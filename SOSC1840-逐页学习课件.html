 China", "section": "离婚", "source": "48\nModes of divorce in China\nthrough the court; \nthrough the civil affairs bureau (民政部门) especially after 2003.\nSimple procedure: divorce based on mutual agreement \n\nIn 2004, 1.6 million couples split up. Roughly 6 in 10 opted non-contested divorce offered at government civil affairs offices.", "knowledge": "中国的离婚方式：法院离婚；民政部门离婚（2003 年后尤其普遍）——程序简单，双方同意即可。2004 年 160 万对离婚，约六成选择民政部门的协议离婚。", "understand": "两种离婚路径：诉讼离婚 vs 协议离婚。2003 年《婚姻登记条例》简化了协议离婚程序，六成占比说明多数人选择低成本渠道。", "image": "study-assets/lecture-4/slide-048.jpg", "extract": "中国离婚方式：通过法院；通过民政部门（2003年后尤其普遍）——程序简单：双方同意的协议离婚。2004年160万对离婚，约六成选择民政部门的协议离婚"}, {"id": "L4-049", "lecture": 4, "page": 49, "title": "P l a c e     D i v o r c e d   c o u p l e s   T h r o u g ", "section": "离婚", "source": "49\nP l a c e     D i v o r c e d   c o u p l e s   T h r o u g h   t h e   c i v i l   a f f a i r s   d e p a r t m e n t   ( % )   T h r o u g h   t h e   c o u r t s   ( % ) B e i j i n g     2 7 , 6 9 1   2 1     7 9 S h a n g h a i   2 9 , 6 1 3   5 2   4 8 T i a n j i n   1 1 , 9 4 1   5 3   4 7 G u a n g d o n g     5 1 , 2 5 5   4 9   5 1\nModes of divorce in Beijing, Shanghai, Tianjin, and Guangdong in 2002", "knowledge": "表格：2002 年京沪津粤的离婚方式——北京 27,691 对：民政 21%/法院 79%；上海 29,613 对：52%/48%；天津 11,941 对：53%/47%；广东 51,255 对：49%/51%。", "understand": "北京的异常值是考点：近八成走法院，与其他三地约半对半完全不同。可能的原因：北京单位制传统深、房产等财产安排需法院文书。", "image": "study-assets/lecture-4/slide-049.jpg", "extract": "2002年京沪津粤离婚方式：北京27,691对——民政21%、法院79%；上海29,613对——52%、48%；天津11,941对——53%、47%；广东51,255对——49%、51%"}, {"id": "L4-050", "lecture": 4, "page": 50, "title": "Reasons for divorces: the case of Guangdong", "section": "离婚", "source": "50\nReasons for divorces: the case of Guangdong \nGuangdong Province saw nearly 100, 000 get divorced in the past four years (i.e., before 2005) and an increase of 20 percent in overall divorce rate.", "knowledge": "离婚原因：广东案例——2005 年前四年广东近 10 万对离婚，总体离婚率上升 20%。", "understand": "过渡页，引出下一页的离婚原因构成表。", "image": "study-assets/lecture-4/slide-050.jpg", "extract": "离婚原因：广东案例。广东近四年（至2005年）有近10万对离婚，总体离婚率上升20%"}, {"id": "L4-051", "lecture": 4, "page": 51, "title": "C a u s e s   F r e q u e n c y   ( % ) F a i l u r e   t o ", "section": "离婚", "source": "51\nC a u s e s   F r e q u e n c y   ( % ) F a i l u r e   t o   c o m m u n i c a t i o n   a n d   d e t a c h m e n t , \n 夫 妻 双 方 无 法 沟 通 、 感 情 冷 漠   6 0   E x t r a m a r i t a l   a f f a i r   第 三 者   2 0 U n h a r m o n i o u s   s e x   l i f e   a n d   s h a r p   d i f f e r e n c e   i n   t h e   c o u p l e ’ s   s o c i a l   s t a t u s . \n 性 生 活 不 和 谐 、 夫 妻 社 会 地 位 悬 殊   2 0\nCauses of divorces in Guangzhou", "knowledge": "表格：广州离婚原因构成——无法沟通、感情冷漠 60%；第三者 20%；性生活不和谐/夫妻社会地位悬殊 20%。", "understand": "离婚主因从「第三者」转向「感情冷漠」——婚姻观念从工具性（经济共同体）转向情感性（感情共同体）的体现。", "image": "study-assets/lecture-4/slide-051.jpg", "extract": "广州离婚原因：夫妻双方无法沟通、感情冷漠60%；第三者20%；性生活不和谐、夫妻社会地位悬殊20%"}, {"id": "L4-052", "lecture": 4, "page": 52, "title": "Two characteristics:", "section": "离婚", "source": "52\nTwo characteristics:\nIn 70 percent of the cases, wives proposed divorces \nFemales between 35 and 39 years old are most likely to have divorces \n\nAnother source:\nWork pressure: 60 percent of divorces \nExtra marital affairs: 30 percent\nUnhappiness with a “poor sex life”; 20 percent", "knowledge": "两个特征：70% 的离婚由女方提出；35–39 岁女性最可能离婚。另一来源：工作压力导致 60% 的离婚；婚外恋 30%；对「性生活不满意」20%。", "understand": "「七成由女方提出」是最重要的考点：女性地位上升、经济独立使她们不再容忍低质量婚姻。", "image": "study-assets/lecture-4/slide-052.jpg", "extract": "两个特征：70%的离婚由女方提出；35–39岁女性最可能离婚。另一来源：工作压力占离婚的60%；婚外恋30%；对「性生活不满意」20%"}, {"id": "L4-053", "lecture": 4, "page": 53, "title": "New social environment:", "section": "离婚", "source": "53\nNew social environment: \nChanging mentality:\n\n1. Getting divorced used to be seen as an embarrassing loss of face and cause for anger and grief by almost all concerned. But nowadays it’s generally treated with tolerance and understanding.", "knowledge": "新社会环境/心态变化 1：离婚曾被视为丢脸、令所有相关者愤怒悲伤的事，如今普遍得到宽容和理解。", "understand": "心态变化系列的开始：离婚的「去污名化」。", "image": "study-assets/lecture-4/slide-053.jpg", "extract": "新社会环境：心态变化——1. 离婚曾被视为丢脸并令几乎所有相关者愤怒悲伤的事，如今普遍得到宽容和理解"}, {"id": "L4-054", "lecture": 4, "page": 54, "title": "2. Today’s divorcees are more stable psychologically than th", "section": "离婚", "source": "54\n2. Today’s divorcees are more stable psychologically than those in the past. Those who are deserted are no longer so anxious to win sympathy from family and friends.\n\nNor do they feel they must look absolutely miserable when in the presence of others.", "knowledge": "心态变化 2：今天的离婚者心理上比过去更稳定；被抛弃的一方不再急于博取家人朋友的同情，也不再觉得必须在人前装得很惨。", "understand": "继续讲去污名化后的行为变化。", "image": "study-assets/lecture-4/slide-054.jpg", "extract": "2. 今天的离婚者心理上比过去更稳定；被抛弃者不再急于博取家人朋友同情，也不再觉得必须在人前显得悲惨"}, {"id": "L4-055", "lecture": 4, "page": 55, "title": "3. The quality of one’s sex life, previously considered priv", "section": "离婚", "source": "55\n3. The quality of one’s sex life, previously considered private, is now often a topic to be discussed openly, and as one standard to measure the quality of a marriage.\n\n4. Divorced couples have also learned to understand and respect each other. \n\n5. The attitude of many divorcees has changed from that of animosity to friendship.\n\n6. To some extent, it also reflects the moral decay", "knowledge": "心态变化 3–6：性生活质量从私事变成公开话题和衡量婚姻的标准；离婚夫妇学会理解尊重彼此；态度从敌对变为友善；某种程度上也反映道德滑坡。", "understand": "注意第 6 点的平衡视角：离婚自由化也被部分人解读为道德滑坡——社会变迁评价的两面性。", "image": "study-assets/lecture-4/slide-055.jpg", "extract": "3. 性生活质量从隐私变为可公开讨论的话题，成为衡量婚姻质量的标准之一；4. 离婚夫妇学会理解尊重彼此；5. 许多离婚者的态度从敌对变为友善；6. 某种程度上也反映道德滑坡"}, {"id": "L4-056", "lecture": 4, "page": 56, "title": "Extramarital affairs as an important cause of divorce", "section": "离婚", "source": "56\nExtramarital affairs as an important cause of divorce \nThe number of divorces in Shanghai in 2000 amounted to ten times the number in 1980\n40 percent cited an extramarital liaison as the immediate reason \n\nAccording to the rights protection center established in Chengdu in 2004: Extramarital affairs led to 80 percent of the divorces", "knowledge": "婚外情作为离婚重要原因：上海 2000 年离婚数是 1980 年的 10 倍，40% 以婚外情为直接原因；成都 2004 年成立的维权中心数据：婚外情导致 80% 的离婚。", "understand": "婚外情与离婚的关联数据，注意不同来源比例差异很大（40% vs 80%）——样本口径不同（全市 vs 求助者）。", "image": "study-assets/lecture-4/slide-056.jpg", "extract": "婚外情作为离婚重要原因：上海2000年离婚数是1980年的10倍，40%以婚外情为直接原因；成都2004年成立的维权中心：婚外情导致80%的离婚"}, {"id": "L4-057", "lecture": 4, "page": 57, "title": "Estimates:", "section": "离婚", "source": "57\nEstimates:\nIn China:       17 to 19 percent of married urban residents engaged in extramarital sex\n\nIn the U.S:     25 percent men and 15 percent  women reported having extramarital sex", "knowledge": "估计：中国 17%–19% 的已婚城市居民有婚外性行为；美国 25% 男性和 15% 女性报告有婚外性行为。", "understand": "中美婚外性行为比例接近——社会变迁中的趋同现象。", "image": "study-assets/lecture-4/slide-057.jpg", "extract": "估计：中国17–19%的已婚城市居民有婚外性行为；美国25%男性和15%女性报告有婚外性行为"}, {"id": "L4-058", "lecture": 4, "page": 58, "title": "C a t e g o r i e s     F r e q u e n c y   ( % ) P e o p l ", "section": "离婚", "source": "58\nC a t e g o r i e s     F r e q u e n c y   ( % ) P e o p l e   b e c o m e   r i c h   f a s t   ( 暴 发 户 )   5 0 P e o p l e   w i t h   s o m e   p o w e r   o r   i n f l u e n c e   \n ( 有 一 定 权 势 者 )   2 0 L o w - i n c o m e   p e o p l e   ( 低 收 入 阶 层 )   1 0\nHusbands with extramarital affairs in Guangzhou", "knowledge": "表格：广州有婚外情的丈夫构成——暴发户 50%；有一定权势者 20%；低收入阶层 10%。", "understand": "婚外情的阶层分布：新富阶层占一半——经济机会转化为婚姻不忠的机会。「暴发户」一词带道德评价色彩。", "image": "study-assets/lecture-4/slide-058.jpg", "extract": "广州有婚外情的丈夫：暴发户50%；有一定权势者20%；低收入阶层10%"}, {"id": "L4-059", "lecture": 4, "page": 59, "title": "a. DNA tests of kids are not rare", "section": "离婚", "source": "59\na. DNA tests of kids are not rare \nIn a hospital of Guangzhou, \nThe number of DNA tests in 2004 was three times the total of the previous three years. \n\nEveryday, they received about 40 telephones inquiring about the test\n\nThe cost is about a few thousand yuan.", "knowledge": "a 亲子鉴定不再罕见：广州某医院 2004 年的 DNA 鉴定数是此前三年总和的三倍；每天约 40 个咨询电话；费用数千元。", "understand": "亲子鉴定需求暴增是信任危机的量化指标——婚外情普遍化的衍生现象。", "image": "study-assets/lecture-4/slide-059.jpg", "extract": "a 给孩子做DNA鉴定不再罕见：广州某医院2004年的DNA鉴定数是此前三年总和的三倍；每天接到约40个咨询电话；费用数千元"}, {"id": "L4-060", "lecture": 4, "page": 60, "title": "In a number of cases, people had divorces after the husbands", "section": "离婚", "source": "60\nIn a number of cases, people had divorces after the husbands found that their children’ father were other people \n\n(e.g., Chongqing raising a kid for ten years without knowing his father was someone else)", "knowledge": "在一些案例中，丈夫发现孩子生父另有其人后离婚（如重庆一男子养子十年才知非亲生）。", "understand": "亲子鉴定的直接后果：发现真相即离婚。", "image": "study-assets/lecture-4/slide-060.jpg", "extract": "在一些案例中，丈夫发现孩子的生父另有其人后离婚（如重庆一男子养子十年才知生父是别人）"}, {"id": "L4-061", "lecture": 4, "page": 61, "title": "b. Investigation of extramarital affairs is a good business", "section": "离婚", "source": "61\nb. Investigation of extramarital affairs is a good business\n\nBetween July 2003 and July 2004, a marriage consulting firm in Guangdong accepted more than 6,000 cases, and 80 percent were due to extramarital affairs.", "knowledge": "b 婚外情调查成为好生意：2003 年 7 月至 2004 年 7 月，广东某婚姻咨询公司受理 6,000 多件案子，80% 因婚外情。", "understand": "婚姻危机催生了调查产业。", "image": "study-assets/lecture-4/slide-061.jpg", "extract": "b 婚外情调查是好生意：2003年7月至2004年7月，广东一家婚姻咨询公司受理6,000多件案子，80%因婚外情"}, {"id": "L4-062", "lecture": 4, "page": 62, "title": "In shanghai, there were about 30 private detective offices w", "section": "离婚", "source": "62\nIn shanghai, there were about 30 private detective offices with more than 200 people. \n\nBut more such private offices are in Beijing, Guangzhou, Chongqing, and Shenyang\n\nIn Beijing, there are more than 1,000 such detective offices. 80 percent of their business concerns extramarital affairs. \n\nCost of investigating a case: 1000 yaun per day in Shanghai", "knowledge": "上海约有 30 家私人侦探所、200 多名从业者；北京有 1,000 多家侦探所，80% 的业务是婚外情调查；上海调查一个案子每天 1,000 元。", "understand": "侦探产业的规模数据：北京千家侦探所、八成业务查婚外情——「抓小三」是支柱产业。注意中国私人侦探处于灰色地带（无合法牌照）。", "image": "study-assets/lecture-4/slide-062.jpg", "extract": "上海约有30家私人侦探所、200多人；北京、广州、重庆、沈阳更多；北京有1,000多家侦探所，80%业务涉及婚外情；调查费用：上海每天1,000元"}, {"id": "L4-063", "lecture": 4, "page": 63, "title": "According to marriage investigation firms in Shanghai and Gu", "section": "离婚", "source": "63\nAccording to marriage investigation firms in Shanghai and Guangzhou:\n\nIn the past: in 70 percent of the cases, wives asked to investigate their husbands \n\nNow: in 40 percent of the cases, husbands asked to investigate their wives.", "knowledge": "上海和广州婚姻调查公司的数据：过去 70% 是妻子要求调查丈夫；现在 40% 是丈夫要求调查妻子。", "understand": "委托人性别结构的变化：丈夫查妻子的比例从无到有升到 40%——女性婚外情的曝光度上升，或男性疑心的上升。", "image": "study-assets/lecture-4/slide-063.jpg", "extract": "据上海和广州的婚姻调查公司：过去70%的案件是妻子要求调查丈夫；现在40%是丈夫要求调查妻子"}, {"id": "L4-064", "lecture": 4, "page": 64, "title": "The emergence of divorce companies in some places", "section": "离婚", "source": "64\nThe emergence of divorce companies in some places \nSome divorces can be very complex, involving kids, property, and others.\ne.g., \n1985, Zhang (male) and Li (female) married and had two kids\n1995, Li lived together with another male and then a second male. \n1995, Zhang filed a lawsuit, requiring a divorce, but Li did not show up, and the lawsuit aborted.\n1995, Zhang filed a criminal charges against Li for bigamy, but he had to withdraw the case because of lack of evidence", "knowledge": "「离婚公司」在一些地方出现。复杂离婚案例（1/2）：1985 年张某（男）与李某（女）结婚并育有两子；1995 年李某先后与两名男子同居；1995 年张某起诉离婚，李某不出庭，诉讼中止；1995 年张某告李某重婚罪，因证据不足撤诉。", "understand": "离婚复杂化的案例开场：涉及出轨、重婚、子女。离婚公司（代理离婚事务）的出现说明离婚已成专业服务市场。", "image": "study-assets/lecture-4/slide-064.jpg", "extract": "一些地方出现离婚公司。复杂离婚涉及孩子、财产等。例：1985年张某（男）与李某（女）结婚并育有两子；1995年李某先后与两名男子同居；1995年张某起诉离婚，李某不出庭，诉讼中止；1995年张某刑事控告李某重婚，因证据不足撤诉"}, {"id": "L4-065", "lecture": 4, "page": 65, "title": "1996, Li filed a lawsuit for a divorce; Zhang sued Li for bi", "section": "离婚", "source": "65\n1996, Li filed a lawsuit for a divorce; Zhang sued Li for bigamy. Li was jailed for three months. \n1996, after Li’s release, Zhang filed a lawsuit for a divorce, but Li did not show up, and the case aborted again.\n1998, Zhang lodged another lawsuit, then withdrew.\n1998, Zhang reported Li’s bigamy to the court, Li was detained for another six months.\nBut the local court refused to approve the divorce, and with the intervention of the public security department, the divorce was eventually accomplished.", "knowledge": "案例（2/2）：1996 年李某起诉离婚，张某反诉重婚，李某被关押三个月；1996 年李出狱后张某再诉离婚，李不出庭，案件再次中止；1998 年张再次起诉后撤诉；1998 年张再告重婚，李被拘留六个月；但当地法院拒绝批准离婚，后经公安部门介入才最终离成。", "understand": "这个案例的看点：一个离婚拉锯十几年、多次刑事民事交叉，最后靠公安介入才解决——正式法律渠道处理复杂家庭纠纷的笨拙。", "image": "study-assets/lecture-4/slide-065.jpg", "extract": "1996年李某起诉离婚，张某反诉重婚，李某被关押三个月；1996年李出狱后张某再诉离婚，李不出庭，案件再次中止；1998年张再次起诉后撤诉；1998年张再告重婚，李被拘留六个月；但当地法院拒绝批准离婚，后经公安部门介入，离婚最终完成"}, {"id": "L4-066", "lecture": 4, "page": 66, "title": "Divorce in China", "section": "离婚", "source": "Divorce in China\n66", "knowledge": "图片页：中国的离婚。", "understand": "过渡图片页。", "image": "study-assets/lecture-4/slide-066.jpg", "extract": "中国的离婚"}, {"id": "L4-067", "lecture": 4, "page": 67, "title": "Fake divorce", "section": "离婚", "source": "Fake divorce \nM and F (wife) married in 1992 and had two daughters. In 2004, the had a divorce. In the court both parties claimed that they lived together without being married; they claimed to have only one child, which was proven by the village committee that provided a document.  Both parties agreed to the mediation of the court and signed the agreement of separation. \n\n67", "knowledge": "假离婚案例（1/2）：M 与 F（妻）1992 年结婚、育有两女；2004 年「离婚」；法庭上双方都声称未登记结婚只同居，并称只有一个孩子，村委会提供证明；双方接受法院调解，签了分居协议。", "understand": "假离婚的操作手法：隐瞒婚姻和子女事实，利用村委会出假证明。目的在下一页揭晓。", "image": "study-assets/lecture-4/slide-067.jpg", "extract": "假离婚：M与F（妻）1992年结婚、育有两女；2004年他们「离婚」；法庭上双方都声称未登记结婚只是同居，并声称只有一个孩子，村委会提供了证明文件；双方接受法院调解并签了分居协议"}, {"id": "L4-068", "lecture": 4, "page": 68, "title": "In 2005, the wife went to the court, claiming that the court", "section": "离婚", "source": "In 2005, the wife went to the court, claiming that the court mediation was problematic. She provided a marriage certificate and the proof of the village committee to prove that:\nThey actually married \nThey had two children\n\nOriginal intention: to have a fake divorce in order to have a third child. \nBut the husband married someone else after the separation. The court rejected her case.\n\n68", "knowledge": "假离婚案例（2/2）：2005 年妻子向法院申诉，提供结婚证和村委会证明，证实两人确实结婚且育有两子；原意：假离婚以便生第三胎；但丈夫分居后另娶他人；法院驳回她的案子。", "understand": "假离婚的真风险：一方假戏真做。为规避计划生育而假离婚，结果弄假成真——制度规避行为的双刃剑。", "image": "study-assets/lecture-4/slide-068.jpg", "extract": "2005年，妻子到法院申诉，称法院调解有问题，提供结婚证和村委会证明：他们确实结婚、育有两子；原意是假离婚以便生第三胎；但丈夫分居后另娶他人；法院驳回了她的案子"}, {"id": "L4-069", "lecture": 4, "page": 69, "title": "Housing price in China", "section": "离婚", "source": "Housing price in China\n69", "knowledge": "图片页：中国房价。", "understand": "引出假离婚的经济动机之一：房产政策。", "image": "study-assets/lecture-4/slide-069.jpg", "extract": "中国房价"}, {"id": "L4-070", "lecture": 4, "page": 70, "title": "Fake divorce:", "section": "离婚", "source": "Fake divorce:\nTo gain some benefits\nTo get a real divorce by using a pretext\n\nDivorce and benefits:\nHousing demolition (拆迁补偿)\nBuying an extra apartment (二套房)\nDebt evasion (逃避夫妻债务)\nOthers \n\n70", "knowledge": "假离婚的目的：获取某些利益；以借口达到真离婚。与利益挂钩的离婚：拆迁补偿、买二套房、逃避夫妻债务等。", "understand": "假离婚的利益清单：拆迁、购房资格、逃债——都是政策漏洞驱动的策略性行为。规则被利用说明政策设计与现实激励的错位。", "image": "study-assets/lecture-4/slide-070.jpg", "extract": "假离婚：为获取某些利益；或以借口达到真离婚。离婚与利益：拆迁补偿；买二套房；逃避夫妻债务；其他"}, {"id": "L4-071", "lecture": 4, "page": 71, "title": "Movie: I am not Pan Jinlian", "section": "离婚", "source": "Movie: I am not Pan Jinlian\n71", "knowledge": "图片页：电影《我不是潘金莲》。", "understand": "电影情节正是一个「假离婚弄假成真后持续上访告状」的故事，与本板块完美呼应。", "image": "study-assets/lecture-4/slide-071.jpg", "extract": "电影：《我不是潘金莲》"}, {"id": "L4-072", "lecture": 4, "page": 72, "title": "Economic changes and social conflict: the case of labor disp", "section": "劳动争议与农民工", "source": "72\nEconomic changes and social conflict: the case of labor disputes in China", "knowledge": "章节页：经济变化与社会冲突——中国的劳动争议。", "understand": "进入劳动争议专题：市场化带来的第二大纠纷类型。", "image": "study-assets/lecture-4/slide-072.jpg", "extract": "经济变化与社会冲突：中国的劳动争议"}, {"id": "L4-073", "lecture": 4, "page": 73, "title": "2 0 1 0   ( % )   2 0 2 0   ( % )                   U r b a ", "section": "劳动争议与农民工", "source": "2 0 1 0   ( % )   2 0 2 0   ( % )                   U r b a n   e m p l o y e e s   3 4 6 8 7   1 0 0   4 6 2 7 1   1 0 0         S t a t e - c o n t r o l l e d   6 5 1 6   1 8 . 8   5 5 6 3   1 2 . 0         F o r e i g n     1 8 2 3   5 . 2   2 4 0 6   5 . 1         P r i v a t e     2 6 3 4 8   7 6 . 0   3 8 3 3 3   8 2 . 9\n73", "knowledge": "表格：城镇就业结构变化（2010→2020，万人/%）——城镇就业 34,687→46,271；国有控股 6,516（18.8%）→5,563（12.0%）；外资 1,823（5.2%）→2,406（5.1%）；私营 26,348（76.0%）→38,333（82.9%）。", "understand": "十年间私营部门就业占比从 76% 升至 83%，国有从 19% 降至 12%——劳动关系的雇主主体已是私企，这正是劳动争议高发的结构性原因（私企劳动法遵守差）。", "image": "study-assets/lecture-4/slide-073.jpg", "extract": "城镇就业（万人）：2010年34,687 → 2020年46,271；国有控股6,516（18.8%）→ 5,563（12.0%）；外资1,823（5.2%）→ 2,406（5.1%）；私营26,348（76.0%）→ 38,333（82.9%）"}, {"id": "L4-074", "lecture": 4, "page": 74, "title": "1.   Salary payment   (2,840,066)", "section": "劳动争议与农民工", "source": "1.   Salary payment   (2,840,066)\n\n2.   Social Insurances   (1,487,500)\n\n3.   Change Labor Contracts   (46,826)\n\n4.   End The Labor Contract   (1,574,851)\n\n5.   Others   (39,607)\nDisputes Reasons  (1996-2016)", "knowledge": "劳动争议原因（1996–2016 累计）：1 工资支付 2,840,066 件；2 社会保险 1,487,500 件；3 变更劳动合同 46,826 件；4 解除劳动合同 1,574,851 件；5 其他 39,607 件。", "understand": "争议原因的排名：欠薪第一、解除合同第二、社保第三。工资问题占了近一半——劳动争议的核心是钱。", "image": "study-assets/lecture-4/slide-074.jpg", "extract": "争议原因（1996–2016）：1 工资支付2,840,066件；2 社会保险1,487,500件；3 变更劳动合同46,826件；4 解除劳动合同1,574,851件；5 其他39,607件"}, {"id": "L4-075", "lecture": 4, "page": 75, "title": "第 75 页", "section": "劳动争议与农民工", "source": "75", "knowledge": "（图片过渡页）", "understand": "劳动争议主题图片页。", "image": "study-assets/lecture-4/slide-075.jpg", "extract": "（本页无提取文字，为图片页）"}, {"id": "L4-076", "lecture": 4, "page": 76, "title": "第 76 页", "section": "劳动争议与农民工", "source": "76", "knowledge": "（图片过渡页）", "understand": "劳动争议主题图片页。", "image": "study-assets/lecture-4/slide-076.jpg", "extract": "（本页无提取文字，为图片页）"}, {"id": "L4-077", "lecture": 4, "page": 77, "title": "Manners of Settlement", "section": "劳动争议与农民工", "source": "Manners of Settlement \n(1996-2016)\nM a n n e r s   o f   S e t t l e m e n t   T o t a l M e d i a t i o n   3 , 4 3 2 , 7 5 8 A r b i t r i t i o n   o r   L a w s u i t   3 , 6 0 2 , 5 4 6 O t h e r s   1 , 4 0 1 , 9 1 9", "knowledge": "表格：劳动争议的解决方式（1996–2016 累计）——调解 3,432,758 件；仲裁或诉讼 3,602,546 件；其他 1,401,919 件。", "understand": "调解与仲裁诉讼约各占一半——正式与非正式渠道分担劳动争议。", "image": "study-assets/lecture-4/slide-077.jpg", "extract": "解决方式（1996–2016）：调解3,432,758件；仲裁或诉讼3,602,546件；其他1,401,919件"}, {"id": "L4-078", "lecture": 4, "page": 78, "title": "R e s u l t   o f     S e t t l e m e n t   T o t a l L a w ", "section": "劳动争议与农民工", "source": "R e s u l t   o f     S e t t l e m e n t   T o t a l L a w s u i t   W o n   b y   U n i t s   1 , 0 8 1 , 2 1 1 L a w s u i t   W o n   b y   L a b o r e r s   3 , 2 9 5 , 0 0 9 L a w s u i t   P a r t l y   W o n   b y   B o t h   P a r t i e s   a n d   O t h e r s   3 , 9 5 1 , 6 8 5\nResult of  Settlement\n(1996-2016)", "knowledge": "表格：解决结果（1996–2016）——单位胜诉 1,081,211 件；劳动者胜诉 3,295,009 件；双方部分胜诉及其他 3,951,685 件。", "understand": "劳动者完全胜诉是单位胜诉的 3 倍——进入法律渠道的劳动争议中劳动者占优，说明法律本身对劳动者友好，瓶颈在别處（执行、成本）。", "image": "study-assets/lecture-4/slide-078.jpg", "extract": "解决结果（1996–2016）：单位胜诉1,081,211件；劳动者胜诉3,295,009件；双方部分胜诉及其他3,951,685件"}, {"id": "L4-079", "lecture": 4, "page": 79, "title": "Migrant workers and economic development in China", "section": "劳动争议与农民工", "source": "Migrant workers and economic development in China \n\n79", "knowledge": "章节页：农民工与中国经济发展。", "understand": "聚焦劳动争议的最大当事人群体：农民工。", "image": "study-assets/lecture-4/slide-079.jpg", "extract": "农民工与中国经济发展"}, {"id": "L4-080", "lecture": 4, "page": 80, "title": "Peasants now play an important role in non-agricultural sect", "section": "劳动争议与农民工", "source": "80\nPeasants now play an important role in non-agricultural sectors in China. \nIn the early 2000s, peasant migrant workers accounted for \nabout 90 percent of the workers in the construction sector, \n80 percent in the coal mining industry, \n60 percent in the textile industry, \n50 percent in the urban service sector.", "knowledge": "农民工在非农业部门的重要地位（2000 年代初）：建筑业约 90%、采煤 80%、纺织 60%、城市服务业 50%。", "understand": "农民工是多个行业的劳动力主体——这个群体被欠薪的规模性意义。", "image": "study-assets/lecture-4/slide-080.jpg", "extract": "农民如今在中国非农业部门中占重要地位（2000年代初）：建筑业约90%、采煤80%、纺织60%、城市服务业50%"}, {"id": "L4-081", "lecture": 4, "page": 81, "title": "Problems faced by migrant workers:", "section": "劳动争议与农民工", "source": "81\nProblems faced by migrant workers:\n\nThe poor work conditions and mistreatment by management. Overtime work is also common. \n\nChina enacted the Labor Law in 1994, but the law is often violated by employers in the private sector.", "knowledge": "农民工面临的问题：工作条件差、被管理层虐待、加班普遍。中国 1994 年颁布《劳动法》，但私企雇主经常违反。", "understand": "有法不依是主题：1994 年《劳动法》已存在，但私企普遍违反——法律文本与执行的落差。", "image": "study-assets/lecture-4/slide-081.jpg", "extract": "农民工面临的问题：工作条件差、被管理层虐待、加班普遍。中国1994年颁布《劳动法》，但私企雇主经常违反"}, {"id": "L4-082", "lecture": 4, "page": 82, "title": "第 82 页", "section": "劳动争议与农民工", "source": "82", "knowledge": "（图片过渡页）", "understand": "农民工工作场景图片页。", "image": "study-assets/lecture-4/slide-082.jpg", "extract": "（本页无提取文字，为图片页）"}, {"id": "L4-083", "lecture": 4, "page": 83, "title": "第 83 页", "section": "劳动争议与农民工", "source": "83", "knowledge": "（图片过渡页）", "understand": "农民工工作场景图片页。", "image": "study-assets/lecture-4/slide-083.jpg", "extract": "（本页无提取文字，为图片页）"}, {"id": "L4-084", "lecture": 4, "page": 84, "title": "2. Labor protection is very weak or absent in many private f", "section": "劳动争议与农民工", "source": "84\n2. Labor protection is very weak or absent in many private firms. For example, there were 15,000 labor accidents in two districts of Shenzhen in 1998, and 90 percent of those who were injured in work suffered physical harm.", "knowledge": "问题 2：许多私企劳动保护很弱或缺失。例：1998 年深圳两个区发生 15,000 起工伤事故，90% 的工伤者遭受身体伤害。", "understand": "两个区一年 1.5 万起工伤——劳动保护缺位的严重程度。", "image": "study-assets/lecture-4/slide-084.jpg", "extract": "2. 许多私企劳动保护很弱或缺失。例：1998年深圳两个区发生15,000起工伤事故，90%的工伤者遭受身体伤害"}, {"id": "L4-085", "lecture": 4, "page": 85, "title": "3. The salary is too low.", "section": "劳动争议与农民工", "source": "85\n3. The salary is too low.\nComparison between the Minimum Wage and the Average Salary of Urban Employees in Guangdong (2004)\nC i t y   M i n i m u m   w a g e   M i n i m u m   w a g e / A v e r a g e   s a l a r y   o f   u r b a n   e m p l o y e e s   i n   t h e   c i t y ²     G u a n g z h o u   6 8 4   2 9 . 1 S h e n z h e n   6 0 0   2 3 . 7 Z h u h a i   5 1 0   3 2 . 0 F u s h a   4 5 0   3 1 . 0 J i a n g m e n   4 0 0   3 9 . 0 Z h a o q i n g   3 0 0   2 9 . 3 H u i z h o u   4 0 0   3 7 . 2 D o n g g u a n   4 5 0   2 4 . 0 Z h o n g s h a n   4 5 0   2 5 . 7", "knowledge": "问题 3：工资太低。表格：广东各市最低工资及其占城镇职工平均工资之比（2004）——广州 684 元/29.1%；深圳 600/23.7%；珠海 510/32.0%；佛山 450/31.0%；江门 400/39.0%；肇庆 300/29.3%；惠州 400/37.2%；东莞 450/24.0%；中山 450/25.7%。", "understand": "看比值列：最低工资仅为平均工资的 24%–39%——即使拿到最低工资也远低于社会平均生活水平。深圳、东莞（工厂密集）的比值最低。", "image": "study-assets/lecture-4/slide-085.jpg", "extract": "3. 工资太低：广东各市最低工资及其占本市城镇职工平均工资之比（2004）：广州684元/29.1%；深圳600/23.7%；珠海510/32.0%；佛山450/31.0%；江门400/39.0%；肇庆300/29.3%；惠州400/37.2%；东莞450/24.0%；中山450/25.7%"}, {"id": "L4-086", "lecture": 4, "page": 86, "title": "4. Workers often fail to receive their limited salaries in t", "section": "劳动争议与农民工", "source": "86\n4. Workers often fail to receive their limited salaries in time. \n\nNationwide, salary non-payment was most serious in the construction sector, which was estimated to account for 70 percent of the total amount owed to peasants.", "knowledge": "问题 4：工人经常不能按时领到微薄工资。全国欠薪以建筑业最严重，估计占欠农民工工资总额的 70%。", "understand": "欠薪行业集中度：建筑业 70%——层层分包的建筑业链条是欠薪的制度温床。", "image": "study-assets/lecture-4/slide-086.jpg", "extract": "4. 工人经常不能按时领到微薄工资。全国欠薪以建筑业最严重，估计占欠农民工工资总额的70%"}, {"id": "L4-087", "lecture": 4, "page": 87, "title": "A migrant worker threatened to commit suicide together with ", "section": "劳动争议与农民工", "source": "87\n                                                                                                                                                                                                                                                   \nA migrant worker threatened to commit suicide together with his baby to require the payment of his salary", "knowledge": "图片：一名农民工抱着婴儿威胁一起自杀，以讨要被欠的工资。", "understand": "「跳楼讨薪」「以死讨薪」成为社会现象——正常渠道失灵后的绝望式维权。", "image": "study-assets/lecture-4/slide-087.jpg", "extract": "一名农民工威胁带着婴儿一起自杀，以讨要工资"}, {"id": "L4-088", "lecture": 4, "page": 88, "title": "Peasants not paid in Zhejiang  (10,000 people)", "section": "劳动争议与农民工", "source": "88\nPeasants not paid in Zhejiang  (10,000 people)\n  2 0 0 1   2 0 0 2   2 0 0 3   2 0 0 4   \n ( f i r s t   t h r e e   Q ) P e a s a n t s   1 0 . 4   1 8 . 3   2 4 . 8   2 7 . 6 C a s e s     1 0 7 3 3   1 1 0 4 8   1 6 0 0 2   1 9 6 7 2", "knowledge": "表格：浙江被欠薪农民数（万人）与案件数——2001 年 10.4 万/10,733 件；2002 年 18.3 万/11,048 件；2003 年 24.8 万/16,002 件；2004 年前三季度 27.6 万/19,672 件。", "understand": "欠薪规模和案件数都在快速上升，三年半翻了一倍多——问题在恶化而非改善。", "image": "study-assets/lecture-4/slide-088.jpg", "extract": "浙江被欠薪农民（万人）与案件数：2001年10.4万/10,733件；2002年18.3万/11,048件；2003年24.8万/16,002件；2004年前三季度27.6万/19,672件"}, {"id": "L4-089", "lecture": 4, "page": 89, "title": "Migrant workers’ resistance:", "section": "劳动争议与农民工", "source": "89\nMigrant workers’ resistance:\na. Choosing to work in other firms or cities \n\nb. Non-confrontational resistance \ne.g., in a shoe factory in Guangdong, because of a labor dispute, a female worker put a nail in a shoe and then told the management about the nail. As a result, hundreds of thousands of packed shoes had to be opened in order to find out the nail.", "knowledge": "农民工的反抗：a 换厂或换城市打工；b 非对抗性反抗——例：广东一家鞋厂，一名女工因劳动争议把一枚钉子放进鞋里然后告诉管理层，结果几十万双已包装的鞋不得不拆箱找钉子。", "understand": "弱者的武器：钉子案例是「非对抗性反抗」的经典——不罢工、不冲突，用生产规则本身制造麻烦，让资方付出代价又抓不到把柄。", "image": "study-assets/lecture-4/slide-089.jpg", "extract": "农民工的反抗：a 选择到其他厂或城市打工；b 非对抗性反抗。例：广东一家鞋厂，一名女工因劳动争议把一枚钉子放进鞋里然后告诉管理层，结果几十万双已包装的鞋不得不拆箱找钉子"}, {"id": "L4-090", "lecture": 4, "page": 90, "title": "b. Labor actions", "section": "劳动争议与农民工", "source": "90\nb. Labor actions  \n\nReportedly, 6,767 strikes or slowdowns occurred in 1998, with the average number of participants in each 37; \n\n8,247 occurred in 2000, with the number of participants in each 31.", "knowledge": "b 劳工行动：据报道 1998 年发生 6,767 起罢工或怠工，平均每起 37 人参与；2000 年 8,247 起，平均每起 31 人。", "understand": "集体行动的规模：数量上升（+22%）但平均规模缩小——碎片化的小规模行动是主流，没有形成工会力量。", "image": "study-assets/lecture-4/slide-090.jpg", "extract": "b 劳工行动：据报道1998年发生6,767起罢工或怠工，平均每起37人参与；2000年8,247起，平均每起31人"}, {"id": "L4-091", "lecture": 4, "page": 91, "title": "第 91 页", "section": "劳动争议与农民工", "source": "91", "knowledge": "（图片过渡页）", "understand": "劳工行动图片页。", "image": "study-assets/lecture-4/slide-091.jpg", "extract": "（本页无提取文字，为图片页）"}, {"id": "L4-092", "lecture": 4, "page": 92, "title": "c. Mediation and lawsuits Modes of dispute settlement", "section": "劳动争议与农民工", "source": "92\nc. Mediation and lawsuits Modes of dispute settlement \n\na. He or she can present the petition to the labor management department. If the reported problem is confirmed to be true, the labor department will issue a notification requiring the employer to address the problem and pay a fine.", "knowledge": "c 调解与诉讼——争议解决途径 a：工人可向劳动管理部门投诉；核实后劳动部门会通知雇主解决问题并罚款。", "understand": "行政渠道：向劳动部门投诉。优点是快、免费；局限是依赖地方政府的意愿（地方政府常偏向资方）。", "image": "study-assets/lecture-4/slide-092.jpg", "extract": "c 调解与诉讼——解决方式：a 工人可向劳动管理部门投诉；如查实，劳动部门将通知雇主解决问题并处以罚款"}, {"id": "L4-093", "lecture": 4, "page": 93, "title": "b. The worker can present their cases to the court. Accordin", "section": "劳动争议与农民工", "source": "93\n\n\nb. The worker can present their cases to the court. According to the labor law, disputes between an employee and the employer must be submitted to the arbitration committee for arbitration first. And it will be submitted to the court only if the arbitration is not accepted by either of the parties.", "knowledge": "途径 b：工人可诉至法院。按劳动法，劳资纠纷必须先提交仲裁委员会仲裁；任何一方不服仲裁，才能诉至法院。", "understand": "劳动争议的程序特点：仲裁前置（必经程序）。这个设计与一般民事纠纷不同，是重要考点。", "image": "study-assets/lecture-4/slide-093.jpg", "extract": "b 工人可诉至法院。按劳动法，劳资纠纷必须先提交仲裁委员会仲裁；任何一方不服仲裁，才提交法院"}, {"id": "L4-094", "lecture": 4, "page": 94, "title": "2003, Premier Wen visited a village in Chongqing", "section": "劳动争议与农民工", "source": "94\n                 \n2003, Premier Wen visited a village in Chongqing \nXiong Deming (熊德明）complained to the premier that her husband could not get his pay after working for a year. \nWen told local officials to solve the problems and Xiong’s family got the pay that night.", "knowledge": "2003 年温总理走访重庆一村庄；熊德明向总理反映丈夫打工一年拿不到工钱；温指示地方官员解决，熊家当晚就拿到了工资。", "understand": "「总理讨薪」事件：靠最高领导人个人干预解决个案，反衬常规渠道失灵——人治逻辑对法治问题的讽刺性解决。", "image": "study-assets/lecture-4/slide-094.jpg", "extract": "2003年温总理走访重庆一村庄；熊德明向总理反映丈夫打工一年拿不到工钱；温指示地方官员解决，熊家当晚拿到工资"}, {"id": "L4-095", "lecture": 4, "page": 95, "title": "Peasants arrested for protesting against salary nonpayment", "section": "劳动争议与农民工", "source": "95\nPeasants arrested for protesting against salary nonpayment", "knowledge": "图片：因抗议欠薪被捕的农民。", "understand": "另一面：讨薪者反而被捕——维稳逻辑下维权行为被治安化。", "image": "study-assets/lecture-4/slide-095.jpg", "extract": "因抗议欠薪而被捕的农民"}, {"id": "L4-096", "lecture": 4, "page": 96, "title": "Using lawsuits to get salary.", "section": "劳动争议与农民工", "source": "96\nUsing lawsuits to get salary. \n\nIn 2002, disputes concerning salary, social insurance and welfare, and work injury accounted for about 63 percent of the total labor disputes. \n\nIssues regarding salaries were the most conflict-generating (i.e., 32 percent).", "knowledge": "用诉讼讨薪：2002 年，涉及工资、社保福利和工伤的争议约占劳动争议总数的 63%；工资问题最易引发冲突（占 32%）。", "understand": "诉讼渠道的争议构成：工资居首（32%），三类与钱直接相关的合计 63%。", "image": "study-assets/lecture-4/slide-096.jpg", "extract": "用诉讼讨薪：2002年，涉及工资、社保福利和工伤的争议约占劳动争议总数的63%；工资问题最易引发冲突（占32%）"}, {"id": "L4-097", "lecture": 4, "page": 97, "title": "Case 1", "section": "劳动争议与农民工", "source": "97\nCase 1 \nBetween 2000 and 2002, 86 peasant workers carried out a construction project for a company in Sichuan province. \nThey should receive 221,984 yuan \nBut the company only paid them 72,900 yuan during this period of time.\nThe head of the peasants’ team went to the contractor for money, but he was beaten by the contractor and passed out. \nThe peasant approached the city trade union in Chengdu.\nThe trade union supported him to file a lawsuit and won the case.", "knowledge": "案例一：2000–2002 年 86 名农民工在四川为一公司做工程，应得 221,984 元，期间只拿到 72,900 元；工头找承包商讨钱被打晕；农民工找到成都市总工会，工会支持他起诉并胜诉。", "understand": "工会（trade union）在案例中扮演法律援助角色——官方工会的维权功能体现。", "image": "study-assets/lecture-4/slide-097.jpg", "extract": "案例一：2000–2002年，86名农民工在四川为一公司施工，应得221,984元，但只拿到72,900元；工头找承包商讨钱被打晕；农民工找到成都市总工会；工会支持他起诉并胜诉"}, {"id": "L4-098", "lecture": 4, "page": 98, "title": "Happy peasants got their pay in a court in Hubei province", "section": "劳动争议与农民工", "source": "98\n                                                                                                                                                                                                                                                                                                                                                                                                                                       \nHappy peasants got their pay in a court in Hubei province \n\n\nBut winning a case may mean nothing\n\n500 peasant workers in Beijing were not paid. They won the case, but could not get the money.", "knowledge": "图片：湖北农民在法院拿到工资，配文「但胜诉可能毫无意义」——北京 500 名农民工被欠薪，赢了官司却拿不到钱。", "understand": "本页核心：执行难。判决不等于兑现——「赢了官司输了钱」是司法救济的致命短板。", "image": "study-assets/lecture-4/slide-098.jpg", "extract": "湖北农民在法院高兴地拿到工资。但胜诉可能毫无意义：北京500名农民工被欠薪，赢了官司却拿不到钱"}, {"id": "L4-099", "lecture": 4, "page": 99, "title": "Case 2", "section": "劳动争议与农民工", "source": "99\nCase 2\n. Lu was from a poor family in Henan province \n. He was asked to construct a building in Zhejiang province in 1999.\n. Lu formed a team, and signed a contract with the first contractor (承包人), Bian\n. But the fist contractor left because he could not get money from the party who was supposed to pay.\n. Lu also failed to pay his workers. \n. Lu approached Bian numerous times, for the total amount of 19213.77 yuan.\n. Between 2000 and 2002, Lu could only get 650 yuan from Bian.", "knowledge": "案例二（1/2）：河南卢某家境贫寒，1999 年赴浙江承建楼房，组建施工队并与第一承包人卞某签合同；但卞某因拿不到上家付款而离开；卢某也付不出工人工钱；卢某无数次找卞某讨要总额 19,213.77 元；2000–2002 年只拿到 650 元。", "understand": "欠薪链条的复杂性：层层分包下，包工头既是受害者又是责任人。记住金额 19,213.77 元与 650 元的对比。", "image": "study-assets/lecture-4/slide-099.jpg", "extract": "案例二：卢某来自河南贫困家庭；1999年被请到浙江建楼；卢组建施工队并与第一承包人卞某签合同；但卞某因拿不到上家付款而离开；卢也付不出工人工钱；卢无数次找卞某讨要19,213.77元；2000–2002年只拿到650元"}, {"id": "L4-100", "lecture": 4, "page": 100, "title": "In 2002, Lu sued Bian in a local court, and won the case.", "section": "劳动争议与农民工", "source": "100\nIn 2002, Lu sued Bian in a local court, and won the case.\nThe court required Bian to pay the remaining 18563.77 yuan.\nBut Bian refused to pay, and Lu applied to the court for a compulsory enforcement.\nBut the court did not succeed. It went to Bian’s family six times in 2004 alone.\nThe court could not confiscate Bian’s property because it is not allowed in China.\nThe desperate Lu left his eight-month baby in the court. \nAfter the baby stayed in a welfare house for 40 days, the local government used public fund to pay Lu.", "knowledge": "案例二（2/2）：2002 年卢某起诉卞某胜诉，法院判卞某支付剩余 18,563.77 元；但卞某拒付，卢申请强制执行未果——仅 2004 年法院就去了卞家六次；法院不能没收卞的财产（中国不允许）；绝望的卢某把八个月大的婴儿留在法院；婴儿在福利院待了 40 天后，地方政府用公款垫付了卢某。", "understand": "执行难的完整图景：六次上门执行不了 + 不能没收财产 + 以婴儿相逼 + 政府兜底。每个环节都是制度问题的注脚。", "image": "study-assets/lecture-4/slide-100.jpg", "extract": "2002年卢某起诉卞某胜诉，法院判卞支付剩余18,563.77元；卞拒付，卢申请强制执行，但法院未成功——仅2004年就去了卞家六次；法院不能没收卞的财产（中国不允许）；绝望的卢某把八个月大的婴儿留在法院；婴儿在福利院待了40天后，地方政府用公款垫付了卢某"}, {"id": "L4-101", "lecture": 4, "page": 101, "title": "In 2005, a migrant worker needed money to pay for his father", "section": "劳动争议与农民工", "source": "101\nIn 2005, a migrant worker needed money to pay for his father’s medical expense. He was owed salary by his employer. He approached his employer several times, but did not received his pay. He also approached government agencies but did not get any help. When he finally approached the employer, he was insulted and beaten. In the end, he killed four people and wounded another. He then turned in himself to the police.", "knowledge": "2005 年，一名农民工因父亲治病急需用钱，被雇主欠薪；多次讨薪无果，找政府部门也无人帮助；最后讨薪时被侮辱殴打，怒而杀死四人、伤一人，随后自首。", "understand": "王斌余案：讨薪无果酿成的杀人惨案。绝望式维权的最极端形态——制度失灵的终极代价。", "image": "study-assets/lecture-4/slide-101.jpg", "extract": "2005年，一名农民工需钱给父亲治病，被雇主欠薪；多次讨要无果，找政府部门也无帮助；最后讨薪时被侮辱殴打；他杀死四人、伤一人，随后自首"}, {"id": "L4-102", "lecture": 4, "page": 102, "title": "If you were the judge, how would you make the ruling?", "section": "劳动争议与农民工", "source": "102\nIf you were the judge, how would you make the ruling?\n\nA. death penalty \nB. death penalty with a reprieve \nC. life in jail\nD. 15 years in jail\nE. others (specify)", "knowledge": "课堂讨论：如果你是法官，你会怎么判？A 死刑；B 死缓；C 无期；D 15 年有期徒刑；E 其他。", "understand": "情与法的冲突案例：杀人手段残忍（4 死）但情有可原（讨薪被逼）。实际判决是死刑——引发社会对农民工处境的广泛讨论。", "image": "study-assets/lecture-4/slide-102.jpg", "extract": "如果你是法官，你会怎么判？A 死刑；B 死缓；C 无期；D 15年有期徒刑；E 其他（说明）"}, {"id": "L4-103", "lecture": 4, "page": 103, "title": "Problems faced by migrant workers when defending their right", "section": "劳动争议与农民工", "source": "103\nProblems faced by migrant workers when defending their rights\nthe limited credibility of arbitration (waste of money and time)\n(2) lengthy legal process (e.g., compensation took a few years)\n(3) problems with law enforcement (e.g., winning a case but still cannot get the pay)\n(4) local government’s bias toward workers", "knowledge": "农民工维权的困难：(1) 仲裁公信力有限（浪费金钱和时间）；(2) 法律程序漫长（赔偿拖数年）；(3) 执法问题（赢了官司拿不到钱）；(4) 地方政府偏向资方。", "understand": "四条维权障碍的总结页，是劳动争议板块的收束。注意 (4) 的方向：地方政府为了招商引资/GDP 偏向资方而非工人。", "image": "study-assets/lecture-4/slide-103.jpg", "extract": "农民工维权的困难：(1) 仲裁公信力有限（浪费金钱和时间）；(2) 法律程序漫长（如赔偿拖数年）；(3) 执法问题（赢了官司仍拿不到钱）；(4) 地方政府偏向资方"}, {"id": "L4-104", "lecture": 4, "page": 104, "title": "lawyers accused peasants of \u000bfailing to pay him", "section": "劳动争议与农民工", "source": "104\n\n                                                               \nlawyers accused peasants of \u000bfailing to pay him  \n维权律师撰文辱骂农民工讨薪成功后不付费\n又有一群“狗日”的跑了 \n我没仔细统计过，粗略算来替民工讨薪的案子中大概有1/3是拖欠律师费的”。", "knowledge": "案例：律师指责农民工讨薪成功后不付律师费——「又有一群『狗日』的跑了」「替民工讨薪的案子中大概有 1/3 拖欠律师费」。", "understand": "维权生态链的另一环：律师帮农民工讨薪也面临收费难——市场化解纷渠道在高风险客户群中的可持续性困境。", "image": "study-assets/lecture-4/slide-104.jpg", "extract": "律师指责农民工不付律师费：「又有一群『狗日』的跑了」「粗略算来替民工讨薪的案子中大概有1/3拖欠律师费」"}, {"id": "L4-105", "lecture": 4, "page": 105, "title": "The new labor law and the problems", "section": "劳动争议与农民工", "source": "105\nThe new labor law and the problems \n\nMore protection for workers (higher cost for employers)\nDifficulties in law enforcement (economic environment); strategies used by employers (irregularities in contract; running away)", "knowledge": "新《劳动合同法》及其问题：对工人保护更多（雇主成本更高）；执法困难（经济环境）；雇主的对策（合同违规操作；跑路）。", "understand": "2008 年《劳动合同法》强化保护，但结果是上有政策下有对策：雇主用不规范合同规避，甚至关门跑路。法律意图与执行能力的落差再次上演。", "image": "study-assets/lecture-4/slide-105.jpg", "extract": "新劳动法及其问题：对工人保护更多（雇主成本更高）；执法困难（经济环境）；雇主的对策（合同违规操作；跑路）"}, {"id": "L4-106", "lecture": 4, "page": 106, "title": "The market force: Lewis Turning point", "section": "劳动争议与农民工", "source": "106\nThe market force: Lewis Turning point \n(刘易斯拐点)?\n\n    Lewis Turning Point, a point at which it would move from a vast supply of low-cost workers to a labor shortage economy. \n\nThe rise of salaries of migrant workers", "knowledge": "市场力量：刘易斯拐点——从低成本劳动力无限供给转向劳动力短缺经济的转折点；农民工工资上涨。", "understand": "劳动力市场结构变化可能是改善工人处境的真正力量：劳动力短缺时，工人议价能力自然上升——市场机制 vs 法律保护的两条路径。", "image": "study-assets/lecture-4/slide-106.jpg", "extract": "市场力量：刘易斯拐点——从低成本劳动力大量供给转向劳动力短缺经济的转折点；农民工工资的上涨"}, {"id": "L4-107", "lecture": 4, "page": 107, "title": "New developments in China:", "section": "劳动争议与农民工", "source": "New developments in China:\nNational Statistic Bureau: 2021\nTemporary employees/self employed (灵活就业):\n200 million, accounting for 22.4% of the total 894 million people of labor force. \n\n\n107", "knowledge": "新情况：国家统计局 2021 年数据——灵活就业（临时工/自雇）2 亿人，占 8.94 亿劳动力的 22.4%。", "understand": "劳动关系的新形态：外卖骑手等灵活就业者不属于传统劳动关系，劳动法的保护出现新空白。", "image": "study-assets/lecture-4/slide-107.jpg", "extract": "中国的新情况：国家统计局2021年——临时工/自雇（灵活就业）2亿人，占8.94亿劳动力的22.4%"}, {"id": "L4-108", "lecture": 4, "page": 108, "title": "A 2022 survey of 26,252 people:", "section": "劳动争议与农民工", "source": "A 2022 survey of 26,252 people:\n3,894 or 22.4% were temporary employees. \n20.4%: manufactures \n15.9%: offline service \n15.6%: construction \n108", "knowledge": "2022 年对 26,252 人的调查：3,894 人（原文作 22.4%）为灵活就业；其中制造业占 20.4%、线下服务业 15.9%、建筑业 15.6%。", "understand": "灵活就业的行业分布：制造、服务、建筑三分天下。", "image": "study-assets/lecture-4/slide-108.jpg", "extract": "2022年对26,252人的调查：3,894人（22.4%）是灵活就业者；其中制造业20.4%、线下服务业15.9%、建筑业15.6%"}, {"id": "L4-109", "lecture": 4, "page": 109, "title": "第 109 页", "section": "劳动争议与农民工", "source": "109", "knowledge": "（图片过渡页）", "understand": "灵活就业主题图片页。", "image": "study-assets/lecture-4/slide-109.jpg", "extract": "（本页无提取文字，为图片页）"}, {"id": "L4-110", "lecture": 4, "page": 110, "title": "53.5% of the temporary employees were not covered by a pensi", "section": "劳动争议与农民工", "source": "53.5% of the temporary employees were not covered by a pension scheme.\n110", "knowledge": "53.5% 的灵活就业者没有养老保险。", "understand": "本讲收束数据：灵活就业者过半无养老保障——劳动保护体系在新经济形态面前的缺口。", "image": "study-assets/lecture-4/slide-110.jpg", "extract": "53.5%的灵活就业者没有养老保险"}, {"id": "L5-001", "lecture": 5, "page": 1, "title": "Lecture 5 Resolution of Civil Disputes", "section": "民事基本法律与案例", "source": "1\nLecture 5 Resolution of Civil Disputes", "knowledge": "Lecture 5 主题：民事纠纷的解决（Resolution of Civil Disputes）。", "understand": "承接 L4 的「诉讼使用」，本讲聚焦民事领域：先看三部基本民事法律，再用抚养、合同、医疗纠纷等案例看民法如何实际运作。", "image": "study-assets/lecture-5/slide-001.jpg", "extract": "第五讲：民事纠纷的解决"}, {"id": "L5-002", "lecture": 5, "page": 2, "title": "Basic laws in addressing civil disputes", "section": "民事基本法律与案例", "source": "2\nBasic laws in addressing civil disputes \n\n1. The General Rules of Civil Law (1986)\n\n2. The Marriage Law (1950, 1980, 2001)\n\n3. The Contract Law (1999)", "knowledge": "处理民事纠纷的基本法律：1《民法通则》（1986）；2《婚姻法》（1950、1980、2001）；3《合同法》（1999）。", "understand": "三部法律 + 年份是考点框架：民法通则是总则，婚姻法和合同法是两个最重要领域的专门法。注意婚姻法的三次修订年份。", "image": "study-assets/lecture-5/slide-002.jpg", "extract": "处理民事纠纷的基本法律：1《民法通则》（1986）；2《婚姻法》（1950、1980、2001）；3《合同法》（1999）"}, {"id": "L5-003", "lecture": 5, "page": 3, "title": "The General Rules of Civil Law:", "section": "民事基本法律与案例", "source": "3\nThe General Rules of Civil Law:\nIt lays out some basic rules for guiding the interaction among citizens or other legal persons; some of the rules become the bases for the making of other laws (e.g., the bankruptcy law). \ne.g., the rights: ownership; creditors’ rights; intellectual property rights; individuals’ other rights (e.g., personal honor, 名誉权)", "knowledge": "《民法通则》：为公民之间或法人之间的交往制定基本规则，其中一些规则成为其他法律的立法基础（如破产法）。规定的权利包括：所有权、债权、知识产权、个人其他权利（如名誉权）。", "understand": "民法通则是中国民事法律的「总纲」：在民法典出台前（1986–2020）承担总则功能。权利清单是考点。", "image": "study-assets/lecture-5/slide-003.jpg", "extract": "《民法通则》：为公民或法人之间的交往规定基本规则；其中一些规则成为其他法律的基础（如破产法）。权利如：所有权、债权、知识产权、个人其他权利（如名誉权）"}, {"id": "L5-004", "lecture": 5, "page": 4, "title": "The Marriage Law (婚姻法) (1950, 1980, 2001)", "section": "民事基本法律与案例", "source": "4\nThe Marriage Law (婚姻法) (1950, 1980, 2001)\nAccording to an incomplete statistics of 50 counties in Shanxi province, 464 women died in the early 1950s.\nThose who demanded divorces but were rejected: 40 %\nThose who were prosecuted: 25 %\nThose who committed suicide because of maltreatment: 20%\nThose who committed suicide because of family disputes: 10%\nIn sum: women’s rights were not respected and protected.", "knowledge": "《婚姻法》（1950/1980/2001）。背景：据山西 50 个县的不完全统计，1950 年代初有 464 名妇女死亡——要求离婚被拒的 40%、被起诉的 25%、因受虐待自杀的 20%、因家庭纠纷自杀的 10%。总之：妇女权利不受尊重和保护。", "understand": "立法背景数据：旧婚姻制度下妇女的绝境（死亡原因的构成）。这为 1950 年婚姻法的激进内容提供正当性。", "image": "study-assets/lecture-5/slide-004.jpg", "extract": "《婚姻法》（1950、1980、2001）：据山西50个县的不完全统计，1950年代初有464名妇女死亡：要求离婚被拒的40%；被起诉的25%；因受虐待自杀的20%；因家庭纠纷自杀的10%。总之：妇女权利不受尊重和保护"}, {"id": "L5-005", "lecture": 5, "page": 5, "title": "In 1950, the Marriage Law was enacted:", "section": "民事基本法律与案例", "source": "5\nIn 1950, the Marriage Law was enacted:\nAbolishing polygamy (一夫多妻); protecting the rights of women and children. \n\nBut the mentality of mistreating women remained:\nBetween 1950 and 1952, 11,500 women died of suicide or murder. \nThe government launched a campaign to inform people of the Marriage Law. \nBy 1955, most people knew the Marriage Law.", "knowledge": "1950 年《婚姻法》颁布：废除一夫多妻；保护妇女儿童权利。但歧视妇女的心态依旧：1950–1952 年有 11,500 名妇女死于自杀或被杀；政府开展婚姻法宣传运动；到 1955 年大多数人都知道婚姻法。", "understand": "立法改变观念的难度：法律颁布后三年仍有上万妇女死亡——纸面法律与社会心态的落差。政府对策是宣传运动（运动式普法）。", "image": "study-assets/lecture-5/slide-005.jpg", "extract": "1950年《婚姻法》颁布：废除一夫多妻；保护妇女儿童权利。但歧视妇女的心态依旧：1950–1952年有11,500名妇女死于自杀或被杀；政府开展婚姻法宣传运动；到1955年大多数人都知道婚姻法"}, {"id": "L5-006", "lecture": 5, "page": 6, "title": "New social changes and the new law", "section": "民事基本法律与案例", "source": "6\nNew social changes and the new law\nIn 1980, a new Marriage Law was passed (new articles): \n\na. Protecting the rights of the old people;\nb. Family planning was included  \nc. Marriage age, male (from 20 to 22); female (from 18 to 20)\nd. Relatives within three generations cannot get married.\ne. Conditions for divorce (i.e., relation between a couple broken, and mediation failed)", "knowledge": "1980 年新《婚姻法》（新条款）：a 保护老年人权利；b 纳入计划生育；c 婚龄提高（男 20→22，女 18→20）；d 三代以内旁系血亲不得结婚；e 离婚条件（夫妻感情确已破裂、调解无效）。", "understand": "1980 年修订的五条新内容是考点。注意 b 和 c 都服务于计划生育政策——婚姻法成为人口政策工具。e 的「感情确已破裂」是离婚诉讼的核心标准。", "image": "study-assets/lecture-5/slide-006.jpg", "extract": "1980年新《婚姻法》（新条款）：a 保护老年人权利；b 纳入计划生育；c 婚龄（男20→22；女18→20）；d 三代以内亲属不得结婚；e 离婚条件（夫妻感情确已破裂、调解无效）"}, {"id": "L5-007", "lecture": 5, "page": 7, "title": "In 2001, a new Marriage Law was enacted (new content):", "section": "民事基本法律与案例", "source": "7\nIn 2001, a new Marriage Law was enacted (new content):\na. Prohibition of living together with a third party, the use of violence\nb. Divorce compensation system (e.g., one party needs to provide compensation if this party caused the divorce under certain circumstances) \nc. More regulations on the common property in a family. \nd. Divorce under certain circumstances (e.g., one person has an illness that makes one not suitable for marriage, and is not cured after the marriage).", "knowledge": "2001 年新《婚姻法》（新内容）：a 禁止与他人同居、禁止家庭暴力；b 离婚损害赔偿制度（一方有过错导致离婚须赔偿）；c 更多关于家庭共同财产的规定；d 特定情形下的离婚（如一方患有不宜结婚的疾病且婚后未愈）。", "understand": "2001 年修订针对的是市场化时代的新问题：包二奶、家暴、财产复杂化。「离婚损害赔偿」是新制度，与 L4 的婚外情数据呼应。", "image": "study-assets/lecture-5/slide-007.jpg", "extract": "2001年新《婚姻法》（新内容）：a 禁止与他人同居、禁止家庭暴力；b 离婚损害赔偿制度（一方有过错导致离婚的须赔偿）；c 更多关于家庭共同财产的规定；d 特定情形下的离婚（如一方患有不宜结婚的疾病且婚后未愈）"}, {"id": "L5-008", "lecture": 5, "page": 8, "title": "Case 1:", "section": "民事基本法律与案例", "source": "8\nCase 1:\nIt was a dispute between a child and his father in 2003. The child’s parents had a divorce in 1992. The child lived with the mother, and the father paid 150 yuan to the child per month. \nThe demand of the plaintiff (the child):\n1. The child entered a high school in 2001 and needed to pay 18,000 yuan. The father should pay half of that amount.\n2. The monthly allowance should be increased from 150 yuan to 300 yuan.", "knowledge": "案例一（抚养费，1/3）：2003 年孩子状告父亲。父母 1992 年离婚，孩子随母，父亲每月付 150 元。原告诉求：1 孩子 2001 年上高中需交 18,000 元，父亲应付一半；2 每月抚养费从 150 元增至 300 元。", "understand": "抚养费纠纷的三页案例，注意两个诉求：大额教育费分担 + 抚养费增加。", "image": "study-assets/lecture-5/slide-008.jpg", "extract": "案例一：2003年孩子与父亲的纠纷。父母1992年离婚，孩子随母生活，父亲每月付150元。原告（孩子）诉求：1 孩子2001年上高中需交18,000元，父亲应付一半；2 每月抚养费从150元增至300元"}, {"id": "L5-009", "lecture": 5, "page": 9, "title": "The defendant/the father:", "section": "民事基本法律与案例", "source": "9\nThe defendant/the father:\n1. The child did not get his permission when he chose to go to that school. \n2. The child was more than 18 years old, and the father did not have the responsibility of raising the child. In addition, the father got married and had his own child. He did not have the capability. \n\nThe court:\n1. The mother’s monthly salary: 1,446 yuan\n     The father’s monthly salary: 1,058 yuan, and he had a child", "knowledge": "案例一（2/3）：被告（父亲）辩称：1 孩子择校未经其同意；2 孩子已满 18 岁，无抚养义务；且自己再婚育有一子，没有能力。法院查明：母亲月薪 1,446 元；父亲月薪 1,058 元且有孩子。", "understand": "双方主张 + 法院查明的事实（双方收入）。父亲的三条抗辩：程序（未同意）、法律（已成年）、能力（收入低有新家）。", "image": "study-assets/lecture-5/slide-009.jpg", "extract": "被告（父亲）：1 孩子择校未经其同意；2 孩子已满18岁，父亲无抚养义务；且自己再婚育有一子，没有能力。法院：母亲月薪1,446元；父亲月薪1,058元且有孩子"}, {"id": "L5-010", "lecture": 5, "page": 10, "title": "Ruling:", "section": "民事基本法律与案例", "source": "10\nRuling:\n1. The child was still in school and did not have independent income, so the father needed \n     to increase the allowance to 250 yuan.\n2. The child entered the school without the agreement of the father, and the money paid   \n     to the school did not belong to tuition, so the father did not need to pay for that. \n3. Lawsuit fee: 382 yuan: the father paid 200 yuan, and the plaintiff paid 182 yuan. \n4. If a party did not accept the ruling, s/he could appeal to the upper-level court within 15 days after s/he received the ruling.", "knowledge": "案例一（3/3）判决：1 孩子仍上学无独立收入，父亲须将抚养费增至 250 元；2 择校未经父亲同意且费用不属学费，父亲无需支付；3 诉讼费 382 元：父亲 200 元、原告 182 元；4 不服可在收到判决后 15 日内向上级法院上诉。", "understand": "判决是「各打五十大板」的衡平结果：部分支持（抚养费涨 100 元）、部分驳回（择校费）。注意细节：诉讼费分摊方式和 15 日上诉期——民事诉讼程序的实用知识。", "image": "study-assets/lecture-5/slide-010.jpg", "extract": "判决：1 孩子仍上学、无独立收入，父亲须将抚养费增至250元；2 择校未经父亲同意且费用不属学费，父亲无需支付；3 诉讼费382元：父亲付200元，原告付182元；4 不服可在收到判决后15日内向上级法院上诉"}, {"id": "L5-011", "lecture": 5, "page": 11, "title": "One survey of college students in Beijing, Shanghai, and Gua", "section": "民事基本法律与案例", "source": "11\nOne survey of college students in Beijing, Shanghai, and Guangzhou in 2006 found that the average monthly income was 707 yuan, 87 percent of the income came from their parents.", "knowledge": "2006 年北上广大学生调查：月均收入 707 元，87% 来自父母。", "understand": "背景数据：大学生经济上高度依赖父母——为理解抚养费诉讼的社会背景（成年但无法独立）。", "image": "study-assets/lecture-5/slide-011.jpg", "extract": "2006年北上广大学生调查：月均收入707元，87%来自父母"}, {"id": "L5-012", "lecture": 5, "page": 12, "title": "Case 2:", "section": "民事基本法律与案例", "source": "12\nCase 2:\nAzi was born in 1984 and was a college student in 2001. Her parents had a divorce in 2001. According to the agreement between the parents, Azi lived with her mother, and the father paid 600 yuan in allowance to her until she graduated. In 2005, the mother could not afford to pay the girl’s living cost, and the girl sued the father for an increase in the living allowance (to 1,000 yuan).", "knowledge": "案例二（1/2）：阿紫 1984 年生，2001 年上大学；父母 2001 年离婚，协议阿紫随母，父亲每月付 600 元至她毕业；2005 年母亲无力负担，女儿起诉父亲要求把抚养费增至 1,000 元。", "understand": "与案例一对照的第二个抚养费案：父亲有书面协议（600 元/月），案情更「简单」。", "image": "study-assets/lecture-5/slide-012.jpg", "extract": "案例二：阿紫1984年生，2001年上大学；父母2001年离婚，协议阿紫随母，父亲每月付600元抚养费至她毕业；2005年母亲无力负担，女儿起诉父亲要求增至1,000元"}, {"id": "L5-013", "lecture": 5, "page": 13, "title": "The father defended that he was remarried and had family res", "section": "民事基本法律与案例", "source": "13\nThe father defended that he was remarried and had family responsibilities. He was willing to pay 600 yuan until the daughter finished her college education. He was willing to pay more if he had more income. For the time being, he could not. \n\nThe court rejected the daughter’s lawsuit: she was more than 18 years old and was in college. She was supposed to live independently.", "knowledge": "案例二（2/2）：父亲辩称已再婚有家庭负担，愿按原协议付 600 元至女儿毕业，收入多了愿意多付，目前做不到。法院驳回女儿的诉讼：她已满 18 岁且在上大学，应当独立生活。", "understand": "对比两个案例的判决差异：案例一支持增加（高中生），案例二驳回（大学生）——区别在于「应当独立生活」的年龄与身份判断。判决逻辑：法律义务止于成年，上大学的费用不是法定义务。", "image": "study-assets/lecture-5/slide-013.jpg", "extract": "父亲辩称已再婚有家庭负担，愿按协议付600元至女儿毕业，收入多了愿意多付，目前做不到。法院驳回女儿的诉讼：她已满18岁且在上大学，应当独立生活"}, {"id": "L5-014", "lecture": 5, "page": 14, "title": "Case 3:", "section": "民事基本法律与案例", "source": "14\nCase 3:\nThe son of an old couple had a dispute with his parents about the fee he should give to the parents. The son’s wife was laid off, and the family depended on the husband’s 800 yuan income. Previously, the son had to pay 100 yuan to his parents per month. He wanted to reduce the amount from 100 yuan to 20 yuan. But his parents refused. The son filed a lawsuit to the court.", "knowledge": "案例三（赡养）：一对老夫妇的儿子因赡养费与父母发生纠纷；儿媳下岗，全家靠儿子 800 元收入；此前儿子每月给父母 100 元，他想减到 20 元，父母拒绝；儿子诉至法院。", "understand": "反方向的抚养案：子女要求减少赡养费。800 元养全家的情况下 100 元赡养费确实沉重。", "image": "study-assets/lecture-5/slide-014.jpg", "extract": "案例三：一对老夫妇的儿子就赡养费与父母发生纠纷；儿媳下岗，全家靠儿子800元收入；此前儿子每月给父母100元，他想减到20元，父母拒绝；儿子诉至法院"}, {"id": "L5-015", "lecture": 5, "page": 15, "title": "The ruling: his parents’ monthly income was 16,000 yuan. The", "section": "民事基本法律与案例", "source": "15\nThe ruling: his parents’ monthly income was 16,000 yuan. The court ruled that the amount paid by the son was reduced to 40 yuan. \n\nWhy did the parents refuse to accept the amount? The face issue", "knowledge": "案例三判决：父母月收入 16,000 元（原文如此），法院判儿子的赡养费减至 40 元。父母为什么不肯接受减少？面子问题。", "understand": "判决结果：减至 40 元（在儿子负担与老人间平衡）。父母月收入远高于儿子，拒绝减少其实是「面子问题」——赡养费数额成为孝心的象征，钱是次要的。", "image": "study-assets/lecture-5/slide-015.jpg", "extract": "判决：父母月收入16,000元，法院判儿子的赡养费减至40元。父母为什么不肯接受减少？面子问题"}, {"id": "L5-016", "lecture": 5, "page": 16, "title": "Private-Life Disputes (N  45)", "section": "民事基本法律与案例", "source": "16\nPrivate-Life Disputes (N  45)\n\n T y p e s   o f   C a s e s     N u m b e r   D e a t h s   I n j u r e d       M a r r i a g e - r e l a t e d   d i s p u t e s       2 0   3 8   6 D i s p u t e s   b e t w e e n   p e o p l e   i n   l o v e   1 4   2 3   3 D i s p u t e s   b e t w e e n   p e o p l e   l i v i n g   t o g e t h e r     1 1   1 6   2 T o t a l   c a s e s   4 5   7 7               1 1", "knowledge": "表格：私生活纠纷引发的命案（N=45）——婚姻纠纷 20 起（死 38、伤 6）；恋人纠纷 14 起（死 23、伤 3）；同居纠纷 11 起（死 16、伤 2）；合计 45 起（死 77、伤 11）。", "understand": "民事纠纷不解决会升级成命案：45 起感情纠纷造成 77 死。婚姻纠纷是最危险的类别。这说明民事解纷机制（调解、诉讼）的社会稳定功能。", "image": "study-assets/lecture-5/slide-016.jpg", "extract": "私生活纠纷（N=45）：婚姻纠纷20起——死38、伤6；恋人纠纷14起——死23、伤3；同居纠纷11起——死16、伤2；合计45起——死77、伤11"}, {"id": "L5-017", "lecture": 5, "page": 17, "title": "The Contract Law", "section": "民事基本法律与案例", "source": "17\nThe Contract Law\n\nRegulating mainly economic activities among citizens or organizations; \n\nIt is very important to specify all the conditions in the contract because court rulings are strictly based on the contract and oral promises are not legally binding.", "knowledge": "《合同法》：主要规范公民或组织之间的经济活动；在合同中写明所有条件非常重要，因为法院判决严格依据合同，口头承诺没有法律约束力。", "understand": "合同法的核心规则：书面至上。oral promises are not legally binding 是考点——与 L2 理发店口头协议案对照（那个案子靠其他途径解决）。", "image": "study-assets/lecture-5/slide-017.jpg", "extract": "《合同法》：主要规范公民或组织之间的经济活动；在合同中写明所有条件非常重要，因为法院判决严格依据合同，口头承诺没有法律约束力"}, {"id": "L5-018", "lecture": 5, "page": 18, "title": "Case 1", "section": "民事基本法律与案例", "source": "18\nCase 1\nA lady saw an advertisement of a residential building. The advertisement said that the apartments could be used for both residential and business purposes. According to government regulation, this (i.e., for the business purpose) needed the approval of the government. After the lady bought the apartment, she realized that the developer did not get the approval, which meant that the apartment she bought could only be used for the residential purpose. She filed a lawsuit against the developer, but she lost the case because the contract did not say that the apartment would be used for business purposes. \n\nWhy did she buy the apartment in the first place? \nOral promise or bragging by the developer, which was not legally binding", "knowledge": "合同法案例一：一女士看到楼盘广告称公寓可商住两用；按政府规定商用需审批；她买房后发现开发商未获审批，房子只能居住；她起诉开发商但败诉——因为合同没有写明可商用。", "understand": "广告承诺 vs 合同文本：口头/广告宣传不构成合同内容，败诉理所当然。教训：一切以合同为准。", "image": "study-assets/lecture-5/slide-018.jpg", "extract": "案例一：一女士看到楼盘广告称公寓可商住两用；按政府规定商用需政府审批；她买房后发现开发商未获审批，房子只能居住；她起诉开发商但败诉——因为合同没有写明可商用"}, {"id": "L5-019", "lecture": 5, "page": 19, "title": "Case 2", "section": "民事基本法律与案例", "source": "19\nCase 2\nCompany A bought some products from Company B. According to the contract, B should provide product x (e.g., note book) to A. A person from company A told B that they actually needed product y (desk computer), and x is more expensive than y. Without changing the contract, B provided A with y. It turned out that it was a trick by A. A sued B for compensation for the violation of the contract.", "knowledge": "合同法案例二：A 公司向 B 公司购货，合同约定 B 提供产品 x（如笔记本）；A 公司一人告诉 B 他们实际需要产品 y（台式机），x 比 y 贵；B 未改合同就交付了 y；结果这是 A 设的局，A 反告 B 违约索赔。", "understand": "商业陷阱案例：任何变更必须改合同。B 的「好意」成为被起诉的把柄——合同刚性原则在欺诈环境下的冷酷应用。", "image": "study-assets/lecture-5/slide-019.jpg", "extract": "案例二：A公司向B公司购货，合同约定B提供产品x（如笔记本）；A公司一人告诉B他们实际需要产品y（台式机），x比y贵；B未改合同就交付了y；结果这是A设的局，A反告B违约索赔"}, {"id": "L5-020", "lecture": 5, "page": 20, "title": "Medical disputes in China", "section": "医疗纠纷", "source": "20\nMedical disputes in China \n  In 2013, China had 7.3 billion outpatients, and the number of medical disputes reached 70,000. But this number includes only those that were submitted to mediation or arbitration agencies and legal departments.", "knowledge": "中国的医疗纠纷：2013 年全国门诊 73 亿人次，医疗纠纷达 7 万起；但这只包括提交调解、仲裁机构和法律部门的部分。", "understand": "医疗纠纷板块开场。73 亿人次 vs 7 万起纠纷——比例虽小但绝对数大，且统计只覆盖进入正式渠道的部分。", "image": "study-assets/lecture-5/slide-020.jpg", "extract": "中国的医疗纠纷：2013年全国门诊73亿人次，医疗纠纷达7万起；但这只包括提交调解、仲裁机构和法律部门的部分"}, {"id": "L5-021", "lecture": 5, "page": 21, "title": "March 2012, a doctor was killed in Harbin", "section": "医疗纠纷", "source": "21\n21\nMarch 2012, a doctor was killed in Harbin \n   An innocent  28-year old doctor was killed by a 17-year old patient", "knowledge": "2012 年 3 月哈尔滨杀医案：一名 28 岁的无辜医生被 17 岁患者杀害。", "understand": "震动全国的杀医案：医生与患者并无直接纠纷（无辜），凸显医患对立的极端化。", "image": "study-assets/lecture-5/slide-021.jpg", "extract": "2012年3月哈尔滨杀医案：一名28岁的无辜医生被17岁患者杀害"}, {"id": "L5-022", "lecture": 5, "page": 22, "title": "Life in jail", "section": "医疗纠纷", "source": "22\n22\nLife in jail", "knowledge": "判决：凶手被判无期徒刑。", "understand": "17 岁未成年，无期已是顶格量刑。", "image": "study-assets/lecture-5/slide-022.jpg", "extract": "（凶手被判）无期徒刑"}, {"id": "L5-023", "lecture": 5, "page": 23, "title": "Background of medical disputes in China", "section": "医疗纠纷", "source": "Background of medical disputes in China \n23", "knowledge": "章节页：中国医疗纠纷的背景。", "understand": "转入医患矛盾的社会背景分析。", "image": "study-assets/lecture-5/slide-023.jpg", "extract": "中国医疗纠纷的背景"}, {"id": "L5-024", "lecture": 5, "page": 24, "title": "about 5,200 internet users responded to this event:", "section": "医疗纠纷", "source": "24\n24\nabout 5,200 internet users responded to this event:\n\n77 %: happy\n17 %: angry\n5%: “sympathetic.” \n\nWhy do people react in this way?", "knowledge": "约 5,200 名网民对哈尔滨杀医案的反应：77% 高兴；17% 愤怒；5% 同情。为什么人们这样反应？", "understand": "最刺眼的数据：医生被杀，77% 的网民「高兴」——医患信任已崩坏到反人性的程度。设问引导思考根源（下一页的制度性原因）。", "image": "study-assets/lecture-5/slide-024.jpg", "extract": "约5,200名网民对此事件的反应：77%高兴；17%愤怒；5%「同情」。为什么人们这样反应？"}, {"id": "L5-025", "lecture": 5, "page": 25, "title": "According to the Ministry of Public Health and Family Planni", "section": "医疗纠纷", "source": "25\n   According to the Ministry of Public Health and Family Planning, the number of medical disputes involving violence increased from 10,250 in 2006 to 17,240 in 2010, or by 68 percent. \n\n   In the 123 cases involving violence, patients or their family members beat and often injured medical staff in 48 cases, and in 37 cases they harmed medical staff mostly with a knife. According to reports on violent medical disputes, at least 15 doctors were killed between 2000 and 2013.", "knowledge": "卫生部数据：涉暴力医疗纠纷从 2006 年 10,250 起增至 2010 年 17,240 起，上升 68%；123 起暴力案件中，48 起患者或家属殴打（常致伤）医务人员，37 起多为持刀伤害；2000–2013 年至少 15 名医生被杀。", "understand": "医暴的量化：五年升 68%，15 名医生被杀。「医闹」成为独特社会现象。", "image": "study-assets/lecture-5/slide-025.jpg", "extract": "据卫生部：涉暴力医疗纠纷从2006年10,250起增至2010年17,240起，上升68%；123起暴力案件中，48起患者或家属殴打（常致伤）医务人员，37起多为持刀伤害；据报道，2000–2013年至少15名医生被杀"}, {"id": "L5-026", "lecture": 5, "page": 26, "title": "D o c t o r s   ( % )   P a t i e n t s   ( % )   R e s i d ", "section": "医疗纠纷", "source": "26\n  D o c t o r s   ( % )   P a t i e n t s   ( % )   R e s i d e n t s   ( % ) D i f f i c u l t   t o   s e e   d o c t o r s   6 4 . 4   8 2 . 4   8 0 . 9 E x p e n s i v e   t o   s e e   d o c t o r s   8 1 . 3   9 6 . 2   9 6 . 4 S a m p l e   s i z e   1 , 3 0 5   1 , 2 7 9   3 , 6 3 6\nMedical Service in Shanghai/2006", "knowledge": "表格：上海医疗服务调查（2006）——「看病难」：医生认同 64.4%、患者 82.4%、居民 80.9%；「看病贵」：81.3%、96.2%、96.4%（样本：医生 1,305、患者 1,279、居民 3,636）。", "understand": "医患双方对「看病难、看病贵」高度共识（连医生都 81% 认同看病贵）——矛盾不在医患之间，而在医疗体制本身。", "image": "study-assets/lecture-5/slide-026.jpg", "extract": "上海医疗服务调查（2006）：「看病难」——医生64.4%、患者82.4%、居民80.9%；「看病贵」——医生81.3%、患者96.2%、居民96.4%（样本：医生1,305、患者1,279、居民3,636）"}, {"id": "L5-027", "lecture": 5, "page": 27, "title": "Causes:", "section": "医疗纠纷", "source": "27\nCauses:\n1. medical malpractice committed by medical staff; \n2. poor services provided by hospitals, \n3 poor communication between medical staff and patients\n4 irregularities in medical treatment; \n5 technical difficulties; \n6 patients’ demands, \n7 high medical fees, \n8. others.\n  more medical disputes have occurred in hospitals with good facilities or better doctors.\n\n A 2011 survey of more than 10,000 doctors showed that about 30 percent reported that they had 50 or more patients per day.", "knowledge": "医疗纠纷的成因：1 医疗事故；2 医院服务差；3 医患沟通不良；4 诊疗不规范；5 技术困难；6 患者的要求；7 医疗费高；8 其他。更多纠纷发生在设施好、医生好的大医院。2011 年对 1 万多名医生的调查：约 30% 的医生每天看 50 个以上病人。", "understand": "八条成因清单。「纠纷集中在大医院」这个悖论的解释在下页：大医院人满为患、沟通时间极少（每天 50+ 病人），沟通不良（成因 3）由此产生。", "image": "study-assets/lecture-5/slide-027.jpg", "extract": "成因：1 医疗事故；2 医院服务差；3 医患沟通不良；4 诊疗不规范；5 技术困难；6 患者的要求；7 医疗费高；8 其他。更多纠纷发生在设施好、医生好的大医院。2011年对1万多名医生的调查：约30%的医生每天看50个以上病人"}, {"id": "L5-028", "lecture": 5, "page": 28, "title": "m i l l i o n   p e o p l e   　 广 东 省 中 医 院 / G u a n g d o ", "section": "医疗纠纷", "source": "28\n28\n  　 m i l l i o n   p e o p l e   　 广 东 省 中 医 院 / G u a n g d o n g   ６ . ８ 中 山 大 学 附 属 第 一 医 院 / G u a n g d o n g   ４ . ６ 四 川 大 学 华 西 医 院 / S i c h u a n   ４ . ０ 广 东 省 人 民 医 院 / G u a n g d o n g 　   ３ . ７ 北 京 朝 阳 医 院 / B e i j i n g   ３ . ５ ８ 北 京 大 学 第 三 医 院 / B e i j i n g   ３ . ２ ３ 复 旦 大 学 附 属 中 山 医 院 / S h a n g h a i   ２ . ９ ４ 北 京 儿 童 医 院 / B e i j i n g   ２ . ７ ０\nOutpatients/门诊病人（2012）", "knowledge": "表格：各大医院门诊量（2012，百万人次）——广东省中医院 6.8；中山一院 4.6；四川华西 4.0；广东省人民医院 3.7；北京朝阳 3.58；北医三院 3.23；上海中山 2.94；北京儿童医院 2.70。", "understand": "大医院年门诊量以百万计（最高 680 万人次/年，即每天近两万）——解释上页「沟通不良」与「大医院纠纷多」的结构性根源。", "image": "study-assets/lecture-5/slide-028.jpg", "extract": "门诊病人（2012，百万人次）：广东省中医院6.8；中山大学附属第一医院4.6；四川大学华西医院4.0；广东省人民医院3.7；北京朝阳医院3.58；北京大学第三医院3.23；复旦大学附属中山医院2.94；北京儿童医院2.70"}, {"id": "L5-029", "lecture": 5, "page": 29, "title": "Hospitals’ major money-making methods:", "section": "医疗纠纷", "source": "29\n29\nHospitals’ major money-making methods:\nDrug price\nMedical checks \n\nFor example, the income of a top-tier hospital (i.e., level three) in Beijing between 2000 and 2009 consisted of the following: \nmedical service (53 %), \ndrug selling (40%), \ngovernment subsidy (5 %), and \nothers (2 %).", "knowledge": "医院的主要赚钱方式：药价、检查。例：北京某三甲医院 2000–2009 年收入构成：医疗服务 53%、卖药 40%、政府补贴 5%、其他 2%。", "understand": "「以药养医」的制度根源：政府补贴仅 5%，医院必须靠药和检查创收——看病贵、过度医疗的结构性解释。", "image": "study-assets/lecture-5/slide-029.jpg", "extract": "医院的主要赚钱方式：药价、医疗检查。例：北京某三甲医院2000–2009年的收入构成：医疗服务53%、卖药40%、政府补贴5%、其他2%"}, {"id": "L5-030", "lecture": 5, "page": 30, "title": "第 30 页", "section": "医疗纠纷", "source": "30", "knowledge": "（图片过渡页）", "understand": "医疗主题图片页。", "image": "study-assets/lecture-5/slide-030.jpg", "extract": "（本页无提取文字，为图片页）"}, {"id": "L5-031", "lecture": 5, "page": 31, "title": "妇 产 科   （ O b s t e t r i c s   a n d   G y n e c o l o g y ", "section": "医疗纠纷", "source": "31\n妇 产 科   （ O b s t e t r i c s   a n d   G y n e c o l o g y ）   2 6 7   1 9 . 7 6 % 骨 科   ( o r t h o p e d i c s )   1 0 6   7 . 8 5 % 呼 吸 内 科   ( R e s p i r a t o r y )   8 1   6 . 0 0 % 心 血 管 内 科   ( V a s c u l o c a r d i o l o g y )     7 7   5 . 7 0 % 消 化 内 科   ( G a s t r o e n t e r o l o g y )   7 5   5 . 5 5 % 神 经 内 科   ( N e u r o l o g y )   6 5   4 . 8 1 % 消 化 外 科   ( D i g e s t i v e   S u r g e r y )   6 0   4 . 4 4 % 儿 科   ( P e d i a t r i c s )   5 8   4 . 2 9 % M i s c e l l a n e o u s     5 6 2   4 1 . 6 0 % T o t a l     1 3 5 1   1 0 0 . 0 0 %\nDepartments and conflicts", "knowledge": "表格：医疗纠纷的科室分布（共 1,351 起）——妇产科 267 起（19.76%）居首；骨科 106（7.85%）；呼吸内科 81（6.00%）；心血管内科 77（5.70%）；消化内科 75（5.55%）；神经内科 65（4.81%）；消化外科 60（4.44%）；儿科 58（4.29%）；其他 562（41.60%）。", "understand": "妇产科纠纷占近五分之一：生育期望高、风险事件情感冲击大，是最易起冲突的科室。", "image": "study-assets/lecture-5/slide-031.jpg", "extract": "科室与冲突（共1,351起）：妇产科267（19.76%）；骨科106（7.85%）；呼吸内科81（6.00%）；心血管内科77（5.70%）；消化内科75（5.55%）；神经内科65（4.81%）；消化外科60（4.44%）；儿科58（4.29%）；其他562（41.60%）"}, {"id": "L5-032", "lecture": 5, "page": 32, "title": "Court Rulings", "section": "医疗纠纷", "source": "32\nCourt Rulings \n  \n P a t i e n t s ’   w i n n i n g   ( c a s e s )   \n P a t i e n t s ’   w i n n i n g   ( % ) F i r s t - i n s t a n c e   r u l i n g                             1 6 8   7 3 . 4 S e c o n d - i n s t a n c e   r u l i n g                                 7 2   5 1 . 4", "knowledge": "表格：法院判决中患者胜诉情况——一审 168 起胜诉（73.4%）；二审 72 起胜诉（51.4%）。", "understand": "患者胜诉率一审超七成——进入诉讼的医疗纠纷中患者占优（说明进入诉讼的多是医院确有问题的案子）。二审胜诉率下降，反映改判纠偏。", "image": "study-assets/lecture-5/slide-032.jpg", "extract": "法院判决：患者胜诉——一审168起（73.4%）；二审72起（51.4%）"}, {"id": "L5-033", "lecture": 5, "page": 33, "title": "Patients’ Winning in Cases with or without Supporting Eviden", "section": "医疗纠纷", "source": "33\nPatients’ Winning in Cases with or without Supporting Evidence \n  \n F i r s t   i n s t a n c e   ( % )   S e c o n d   i n s t a n c e   ( % ) W i t h   s u p p o r t i n g   e v i d e n c e     9 7 . 8   6 9 . 3 W i t h o u t   s u p p o r t i n g   e v i d e n c e     3 5 . 6   3 0 . 7", "knowledge": "表格：有无证据时患者胜诉率——一审：有证据 97.8%、无证据 35.6%；二审：有证据 69.3%、无证据 30.7%。", "understand": "证据是胜诉的决定性变量：有证据胜诉率近 98%，无证据只有约三分之一。医疗纠纷维权的关键是保存证据（病历、单据）。", "image": "study-assets/lecture-5/slide-033.jpg", "extract": "有无证据时患者胜诉率：一审——有证据97.8%、无证据35.6%；二审——有证据69.3%、无证据30.7%"}, {"id": "L5-034", "lecture": 5, "page": 34, "title": "The creation of the mediation Committee for medical disputes", "section": "医疗纠纷", "source": "34\nThe creation of the mediation Committee for medical disputes", "knowledge": "医疗纠纷调解委员会的设立。", "understand": "制度回应：专门的第三方调解机构（医调委）处理医疗纠纷，避免医患直接对抗。", "image": "study-assets/lecture-5/slide-034.jpg", "extract": "医疗纠纷调解委员会的设立"}, {"id": "L5-035", "lecture": 5, "page": 35, "title": "第 35 页", "section": "医疗纠纷", "source": "35", "knowledge": "（图片过渡页）", "understand": "医疗调解相关图片页。", "image": "study-assets/lecture-5/slide-035.jpg", "extract": "（本页无提取文字，为图片页）"}, {"id": "L5-036", "lecture": 5, "page": 36, "title": "Modes of Intervention by State Agencies", "section": "医疗纠纷", "source": "36\nModes of Intervention by State Agencies \n\n M o d e   o f   I n t e r v e n t i o n   C a s e s   F r e q u e n c y   ( % ) I n t e r v e n i n g   a s   t h e   d e c i s i o n   m a k e r         5 4   2 4 . 3 I n t e r v e n i n g   a s   a n   a d v i s o r     1 1 8   5 3 . 2 E n t r u s t i n g   t h e   m e d i a t i o n   c o m m i t t e e   \n f o r   r e s o l u t i o n         6 1   2 7 . 5 T o t a l   n u m b e r     2 2 2   1 0 0", "knowledge": "表格：国家机关介入医疗纠纷的方式（共 222 起）——作为决定者介入 54 起（24.3%）；作为顾问介入 118 起（53.2%）；委托调解委员会解决 61 起（27.5%）。", "understand": "政府介入的三模式：过半数是「顾问」式（柔性指导），直接做决定或委托调解各占约四分之一。", "image": "study-assets/lecture-5/slide-036.jpg", "extract": "国家机关介入方式（共222起）：作为决定者介入54起（24.3%）；作为顾问介入118起（53.2%）；委托调解委员会解决61起（27.5%）"}, {"id": "L5-037", "lecture": 5, "page": 37, "title": "The mismanagement", "section": "医疗纠纷", "source": "37\nThe mismanagement \nCourts may refuse to accept the case\n\n\nFood and Drug Agency \n2004:\nU.S: 184 new medicines\nChina: 10,009\n\nLawsuits against two agencies of FAD (for its inaction). \nOne person reported the case for 11 years.", "knowledge": "管理失当：法院可能拒绝受理案件。药监局（FDA 类比）案例：2004 年美国批准新药 184 种，中国 10,009 种；对药监局两个下属机构的不作为提起诉讼；有人为一起案件举报了 11 年。", "understand": "药品审批的数字对比（184 vs 10,009）说明审批腐败/滥批的疯狂程度——为下一页的药监局长死刑案铺垫。", "image": "study-assets/lecture-5/slide-037.jpg", "extract": "管理失当：法院可能拒绝受理案件。药监局：2004年——美国批准新药184种，中国10,009种；对药监局两个下属机构的不作为提起诉讼；有人为一起案件举报了11年"}, {"id": "L5-038", "lecture": 5, "page": 38, "title": "Sentenced to death in June 2007", "section": "医疗纠纷", "source": "38\nSentenced to death in June 2007", "knowledge": "（郑筱萸）2007 年 6 月被判死刑。", "understand": "国家药监局原局长郑筱萸因受贿和滥批药品被判死刑——药品监管腐败的最高级别案例，与前页 10,009 种新药直接相关。", "image": "study-assets/lecture-5/slide-038.jpg", "extract": "（2007年6月）被判处死刑"}, {"id": "L6-001", "lecture": 6, "page": 1, "title": "Lecture 6", "section": "行政诉讼的兴起与案例", "source": "1\n1\nLecture 6    \n\nSuing the government in China", "knowledge": "Lecture 6 主题：在中国告政府（Suing the government in China）。", "understand": "L4 讲了民告民（民事诉讼），本讲讲民告官（行政诉讼与国家赔偿）：公民能不能、敢不敢、怎么告政府，以及结果如何。", "image": "study-assets/lecture-6/slide-001.jpg", "extract": "第六讲：在中国告政府"}, {"id": "L6-002", "lecture": 6, "page": 2, "title": "第 2 页", "section": "行政诉讼的兴起与案例", "source": "2", "knowledge": "（图片过渡页）", "understand": "行政诉讼主题的开场图片。", "image": "study-assets/lecture-6/slide-002.jpg", "extract": "（本页无提取文字，为图片页）"}, {"id": "L6-003", "lecture": 6, "page": 3, "title": "T o t a l   ( % )       U r b a n   ( % )     R u r a l   ( ", "section": "行政诉讼的兴起与案例", "source": "3\n3\n                                                                                T o t a l   ( % )       U r b a n   ( % )     R u r a l   ( % )                                                                                   T o t a l   ( % )       U r b a n   ( % )     R u r a l   ( % )                                                                                   T o t a l   ( % )       U r b a n   ( % )     R u r a l   ( % )                                                                                   T o t a l   ( % )       U r b a n   ( % )     R u r a l   ( % ) M o d e s   o f   a c t i o n               L a w     2 7 . 1   3 2 . 9   2 1 . 5       A p p r o a c h i n g   u p p e r - l e v e l   l e a d e r s     2 6 . 8   2 9 . 3   2 4 . 0       N o   a c t i o n   2 6 . 0   1 4 . 3   3 9 . 5       A p p r o a c h i n g   l e a d e r s   o f   t h e   a g e n c y   c o n c e r n e d     1 8 . 3   2 2 . 1   1 6 . 5       C o l l e c t i v e   p e t i t i o n     1 3 . 4   1 6 . 4       9 . 9       A p p r o a c h i n g   t h e   m e d i a         4 . 6       5 . 7       3 . 3       M i s c e l l a n e o u s         3 . 8       4 . 3       3 . 3       T o t a l   n u m b e r   o f   c a s e s       2 6 1     1 4 0       1 2 1\nResolving state-citizen disputes", "knowledge": "表格：国家—公民纠纷的解决方式（总体/城市/农村）——用法律 27.1%（城市 32.9/农村 21.5）；找上级领导 26.8%（29.3/24.0）……", "understand": "官民纠纷的解决渠道数据：用法律的仅约四分之一，与找领导相当。城市用法律明显高于农村——呼应 L4 的城乡梯度。完整数据见原图。", "image": "study-assets/lecture-6/slide-003.jpg", "extract": "国家—公民纠纷的解决：用法律27.1%（城市32.9/农村21.5）；找上级领导26.8（29.3/24.0）……（其余见原表）"}, {"id": "L6-004", "lecture": 6, "page": 4, "title": "A 84-year-old lady sued a district government in Beijing", "section": "行政诉讼的兴起与案例", "source": "4\n4\nA 84-year-old lady sued a district government in Beijing \nThis lady sued the local government for the compensation for her demolished apartment. More than 90 high-ranking officials attended the hearing. She won the case.", "knowledge": "案例：北京一位 84 岁老太太起诉区政府，要求拆迁补偿；90 多名高级官员旁听庭审；她胜诉了。", "understand": "民告官的正面案例：老人胜诉 + 官员集体旁听（行政诉讼的警示教育功能）。个案鼓舞人心，但注意它是被报道的「样板」。", "image": "study-assets/lecture-6/slide-004.jpg", "extract": "北京一位84岁老太太起诉区政府：她就公寓被拆的补偿问题起诉当地政府，90多名高级官员旁听庭审；她胜诉了"}, {"id": "L6-005", "lecture": 6, "page": 5, "title": "Suing the government has not been common in China", "section": "行政诉讼的兴起与案例", "source": "5\n5\nSuing the government has not been common in China\n\n(1) Work unit system (direct contact with the government was limited)\n(2) Rural collective\n(3) Before the 1990s, there was no law specifying how to sue the government in China\n(4) Traditional influence (屈死不告官)", "knowledge": "民告官在中国过去并不常见：(1) 单位制（与政府直接接触有限）；(2) 农村集体；(3) 1990 年代前没有告政府的法律；(4) 传统影响（屈死不告官）。", "understand": "四个原因解释行政诉讼的长期缺位：两个制度原因（单位、公社隔绝了官民直接冲突）+ 法律空白 + 文化禁忌。谚语「屈死不告官」对应 L1 的厌讼文化。", "image": "study-assets/lecture-6/slide-005.jpg", "extract": "民告官在中国过去并不常见：(1) 单位制（与政府直接接触有限）；(2) 农村集体；(3) 1990年代前没有告政府的法律；(4) 传统影响（屈死不告官）"}, {"id": "L6-006", "lecture": 6, "page": 6, "title": "New environment and the violation of citizen rights:", "section": "行政诉讼的兴起与案例", "source": "6\n6\nNew environment and the violation of citizen rights:\nMore direct between citizens and government agencies: \n     violations of citizens’ rights are more common \n\nb. The making of laws \n     The Administrative Litigation Law (1990)\n     State Compensation Law (1994)\n     The Administrative Reconsideration Law (1999)\n\nc. The rise of awareness of rights on the part of citizens", "knowledge": "新环境与公民权利受侵：a 公民与政府机构的直接接触增多，侵权更常见；b 立法——《行政诉讼法》（1990）、《国家赔偿法》（1994）、《行政复议法》（1999）；c 公民权利意识上升。", "understand": "行政诉讼兴起的三因素：接触增多（侵权机会）+ 立法（武器）+ 意识（意愿）。三部法律的年份是考点。", "image": "study-assets/lecture-6/slide-006.jpg", "extract": "新环境与公民权利受侵：a 公民与政府机构的直接接触增多，侵权更常见；b 立法——《行政诉讼法》（1990）、《国家赔偿法》（1994）、《行政复议法》（1999）；c 公民权利意识上升"}, {"id": "L6-007", "lecture": 6, "page": 7, "title": "How to sue the government or its agencies in China:", "section": "行政诉讼的兴起与案例", "source": "7\n7\nHow to sue the government or its agencies in China:\nThe Administrative Litigation Law (行政诉讼法) \n      Allows citizens to sue the government agencies for violations of their rights\n\n       e.g., If a government agency pulls down your home illegally, you file a lawsuit to the court.", "knowledge": "如何告政府（1）：《行政诉讼法》——允许公民就政府机构的侵权行为起诉。例：政府违法拆你的房，可向法院起诉。", "understand": "三大救济途径之一：行政诉讼。记住年份 1990 和基本功能。", "image": "study-assets/lecture-6/slide-007.jpg", "extract": "如何告政府或政府机构：《行政诉讼法》——允许公民就政府机构的侵权行为起诉。例：政府机构违法拆你的房，可向法院起诉"}, {"id": "L6-008", "lecture": 6, "page": 8, "title": "(2) State Compensation Law (国家赔偿法)", "section": "行政诉讼的兴起与案例", "source": "8\n8\n(2) State Compensation Law (国家赔偿法)\n\n       e.g., If the police department illegally detains you for a week, you can lodge a lawsuit for state compensation.", "knowledge": "（2）《国家赔偿法》：例：警察非法拘留你一周，可起诉要求国家赔偿。", "understand": "途径二：国家赔偿（1994）。针对已经发生的违法侵害，事后索赔。", "image": "study-assets/lecture-6/slide-008.jpg", "extract": "(2)《国家赔偿法》：例：警察非法拘留你一周，可起诉要求国家赔偿"}, {"id": "L6-009", "lecture": 6, "page": 9, "title": "(3) The Administrative Reconsideration Law (行政复议法)", "section": "行政诉讼的兴起与案例", "source": "9\n9\n(3) The Administrative Reconsideration Law (行政复议法)\n a. Litigants can appeal to the government or its   agencies without going to the court\n b. It is free. \n\n   e.g., If you park your car in a place you are not supposed to park. According to the law, you pay 50 yuan in fine. But the police department requires you to pay 200. You can apply to the next higher-level police department (e.g., from the county to the city) for an administrative reconsideration of the police department’s fine.", "knowledge": "（3）《行政复议法》：a 当事人可不经法院向政府或其机构申诉；b 免费。例：你违停依法应罚 50 元，警察要罚 200 元，你可向上一级公安机关（如从县到市）申请行政复议。", "understand": "途径三：行政复议（1999）——行政系统内部救济，特点是免费、快捷、上级管下级。违停罚款的例子说明它处理日常轻微争议。", "image": "study-assets/lecture-6/slide-009.jpg", "extract": "(3)《行政复议法》：a 当事人可不经法院向政府或其机构申诉；b 免费。例：你违停依法应罚50元，警察要罚200元，你可向上一级公安机关（如从县到市）申请行政复议"}, {"id": "L6-010", "lecture": 6, "page": 10, "title": "The use of lawsuits against government agencies", "section": "行政诉讼的兴起与案例", "source": "10\n10\nThe use of lawsuits against government agencies \na. The number of administrative litigations increased from 13,000 in 1990 to 100,900 in 2001. \nb. Over the years, tens of ministries at the national level have been sued, not to mention local governments. \n\nc. After the State Compensation Law was enacted in 1994, lawsuits numbered several hundred annually in the initial years, but the number reached over 2,000 annually in the early 2000s.", "knowledge": "告政府的诉讼使用：a 行政诉讼从 1990 年 13,000 件增至 2001 年 100,900 件；b 多年来几十个部委被诉，地方政府更不消说；c 《国家赔偿法》1994 年出台后最初每年几百件，2000 年代初达每年 2,000 多件。", "understand": "数量增长曲线：行政诉讼十一年增近 8 倍。但下一页会说明这个增长在总诉讼中占比仍极小。", "image": "study-assets/lecture-6/slide-010.jpg", "extract": "告政府的诉讼使用：a 行政诉讼从1990年13,000件增至2001年100,900件；b 多年来几十个国家级部委被诉，地方政府更不消说；c 《国家赔偿法》1994年出台后最初每年几百件，2000年代初达每年2,000多件"}, {"id": "L6-011", "lecture": 6, "page": 11, "title": "Administrative litigations", "section": "行政诉讼的兴起与案例", "source": "11\nAdministrative litigations", "knowledge": "图表页：行政诉讼数量。", "understand": "行政诉讼案件数的趋势图，看长期上升但基数小的特征。", "image": "study-assets/lecture-6/slide-011.jpg", "extract": "行政诉讼（数量趋势图）"}, {"id": "L6-012", "lecture": 6, "page": 12, "title": "Cases", "section": "行政诉讼的兴起与案例", "source": "12\n12\nCases", "knowledge": "图表页：案件数。", "understand": "案件数量的图示页。", "image": "study-assets/lecture-6/slide-012.jpg", "extract": "案件（图示）"}, {"id": "L6-013", "lecture": 6, "page": 13, "title": "(1) Lawsuits against the government have been used by all ki", "section": "行政诉讼的兴起与案例", "source": "13\n13\n(1) Lawsuits against the government have been used by all kinds of citizens or social actors in China. \n\nPlaintiffs in Administrative Litigations to the Intermediate Court of Wuhan (2003)", "knowledge": "(1) 各类公民和社会主体都在用行政诉讼。表格：武汉中院行政诉讼原告构成（2003）。", "understand": "原告构成的表格页，数据在下一页。", "image": "study-assets/lecture-6/slide-013.jpg", "extract": "(1) 各类公民和社会主体都在使用行政诉讼（武汉市中院行政诉讼原告构成，2003）"}, {"id": "L6-014", "lecture": 6, "page": 14, "title": "C a t e g o r y   C a s e s   F r e q u e n c y   ( % ) E m ", "section": "行政诉讼的兴起与案例", "source": "14\n14\nC a t e g o r y   C a s e s   F r e q u e n c y   ( % ) E m p l o y e e s       2 8     2 1 . 7 F i r m s     1 4     1 0 . 9 A   g r o u p   a s   a   p l a i n t i f f   1 3     1 0 . 1 S t a t e   a g e n c i e s   1 2       9 . 3 T h e   u n e m p l o y e d   1 1       8 . 5 P e a s a n t s   1 0       7 . 6 R e t i r e d   e m p l o y e e s       9       7 . 0 I n d i v i d u a l   b u s i n e s s m e n       8       6 . 2 L a i d - o f f   w o r k e r s       5       3 . 9 H o m e   o w n e r s       3       2 . 3 S t u d e n t s       2       1 . 6 M i s c e l l a n e o u s   o r   u n s p e c i f i e d     1 4   1 0 . 9 T o t a l                   1 2 9                 1 0 0", "knowledge": "表格：武汉中院行政诉讼原告（2003，共 129 件）——职工 28 件（21.7%）；企业 14（10.9%）；原告群体 13（10.1%）；国家机关 12（9.3%）；失业者 11（8.5%）；农民 10（7.6%）；退休职工 9（7.0%）；个体户 8（6.2%）；下岗工人 5（3.9%）；业主 3（2.3%）；学生 2（1.6%）；其他/未指明 14（10.9%）。", "understand": "原告构成的考点：职工最多（21.7%），农民仅 7.6%；「国家机关」也当原告（9.3%）——机关之间也打官司。社会各阶层都用，但弱势群体占比不高。", "image": "study-assets/lecture-6/slide-014.jpg", "extract": "武汉中院行政诉讼原告（2003，共129件）：职工28（21.7%）；企业14（10.9%）；原告群体13（10.1%）；国家机关12（9.3%）；失业者11（8.5%）；农民10（7.6%）；退休职工9（7.0%）；个体户8（6.2%）；下岗工人5（3.9%）；业主3（2.3%）；学生2（1.6%）；其他/未指明14（10.9%）"}, {"id": "L6-015", "lecture": 6, "page": 15, "title": "(2) Lower-level governments, especially at the county level,", "section": "行政诉讼的兴起与案例", "source": "15\n15\n(2) Lower-level governments, especially at the county level, and their agencies are most frequently sued by citizens.\nAgencies Sued in Administrative Reconsiderations in 2000\nT a r g e t e d   p a r t i e s     F r e q u e n c y   ( % ) T o w n s h i p   g o v e r n m e n t                 1 0 C o u n t y   g o v e r n m e n t                     9 C o u n t y   g o v e r n m e n t   a g e n c i e s               4 8 C i t y - l e v e l   g o v e r n m e n t                     2 C i t y - l e v e l   g o v e r n m e n t   a g e n c i e s               1 8 P r o v i n c i a l   g o v e r n m e n t                       . 1 P r o v i n c i a l   g o v e r n m e n t   a g e n c i e s                 3 . 9 M i s c e l l a n e o u s                   9 T o t a l             1 0 0", "knowledge": "(2) 被诉最多的是低层级政府（尤其县级）及其机构。表格：2000 年行政复议被申请方——乡政府 10%；县政府 9%；县级政府机构 48%；市政府 2%；市级政府机构 18%；省政府 0.1%；省级政府机构 3.9%；其他 9%。", "understand": "被告分布的考点：县级政府+机构合计 57%，加上乡镇达 67%——层级越低被诉越多，因为直接面对公民、执法最多、也最不规范。", "image": "study-assets/lecture-6/slide-015.jpg", "extract": "(2) 低层级政府（尤其县级）及其机构最常被诉。2000年行政复议被申请方：乡政府10%；县政府9%；县级政府机构48%；市政府2%；市级政府机构18%；省政府0.1%；省级政府机构3.9%；其他9%"}, {"id": "L6-016", "lecture": 6, "page": 16, "title": "Government/agencies sued in 2012 (%)", "section": "行政诉讼的兴起与案例", "source": "16\n16\nGovernment/agencies sued in 2012 (%)\nTownship: 5.35\nCounty government: 15.94\nCounty government agencies: 39.9\nCity government: 3.61\nCity government agencies: 24.31\nProvincial government: 4.66\nProvincial government agencies: 0.67\nOthers: 5.56\nTotal cases: 74,242", "knowledge": "2012 年被诉政府/机构构成（%）：乡镇 5.35；县政府 15.94；县级政府机构 39.9；市政府 3.61；市级政府机构 24.31；省政府 4.66；省级政府机构 0.67；其他 5.56；案件总数 74,242 件。", "understand": "与上页（2000 年）同构的更新数据：县级政府及机构合计约 56%，格局未变——「压力集中在基层」是稳定现象。", "image": "study-assets/lecture-6/slide-016.jpg", "extract"
