<div class="layout"><aside class="side"><h3>学习导航</h3><nav id="toc" class="toc"></nav><h3>使用建议</h3><p style="color:var(--muted);font-size:13px">按原课件顺序学习。先看图片，再读“知识点”和“如何理解”，最后用自测问题复述本页。</p></aside><main id="main"></main></div>
<script>
const DATA={"slides": [{"id": "L1-001", "lecture": 1, "page": 1, "title": "Introduction to Law and society", "section": "课程导入与学习要求", "source": "Lecture 1   Introduction to Law and society\r\ra. What is the course about?\r     (how law is used, as opposed to the law per se)\r\rb. Requirements \r\rc. Grading\n1", "knowledge": "本课的研究对象是「法律在社会中如何被使用」，而不是法律条文本身。课程围绕三个问题展开：法律在中国社会、经济和政治生活中扮演什么角色、如何运行、产生什么后果。", "understand": "开篇先立框架：学这门课不是背法条，而是把法律当作观察社会的窗口。后面所有内容——传统社会、毛时代、改革开放、法院公安检察院——都是在回答「法律实际怎样运行、被谁使用、效果如何」。考试是选择题，重点在理解概念和案例之间的因果逻辑。", "image": "study-assets/lecture-1/slide-001.jpg", "extract": "第一讲：法律与社会导论。a 本课讲什么？（法律如何被使用，而不是法律条文本身）b 课程要求 c 成绩构成"}, {"id": "L1-002", "lecture": 1, "page": 2, "title": "quiz", "section": "课程导入与学习要求", "source": "quiz:\rWhat has been discussed in the previous week.\r\rAsking for leave is allowed\n2", "knowledge": "课程管理页：每周小测考查上一周讲过的内容；请假是被允许的。", "understand": "这页交代考核运作方式。Quiz 共 6 次、每次 3 分，考的是上周内容，所以每周课后及时复习这 126 页课件就是拿分的关键。", "image": "study-assets/lecture-1/slide-002.jpg", "extract": "小测：考上一周讲过的内容。可以请假。"}, {"id": "L1-003", "lecture": 1, "page": 3, "title": "Mid-term and final exams (multiple choice)", "section": "课程导入与学习要求", "source": "Mid-term and final exams (multiple choice)\r\rGrading :\rQuiz: 36 =18\rMid-term: 41\rFinal: 41 (not accumulative)\n3", "knowledge": "成绩构成：Quiz 3×6=18 分，期中 41 分，期末 41 分；期末不累积（不考期中前的内容）。考试形式均为选择题。", "understand": "三个数字要记牢：18 / 41 / 41。「not accumulative」意味着期中和期末各管一段内容，复习范围可以对半切。选择题题型决定了复习重点是辨析概念差异（比如正式/非正式渠道、三类诉讼）而非默写。", "image": "study-assets/lecture-1/slide-003.jpg", "extract": "期中和期末考试（选择题）。成绩构成：小测3×6=18；期中41；期末41（不累积）。"}, {"id": "L1-004", "lecture": 1, "page": 4, "title": "Course Website", "section": "课程导入与学习要求", "source": "Course Website: \r\rhttps://canvas.ust.hk/courses/2487/users\r\rLecture notes and readings are available on the course website\r\rIf you have any problems with access to the course website, please let my TA know (TA’s emails are included in the syllabus)\n4", "knowledge": "课程网站（Canvas）提供讲义和阅读材料；访问有问题联系助教，助教邮箱在教学大纲里。", "understand": "事务性页面。要点只有一个：所有 lecture notes 和 readings 都在 Canvas 上，考试内容出自课堂讲义。", "image": "study-assets/lecture-1/slide-004.jpg", "extract": "课程网站：https://canvas.ust.hk/courses/2487/users。讲义和阅读材料都在课程网站上；如无法访问课程网站，请告知助教（助教邮箱在教学大纲里）。"}, {"id": "L1-005", "lecture": 1, "page": 5, "title": "Why study law?", "section": "为什么需要法律：秩序、权利与纠纷解决", "source": "Why study law?\r\r  To know about the law is an important and effective way of understanding a society. \r\r   Law and its enforcement reflects political and socio-economic situations in a society\n5", "knowledge": "为什么学法律：了解法律是理解一个社会的重要途径；法律及其执行状况反映该社会的政治与社会经济状况。", "understand": "这是全课的方法论宣言：法律是社会的镜子。反过来也成立——要看懂一套法律制度，必须把它放回政治经济背景里。后面讲传统社会的「厌讼」、毛时代的「运动式治理」、改革后的「立法潮」，都是在演示这个原理。", "image": "study-assets/lecture-1/slide-005.jpg", "extract": "为什么学法律？了解法律是理解一个社会的重要而有效的途径；法律及其执行反映一个社会的政治与社会经济状况。"}, {"id": "L1-006", "lecture": 1, "page": 6, "title": "25-year-old wife beaten to death, August 2025", "section": "为什么需要法律：秩序、权利与纠纷解决", "source": "25-year-old wife beaten to death, August 2025\n6", "knowledge": "案例导入：2025 年 8 月一名 25 岁妻子被殴打致死的新闻，用来引出问题——社会为什么需要法律。", "understand": "用社会新闻做引子：当非正式约束（家庭、道德）失效时，个体靠什么保护？答案指向法律的功能。这类案例页本身不出考点，但它服务的结论是考点（下一页的四大功能）。", "image": "study-assets/lecture-1/slide-006.jpg", "extract": "25岁妻子被殴打致死，2025年8月。"}, {"id": "L1-007", "lecture": 1, "page": 7, "title": "Why do we need law in society?", "section": "为什么需要法律：秩序、权利与纠纷解决", "source": "Why do we need law in society?\ra. Maintaining social order and protecting the legitimate rights of social actors. \r        \rb. Providing stability and predictability \r    (facilitating economic development)\r\rc. Mediating and resolving social disputes\n7", "knowledge": "社会为什么需要法律（四大功能）：a 维持社会秩序、保护社会成员的正当权利；b 提供稳定性和可预期性（促进经济发展）；c 调解和解决社会纠纷。", "understand": "本页是 Lecture 1 前半部分的总纲，四大功能可以记成「秩序—权利—预期—解纷」。b 条括号里的「facilitating economic development」是常考逻辑：可预期性降低交易风险，人们才愿意做长期投资。后面几页逐一展开这四条。", "image": "study-assets/lecture-1/slide-007.jpg", "extract": "社会为什么需要法律？a 维持社会秩序、保护社会成员的正当权利；b 提供稳定性与可预期性（促进经济发展）；c 调解和解决社会纠纷。"}, {"id": "L1-008", "lecture": 1, "page": 8, "title": "a. Maintaining social order", "section": "为什么需要法律：秩序、权利与纠纷解决", "source": "a. Maintaining social order\n8", "knowledge": "功能一展开：维持社会秩序（maintaining social order）。", "understand": "过渡页，提示接下来讨论法律的第一大功能——用国家强制力维持秩序，对应后面「远华走私案」等例子。", "image": "study-assets/lecture-1/slide-008.jpg", "extract": "a 维持社会秩序。"}, {"id": "L1-009", "lecture": 1, "page": 9, "title": "b. Protecting social actors’ rights", "section": "为什么需要法律：秩序、权利与纠纷解决", "source": "b. Protecting social actors’ rights\r\re.g., workers/labor \r         consumers\n9", "knowledge": "功能二展开：保护社会成员的权利，典型对象是劳动者（workers/labor）和消费者（consumers）。", "understand": "法律保护的权利不是抽象的，课件给出两个最日常的群体：劳工和消费者。对应现实中的劳动法、消费者权益保护法。", "image": "study-assets/lecture-1/slide-009.jpg", "extract": "b 保护社会成员的权利，例如：工人/劳动者、消费者。"}, {"id": "L1-010", "lecture": 1, "page": 10, "title": "C. Providing stability and predictability", "section": "为什么需要法律：秩序、权利与纠纷解决", "source": "C. Providing stability and predictability: \rLaw and Economic Development \r\rIt protects economic actors’ property rights, and gives them an incentive to make long-term investment.\r\rExample: \rFarmers left villages to evade tax responsibilities in China before the tax reform.\n10", "knowledge": "功能三展开：法律与经济发展——法律保护经济主体的产权，给他们做长期投资的激励。", "understand": "这是「法律—经济」链条的核心论点：产权保护 → 激励长期投资 → 经济发展。没有产权保障，人们担心资产被剥夺，就不愿投资。这个逻辑后面会反复用到（改革开放后为什么先立《中外合资经营企业法》）。", "image": "study-assets/lecture-1/slide-010.jpg", "extract": "c 提供稳定性与可预期性：法律与经济发展。法律保护经济主体的产权，给他们做长期投资的激励。"}, {"id": "L1-011", "lecture": 1, "page": 11, "title": "d. Law and conflict resolution", "section": "为什么需要法律：秩序、权利与纠纷解决", "source": "d.   Law and conflict resolution \r\r      by law or \r      “in the shadow of law”:\r       按照法律的精神\n11", "knowledge": "功能四展开：法律与纠纷解决——可以「依法」（by law），也可以「在法律阴影下」（in the shadow of law，即按照法律的精神）协商解决。", "understand": "「在法律阴影下谈判」是关键概念：即使不走法院，法律仍是谈判的底气——双方都清楚打官司会是什么结果，所以按这个结果附近达成和解。法律因此即使不被直接使用也在发挥作用。", "image": "study-assets/lecture-1/slide-011.jpg", "extract": "d 法律与纠纷解决：依法解决，或「在法律阴影下」（按照法律的精神）解决。"}, {"id": "L1-012", "lecture": 1, "page": 12, "title": "Law and conflict resolution", "section": "为什么需要法律：秩序、权利与纠纷解决", "source": "Law and conflict resolution \r\rInformal channels (e.g., mediation)\r\rb. Formal channels (e.g., courts)\n12", "knowledge": "纠纷解决的两类渠道：非正式渠道（如调解 mediation）与正式渠道（如法院 courts）。", "understand": "本页引出 Lecture 1 前半部分的主线对比：informal vs formal channels。接下来十几页分别讲两者的优缺点，考试常考「各自的条件与局限」。", "image": "study-assets/lecture-1/slide-012.jpg", "extract": "法律与纠纷解决：a 非正式渠道（如调解）；b 正式渠道（如法院）。"}, {"id": "L1-013", "lecture": 1, "page": 13, "title": "What are the differences?", "section": "为什么需要法律：秩序、权利与纠纷解决", "source": "What are the differences?\nMcDonald Hamburg\nFrench restaurant\n13", "knowledge": "思考题：麦当劳汉堡和法国餐厅有什么不同？用来引出正式规则与非正式规则的差异。", "understand": "课堂讨论页。暗含的答案是标准化程度：麦当劳靠标准化流程（正式规则）运转，法式餐厅靠厨师个人技艺和默契（非正式规则）。由此过渡到下一页的「日常生活中的非正式规则」。", "image": "study-assets/lecture-1/slide-013.jpg", "extract": "两者有什么不同？麦当劳汉堡 vs 法国餐厅。"}, {"id": "L1-014", "lecture": 1, "page": 14, "title": "Informal rules (非正式规则) in daily lives", "section": "为什么需要法律：秩序、权利与纠纷解决", "source": "Informal rules (非正式规则) in daily lives\nA village beside the sea \rThe village is not ruled by any government\rtimbers (or trees, pieces of wood) brought to the seashore by the water\rHow to distribute the timbers among the villagers ?\n14", "knowledge": "非正式规则的例子：一个无人管辖的海边村庄，村民对海水冲上岸的木材形成约定俗成的分配规则。", "understand": "「漂木归属」的例子说明：即使没有政府和成文法，社区也会自发产生规则。这为「无需法律的秩序」（order without law）埋下伏笔。", "image": "study-assets/lecture-1/slide-014.jpg", "extract": "日常生活中的非正式规则：一个海边村庄，不受任何政府管辖；被海水冲上岸的木材（或树木、木块）……"}, {"id": "L1-015", "lecture": 1, "page": 15, "title": "Informal channels (非正式渠道)", "section": "为什么需要法律：秩序、权利与纠纷解决", "source": "Informal channels (非正式渠道)\rInformal channels of resolving conflicts among citizens or social actors are normally based on their voluntary cooperation or negotiation. \r\rTwo situations in which informal channels are used:\ra. When the state power (e.g., the court) is absent (i.e., order without law).\rb. When the people are reluctant to resort to formal legal institutions.\n15", "knowledge": "非正式渠道：社会成员之间基于自愿合作或协商解决冲突的途径。", "understand": "定义页。非正式解纷的两个关键词：voluntary cooperation / negotiation——没有国家强制力介入。下一页讲它为什么能奏效。", "image": "study-assets/lecture-1/slide-015.jpg", "extract": "非正式渠道：公民或社会主体之间解决冲突的非正式渠道通常基于自愿合作或协商。两种情形……"}, {"id": "L1-016", "lecture": 1, "page": 16, "title": "Why does “order without law” work?", "section": "为什么需要法律：秩序、权利与纠纷解决", "source": "Why does “order without law” work?\rIn a relatively small community (i.e., village): \ra. The reputation of an individual is important to his status in the community.\rb. It is difficult to exit, and tit-for-tat (以牙还牙) is possible. \r\rExample: \rIn ancient times, people did businesses in an environment in which laws were absent. (e.g, village)\n16", "knowledge": "「无需法律的秩序」为什么有效？在小社区（如村庄）里：a 个人声望对社区地位很重要；b 难以隐瞒行为（信息透明）。", "understand": "两个机制：声誉约束 + 信息透明。小社区是「熟人社会」，干了坏事全村知道，代价极高，所以人自觉遵守规范。这是理解传统中国调解文化的钥匙。", "image": "study-assets/lecture-1/slide-016.jpg", "extract": "「无需法律的秩序」为什么有效？在较小的社区（如村庄）里：a 个人声望对其在社区中的地位很重要；b 行为难以隐瞒……"}, {"id": "L1-017", "lecture": 1, "page": 17, "title": "Limitations of informal mechanism or norms", "section": "为什么需要法律：秩序、权利与纠纷解决", "source": "Limitations of informal mechanism or norms:\r(1). Context-specific (特定环境i.e., it is often confined to a small community).\ra. Informal norms are effective in regulating relationships, for small groups, families, people in face to face contact, in villages, in tribal life. \rb. They are not good enough for relationships among strangers, who “meet” only in the form of a product that one group makes and the other consumers. \rc. They do not work for many problems and relationships in large, complex, mobile societies.\n17", "knowledge": "非正式机制的局限（1）：情境依赖——只在小型熟人社区有效，难以约束陌生人之间的关系。", "understand": "上一页的两个优点换个场景就变成缺点：现代社会是陌生人社会，没有声誉积累和信息透明，非正式规范失灵。由此论证现代社会为什么需要正式法律。", "image": "study-assets/lecture-1/slide-017.jpg", "extract": "非正式机制或规范的局限：(1) 情境依赖（特定环境，常局限于小型社区）：a 非正式规范能有效调节……关系"}, {"id": "L1-018", "lecture": 1, "page": 18, "title": "(2). Informal rules are less costly but may not always be binding", "section": "为什么需要法律：秩序、权利与纠纷解决", "source": "(2). Informal rules are less costly but may not always be binding\nIs there a place called\ra Village of Peaches \r(桃花源) ?\n18", "knowledge": "非正式机制的局限（2）：成本低但可能没有约束力。反问：存在真正的「桃花源」吗？", "understand": "非正式规范靠自觉遵守，遇上不合作者缺乏强制手段。「桃花源」的设问是在质疑理想化的无政府秩序是否真能存在，答案由下一页杨村的案例给出。", "image": "study-assets/lecture-1/slide-018.jpg", "extract": "(2) 非正式规则成本较低，但未必总有约束力。存在一个叫桃花源的地方吗？"}, {"id": "L1-019", "lecture": 1, "page": 19, "title": "Example: The case of Yang village in China", "section": "为什么需要法律：秩序、权利与纠纷解决", "source": "Example: The case of Yang village in China\rA Chinese village in Jilin province \r\rVillagers did not allow rural officials to enter their village to collect taxes and fees \r\rFor eight years (1994-2002), the village was not administered by the local government \r\rVillagers’ freedom:\ra. No family planning policies (as many as 5 kids)\rb. No housing construction planning\n19", "knowledge": "案例：吉林杨村——村民八年不让乡镇干部进村收税费，形成「无政府」状态。", "understand": "真实案例说明非正式秩序的另一面：当村民把国家正式规则（征税）拒之门外时，看似自治的村庄并不会自动变成桃花源。下一页讲村庄内部出了什么问题。", "image": "study-assets/lecture-1/slide-019.jpg", "extract": "例：中国杨村的案例——吉林省的一个村庄；村民不让乡镇干部进村收税费；长达八年……"}, {"id": "L1-020", "lecture": 1, "page": 20, "title": "Villagers’ problems", "section": "为什么需要法律：秩序、权利与纠纷解决", "source": "Villagers’ problems:\rNo protection (some occupied more land)\r\rConflict resolution: Retaliation \r   Setting piles of straws on fire; poisoning  domestic animals \r\rThis anarchy was ended with the order of the provincial authority.\n20", "knowledge": "杨村村民的困境：缺乏保护（有人多占土地）；纠纷靠报复解决——烧草堆、毒死家畜。这种无政府状态并不比国家统治更好。", "understand": "案例的结论：脱离正式法律后，村庄退回到私力救济和暴力循环。这正面论证了国家法律存在的必要性——法治再差也胜过无政府（This anarchy was even worse）。", "image": "study-assets/lecture-1/slide-020.jpg", "extract": "村民的困境：没有保护（有人多占土地）；纠纷解决靠报复——点燃草堆、毒死家畜。这种无政府状态甚至……"}, {"id": "L1-021", "lecture": 1, "page": 21, "title": "(3) Informal rules may not be reasonable to others.", "section": "为什么需要法律：秩序、权利与纠纷解决", "source": "(3) Informal rules may not be reasonable to others.\r\rExample 1\rAccording to the norm of a minority (Dai) in China, if an animal (e.g., cattle) eats the crop of a household, the owner of the cattle need to make compensation. Also, the cattle will be killed and eaten by the whole village.\n21", "knowledge": "非正式机制的局限（3）：非正式规则对外人可能不合理。例：傣族习俗中，牲畜吃了别家庄稼，主人反而要赔偿牲畜主人。", "understand": "地方习俗在内部人看来天经地义，在外人看来却荒谬。说明非正式规则缺乏普遍性，跨社区交往时需要统一、公开、可预期的正式法律。", "image": "study-assets/lecture-1/slide-021.jpg", "extract": "(3) 非正式规则对外人可能不合理。例一：按中国某少数民族（傣族）的习俗，牲畜（如牛）吃了某户的庄稼，庄稼的主人反而要……"}, {"id": "L1-022", "lecture": 1, "page": 22, "title": "Formal Channels: legal institutions (e.g., courts)", "section": "为什么需要法律：秩序、权利与纠纷解决", "source": "Formal Channels: legal institutions (e.g., courts)\rConditions:\ra. Stable (稳定), clear, and legitimate (合理) laws \rb. Independent (独立) legal institutions staffed with (配备) capable and incorrupt agents are trained, disciplined, with integrity.  \rc. The political system that limits the power of both public and private actors. \r   Check and balance; elections; media; social movements (protests)\rd. Political and social culture conducive to fair law enforcement. It takes a long time for such cultures to emerge\n22", "knowledge": "正式渠道：以法院为代表的法律制度。其有效运转的条件：a 稳定、清晰、正当（合理）的法律；b 独立、且配备有能力和诚实人员的法律机构。", "understand": "讲完非正式后转向正式制度。两个条件是考点：法律本身要 stable/clear/legitimate；执行机构要 independent + capable + honest。后面讲中国司法问题时（党政干预、法官素质），都是在对照这两个条件找差距。", "image": "study-assets/lecture-1/slide-022.jpg", "extract": "正式渠道：法律机构（如法院）。条件：a 稳定、清晰、正当（合理）的法律；b 独立、配备有能力和诚实人员的法律机构。"}, {"id": "L1-023", "lecture": 1, "page": 23, "title": "Limitations (局限) of formal legal systems", "section": "为什么需要法律：秩序、权利与纠纷解决", "source": "Limitations (局限) of formal legal systems:\r\ra. It requires (需要) knowledge \rb. It requires money \rc. It can be a lengthy process \r    Justice delayed is justice denied (迟到的正义是非正义）\n23", "knowledge": "正式法律系统的局限：a 需要知识；b 需要金钱；c 过程漫长——「迟到的正义是非正义」。", "understand": "正式制度的三大成本：知识门槛（要懂法或请律师）、经济门槛（诉讼费律师费）、时间门槛。英文谚语 Justice delayed is justice denied 是高频考点。下面用龚如心案和赖昌星案具体演示这三个成本。", "image": "study-assets/lecture-1/slide-023.jpg", "extract": "正式法律系统的局限：a 需要知识；b 需要金钱；c 过程可能漫长——迟到的正义是非正义。"}, {"id": "L1-024", "lecture": 1, "page": 24, "title": "Example 1: Nina Kung’ (龚如心）case", "section": "为什么需要法律：秩序、权利与纠纷解决", "source": "Example 1: Nina Kung’ (龚如心）case\nA Legal dispute between Kung and her father-in-law over the Chinachem fortune (1997-2005)\r\rCost 200 million HK$\r    (paid to the lawyers)\n24", "knowledge": "例一：龚如心案——与家翁争夺华懋集团财产的遗产官司打了 8 年（1997–2005），律师费高达 2 亿港元。", "understand": "用香港最著名的遗产案演示正式诉讼的两大成本：时间（8 年）和金钱（2 亿港元付给律师）。即使最后赢了，成本也极其惊人。 2 亿是累计律师费而非涉案金额；1997–2005 是诉讼持续时间。两个数字对应上一页的局限 b 和 c。", "image": "study-assets/lecture-1/slide-024.jpg", "extract": "例一：龚如心案——龚与家翁之间关于华懋集团遗产的法律纠纷（1997–2005），花费2亿港元（付给律师）。"}, {"id": "L1-025", "lecture": 1, "page": 25, "title": "Example 2", "section": "为什么需要法律：秩序、权利与纠纷解决", "source": "Example 2\u000bLai Changxin’s (赖昌星 )smuggling case 远华\nLai, previously a peasant\nFrom 1994-1998, Lai engaged in smuggling, involving \r   least 30 billion yuan. \rHe formed a strong network, and that case involved more than 600 people, including high-ranking officials\n25", "knowledge": "例二：赖昌星远华走私案——1994–1998 年走私至少 300 亿元，并编织了强大的官员保护网。", "understand": "从农民到走私头目，赖昌星案是讲「正式制度的局限与成本」的引子：一个能量极大的违法者可以动用关系网和外国法律程序长期对抗追诉。背景数字：涉案至少 300 亿元。 30 billion yuan 是走私涉案金额下限（at least）。记住时间跨度 1994–1998。", "image": "study-assets/lecture-1/slide-025.jpg", "extract": "例二：赖昌星走私案（远华）。赖本是农民；1994–1998年从事走私，涉案至少300亿元；他编织了强大的……网络"}, {"id": "L1-026", "lecture": 1, "page": 26, "title": "In 1999, a 74-page letter was sent to Jiang and Zhu", "section": "为什么需要法律：秩序、权利与纠纷解决", "source": "In 1999, a 74-page letter was sent to Jiang and Zhu\rApril 20, an investigation team was formed based on the instruction of the central leaders\rLai knew the instruction six days earlier than the investigative team  \rThe team consisted of more than 1,000 members\n26", "knowledge": "1999 年一封 74 页举报信送达高层；4 月 20 日中央批示成立专案组，但赖昌星提前六天获知消息。", "understand": "细节考点：74 页举报信、专案组成立、赖提前六天知道——「提前六天」说明其保护网已深入体制内部，信息泄露使抓捕落空。 两个数字：74 页（举报信篇幅）、6 天（消息提前泄露）。箭头逻辑：举报 → 批示 → 泄密 → 潜逃。", "image": "study-assets/lecture-1/slide-026.jpg", "extract": "1999年，一封74页的举报信送达江和朱；4月20日，根据中央领导批示成立调查组；赖提前六天知道了批示……"}, {"id": "L1-027", "lecture": 1, "page": 27, "title": "14 people were sentenced to death, seven were executed soon after the ruling was i…", "section": "为什么需要法律：秩序、权利与纠纷解决", "source": "14 people were sentenced to death, seven were executed  soon after the ruling was issued.  \rA deputy minister of the Ministry of Public Security was also involved in the case \rBut Lai escaped with the help of some officials\n27", "knowledge": "远华案判决：14 人被判死刑，其中 7 人在判决后很快被处决；公安部一名副部长也涉案。但赖昌星本人逃到了加拿大。", "understand": "数字反映案件规模与严厉程度：14 死刑、7 已执行、部级官员落马。但主犯逃脱，引出下一页的跨国司法拉锯。 14 与 7 是「判死刑人数」与「实际执行人数」，不要混淆；注意「but」转折——惩罚再重也没抓到主犯。", "image": "study-assets/lecture-1/slide-027.jpg", "extract": "14人被判死刑，其中7人在判决下达后不久被处决；公安部一名副部长也涉案；但……"}, {"id": "L1-028", "lecture": 1, "page": 28, "title": "Lai escaped to Canada via Hong Kong on 13 August 1999, with his family", "section": "为什么需要法律：秩序、权利与纠纷解决", "source": "Lai escaped to Canada via Hong Kong on 13 August 1999, with his family\rIn July 2000, Lai applied for refugee protection\rIn November 2000, Lai was arrested by\r    for illegal migration\n28", "knowledge": "赖昌星 1999 年 8 月 13 日经香港逃往加拿大；2000 年 7 月申请难民保护；2000 年 11 月因非法移民被加方拘捕。", "understand": "时间线展示赖如何利用加拿大法律程序拖延遣返：潜逃 → 申请难民 → 被捕后走司法救济。为下一页「诉讼的公平与成本」主题铺垫。", "image": "study-assets/lecture-1/slide-028.jpg", "extract": "赖昌星于1999年8月13日经香港携家人逃往加拿大；2000年7月申请难民保护；2000年11月因非法移民被拘捕。"}, {"id": "L1-029", "lecture": 1, "page": 29, "title": "Fairness and cost in lawsuits", "section": "为什么需要法律：秩序、权利与纠纷解决", "source": "Fairness and cost in lawsuits\nJuly 2001, Lai filed lawsuits to various legal departments and courts in Canada. Until today, Lai was able to stay in Canada until 2011.\n29", "knowledge": "2001 年 7 月起赖昌星在加拿大各级法院反复提起诉讼，利用司法程序一直拖到 2011 年才被遣返。", "understand": "本页结论：正式司法程序给了被告充分的救济机会（公平），但也带来巨大时间和金钱成本（十年诉讼）。呼应 L1-023 的局限 c「迟到的正义」。 2001→2011 表示诉讼拖延约十年，说明正式程序的 time cost。", "image": "study-assets/lecture-1/slide-029.jpg", "extract": "诉讼中的公平与成本：2001年7月，赖向加拿大各法律部门和法院提起诉讼；一直到2011年，赖都得以留在加拿大。"}, {"id": "L1-030", "lecture": 1, "page": 30, "title": "第 30 页", "section": "为什么需要法律：秩序、权利与纠纷解决", "source": "30", "knowledge": "（图片过渡页）", "understand": "本页无提取文字，为插图或过渡页，配合赖昌星案或诉讼成本主题的视觉材料。", "image": "study-assets/lecture-1/slide-030.jpg", "extract": "（本页无可提取文字，为图片页）"}, {"id": "L1-031", "lecture": 1, "page": 31, "title": "d. It can be too rigid", "section": "为什么需要法律：秩序、权利与纠纷解决", "source": "d. It can be too rigid\r\rIn one case in 2006, a person found that there was something wrong with the ATM machine, so he took 170,000 yuan by taking that opportunity. He was then sentenced to life in jail by the local court. \r\rIs the ruling reasonable?\n31", "knowledge": "正式制度的局限 d：可能过于僵化。2006 年许霆案：发现 ATM 故障取走 17 万元，一审被判无期徒刑。", "understand": "许霆案说明机械适用法律条文会产生明显过重的结果：利用 ATM 故障取钱与「盗窃金融机构」同罪，一审判无期，引发舆论哗然。这是「合法但不合理」（formal but unreasonable）的典型。", "image": "study-assets/lecture-1/slide-031.jpg", "extract": "d 可能过于僵化：2006年一案中，一人发现ATM机出了故障，便趁机取走17万元；他被判……"}, {"id": "L1-032", "lecture": 1, "page": 32, "title": "An online survey of tens of thousands of people", "section": "为什么需要法律：秩序、权利与纠纷解决", "source": "An online survey of tens of thousands of people: \rAbout the person:\rShould not be in jail for lifetime: 35%\rShould not be guilty: 34.5%\rShould be in jail for lifetime: 1.9%\r\rShould the ATM be responsible?\rYes: 93%\rNo: 7%\n32", "knowledge": "网络调查（数万人参与）：认为许霆不该判无期的 35%，认为无罪的 34.5%，认为该判无期的仅 1.9%。", "understand": "民意与法条的冲突数据化：近七成受访者认为判决过重或不应有罪，支持原判的不到 2%。说明「严格依法」的结果与社会公正感严重脱节，印证法律过于僵化的问题。", "image": "study-assets/lecture-1/slide-032.jpg", "extract": "一项数万人的网络调查：关于此人——不该判无期徒刑：35%；不应有罪：34.5%；该判无期徒刑：1.9%……"}, {"id": "L1-033", "lecture": 1, "page": 33, "title": "Formal but unreasonable", "section": "为什么需要法律：秩序、权利与纠纷解决", "source": "Formal but unreasonable", "knowledge": "小结页：形式上合法，但不合理（formal but unreasonable）。", "understand": "四个字概括许霆案式困境：程序、条文都对，结果却不被社会接受。这是正式法律系统局限的收束，也是对「法治」复杂性的提醒。", "image": "study-assets/lecture-1/slide-033.jpg", "extract": "形式上合法，但不合理。"}, {"id": "L1-034", "lecture": 1, "page": 34, "title": "e. It can be too relaxed (e.g., the recurring of less serious crimes; Guangzhou Ra…", "section": "为什么需要法律：秩序、权利与纠纷解决", "source": "e. It can be too relaxed (e.g., the recurring of less serious crimes; Guangzhou Railway Station)\r\rIn China, some people \r大错不犯 (Do not commit serious crimes)\r小错不断 (keep engaging in misconduct or \r                small crimes)\r难死法院 (It is difficult for the court to mete out \r                harsh punishment)\r气死公安 (Police officers are frustrated)\n34", "knowledge": "正式制度的局限 e：可能过于宽松——对轻微违法屡罚屡犯、起不到威慑（如广州火车站的惯犯）。这类人是「大错不犯、小错不断」。", "understand": "僵化的反面是失灵的另一端：对小偷小摸等轻微违法，处罚太轻没有威慑力，违法行为反复发生（recurring of less serious crimes）。「大错不犯、小错不断」是要背的中文表述。", "image": "study-assets/lecture-1/slide-034.jpg", "extract": "e 可能过于宽松（如轻微违法屡罚屡犯；广州火车站）：在中国，有些人大错不犯、小错不断……"}, {"id": "L1-035", "lecture": 1, "page": 35, "title": "Law and Society in", "section": "传统中国社会的法律与调解", "source": "Law and Society in \rTraditional Chinese Society\n35", "knowledge": "章节标题页：传统中国社会的法律与社会（Law and Society in Traditional Chinese Society）。", "understand": "进入第二大板块。前面讲的是抽象原理（为什么需要法律、正式与非正式渠道），接下来用中国历史材料检验这些原理：传统中国人为什么厌讼、纠纷实际怎么解决。", "image": "study-assets/lecture-1/slide-035.jpg", "extract": "传统中国社会的法律与社会。"}, {"id": "L1-036", "lecture": 1, "page": 36, "title": "If you have a dispute with your relatives, friends, or colleagues and end up with …", "section": "传统中国社会的法律与调解", "source": "If you have a dispute with your relatives, friends, or colleagues and end up with a lawsuit, how will you feel?\rLosing face\rIt is a good thing \rIt is neither “losing face” nor “a good thing”\n36", "knowledge": "课堂提问：如果你和亲友、同事闹到打官司，你会有什么感受？选项：丢脸 / 好事 / 无所谓。", "understand": "用态度调查引出文化主题：多数中国人打官司会觉得「丢脸」。这种厌讼心理不是偶然的，下一页用 1995 年全国调查数据验证。", "image": "study-assets/lecture-1/slide-036.jpg", "extract": "如果你和亲戚、朋友或同事闹到打官司，你会有什么感受？丢脸；是好事；既非丢脸也非好事。"}, {"id": "L1-037", "lecture": 1, "page": 37, "title": "In a nationwide survey in China in 1995, when questioned “If you have a dispute wi…", "section": "传统中国社会的法律与调解", "source": "In a nationwide survey in China in 1995, when questioned “If you have a dispute with your relatives, friends, or colleagues and end up with a lawsuit, how will you feel?\r\ra. Losing face (丢人): 35 % \rb. It is a glorious thing (光彩): 5%\rc. Neither “losing face” nor “being glorious”:\r    60 %\n37", "knowledge": "1995 年全国调查：被问到与亲友同事打官司的感受时，相当比例的受访者选择「丢脸」。", "understand": "数据证实传统观念在当代中国仍有影响：诉讼被视为关系破裂的标志而非正常维权手段。这为讲儒家意识形态提供了实证基础。", "image": "study-assets/lecture-1/slide-037.jpg", "extract": "1995年中国一项全国调查：被问到「如果你和亲戚、朋友或同事闹到打官司，你会有什么感受」时，a 丢脸……"}, {"id": "L1-038", "lecture": 1, "page": 38, "title": "Confucian ideology (儒家)and law in China", "section": "传统中国社会的法律与调解", "source": "Confucian ideology (儒家)and law in China\rIt emphasizes the cultivation of moral goodness. \rb. The emergence of the formally-enacted law was an indication of moral decline. \rc. Disputes mean a disturbance of social and the natural order, and should be avoided if possible. \rd. Reconciliation (i.e., compromise) takes precedence over direct confrontation (i.e., in the court)\n38", "knowledge": "儒家意识形态与法律：a 强调道德修养；b 成文法的出现被视为道德衰败的标志；c 纠纷应通过调解而非诉讼解决。", "understand": "传统厌讼文化的思想根源：儒家认为理想社会靠道德教化维持，「无讼」是治世理想；需要诉诸法律恰恰说明教化失败。三条要点是选择题直接考点。", "image": "study-assets/lecture-1/slide-038.jpg", "extract": "儒家意识形态与中国法律：a 强调道德修养；b 成文法的出现是道德衰败的标志；c 纠纷应当……"}, {"id": "L1-039", "lecture": 1, "page": 39, "title": "Using lawsuits as one of the three taboos (禁忌)", "section": "传统中国社会的法律与调解", "source": "Using lawsuits as one of the three taboos (禁忌):\ra. the undertaker (殡葬业者，whose business is to prepare the dead, symbolic of death)\r\rb. pawnshop (indicative of debt)/当铺\r \rc. taking to the court (a loss of face because you were not respected by the offending party)\n39", "knowledge": "打官司被列为三大禁忌（taboo）行业/行为之一：与殡葬业（象征死亡）、当铺（象征负债）并列。", "understand": "把「诉讼」与死亡、债务并列为禁忌，形象说明传统社会对打官司的忌讳程度。三个禁忌是具体考点：殡葬业者、当铺、诉讼。", "image": "study-assets/lecture-1/slide-039.jpg", "extract": "诉讼是三大禁忌之一：a 殡葬业者（为死者准备后事，象征死亡）；b 当铺（象征负债）；c 打官司……"}, {"id": "L1-040", "lecture": 1, "page": 40, "title": "2. Government attitudes", "section": "传统中国社会的法律与调解", "source": "2. Government attitudes\nThe government was reluctant to see people approach the courts (government) too often \r\r(e.g., Kang Xi 康熙between 1662 and 1723).\n40", "knowledge": "政府态度：统治者不愿看到民众频繁告官，如康熙（1662–1723 在位）的态度。", "understand": "厌讼不仅是民间文化，也是官方政策。对帝制政府而言，诉讼多意味着治理失败、官吏无能。记住代表例子：康熙。", "image": "study-assets/lecture-1/slide-040.jpg", "extract": "2 政府的态度：政府不愿看到民众过于频繁地告到官府（如康熙，1662–1723在位）。"}, {"id": "L1-041", "lecture": 1, "page": 41, "title": "a. Too many lawsuits: people not afraid of the tribunals; or they had confidence i…", "section": "传统中国社会的法律与调解", "source": "a. Too many lawsuits: people not afraid of the tribunals; or they had confidence in the tribunals. \rb. So those going to the tribunals to be treated without pity; be disgusted with law, and tremble to appear before a Magistrate (e.g, 知府，县官) \rc. People should settle disputes friendly “like brothers.” \rd. troublesome, obstinate and quarrelsome people: let them be ruined in the law-courts – that is the justice they deserve.\n41", "knowledge": "官方逻辑：诉讼太多说明民众不怕官府、或对官府抱有幻想，因此对告状者不应姑息，要让其对衙门生畏。", "understand": "进一步展开政府的反诉讼立场：通过羞辱性程序和严酷刑罚让民众畏惧诉讼。下一页具体讲审讯有多屈辱。", "image": "study-assets/lecture-1/slide-041.jpg", "extract": "a 诉讼太多说明民众不怕官府，或对官府抱有幻想；b 因此告到官府的人应被无情对待，使其厌恶……"}, {"id": "L1-042", "lecture": 1, "page": 42, "title": "Court trials were humiliating", "section": "传统中国社会的法律与调解", "source": "Court trials were humiliating:\ra. The litigants and the witnesses had to kneel before the presiding magistrate. \rb. Torture was used to elicit evidence or a confession of guilt. \rc. Someone had to be responsible for the disturbed the natural order:\r\rIf the accused \rguilty: s/he would be punished; \rNot guilty: the accuser punished.\n42", "knowledge": "古代庭审是羞辱性的：a 当事人和证人要向主审官下跪；b 用刑讯获取证据或口供。", "understand": "两条具体机制：身体屈辱（跪堂）与合法刑讯。刑讯逼供在传统司法中是制度化的取证手段，这也解释了为什么「认罪」文化影响深远（后文严打、冤案部分会呼应）。", "image": "study-assets/lecture-1/slide-042.jpg", "extract": "庭审是羞辱性的：a 当事人和证人须向主审官下跪；b 用刑讯获取证据或口供；c ……"}, {"id": "L1-043", "lecture": 1, "page": 43, "title": "You’d better confess", "section": "传统中国社会的法律与调解", "source": "You’d better confess\u000b(a kid was being beaten)\n43", "knowledge": "插图页：「你最好认罪」——孩子正被责打，表现传统司法中逼供的场景。", "understand": "漫画直观呈现上一条：刑讯用于获取口供。图片本身不出考点，记住它佐证的机制即可。", "image": "study-assets/lecture-1/slide-043.jpg", "extract": "你最好认罪（一个孩子正被责打）。"}, {"id": "L1-044", "lecture": 1, "page": 44, "title": "my rights?", "section": "传统中国社会的法律与调解", "source": "my rights?\n44", "knowledge": "插图页：「我的权利呢？」——以讽刺方式表现传统司法中当事人缺乏权利观念。", "understand": "在传统法庭上谈「个人权利」是不合时宜的：审讯逻辑是服从与认罪，而非权利保障。与儒家无讼理想、羞辱性程序一脉相承。", "image": "study-assets/lecture-1/slide-044.jpg", "extract": "我的权利呢？"}, {"id": "L1-045", "lecture": 1, "page": 45, "title": "Who the hell invented these foot-chains?", "section": "传统中国社会的法律与调解", "source": "Who the hell invented these foot-chains?\n45", "knowledge": "插图页：「谁发明的脚镣？」——表现传统刑罚中械具的使用。", "understand": "脚镣等械具是传统刑罚肉体痛苦的象征，说明诉讼和刑罚体验的残酷，从反面强化民众厌讼心理。", "image": "study-assets/lecture-1/slide-045.jpg", "extract": "到底是谁发明的这些脚镣？"}, {"id": "L1-046", "lecture": 1, "page": 46, "title": "I need a break", "section": "传统中国社会的法律与调解", "source": "I need a break\n46", "knowledge": "插图页：「我需要休息」——表现刑讯或刑罚的煎熬。", "understand": "延续上两页主题，用幽默方式表现受刑者的痛苦。三页漫画是一个系列，共同佐证「古代庭审是羞辱和痛苦的」。", "image": "study-assets/lecture-1/slide-046.jpg", "extract": "我需要休息一下。"}, {"id": "L1-047", "lecture": 1, "page": 47, "title": "Humiliating Females", "section": "传统中国社会的法律与调解", "source": "Humiliating Females\n47", "knowledge": "插图页：羞辱女性——传统司法对女性当事人的羞辱性对待。", "understand": "羞辱性程序对女性尤为严酷，这进一步抬高了诉讼的心理成本，特别是对妇女和家庭。", "image": "study-assets/lecture-1/slide-047.jpg", "extract": "羞辱女性。"}, {"id": "L1-048", "lecture": 1, "page": 48, "title": "In Ancient Vietnam", "section": "传统中国社会的法律与调解", "source": "In Ancient Vietnam\n48", "knowledge": "插图页：古代越南的类似情形。", "understand": "把视野扩到越南：厌讼与严酷司法不是中国独有，而是受儒家文化影响的东亚社会共性。", "image": "study-assets/lecture-1/slide-048.jpg", "extract": "在古代越南。"}, {"id": "L1-049", "lecture": 1, "page": 49, "title": "Trial in ancient Vietnam", "section": "传统中国社会的法律与调解", "source": "Trial in ancient Vietnam\n49", "knowledge": "插图页：古代越南的审判场景。", "understand": "继续佐证东亚法律文化的共性：类似中国的审讯方式也存在于越南，说明这套制度与儒家文化圈相关。", "image": "study-assets/lecture-1/slide-049.jpg", "extract": "古代越南的审判。"}, {"id": "L1-050", "lecture": 1, "page": 50, "title": "In ancient China, certain crimes were particularly unacceptable to the authoriites…", "section": "传统中国社会的法律与调解", "source": "In ancient China, certain crimes were particularly unacceptable to the authoriites (e.g., betrayal; murdering one’s parent)\r\rThe punishment of such criminals was extremely horrible, e.g., \r凌迟处死, killing people by cutting him/her 1,000 times or more;\r腰 斩 cutting a person into half;\r五马分尸 torn apart by horses,\r烹 煮 putting people in a jar, and burn it.\n50", "knowledge": "古代中国对某些重罪（如谋反、弑父母）处罚极其惨烈。", "understand": "对威胁皇权和伦理秩序的重罪使用极端刑罚（如凌迟），体现传统法律的特征：刑罚的严酷程度与「冒犯的伦理等级」挂钩，而非现代意义上的罪刑相适应。", "image": "study-assets/lecture-1/slide-050.jpg", "extract": "在古代中国，某些犯罪尤其不能被官府容忍（如谋反、杀害父母）；对这类罪犯的惩罚极其惨烈……"}, {"id": "L1-051", "lecture": 1, "page": 51, "title": "Ancient China is not unique: Human rights need to be protected", "section": "传统中国社会的法律与调解", "source": "Ancient China is not unique: Human rights need to be protected \r\re.g., Rome: \rfire; wearing heated iron shoes \rputting a person in a bag together with snakes, dog, monkeys, cock; \rTied in a tree, with body covered by honey to attract bees;\rCooked;\n51", "knowledge": "古代中国并不独特：人权保障是普遍问题。例子：罗马的火烧、炙热铁鞋、把人与蛇狗猴鸡同装一袋等酷刑。", "understand": "横向比较说明：以残酷刑罚威慑、缺乏人权保障是传统社会的普遍现象，西方历史上同样存在。这个比较避免把问题简单归因于「中国文化」。", "image": "study-assets/lecture-1/slide-051.jpg", "extract": "古代中国并非特例：人权需要被保护。例：罗马——火刑；穿上烧红的铁鞋；把人与蛇、狗、猴子、公鸡同装一袋……"}, {"id": "L1-052", "lecture": 1, "page": 52, "title": "d. Jails were horrible", "section": "传统中国社会的法律与调解", "source": "d. Jails were horrible\r“If crime, vice, despair, suffering, filth, and cruelty can make a hell on earth, this is one (Bird, 1982.).  \r\re. Corruption was serious \rPeople indeed did not have much confidence in the formal judicial process (e.g., corruption, 三年清知府,十万雪花银). The case of Du Fengzhi (杜凤志)\ra. “To enter a court of law is to enter a tiger’s mouth”\rb. “Of ten reasons by which a magistrate may decide a case, nine are unknown to the public.”\rc. “Let householders avoid litigation; for once go to law and there is nothing but trouble.”\n52", "knowledge": "d 监狱条件极其恶劣（引 Bird 1982：如人间地狱）；e 腐败严重——民众确实不愿进监狱和打官司。", "understand": "监狱恶劣 + 司法腐败是压垮诉讼意愿的最后两根稻草。引文的修辞（hell on earth）强调程度。至此，「民众为什么厌讼」的五个原因讲完：文化禁忌、政府打压、程序羞辱、监狱恶劣、司法腐败。", "image": "study-assets/lecture-1/slide-052.jpg", "extract": "d 监狱极其恶劣：「如果犯罪、恶行、绝望、苦难、污秽和残忍能造出人间地狱，这就是一座」（Bird，1982）。e 腐败严重。人们确实不愿……"}, {"id": "L1-053", "lecture": 1, "page": 53, "title": "As a result, using lawsuits was strongly discouraged, and mediation was more commo…", "section": "传统中国社会的法律与调解", "source": "As a result, using lawsuits was strongly discouraged, and mediation was more commonly used. \r\rDispute-mediation institutions in traditional Chinese societies:\rThe gentry (乡绅);\rVillage leaders;\rThe families and clans;\rGuilds (行会)\n53", "knowledge": "结果：诉讼被强烈抑制，调解成为主要方式。传统中国的调解主体：乡绅（gentry）、村庄领袖、家族、行会。", "understand": "本页是板块枢纽：上半句总结厌讼文化的后果，下半句开启新话题——纠纷不靠法院靠谁？答案是四类调解主体，后面四页逐一展开。", "image": "study-assets/lecture-1/slide-053.jpg", "extract": "结果：诉讼被强烈抑制，调解更为常用。传统中国社会的纠纷调解机构：乡绅；村庄……"}, {"id": "L1-054", "lecture": 1, "page": 54, "title": "Who were the gentry (乡绅)", "section": "传统中国社会的法律与调解", "source": "Who were the gentry (乡绅) \r\rSome characteristics:\ra. having property \rb. marital success (no divorce)\rc. conformity with socially approved code of conduct (e.g., filial, generous)\rd. the leisure to spare in participating in tea-shop discussions \re. education, since “so many were completely illiterate” \rThese people serve as mediators or quasi-adjudicatory functions\n54", "knowledge": "乡绅的特征：a 有财产；b 婚姻美满（无离婚）；c 行为合乎社会规范（孝顺、慷慨）；d 有文化。", "understand": "调解权威来自道德声望：乡绅必须是「德高望重」的样板，财产、家庭、品行、学识缺一不可。这与 L1-016 讲的熟人社会声誉机制完全对应。", "image": "study-assets/lecture-1/slide-054.jpg", "extract": "乡绅是什么人？一些特征：a 有财产；b 婚姻美满（无离婚）；c 行为合乎社会认可的规范（如孝顺、慷慨）；d ……"}, {"id": "L1-055", "lecture": 1, "page": 55, "title": "Gentry /乡绅", "section": "传统中国社会的法律与调解", "source": "Gentry /乡绅\nThose who passed the imperial exam/科举 but were not assigned positions; those who failed the exam.\rLiterate landlords\rRetired officials; staying at home for health reason\r4. Clan patriarch 宗族元老\n55", "knowledge": "乡绅的构成：科举中第但未授官者、落第读书人、识字地主、退休或居家官员。", "understand": "上一页讲「成为乡绅要什么条件」，本页讲「乡绅都是什么人」：核心是科举体制造就的地方精英。两条线：功名（中举/落第）与身份（地主/退休官员）。", "image": "study-assets/lecture-1/slide-055.jpg", "extract": "乡绅：科举中第但未授官者；落第者；识字的地主；退休官员；因病居家者……"}, {"id": "L1-056", "lecture": 1, "page": 56, "title": "2. Village leaders", "section": "传统中国社会的法律与调解", "source": "2. Village leaders \rThese people included the village headman and other informal leaders who commanded respect of the villagers.\r\r3. the families and clans \rMediating conflicts within the family or the clan\ra. The Chinese family could be large and include many families of a clan \rb. The face issue often prevented the use of lawsuits (or family ignominy should not be published to the outsider (家丑不可外扬)\n56", "knowledge": "第二类：村庄领袖——村首领及其他受尊敬的 informal leaders；第三类：家族与宗族——调解族内纠纷。", "understand": "调解主体 2 和 3：村庄领袖管村内事务，家族族长管族内纠纷。血缘和地缘是传统调解的两张网。", "image": "study-assets/lecture-1/slide-056.jpg", "extract": "2 村庄领袖：包括村首领和其他受村民尊敬的非正式领袖。3 家族与宗族：调解……内部的冲突"}, {"id": "L1-057", "lecture": 1, "page": 57, "title": "4. Guilds (行会)", "section": "传统中国社会的法律与调解", "source": "4. Guilds (行会)\rA guild was an association of tradesmen of artisans belonging to the same trade or craft.\r\ra. they regulated business activities \rb. they mediated conflicts\n57", "knowledge": "第四类：行会（guild）——同一行业工匠或商人的组织，功能：a 规范商业活动；b 调解行业内冲突。", "understand": "行会是城市/商业领域的调解主体，相当于行业自治组织。两个功能对应「定规则」和「解纠纷」。至此四类调解主体讲完：乡绅、村领袖、家族、行会。", "image": "study-assets/lecture-1/slide-057.jpg", "extract": "4 行会：同一行业或手艺的工匠、商人组成的组织。a 规范商业活动；b 调解冲突。"}, {"id": "L1-058", "lecture": 1, "page": 58, "title": "Culture and legal practice", "section": "传统中国社会的法律与调解", "source": "Culture and legal practice\nConducting trials in front of the Buddha statue or picture, Zhejiang\n58", "knowledge": "文化与法律实践：浙江在佛像前审案。", "understand": "宗教场所被用作解纷空间，说明正式司法缺位时，纠纷解决嵌入宗教与文化实践中。这也是正式与非正式渠道交融的例子。", "image": "study-assets/lecture-1/slide-058.jpg", "extract": "文化与法律实践：浙江，在佛像或佛像画像前审案。"}, {"id": "L1-059", "lecture": 1, "page": 59, "title": "Maoist society", "section": "毛泽东时代：社会组织与法律", "source": "Maoist society \rAfter socialist China was established in 1949, the party-state controlled the society in an unprecedented way in the Chinese history. \r\rAfter 1958, rural people were formed into rural collectives;\rBy the late 1950s, urban people were formed into work units\n59", "knowledge": "章节页：毛时代社会——1949 年后党国以前所未有的方式控制社会；1958 年后农村人日被组织进公社。", "understand": "进入第三大板块：计划经济时期。核心论点是国家对社会全面渗透，这一页是总起，后面分别讲农村（公社）和城市（单位）两套组织体系。", "image": "study-assets/lecture-1/slide-059.jpg", "extract": "毛时代社会：1949年社会主义中国建立后，党国以前所未有的方式控制社会；1958年后，农村人……"}, {"id": "L1-060", "lecture": 1, "page": 60, "title": "To Live (活着)", "section": "毛泽东时代：社会组织与法律", "source": "To Live (活着)\n60", "knowledge": "插图页：电影《活着》——展现普通人在历次政治运动中的命运。", "understand": "用电影画面导入毛时代的主题：个人生活深度卷入政治。图片本身不是考点。", "image": "study-assets/lecture-1/slide-060.jpg", "extract": "《活着》（电影）。"}, {"id": "L1-061", "lecture": 1, "page": 61, "title": "Social arrangements: planned economy", "section": "毛泽东时代：社会组织与法律", "source": "Social arrangements: planned economy\rPublic ownership and limited mobility \r2. Rationing system/coupon 粮票 \r3. Party’s dominance in the political system\n61", "knowledge": "社会安排：计划经济——1 公有制与限制流动；2 配给制/票证（粮票）；3 党在政治体系中的主导地位。", "understand": "毛时代经济体制的三大支柱：公有制、票证配给、党的领导。粮票是计划经济的标志性符号。三条是后面展开的目录。", "image": "study-assets/lecture-1/slide-061.jpg", "extract": "社会安排：计划经济。1 公有制与限制流动；2 配给制/票证（粮票）；3 党在政治体系中的主导地位。"}, {"id": "L1-062", "lecture": 1, "page": 62, "title": "Socioeconomic arrangements in Maoist China: a planned economy", "section": "毛泽东时代：社会组织与法律", "source": "Socioeconomic arrangements in Maoist China: a planned economy\r\rSocial-economic structure in Maoist China:\r\rRural collective: commune system in rural China  \rWork-unit system (单位) in urban China\n62", "knowledge": "毛时代社会经济结构：农村是公社体制（commune system），城市是单位体制（work-unit system）。", "understand": "总纲页：中国被切成两半治理——农民归公社，市民归单位。这两套制度既是经济组织也是社会控制和纠纷解决装置，后面分别详述。", "image": "study-assets/lecture-1/slide-062.jpg", "extract": "毛时代中国的社会经济安排：计划经济。社会经济结构：农村集体——中国农村的公社制度；城市的单位制度……"}, {"id": "L1-063", "lecture": 1, "page": 63, "title": "Rural commune system (公社）", "section": "毛泽东时代：社会组织与法律", "source": "Rural commune system (公社）\r1958-1984\n63", "knowledge": "农村公社体制（人民公社），1958–1984。", "understand": "标题页给出公社体制的起止年份：1958 年建立，1984 年解体。记住这个时间段。", "image": "study-assets/lecture-1/slide-063.jpg", "extract": "农村公社制度，1958–1984。"}, {"id": "L1-064", "lecture": 1, "page": 64, "title": "In the early 1950s, land was initially distributed to individual peasant households.", "section": "毛泽东时代：社会组织与法律", "source": "In the early 1950s, land was initially distributed to individual peasant households.\rFrom the mid-1950s, peasants were asked to join rural collectives.\rc.   From 1958, peasants were organized into the commune system. Their land was turned in to the collective.\n64", "knowledge": "集体化进程：1950 年代初土地先分给个体农户；1950 年代中期起要求加入集体；1958 年进入公社。", "understand": "三步走：分田到户（土改）→ 互助组/合作社 → 人民公社。土地所有权从私有逐步收归集体，为下一页的表格数据提供背景。", "image": "study-assets/lecture-1/slide-064.jpg", "extract": "1950年代初，土地最初分给个体农户；1950年代中期起，农民被要求加入农村集体；c 1958年起，农民……"}, {"id": "L1-065", "lecture": 1, "page": 65, "title": "The process of collectivization (% of households)", "section": "毛泽东时代：社会组织与法律", "source": "The process of collectivization (% of households)\nYear  | Mutual help\r互助组 | Preliminary \r\r初级社 | High-level cooperative\r高级社 | Commune \n1950 | 10.7 |  |  | \n1951 | 19.2 |  |  | \n1953 | 39.5 |   0.2 |  | \n1954 | 58.3 |   2.0 |  | \n1955 | 50.7 | 14.2 |  | \n1956 |  |   8.5 | 87.8 | \n1957 |  |   1.3 | 96.2 | \n1958 |  |  |  | 98.2\n65", "knowledge": "集体化进程表（农户占比）：从 1950 年互助组 10.7% 起步，几年内迅速推进到高级社和公社。", "understand": "数据说明集体化速度极快：短短几年内全国农户几乎全部被卷入集体组织。速度本身就是考点——反映国家动员能力，也埋下农民抵触的伏笔。 行是年份（1950 起），列是组织形式（互助组→初级社→高级社→公社，逐级提高）；单元格是农户百分比。横向看组织升级，纵向看比例攀升。单位是 % of households。", "image": "study-assets/lecture-1/slide-065.jpg", "extract": "集体化进程（农户占比%）：年份 / 互助组 / 初级社 / 高级社 / 公社——1950年10.7……1951年19.2……"}, {"id": "L1-066", "lecture": 1, "page": 66, "title": "The collectivization of the agricultural production in rural areas", "section": "毛泽东时代：社会组织与法律", "source": "The collectivization of the agricultural production in rural areas: \r\rStructure:\rProduction team (生产队): consisting of a number of peasant households \rBrigade (大队): consisting of a number of production teams \rCommune (人民公社): consisting of a number of brigades\n66", "knowledge": "农村生产集体化的组织结构：生产队（若干农户）→ 大队（若干生产队）→ 公社（若干大队）三级。", "understand": "三级结构是公社体制的骨架：生产队是基本核算单位，大队居中，公社最大。这个层级结构也是行政控制和分配的组织基础。 箭头方向：team → brigade → commune，由小到大逐级包含。记住三级的英文与中文对应。", "image": "study-assets/lecture-1/slide-066.jpg", "extract": "农村农业生产的集体化：结构——生产队：由若干农户组成；大队：由若干……组成"}, {"id": "L1-067", "lecture": 1, "page": 67, "title": "Political implications of collectivization", "section": "毛泽东时代：社会组织与法律", "source": "Political implications of collectivization:\rThe rights of peasants as a collective were not protected. \rPeasants lost their freedom of mobility.\rThe source of the divide between the urban and rural areas emerged.\rA system of low efficiency emerged. \r\rIn1955， household registration/户口\n67", "knowledge": "集体化的政治后果：农民作为集体的权利不受保护；农民失去流动自由；成为城乡分裂（户口）的根源。", "understand": "三条后果是考点：权利缺失、失去迁徙自由、固化了城乡二元结构。户口制度把农民绑在土地上，影响延续至今。", "image": "study-assets/lecture-1/slide-067.jpg", "extract": "集体化的政治后果：农民作为集体的权利不受保护；农民失去流动自由；这是城乡分裂的根源……"}, {"id": "L1-068", "lecture": 1, "page": 68, "title": "The People’s Commune", "section": "毛泽东时代：社会组织与法律", "source": "The People’s Commune\u000b（人民公社）\n68", "knowledge": "插图页：人民公社场景。", "understand": "公社生活的历史图片，直观呈现集体劳动场景。", "image": "study-assets/lecture-1/slide-068.jpg", "extract": "人民公社。"}, {"id": "L1-069", "lecture": 1, "page": 69, "title": "Implications of rural collective for dispute resolution", "section": "毛泽东时代：社会组织与法律", "source": "Implications of rural collective for dispute resolution: \r\r   In rural collective period (until the early 1980s), civil disputes were mostly addressed within the village community, often with the intervention of village cadres and/or senior villagers.\n69", "knowledge": "公社对纠纷解决的影响：集体化时期（至 1980 年代初），民事纠纷大多在村庄内部解决。", "understand": "组织化的社会产生封闭化的纠纷解决：村庄（生产队/大队）内部消化纠纷，国家正式法律很少介入。呼应第一部分「非正式渠道」——但这次是被组织起来的「非正式」。", "image": "study-assets/lecture-1/slide-069.jpg", "extract": "农村集体对纠纷解决的影响：农村集体时期（至1980年代初），民事纠纷大多在村庄社区内部解决……"}, {"id": "L1-070", "lecture": 1, "page": 70, "title": "The work-unit system in urban China", "section": "毛泽东时代：社会组织与法律", "source": "The work-unit system in urban China \r\rNationalization of property\n70", "knowledge": "城市单位体制：财产国有化。", "understand": "转入城市部分。单位的根基是公有制：城市财产国有，绝大多数人依附于单位生存。", "image": "study-assets/lecture-1/slide-070.jpg", "extract": "中国城市的单位制度：财产国有化。"}, {"id": "L1-071", "lecture": 1, "page": 71, "title": "2. The work unit system in the urban area (单位)", "section": "毛泽东时代：社会组织与法律", "source": "2. The work unit system in the urban area (单位)\r\ra. An overwhelming majority of the urban population worked in the work units in the public sector. \r\rb. Welfare benefits, such as housing and pension, were provided by the work units (e.g., factories, government agencies, schools).\r\rc. Personnel-file system, together with the rationing system, controlled employees (e.g., getting married needed documents provided by the work unit).\rState-owned vs. collective owned. 上山下乡\n71", "knowledge": "单位体制：a 绝大多数城市人口在公有部门单位工作；b 住房等福利由单位提供。", "understand": "单位不只是工作场所，而是包办住房、医疗、子女教育等全部福利的「小社会」。个人对单位的全面依附是理解其纠纷解决功能的前提。", "image": "study-assets/lecture-1/slide-071.jpg", "extract": "2 城市的单位制度：a 绝大多数城市人口在公有部门的单位工作；b 住房等福利由单位提供……"}, {"id": "L1-072", "lecture": 1, "page": 72, "title": "A factory making trains", "section": "毛泽东时代：社会组织与法律", "source": "A factory making trains\n72", "knowledge": "插图页：制造火车的工厂——单位体制的典型场景。", "understand": "国营大厂是单位体制的缩影：工厂围墙内是一个完整社会。", "image": "study-assets/lecture-1/slide-072.jpg", "extract": "一家制造火车的工厂。"}, {"id": "L1-073", "lecture": 1, "page": 73, "title": "Implications", "section": "毛泽东时代：社会组织与法律", "source": "Implications:\ra. Conflicts between individuals across work units were not many as they did not interact with each other much.\r\rb. Conflicts within a work unit were mostly addressed within the work unit by the leaders (e.g., even family disputes; divorce).\n73", "knowledge": "影响：a 跨单位的个人之间交往少、冲突不多；b 单位内部的冲突大多由单位内部处理。", "understand": "与农村同构：单位既是生活共同体也是纠纷解决场所，正式法律系统在城市同样被边缘化。至此毛时代的图景完整了——公社和单位分别在城乡内部消化纠纷。", "image": "study-assets/lecture-1/slide-073.jpg", "extract": "影响：a 跨单位的个人之间冲突不多，因为彼此交往很少；b 单位内部的冲突大多在单位内部解决……"}, {"id": "L1-074", "lecture": 1, "page": 74, "title": "Legal institutions in Mao’s China", "section": "毛泽东时代：社会组织与法律", "source": "Legal institutions in Mao’s China\r\rBased on the model of the former Soviet Union\n74", "knowledge": "毛时代的法律机构：以苏联模式建立。", "understand": "过渡到法律机构话题。关键词「苏联模式」：法院、检察院、公安局的设置都仿照苏联。", "image": "study-assets/lecture-1/slide-074.jpg", "extract": "毛时代中国的法律机构：以苏联模式建立。"}, {"id": "L1-075", "lecture": 1, "page": 75, "title": "In the 1950s, formal legal institutions were established, including", "section": "毛泽东时代：社会组织与法律", "source": "In the 1950s, formal legal institutions were established, including:\r1. Courts 法院，\r2. Procuratorate/procuracy 检察院，\r3. Public security bureau, 公安局\r\rWhat is a procuratorate? \rIt represents the government in suing a suspect.\n75", "knowledge": "1950 年代建立的正式法律机构：1 法院；2 检察院；3 公安局。检察院代表国家提起公诉并监督法律执行。", "understand": "三大法律机构是考试重点：法院（审判）、检察院（公诉+监督）、公安局（治安+侦查）。检察院（procuratorate）对中国学生最陌生，注意它的双重职能。", "image": "study-assets/lecture-1/slide-075.jpg", "extract": "1950年代建立的正式法律机构：1 法院；2 检察院；3 公安局。什么是检察院？它代表国家……"}, {"id": "L1-076", "lecture": 1, "page": 76, "title": "The party-state’s attitudes towards law", "section": "毛泽东时代：社会组织与法律", "source": "The party-state’s attitudes towards law:\rinstrumental \r\r(1). Laws and legal institutions were used to achieve political and economic goals, such as land reform and nationalization of urban economies (e.g., factories). \r(2) Cadres were reminded that law must serve policy;\n76", "knowledge": "党国对法律的态度：工具主义（instrumental）——法律被用来实现政治经济目标（如土改、国有化），而非约束权力本身。", "understand": "关键概念 instrumental：法律是统治工具而非权力边界。这解释了为什么法律机构可以随时为政治运动让路（后面的文革、严打都是例证）。", "image": "study-assets/lecture-1/slide-076.jpg", "extract": "党国对法律的态度：工具主义。(1) 法律和法律机构被用来实现政治和经济目标，如土地改革和国有化……"}, {"id": "L1-077", "lecture": 1, "page": 77, "title": "In the early 1950s, government agencies instead of the courts played a more import…", "section": "毛泽东时代：社会组织与法律", "source": "In the early 1950s, government agencies instead of the courts played a more important role in addressing criminal activities. \r\rThis approach seemed to be rather effective in dealing with certain issues like drugs and prostitution.\n77", "knowledge": "1950 年代初：处理犯罪主要靠政府机构而非法院；这种方式在镇压上相当有效。", "understand": "建国初期用行政运动代替司法程序处理犯罪。「有效」指快速压低犯罪率，但代价是程序缺失。下一组页用禁毒禁娼的案例展示。", "image": "study-assets/lecture-1/slide-077.jpg", "extract": "1950年代初，处理犯罪活动时政府机构比法院作用更大；这种方式在打击……方面似乎相当有效"}, {"id": "L1-078", "lecture": 1, "page": 78, "title": "Example: drugs and prostitution in China today", "section": "毛泽东时代：社会组织与法律", "source": "Example: drugs and prostitution in China today:\rIn 2002, about one million drug addicts in China (formally registered) in 2,148 cities and counties in the country. 74 percent were young people. \r\rThe issue of prostitution is also serious in China today, though it is illegal.\r\rIt seems that the government today is less effective in addressing these two issues, compared with the government in the 1950s.\n78", "knowledge": "对比案例：当今毒品与娼妓问题——2002 年全国登记吸毒者约 100 万，遍布 2,148 个市县，74% 为特定年龄段人群。", "understand": "先给出当代问题的规模作对比基准，再回头讲 1950 年代如何「运动式」解决同类问题。一今一昔的对比凸显两种治理方式的差异。 100 万是登记在册人数（实际更多）；2,148 是波及的市县数量；74% 是占比口径。这些是存量统计，不是发生率。", "image": "study-assets/lecture-1/slide-078.jpg", "extract": "例：当今中国的毒品与娼妓问题——2002年，中国约有100万吸毒者（正式登记），分布在全国2,148个市县；74%是……"}, {"id": "L1-079", "lecture": 1, "page": 79, "title": "Addressing the issue of drugs and prostitution in China in the 1950s", "section": "毛泽东时代：社会组织与法律", "source": "Addressing the issue of drugs and prostitution in China in the 1950s\r\rIn the early 1950s, China had 300,000 engaged in drug dealings and 20 million drug users. The communist government used three years to eradicate the drug issue that lasted for more than 100 years in China.\n79", "knowledge": "1950 年代的毒品娼妓问题：全国约 30 万人从事毒品交易、2,000 万吸毒者；政府用运动方式整治。", "understand": "历史问题规模远超当代：2,000 万吸毒者。政府的对策不是常规司法而是政治运动，体现工具主义法律观。 30 万是贩毒从业者，2,000 万是吸毒者，注意数量级差异（约 1:67）。与上一页当代数据对照看。", "image": "study-assets/lecture-1/slide-079.jpg", "extract": "1950年代中国如何处理毒品与娼妓问题：1950年代初，中国有30万人从事毒品交易、2,000万吸毒者；共产党政府……"}, {"id": "L1-080", "lecture": 1, "page": 80, "title": "How?", "section": "毛泽东时代：社会组织与法律", "source": "How?\rHarsh punishment and providing jobs or alternatives\rThe case of Shanghai:\r\rin 1949, Shanghai had more than 800 registered brothels (妓院), more than 4,000 prostitutes, and another 30,000 illegal prostitutes.\r\rNovember 1951, registered brothers were reduced to 72 with 181 prostitutes. All wiped out. \r\r334 owners were all punished: (74 sent to legal departments, and 200 were sent to work in farms in northern Jiangsu province)\r\rProstitutes were sent to detention stations, provided training; some married, or found new jobs.\n80", "knowledge": "怎么做？严厉惩罚 + 提供工作和出路。上海案例：1949 年有 800 多家注册妓院、4,000 多名妓女。", "understand": "运动式治理的两手：镇压（harsh punishment）加安置（providing jobs/alternatives）。后者是常被忽略的考点——不只是打击，还包括把妓女、毒贩改造安置进生产体系。 800 家是妓院数量，4,000 是妓女数量，城市范围仅限上海（1949）。", "image": "study-assets/lecture-1/slide-080.jpg", "extract": "怎么做？严厉惩罚并提供工作或出路。上海的案例：1949年上海有800多家注册妓院、4,000多名妓女，另有……"}, {"id": "L1-081", "lecture": 1, "page": 81, "title": "Prostitutes detained", "section": "毛泽东时代：社会组织与法律", "source": "Prostitutes detained\n81", "knowledge": "插图页：被收容的妓女。", "understand": "历史照片呈现娼妓改造运动的场景。", "image": "study-assets/lecture-1/slide-081.jpg", "extract": "被拘押的妓女。"}, {"id": "L1-082", "lecture": 1, "page": 82, "title": "Drug (毒品)", "section": "毛泽东时代：社会组织与法律", "source": "Drug (毒品):\rIn 1948, Shanghai had 23 factories producing drugs, more than 2,000 places selling drugs.\r\r30,000 people engaged in the drug business, and 100,000 drug addicts (One out of every 80 households had drug addict). \r\rIn 1952, the government arrested 13,685 people involved in drug dealings, and 2,483 were given legal punishment.\n82", "knowledge": "上海的毒品规模：1948 年 23 家制毒工厂、2,000 多处售毒点、3 万人从事毒品生意、10 万吸毒者（约每 50 人中 1 人）。", "understand": "用上海的数据具象化毒品问题的严重程度，括号里的人口比例（One out of 50）最容易记住。 四个数字口径不同——工厂数、销售点数、从业人数、吸毒者数，从供应链上游到下游依次放大。括号给出人口占比便于直观理解。", "image": "study-assets/lecture-1/slide-082.jpg", "extract": "毒品：1948年，上海有23家制毒工厂、2,000多处售毒点；3万人从事毒品生意，10万名吸毒者（每……人中就有一人）"}, {"id": "L1-083", "lecture": 1, "page": 83, "title": "第 83 页", "section": "毛泽东时代：社会组织与法律", "source": "83", "knowledge": "（图片过渡页）", "understand": "无提取文字，为禁毒禁娼主题的历史图片页。", "image": "study-assets/lecture-1/slide-083.jpg", "extract": "（本页无可提取文字，为图片页）"}, {"id": "L1-084", "lecture": 1, "page": 84, "title": "第 84 页", "section": "毛泽东时代：社会组织与法律", "source": "84", "knowledge": "（图片过渡页）", "understand": "无提取文字，为禁毒禁娼主题的历史图片页。", "image": "study-assets/lecture-1/slide-084.jpg", "extract": "（本页无可提取文字，为图片页）"}, {"id": "L1-085", "lecture": 1, "page": 85, "title": "Politics and law: The Cultural Revolution (1966-1976)", "section": "毛泽东时代：社会组织与法律", "source": "Politics and law: The Cultural Revolution (1966-1976)\r\rAbout 100 million people in China were negatively affected by this political movement.\n85", "knowledge": "政治与法律：文化大革命（1966–1976）——约 1 亿中国人在这场政治运动中受到负面影响。", "understand": "转入文革部分。记住时间段 1966–1976 和影响规模（约 1 亿人），说明这不是局部事件而是全国性灾难。 100 million 是受负面影响人数的估计量级，强调波及面之广。", "image": "study-assets/lecture-1/slide-085.jpg", "extract": "政治与法律：文化大革命（1966–1976）——约1亿中国人受到这场政治运动的负面影响。"}, {"id": "L1-086", "lecture": 1, "page": 86, "title": "Legal procedures were not strictly followed, and people could be jailed without be…", "section": "毛泽东时代：社会组织与法律", "source": "Legal procedures were not strictly followed, and people could be jailed without being defended. \r\r  Government agencies, including the legal departments, were sometimes paralyzed.\n86", "knowledge": "文革中的法律状况：不遵守法律程序，未经辩护即可入狱；包括法律部门在内的政府机构一度瘫痪。", "understand": "工具主义法律观的极端后果：当政治运动压倒一切时，本就脆弱的法律程序被完全抛弃。两个要点：程序作废 + 机构瘫痪。", "image": "study-assets/lecture-1/slide-086.jpg", "extract": "法律程序不被严格遵守，人们未经辩护即可入狱；包括法律部门在内的政府机构一度瘫痪……"}, {"id": "L1-087", "lecture": 1, "page": 87, "title": "Cultural revolution is an important reason for the Chinese party-state to strength…", "section": "毛泽东时代：社会组织与法律", "source": "Cultural revolution is an important reason for the Chinese party-state to strengthen the rule of law. \r\rFrom 1978 to 1981, the Supreme Court reviewed 1.2 million criminal cases judged during the Cultural Revolution and corrected the rulings of one-fourth of them, affecting 326,000 people.\n87", "knowledge": "文革是党国后来加强法治的重要原因：1978–1981 年最高法院复查了 120 万件文革期间判处的刑事案件。", "understand": "因果链条的关键页：文革的无法无天 → 领导人切身之痛 → 1978 年后重建法治。120 万件复查说明冤假错案的规模。 1.2 million 是 1978–1981 四年间复查的刑事案件数，属累计流量。记住时间范围 1978–1981。", "image": "study-assets/lecture-1/slide-087.jpg", "extract": "文革是中国党国加强法治的重要原因：1978至1981年，最高法院复查了120万件文革期间判处的刑事案件……"}, {"id": "L1-088", "lecture": 1, "page": 88, "title": "Developments after 1976", "section": "改革开放后的法治建设", "source": "Developments after 1976\n88", "knowledge": "章节页：1976 年之后的发展（文革结束后的重建）。", "understand": "过渡页，标志板块从「文革」转向「改革开放后的法律重建」。", "image": "study-assets/lecture-1/slide-088.jpg", "extract": "1976年之后的发展。"}, {"id": "L1-089", "lecture": 1, "page": 89, "title": "The end of the Cultural Revolution in 1976", "section": "改革开放后的法治建设", "source": "The end of the Cultural Revolution in 1976\r\r  The arrest of the “Gang of Four” (i.e., four people who were deemed as responsible for the tragedy).四人帮\n89", "knowledge": "1976 年文革结束的标志：逮捕「四人帮」——被认为对这场灾难负责的四个人。", "understand": "文革终结的政治事件：毛泽东去世后四人帮（包括毛的妻子江青）被捕受审。记住「四人帮」的定性：deemed responsible for the tragedy。", "image": "study-assets/lecture-1/slide-089.jpg", "extract": "1976年文革结束：逮捕「四人帮」（被认为对这场灾难负责的四个人）。"}, {"id": "L1-090", "lecture": 1, "page": 90, "title": "The trial of the “Gang of Four”", "section": "改革开放后的法治建设", "source": "The trial of the “Gang of Four”\nIn 1976, Mao passed away\rSoon, the “Gang of Four”, including Mao’s wife, were arrested and tried. \rJiang: 1991; Wang: 1992\rYao and Zhang: 2005. \r\rThe Cultural Revolution came to an end\n90", "knowledge": "四人帮审判：1976 年毛去世，随后四人帮（含毛妻江青）被捕受审；各人去世年份：江青 1991、王洪文 1992、姚文元与张春桥 2005。", "understand": "审判本身具有象征意义：用法庭审判处理文革责任者，本身就是「重回法律程序」的宣示。去世年份属背景细节，了解即可。", "image": "study-assets/lecture-1/slide-090.jpg", "extract": "审判「四人帮」：1976年毛去世；不久，包括毛的妻子在内的「四人帮」被捕受审。江：1991；王：1992；姚和张：2005……"}, {"id": "L1-091", "lecture": 1, "page": 91, "title": "Issues faced by the government after the Cultural Revolution.", "section": "改革开放后的法治建设", "source": "Issues faced by the government after the Cultural Revolution. \rMistreated people in the movement \reconomy \rParalyzed institutions\n91", "knowledge": "文革后政府面临的三大问题：运动中受迫害的人、经济、瘫痪的制度。", "understand": "三页总结成一个问题清单：平反、搞经济、重建制度。后面几页逐一对应，本页是目录。", "image": "study-assets/lecture-1/slide-091.jpg", "extract": "文革后政府面临的问题：运动中受冤屈的人；经济；瘫痪的制度。"}, {"id": "L1-092", "lecture": 1, "page": 92, "title": "Correcting cases mishandled in the Cultural revolution", "section": "改革开放后的法治建设", "source": "Correcting cases mishandled in the Cultural revolution \r\ra. Correcting the case for 3 million cadres;\rb. 470,000 party members re-gained their memberships (from 1977-1982).\rc.  Political campaigns were reduced drastically.\n92", "knowledge": "纠正文革错案：a 为 300 万干部平反；b 47 万党员恢复党籍（1977–1982）。", "understand": "平反规模数据化：300 万干部、47 万党员。数字说明文革迫害面之广，也解释重建法治的政治动力——党内精英自己是受害者。 3 million 是平反干部人数，470,000 是恢复党籍人数；括号 1977–1982 是时间范围。均为累计数。", "image": "study-assets/lecture-1/slide-092.jpg", "extract": "纠正文革错案：a 为300万干部平反；b 47万党员恢复党籍（1977–1982）；c 政治……"}, {"id": "L1-093", "lecture": 1, "page": 93, "title": "2. Economic development became the priority", "section": "改革开放后的法治建设", "source": "2. Economic development became the priority\r\ra. The third plenum of the 11th Party Congress in 1978\r \rb. Deng’s rise to power\n93", "knowledge": "经济发展成为首要任务：a 1978 年十一届三中全会；b 邓小平掌权。", "understand": "两个标志性事件：十一届三中全会（1978）确立以经济建设为中心，邓小平成为核心领导人。这是改革开放的起点。", "image": "study-assets/lecture-1/slide-093.jpg", "extract": "2 经济发展成为首要任务：a 1978年十一届三中全会；b 邓小平掌权。"}, {"id": "L1-094", "lecture": 1, "page": 94, "title": "The Cultural Revolution wasted much time.", "section": "改革开放后的法治建设", "source": "The Cultural Revolution wasted much time. \rGDP per capita in 1978 (U.S. dollars):\r\rChina:                                  $230; \rdeveloped countries:           $810; \rother developing countries: $520.\n94", "knowledge": "文革耽误了中国：1978 年人均 GDP 对比——中国 230 美元，低于发达国家和其他发展中国家水平。", "understand": "用国际对比说明经济落后的程度，解释「以经济建设为中心」的紧迫性。中国 230 美元是核心记忆数字。 三个数值是同一指标（1978 年人均 GDP，美元）在三类经济体间的横向对比。中国 230 美元处于最低位，差距越大越能说明「被耽误」。", "image": "study-assets/lecture-1/slide-094.jpg", "extract": "文革浪费了许多时间。1978年人均GDP（美元）：中国230；发达国家810；其他发展中……"}, {"id": "L1-095", "lecture": 1, "page": 95, "title": "The rise of Deng Xiaoping", "section": "改革开放后的法治建设", "source": "The rise of Deng Xiaoping \u000b(1904-1997)\n95", "knowledge": "人物页：邓小平（1904–1997）的崛起。", "understand": "过渡页，引出改革开放的总设计师。生卒年 1904–1997 了解即可。", "image": "study-assets/lecture-1/slide-095.jpg", "extract": "邓小平（1904–1997）的崛起。"}, {"id": "L1-096", "lecture": 1, "page": 96, "title": "After 1978, Deng Xiaoping began to emerge as the most powerful figure in China.", "section": "改革开放后的法治建设", "source": "After 1978, Deng Xiaoping began to emerge as the most powerful figure in China. \r\rHe began the process of reform and openness in China in the late 1970s.\n96", "knowledge": "1978 年后邓小平成为最有权势的人物，于 1970 年代末启动改革开放。", "understand": "核心史实：邓小平与改革开放进程的绑定。后面经济开放数据、法制建设都以此为起点。", "image": "study-assets/lecture-1/slide-096.jpg", "extract": "1978年后，邓小平开始成为最有权势的人物；他在1970年代末开启了中国改革开放的进程。"}, {"id": "L1-097", "lecture": 1, "page": 97, "title": "Deng visited U.S in 1979", "section": "改革开放后的法治建设", "source": "Deng visited U.S in 1979\n97", "knowledge": "插图页：1979 年邓小平访美。", "understand": "历史照片，标志中国对外开放、融入世界的姿态。", "image": "study-assets/lecture-1/slide-097.jpg", "extract": "邓小平1979年访美。"}, {"id": "L1-098", "lecture": 1, "page": 98, "title": "Economic development", "section": "改革开放后的法治建设", "source": "Economic development: \rRecruit young cadres\rReform and openness\n98", "knowledge": "经济发展两手：提拔年轻干部 + 改革开放。", "understand": "人事与经济政策配合：年轻化官僚队伍为改革提供执行者。", "image": "study-assets/lecture-1/slide-098.jpg", "extract": "经济发展：提拔年轻干部；改革开放。"}, {"id": "L1-099", "lecture": 1, "page": 99, "title": "3. Legal institution building", "section": "改革开放后的法治建设", "source": "3. Legal institution building\r\r1). Addressing problems in Cultural revolution:\r2). Economic development \r3). Social changes\n99", "knowledge": "法律机构建设的三大动因：1 解决文革遗留问题；2 经济发展；3 社会变化。", "understand": "本页是后面全部法制建设内容的总纲。三条动因对应前文：文革教训（L1-087/092）、经济中心（L1-093）、社会结构变化（公社解体、单位弱化，L1-103 起）。", "image": "study-assets/lecture-1/slide-099.jpg", "extract": "3 法律机构建设：1) 解决文革问题；2) 经济发展；3) 社会变化。"}, {"id": "L1-100", "lecture": 1, "page": 100, "title": "1969-1973, Deng, his mother, and his wife were sent to Jiangxi", "section": "改革开放后的法治建设", "source": "1969-1973, Deng, his mother, and his wife were sent to Jiangxi\nHis son jumped out of the building in 1968, paralyzed\n100", "knowledge": "背景细节：1969–1973 年邓小平和家人被下放江西；其子 1968 年坠楼瘫痪。", "understand": "解释邓小平个人对法治缺失的切身体会——受害者掌权后更倾向建制度。个人遭遇与政策转向的关联是本课反复使用的解释逻辑。", "image": "study-assets/lecture-1/slide-100.jpg", "extract": "1969–1973年，邓和他的母亲、妻子被下放到江西；他的儿子1968年跳楼，瘫痪。"}, {"id": "L1-101", "lecture": 1, "page": 101, "title": "2). Reform and openness in economic fields", "section": "改革开放后的法治建设", "source": "2). Reform and openness in economic fields:\rFrom the late 1970s, most plans for industrial products (e.g., their output and prices) were abolished. \r\rThe rise of non-state economy:\rFrom 1978 to 1997, \rThe proportion of the state economy in the total GDP decreased from 77.6 percent to 26.5 percent.\rMeanwhile, the proportion of the private economy increased from 0.2 percent to 32.9 percent.\n101", "knowledge": "经济领域改革开放：1970 年代末起工业品的产量和价格计划大多被取消；非国有经济兴起。", "understand": "从计划到市场：取消指令性计划、允许非国有经济。经济自由化产生大量新型纠纷（合同、产权），从而需要法律——这是「经济发展推动法制」的机制。", "image": "study-assets/lecture-1/slide-101.jpg", "extract": "2) 经济领域的改革开放：1970年代末起，大多数工业品计划（产量和价格）被取消；非国有经济兴起……"}, {"id": "L1-102", "lecture": 1, "page": 102, "title": "Openness", "section": "改革开放后的法治建设", "source": "Openness \rExport increased from 20.6 billion U.S dollars in 1978 to 325.1 billion U.S. dollars in 1997. \rFDI (foreign direct investment) increased each year. \rMore recent (the WTO ，2001)，\r1990s-2000s; layoffs; 下岗 40-50million\n102", "knowledge": "开放数据：出口从 1978 年 206 亿美元增至 1997 年 3,251 亿美元；外商直接投资逐年增加；后来加入 WTO。", "understand": "用贸易数字量化「开放」的成就：出口约 16 倍增长。经济活动爆炸式增长必然要求规则（合同法、外资法），衔接下一页立法潮。 20.6 → 325.1 billion 是出口额跨期对比（1978 vs 1997），倍数约 15.8。FDI 只有方向性描述（逐年增加）无具体值。", "image": "study-assets/lecture-1/slide-102.jpg", "extract": "开放：出口从1978年的206亿美元增至1997年的3,251亿美元；外商直接投资逐年增加；更近期（加入WTO……"}, {"id": "L1-103", "lecture": 1, "page": 103, "title": "3) Reform and socio-economic changes after the 1970s", "section": "改革开放后的法治建设", "source": "3) Reform and socio-economic changes after the 1970s:\r\rThe demise of the commune system\rThe rise of private economy and the weakening of the work-unit system\n103", "knowledge": "1970 年代后的社会经济变化：公社体制消亡；私营经济兴起、单位体制弱化。", "understand": "毛时代两大社会组织（公社、单位）解体或弱化，原来内部消化纠纷的机制失灵，纠纷涌向法院——这是「社会变化推动法制」的机制。", "image": "study-assets/lecture-1/slide-103.jpg", "extract": "3) 1970年代后的改革与社会经济变化：公社制度的消亡；私营经济的兴起与单位制度的弱化。"}, {"id": "L1-104", "lecture": 1, "page": 104, "title": "Grain Production (tons/per person) in Rural China (1962-1978)", "section": "改革开放后的法治建设", "source": "Grain Production (tons/per person) in Rural China (1962-1978)\n104", "knowledge": "图表页：中国农村人均粮食产量（1962–1978，吨/人）。", "understand": "数据显示公社时期粮食生产长期停滞，论证公社体制的低效，为「公社解体」提供绩效依据。 横轴年份 1962–1978，纵轴人均粮食产量（吨/人）。关注整体趋势（停滞或缓慢）而非单点数值；它与改革后产量上升形成对照。", "image": "study-assets/lecture-1/slide-104.jpg", "extract": "中国农村人均粮食产量（吨/人），1962–1978。"}, {"id": "L1-105", "lecture": 1, "page": 105, "title": "Grain Provision Based on Membership (%) (in one village in Zhejiang)", "section": "改革开放后的法治建设", "source": "Grain Provision Based on Membership (%) (in one village in Zhejiang)\n105", "knowledge": "图表页：浙江某村按人头分配的粮食供给比例（%）。", "understand": "公社分配的高度平均主义：按成员身份（人头）分配占很高比例，干多干少差别不大，挫伤劳动积极性——解释小岗村包产到户的动机。 单位是百分比，口径是「一个浙江村庄」的分配结构，不能推广为全国数据。看清图例中「按人头」与「按工分」的份额对比。", "image": "study-assets/lecture-1/slide-105.jpg", "extract": "按人头分配的粮食供给比例（%）（浙江某村）。"}, {"id": "L1-106", "lecture": 1, "page": 106, "title": "Xiaogang village/小岗村", "section": "改革开放后的法治建设", "source": "Xiaogang village/小岗村\n106", "knowledge": "案例页：小岗村——1978 年 18 户农民按手印搞包产到户，成为农村改革象征。", "understand": "农民自发的制度创新倒逼国家改革：包产到户大幅提高产量，随后被中央承认并推广，最终导致公社解体。底层实践推动制度变迁的典型案例。", "image": "study-assets/lecture-1/slide-106.jpg", "extract": "小岗村。"}, {"id": "L1-107", "lecture": 1, "page": 107, "title": "第 107 页", "section": "改革开放后的法治建设", "source": "107", "knowledge": "（图片过渡页）", "understand": "无提取文字，为小岗村或农村改革主题的图片页。", "image": "study-assets/lecture-1/slide-107.jpg", "extract": "（本页无可提取文字，为图片页）"}, {"id": "L1-108", "lecture": 1, "page": 108, "title": "2). the weakening of the work unit system in the urban areas", "section": "改革开放后的法治建设", "source": "2). the weakening of the work unit system in the urban areas \ra. The availability of jobs in the private sector \rb. The reform of public enterprises\n108", "knowledge": "城市单位体制弱化：a 私营部门有了就业机会；b 国有企业改革。", "understand": "单位弱化的两个机制：人们可以在单位外找到工作（私企），国企本身也在改制。对单位的依附松动，纠纷溢出到法院。", "image": "study-assets/lecture-1/slide-108.jpg", "extract": "2) 城市单位制度的弱化：a 私营部门有了就业机会；b 国有企业改革。"}, {"id": "L1-109", "lecture": 1, "page": 109, "title": "Employees (10,000)", "section": "改革开放后的法治建设", "source": "Employees (10,000)\n109", "knowledge": "图表页：就业人数变化（单位：万人）——国有部门与私营/其他部门就业的此消彼长。", "understand": "数据展示单位体制弱化的程度：私营部门就业快速扩张、国有单位就业占比下降。就业结构变化 = 社会结构变化 = 法律需求变化。 纵轴单位是万人（10,000），注意这不是百分比。比较不同所有制的就业曲线走势，交叉点即结构转折。", "image": "study-assets/lecture-1/slide-109.jpg", "extract": "就业人数（万人）。"}, {"id": "L1-110", "lecture": 1, "page": 110, "title": "Implications", "section": "改革开放后的法治建设", "source": "Implications:\r\rThe work-unit system is not longer sufficient to solve disputes among social actors.\n110", "knowledge": "影响：单位体制不再足以解决社会成员之间的纠纷。", "understand": "一句结论收束城市部分：旧机制失灵 → 需要正式法律渠道。与 L1-069（公社内解决）形成今昔对照。", "image": "study-assets/lecture-1/slide-110.jpg", "extract": "影响：单位制度不再足以解决社会主体之间的纠纷。"}, {"id": "L1-111", "lecture": 1, "page": 111, "title": "Citizens’ rise of awareness of rights", "section": "改革开放后的法治建设", "source": "Citizens’ rise of awareness of rights\r     e.g., suing the government before a law was made.\n111", "knowledge": "公民权利意识上升：例如在法律出台之前就起诉政府。", "understand": "社会变化的主观面：人们开始把法律当作维权工具，甚至超前于立法。权利意识兴起是诉讼增长的文化条件。", "image": "study-assets/lecture-1/slide-111.jpg", "extract": "公民权利意识上升——例：在一部法律出台之前就起诉政府。"}, {"id": "L1-112", "lecture": 1, "page": 112, "title": "New measures to strengthen the legal system", "section": "改革开放后的法治建设", "source": "New measures to strengthen the legal system:\rNew laws \r\rIn 1979, the National People’s Congress\rpassed seven laws at one time. \r\rThe National People’s Congress is an important organ responsible for lawmaking in China/最高立法机构\n112", "knowledge": "加强法制的新举措：1979 年全国人大一次通过七部法律；全国人大是重要立法机关。", "understand": "立法潮的起点：1979 年七法同立是标志性事件。后面几页逐一介绍这七部法律。", "image": "study-assets/lecture-1/slide-112.jpg", "extract": "加强法制的新举措：新法律——1979年全国人大一次通过七部法律；全国人大是重要的机构……"}, {"id": "L1-113", "lecture": 1, "page": 113, "title": "Peng Zhen/彭真 in NPC (1979-1987)", "section": "改革开放后的法治建设", "source": "Peng Zhen/彭真 in NPC (1979-1987)\n113", "knowledge": "人物页：彭真（1979–1987 年任全国人大常委会委员长）。", "understand": "立法重建的主持者。任期 1979–1987 与立法潮时段吻合。", "image": "study-assets/lecture-1/slide-113.jpg", "extract": "彭真在全国人大（1979–1987）。"}, {"id": "L1-114", "lecture": 1, "page": 114, "title": "1 People’s congress/人民代表大会", "section": "改革开放后的法治建设", "source": "1 People’s congress/人民代表大会\r(1). The Election Law of Deputies of the People’s Congresses \r(人民代表大会选举法)\rSelection of deputies \r\r(2). The Organization Law of Local People’s Congresses and Local Governments (地方人民代表大会和政府组织法)\rThe role of the people’s congress\n114", "knowledge": "七法之一：人民代表大会相关——《选举法》（人大代表选举）与《地方人大组织法》。", "understand": "七部法律的第一类：重建人大制度。选举法解决「代表怎么产生」，组织法解决「地方人大怎么运转」。", "image": "study-assets/lecture-1/slide-114.jpg", "extract": "1 人民代表大会：(1) 人大代表选举法——代表的产生；(2) 地方人大组织法……"}, {"id": "L1-115", "lecture": 1, "page": 115, "title": "2. Criminal issues", "section": "改革开放后的法治建设", "source": "2. Criminal issues \r(1). The Criminal Law (刑法)\rThe legal punishment in light of a conduct\r\r(2). The Criminal Procedure Law (刑事诉讼法)\r\rHow to proceed or process a case; regulating the procedures used by the legal departments, including the court.\n115", "knowledge": "七法之二：刑事领域——《刑法》（什么行为受何种刑罚）与《刑事诉讼法》（案件程序怎么走）。", "understand": "两部刑事法律的分工是常考点：刑法是实体法（定罪量刑），刑事诉讼法是程序法（侦查、起诉、审判流程）。", "image": "study-assets/lecture-1/slide-115.jpg", "extract": "2 刑事领域：(1) 刑法——对行为的法律惩罚；(2) 刑事诉讼法——案件如何进行、规范……"}, {"id": "L1-116", "lecture": 1, "page": 116, "title": "How did CCP rule the country without formal laws?", "section": "改革开放后的法治建设", "source": "How did CCP rule the country without formal laws?\r\rIt used regulations. The Criminal Law was not formally enacted until 1979. Before that, the government used directives to guide the punishment of criminals (e.g., drug dealers in the 1950s).\n116", "knowledge": "问题页：没有正式法律时中共如何治国？答案：靠指令和条例——1979 年前用 directives 指导办案。", "understand": "自问自答页：刑法 1979 年才正式颁布，此前 30 年靠政策指令治国（rule by directive）。这是工具主义法律观的直接证据。", "image": "study-assets/lecture-1/slide-116.jpg", "extract": "中共没有正式法律时如何治国？靠条例：刑法直到1979年才正式颁布；此前政府用指令指导……"}, {"id": "L1-117", "lecture": 1, "page": 117, "title": "After 1949, the Chinese government made a series of directives and regulations: e.…", "section": "改革开放后的法治建设", "source": "After 1949, the Chinese government made a series of directives and regulations: e.g., \rRule by directive \r1950: prohibition on the use of opium \r         prohibition on the export of historical relics (文物）\r1951：prohibition on fake currency \r            anti-revolution behavior \r 1952: corruption\n117", "knowledge": "1949 年后政府发布的一系列指令条例：如 1950 年禁止鸦片、禁止出口等。", "understand": "举例说明「以令代法」时期的治理文本。这些指令后来成为刑法的立法基础。", "image": "study-assets/lecture-1/slide-117.jpg", "extract": "1949年后中国政府发布了一系列指令和条例：例：以令治国——1950年：禁止使用鸦片；禁止出口……"}, {"id": "L1-118", "lecture": 1, "page": 118, "title": "These regulations became the base for the Criminal law", "section": "改革开放后的法治建设", "source": "These regulations became the base for the Criminal law: \r1. In 1950, a committee began the drafting of the criminal law\r2. In 1954-1957, 22 versions were completed, but was then stopped.\r3. 1962: resumed \r4. 1963, the 33rd version was completed.\r5. The Cultural Revolution started and the drafting was stopped again.\n118", "knowledge": "这些条例成为刑法基础：1950 年成立起草委员会；1954–1957 年完成 22 稿，随后搁置。", "understand": "刑法立法的曲折历程：22 稿说明起草之认真，搁置说明政治运动（反右、文革）对立法的中断。数字 22 是细节考点。 22 versions 是草稿数，时间跨度 1954–1957。重点是「完成却被搁置」的转折。", "image": "study-assets/lecture-1/slide-118.jpg", "extract": "这些条例成为刑法的基础：1 1950年一个委员会开始起草刑法；2 1954–1957年完成22稿，随后……"}, {"id": "L1-119", "lecture": 1, "page": 119, "title": "Liu Qingshan/刘青山", "section": "改革开放后的法治建设", "source": "Liu Qingshan/刘青山 \u000bZhang Zishan/张子善, 1952\nJoined the party in the 1930s\rOne ton of gold \rDivided views, Mao authorized the death penalty\n119", "knowledge": "案例：刘青山、张子善案（1952）——1930 年代入党的老干部贪污一吨黄金；对量刑有分歧，毛批准死刑。", "understand": "建国初期反腐第一案：用死刑处理高级干部腐败，显示运动式反腐的严厉，也说明当时量刑靠政治决定而非法定程序（因为刑法还没出台）。", "image": "study-assets/lecture-1/slide-119.jpg", "extract": "刘青山、张子善案（1952）：1930年代入党；一吨黄金；意见分歧，毛批准死刑。"}, {"id": "L1-120", "lecture": 1, "page": 120, "title": "3. Legal institutions", "section": "改革开放后的法治建设", "source": "3. Legal institutions \rThe Organization Law of the People’s Court \r(人民法院组织法)\r\rThe Organization Law of the People’s Procuracy \r(人民检察院组织法)\n120", "knowledge": "七法之三：机构类——《人民法院组织法》《人民检察院组织法》。", "understand": "重建两大司法机构的组织依据。与 L1-075 的三大机构对应（公安属行政系统，另有管理法规）。", "image": "study-assets/lecture-1/slide-120.jpg", "extract": "3 法律机构：人民法院组织法；人民检察院组织法。"}, {"id": "L1-121", "lecture": 1, "page": 121, "title": "4. Economic", "section": "改革开放后的法治建设", "source": "4. Economic \rThe Sino-Foreign Joint Ventures Law \r(中外合资经营企业法)\r\rAttract foreign investment \rChina joined WTO in 2001\n121", "knowledge": "七法之四：经济类——《中外合资经营企业法》，为吸引外资；中国 2001 年加入 WTO。", "understand": "立法顺序透露改革逻辑：最先立的法之一是保护外资的——经济发展优先于一切。WTO（2001）是对外开放的里程碑年份。", "image": "study-assets/lecture-1/slide-121.jpg", "extract": "4 经济：中外合资经营企业法——吸引外资；中国2001年加入WTO。"}, {"id": "L1-122", "lecture": 1, "page": 122, "title": "第 122 页", "section": "改革开放后的法治建设", "source": "122", "knowledge": "（图片过渡页）", "understand": "无提取文字，为立法或开放主题的图片页。", "image": "study-assets/lecture-1/slide-122.jpg", "extract": "（本页无可提取文字，为图片页）"}, {"id": "L1-123", "lecture": 1, "page": 123, "title": "a. From 1978 to 1998, the National People’s Congress and its standing committee pa…", "section": "改革开放后的法治建设", "source": "a. From 1978 to 1998, the National People’s Congress and its standing committee passed 327 laws \rb. The State Council passed more than 1,000 stipulations \rc. The 30 provincial-level people’s congresses and their standing committees approved 4,200 local laws or stipulations.\rd. The departments of the State Council and local governments promulgated more than      5,000 administrative regulations.\n123", "knowledge": "立法规模：1978–1998 年全国人大及其常委会通过 327 部法律；国务院发布 1,000 多项行政法规；省级立法机关亦大量立法。", "understand": "数字说明立法重建的速度：二十年 327 部法律 + 超千项行政法规。法律体系从无到有的量化证据。 327 是法律数（人大口径），1,000+ 是行政法规数（国务院口径），注意立法主体不同、数量级不同；均为 1978–1998 累计。", "image": "study-assets/lecture-1/slide-123.jpg", "extract": "a 1978至1998年，全国人大及其常委会通过327部法律；b 国务院发布1,000多项法规；c 30个省级……"}, {"id": "L1-124", "lecture": 1, "page": 124, "title": "New institution building", "section": "改革开放后的法治建设", "source": "New institution building \r   More judges; lawyers; notary organizations; legal aid centers; mediation organizations,  arbitration committees; legal service offices (more details in subsequent lectures); law schools\r\rc. Efforts to promote legal awareness \rLegal education programs \rMore and more lawsuits are filed to the court.\n124", "knowledge": "新机构建设：更多法官、律师、公证组织、法律援助中心、调解组织、仲裁委员会、法律服务所。", "understand": "立法之外还要建机构、养队伍：七类法律职业/机构一起扩张，构成法律体系的「硬件」。细节在后续讲。", "image": "study-assets/lecture-1/slide-124.jpg", "extract": "新机构建设：更多法官、律师、公证组织、法律援助中心、调解组织、仲裁委员会、法律服务所（更多细节见……"}, {"id": "L1-125", "lecture": 1, "page": 125, "title": "Politics and law graduates (10,000)", "section": "改革开放后的法治建设", "source": "Politics and law graduates (10,000)\n125", "knowledge": "图表页：政法专业毕业生数量变化（单位：万人）。", "understand": "法律人才供给的增长曲线，印证法律职业体系的扩张。 纵轴单位是万人（10,000）。关注曲线的增长趋势和加速时间点（与 1978 后法制重建对应）。", "image": "study-assets/lecture-1/slide-125.jpg", "extract": "政法专业毕业生（万人）。"}, {"id": "L1-126", "lecture": 1, "page": 126, "title": "第 126 页", "section": "改革开放后的法治建设", "source": "126", "knowledge": "（图片过渡页/结尾页）", "understand": "无提取文字，Lecture 1 的收尾页。", "image": "study-assets/lecture-1/slide-126.jpg", "extract": "（本页无可提取文字，为图片页）"}, {"id": "L2-001", "lecture": 2, "page": 1, "title": "2. Legal institutions in China", "section": "中国法律机构与党政关系", "source": "2. Legal institutions in China\nThree branches of a state:\r(1) Legislature (立法)\r     e.g., Parliament, Assembly, Congress; law making \r(2) Executive (行政)\r      i.e., the government (e.g., the president; prime minister)\r(3) Judiciary (司法)\r      Administration of justice in the country\n1\n1", "knowledge": "国家的三权分支：1 立法（议会/人大——制定法律）；2 行政（政府——执行法律）；3 司法（法院——适用法律）。", "understand": "Lecture 2 开篇先立比较框架：现代国家权力的标准三分。后面讲中国体制时不断对照这个框架，找出国情的特殊性（如党凌驾于三者之上、司法不独立）。", "image": "study-assets/lecture-2/slide-001.jpg", "extract": "2 中国的法律机构。国家的三权分支：(1) 立法——如议会、代表大会、国会，制定法律；(2) 行政——即政府……"}, {"id": "L2-002", "lecture": 2, "page": 2, "title": "Administrative hierarchy in China", "section": "中国法律机构与党政关系", "source": "Administrative hierarchy in China\rCenter; province; city; county; township; village\r中央；省；市；县； 镇 （乡）\rThe number of provincial-level regions: 31\r(i.e., province, autonomous region, large city)\rThe number of cities: 332\rThe number of counties: 2,853\rThe number of townships: 40,466\rThe number of villages: 691,510\n2\n2", "knowledge": "中国行政层级：中央—省—市—县—乡镇—村。省级行政区共 31 个（省、自治区、直辖市）。", "understand": "五级政府架构是理解一切「地方干预司法」「属地管理」问题的基础。31 个省级单位是常识考点。", "image": "study-assets/lecture-2/slide-002.jpg", "extract": "中国的行政层级：中央—省—市—县—乡镇—村；省级行政区数量：31个（即省、自治区、直辖市……"}, {"id": "L2-003", "lecture": 2, "page": 3, "title": "Center", "section": "中国法律机构与党政关系", "source": "Center \r                  \r            Provincial \r                  \r                City\r                  \r        County/district\r                  \r           Township\r                  \r              Village\n3\n3", "knowledge": "层级图：中央 → 省 → 市 → 县/区 → 乡镇 → 村，逐级隶属。", "understand": "上一页的可视化。箭头向下表示领导/隶属关系，越往下权力越小、数量越多。 箭头方向 = 行政隶属方向（上级管下级）。这是一条单链结构，没有跨级箭头，体现单一制国家的垂直管理。", "image": "study-assets/lecture-2/slide-003.jpg", "extract": "中央 → 省 → 市 → 县/区 → 乡镇 → 村（逐级向下）"}, {"id": "L2-004", "lecture": 2, "page": 4, "title": "The people’s congress (人民代表大会): law making", "section": "中国法律机构与党政关系", "source": "The people’s congress (人民代表大会): law making \r\r(to be discussed in future lectures, not here)\n4\n4", "knowledge": "人民代表大会：立法机关（本讲不展开，后续讲次再讲）。", "understand": "提示页：人大作为立法机关的细节留待以后，本讲聚焦法律执行与司法机构。", "image": "study-assets/lecture-2/slide-004.jpg", "extract": "人民代表大会：立法（将在以后讲次讨论，本讲不展开）。"}, {"id": "L2-005", "lecture": 2, "page": 5, "title": "1. The party system", "section": "中国法律机构与党政关系", "source": "1. The party system: \rParty committee (党委): standing committee/常委会            \r\rcentral level (党中央); \rprovincial (省委)；\rcity-level (市委)；\rcounty-level (县委)；\rtownship level (乡镇党委); \rvillage branch (村支部)\n5\n5", "knowledge": "党的系统：各级党委（党中央、省委、市委、县委、乡镇党委、村支部），核心是常委会。", "understand": "中国体制的特殊性从这里开始：在政府层级之外有一套平行的党组织，且权力在常委会手中。党的层级与行政层级一一对应。", "image": "study-assets/lecture-2/slide-005.jpg", "extract": "1 党的系统：党委——常委会；中央（党中央）；省级（省委）；市级（市委）；县级（县委）；乡镇级（乡镇党委）；村级……"}, {"id": "L2-006", "lecture": 2, "page": 6, "title": "Party Boss at each level", "section": "中国法律机构与党政关系", "source": "Party Boss at each level \rGeneral party secretary (总书记); \rprovincial party secretary (省委书记)，\rcity party secretary (市委书记)，\rcounty party secretary (县委书记)，\rtownship party secretary (乡镇书记), \rvillage party secretary ( 村支书)\r\rThey are appointed\n6\n6", "knowledge": "各级的「党的一把手」：总书记、省委书记、市委书记、县委书记、乡镇党委书记、村支书。", "understand": "每一级真正的最高领导是党委书记而非行政首长。这套称谓体系是考试高频：general secretary → party secretary at each level。", "image": "study-assets/lecture-2/slide-006.jpg", "extract": "各级的党的一把手：总书记；省委书记；市委书记；县委书记；乡镇党委书记；村支书……"}, {"id": "L2-007", "lecture": 2, "page": 7, "title": "2. The government system（政府）", "section": "中国法律机构与党政关系", "source": "2. The government system（政府）: \rThe State Council (国务院)；\rprovincial government (省政府)；\rcity government (市政府)；\rcounty government (县政府)；\r\rtownship government (乡镇政府); \r(not there before CCP) \rvillage authority (村组织) (not a level of formal government)\n7\n7", "knowledge": "政府系统：国务院、省政府、市政府、县政府、乡镇政府。", "understand": "行政首长序列，与党的系统平行。注意括号提示：乡镇政府在历史上并非一直存在。", "image": "study-assets/lecture-2/slide-007.jpg", "extract": "2 政府系统：国务院；省政府；市政府；县政府；乡镇政府（以前没有……"}, {"id": "L2-008", "lecture": 2, "page": 8, "title": "Boss", "section": "中国法律机构与党政关系", "source": "Boss\rChairman (主席)，\rpremier (总理) , \rprovincial governor (省长)，\rmayor (市长)，\rcounty magistrate (县长)，\rtownship head (乡长), \rvillage head (村长，村委会主任)\rSelected by the party, approved by the people’s congress at each level (village head is an exception).\n8\n8", "knowledge": "各级行政首长：主席、总理、省长、市长、县长、乡长、村长（村委会主任）——由党挑选、人大批准。", "understand": "关键句在末尾：Selected by the party, approved by the people's congress——人选由党定，人大走程序。一句话概括党管干部原则。", "image": "study-assets/lecture-2/slide-008.jpg", "extract": "一把手：主席、总理、省长、市长、县长、乡长、村长（村委会主任）；由党挑选，经……批准"}, {"id": "L2-009", "lecture": 2, "page": 9, "title": "3. The relationship between the party and the government", "section": "中国法律机构与党政关系", "source": "3. The relationship between the party and the government:\rThe party controls the government\rThe standing committee (党委常委会) of the party committee is the most powerful organization at each level.\rTop government leaders are in the standing committee of the party committee (常委委员)\rThe standing committee at the central level is the most powerful organization in China.\n9\n9", "knowledge": "党政关系：党控制政府；各级党委常委会是各级最有权力的机构。", "understand": "本讲核心命题之一：党政关系中党居主导。常委会（standing committee）是权力枢纽。后面的司法独立问题都源于这个结构。", "image": "study-assets/lecture-2/slide-009.jpg", "extract": "3 党和政府的关系：党控制政府；各级党委常委会是各级最有权力的组织……"}, {"id": "L2-010", "lecture": 2, "page": 10, "title": "Lega
