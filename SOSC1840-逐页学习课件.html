: "2012年被诉政府/机构（%）：乡镇5.35；县政府15.94；县级政府机构39.9；市政府3.61；市级政府机构24.31；省政府4.66；省级政府机构0.67；其他5.56；案件总数74,242件"}, {"id": "L6-017", "lecture": 6, "page": 17, "title": "w i t h d r a w a l   撤 诉   2 8 0 5 8   7 0 . 1 7 r e j e c ", "section": "行政诉讼的兴起与案例", "source": "17\n17\nw i t h d r a w a l   撤 诉   2 8 0 5 8   7 0 . 1 7 r e j e c t e d   驳 回 起 诉   7 0 9 8   1 7 . 7 5 F o r w a r d e d   移 送   1 2 9 4   3 . 2 4 c l o s e d   终 结   1 9 9   0 . 5 0 o t h e r s   其 他   3 1 8 2   7 . 9 6 m e d i a t i o n   赔 偿 调 解     1 5 3   0 . 3 8 T o t a l     3 9 9 8 4  \nModes of settlement 2012", "knowledge": "表格：2012 年行政诉讼结案方式——撤诉 28,058 件（70.17%）；驳回起诉 7,098（17.75%）；移送 1,294（3.24%）；终结 199（0.50%）；其他 3,182（7.96%）；赔偿调解 153（0.38%）；合计 39,984 件。", "understand": "最震撼的数据：70% 撤诉——原告七成中途退出。为什么撤诉这么多？L6-024、025 会讲（政府纠错私了 + 施压）。", "image": "study-assets/lecture-6/slide-017.jpg", "extract": "2012年结案方式：撤诉28,058（70.17%）；驳回起诉7,098（17.75%）；移送1,294（3.24%）；终结199（0.50%）；其他3,182（7.96%）；赔偿调解153（0.38%）；合计39,984件"}, {"id": "L6-018", "lecture": 6, "page": 18, "title": "Forwarded:", "section": "行政诉讼的兴起与案例", "source": "18\nForwarded: \nWhen a court (A) reviews a case application, it finds that it does not have the legal jurisdiction over the case; it then forwards the case to the court that has the jurisdiction.\n\nIf the court (B) to which the case is forwarded to does not believe that it has the jurisdiction, it can only apply to the upper-level court (H) for designating a court; \n\nCourt B cannot forward the case to another court on its own.", "knowledge": "移送：法院 A 审查立案申请时发现无管辖权，将案件移送有管辖权的法院；受移送法院 B 若也认为无管辖权，只能报请上级法院指定管辖，不得自行再移送。", "understand": "程序知识页：移送管辖的规则（只能移一次）。防止法院之间踢皮球。", "image": "study-assets/lecture-6/slide-018.jpg", "extract": "移送：法院A审查立案申请时发现无管辖权，将案件移送有管辖权的法院；受移送法院B若也认为无管辖权，只能报请上级法院（H）指定管辖，不得自行再移送"}, {"id": "L6-019", "lecture": 6, "page": 19, "title": "Ruling/判决", "section": "行政诉讼的兴起与案例", "source": "19\n19\nRuling/判决\nu p h e l d     维 持   1 6 1 8 3   5 1 . 4 a p p e a l   r e j e c t e d   驳 回 诉 讼 请 求   7 8 8 7   2 5 . 0 5 r e v o k e d   撤 消   4 4 7 8   1 4 . 2 2 c o n f i r m e d   n o t   l e g a l   违 法 或 无 效   1 2 0 8   3 . 8 4 n e e d   t o   p e r f o r m   履 行 法 定 职 责   1 0 7 4   3 . 4 1 c o n f i r m e d   b e i n g   l e g a l   合 法 有 效   2 6 2   0 . 8 3 c o m p e n s a t i o n   赔 偿   1 4 9   0 . 4 7 C h a n g e d   变 更   1 3 5   0 . 4 3 n o   c o m p e n s a t i o n   不 予 赔 偿   1 0 8   0 . 3 4", "knowledge": "表格：行政判决结果——维持 16,183 件（51.4%）；驳回诉讼请求 7,887（25.05%）；撤销 4,478（14.22%）；确认违法或无效 1,208（3.84%）；责令履行法定职责 1,074（3.41%）；确认合法有效 262（0.83%）；赔偿 149（0.47%）；变更 135（0.43%）；不予赔偿 108（0.34%）。", "understand": "判决结构：维持政府决定 + 驳回请求合计约 76%——原告完全胜诉（撤销、确认违法、责令履行、赔偿）约 22%。政府「赢」了大多数进入判决的案子。", "image": "study-assets/lecture-6/slide-019.jpg", "extract": "判决结果：维持16,183（51.4%）；驳回诉讼请求7,887（25.05%）；撤销4,478（14.22%）；确认违法或无效1,208（3.84%）；责令履行法定职责1,074（3.41%）；确认合法有效262（0.83%）；赔偿149（0.47%）；变更135（0.43%）；不予赔偿108（0.34%）"}, {"id": "L6-020", "lecture": 6, "page": 20, "title": "(3) Some agencies are more frequently sued than others", "section": "行政诉讼的兴起与案例", "source": "20\n20\n(3) Some agencies are more frequently sued than others \n\n\nPolice bureau; land management department; agencies in charge of city construction", "knowledge": "(3) 某些机构被诉得更多：公安局、土地管理部门、城建部门。", "understand": "被诉高频机构：公安（人身自由）、土地（财产）、城建（拆迁）——都与公民最重要的人身财产权利直接相关。", "image": "study-assets/lecture-6/slide-020.jpg", "extract": "(3) 某些机构被诉得更多：公安局、土地管理部门、城建部门"}, {"id": "L6-021", "lecture": 6, "page": 21, "title": "The settlement of administrative litigations", "section": "行政诉讼的兴起与案例", "source": "21\n21\nThe settlement of administrative litigations\n(1) Uphold the decision of the government or its agencies. \n\nIn July 1996, Jack, an American student who studied in China got drunk in a restaurant and smashed the windows and beat a waitress. The security guards sent him to a police station. The city public security bureau detained him for seven days and required him to pay 930 yuan in fine. Jack applied to the higher-level public security bureau for an administrative reconsideration, and was rejected.", "knowledge": "行政诉讼的结果类型（1）：维持政府或其机构的决定。例：1996 年 7 月美国学生 Jack 在餐馆醉酒砸窗、打服务员，被市公安局拘留 7 天并罚款 930 元；Jack 向上级公安机关申请行政复议，被驳回。", "understand": "结果类型一：维持。外国人案例说明复议通常支持原机关。", "image": "study-assets/lecture-6/slide-021.jpg", "extract": "行政诉讼的结果：(1) 维持政府或其机构的决定。例：1996年7月，美国学生Jack在餐馆醉酒砸窗、打服务员，被保安送到派出所；市公安局拘留他7天并罚款930元；Jack向上级公安机关申请行政复议，被驳回"}, {"id": "L6-022", "lecture": 6, "page": 22, "title": "(2). Cancel or cancel partially the specific administrative ", "section": "行政诉讼的兴起与案例", "source": "22\n22\n(2). Cancel or cancel partially the specific administrative act.       \n\nRequire a defendant to perform its duty. \ne.g., the transportation agency imposes unreasonable fines on people.", "knowledge": "（2）撤销或部分撤销具体行政行为；要求被告履行职责。例：交通管理部门对人们乱罚款。", "understand": "结果类型二和三：撤销违法行政行为、责令履职（针对不作为）。", "image": "study-assets/lecture-6/slide-022.jpg", "extract": "(2) 撤销或部分撤销具体行政行为；要求被告履行职责。例：交通管理部门对人们乱罚款"}, {"id": "L6-023", "lecture": 6, "page": 23, "title": "(3) Refused", "section": "行政诉讼的兴起与案例", "source": "23\n23\n(3) Refused \ne.g., \nIn the end of 2000, the Ministry of Railway decided to increase the prices of the train tickets. A lawyer who bought train tickets in January 2001 applied to the Ministry of Railway for an administrative reconsideration. The lawyer believed that the price increase was illegal because it had not been approved by the State Council or a public hearing. \nThe ministry rejected his application and upheld its decision of price increase. The lawyer then lodged a lawsuit against the Ministry of Railway to a court in Beijing, and was rejected.", "knowledge": "（3）驳回。例：2000 年底铁道部决定提高火车票价；一名 2001 年 1 月购票的律师向铁道部申请行政复议，认为涨价未经国务院批准或听证、属违法；铁道部驳回其申请并维持涨价决定；律师又向北京某法院起诉铁道部，被驳回。", "understand": "律师诉铁道部涨价案：抽象行政行为（票价政策）难以通过诉讼挑战的典型案例。", "image": "study-assets/lecture-6/slide-023.jpg", "extract": "(3) 驳回。例：2000年底铁道部决定提高火车票价；一名2001年1月购票的律师向铁道部申请行政复议，认为涨价未经国务院批准或听证、属违法；铁道部驳回其申请并维持涨价决定；律师又向北京某法院起诉铁道部，被驳回"}, {"id": "L6-024", "lecture": 6, "page": 24, "title": "(4) Withdrawal", "section": "行政诉讼的兴起与案例", "source": "24\n24\n(4) Withdrawal \nThe plaintiff withdraws the lawsuit from the court.\ne.g., \nA local government decided to sell a hotel, and more than 100 workers lost their jobs. But the compensation they received was too low. 50 of them lodged a lawsuit against the government for violating the stipulation on compensation for retrenched workers. The court was worried that the lawsuit, if accepted, would affect the image of the government. So it persuaded the workers to withdraw the case and succeeded. “The case was highly praised by the local government.”", "knowledge": "（4）撤诉：原告撤回诉讼。例：某地方政府决定出售一家酒店，100 多名工人失业，但补偿太低；50 名工人起诉政府违反下岗工人补偿规定；法院担心受理会影响政府形象，说服工人撤诉并获成功——「该案受到当地政府高度赞扬」。", "understand": "撤诉的阴暗面：法院为照顾政府形象而劝原告撤诉，还因此受表扬——司法屈从行政的直接证据。呼应 70% 撤诉率。", "image": "study-assets/lecture-6/slide-024.jpg", "extract": "(4) 撤诉：原告撤回诉讼。例：某地方政府决定出售一家酒店，100多名工人失业，但补偿太低；50名工人起诉政府违反下岗工人补偿规定；法院担心受理会影响政府形象，说服工人撤诉并获成功——「该案受到当地政府高度赞扬」"}, {"id": "L6-025", "lecture": 6, "page": 25, "title": "Why is withdrawal so commonly used?", "section": "行政诉讼的兴起与案例", "source": "25\n25\nWhy is withdrawal so commonly used?\n(1) The government or its agencies correct their conduct and avoid going to the court to “save their faces”\n(2) They place pressure on the plaintiffs and force them to withdraw\n\nWhy are government agencies sued?\n(1) Violating the rights of citizens or other social actors \n(2) Failing to protect the rights of citizens of other social actors or “inaction”", "knowledge": "撤诉为何普遍？(1) 政府或机构纠正行为、避免出庭以「保面子」；(2) 对原告施压迫使其撤诉。政府机构为何被诉？(1) 侵犯公民或社会主体的权利；(2) 未能保护公民或社会主体的权利（不作为）。", "understand": "撤诉的两种机制：良性（政府纠错私了）与恶性（施压）。被诉原因的二分（作为侵权 + 不作为）是考点。", "image": "study-assets/lecture-6/slide-025.jpg", "extract": "撤诉为何普遍？(1) 政府或机构纠正行为、避免出庭以「保面子」；(2) 对原告施压迫使其撤诉。政府机构为何被诉？(1) 侵犯公民或社会主体的权利；(2) 未能保护公民或社会主体的权利（不作为）"}, {"id": "L6-026", "lecture": 6, "page": 26, "title": "Happy stories:", "section": "行政诉讼的兴起与案例", "source": "26\n26\nHappy stories: \nFrom 1990 to 2001, litigants won 31.3 percent of administrative litigations against state agencies though in different ways\n  \n F r e q u e n c y   ( % ) T h e   c o u r t s ’   r e v o k i n g   a d m i n i s t r a t i v e   c o n d u c t   1 4 . 9   P l a i n t i f f s ’   w i t h d r a w a l   a f t e r   g o v e r n m e n t   a g e n c i e s   c o r r e c t e d   t h e i r   c o n d u c t   1 2 . 9 S t a t e   a g e n c i e s ’   f u l f i l l m e n t   o f   t h e i r   r e s p o n s i b i l i t i e s   a s   r e q u i r e d   b y   t h e   c o u r t s   2 . 5 T h e   c o u r t s ’   c h a n g i n g   t h e   c o n d u c t   o f   s t a t e   a g e n c i e s   . 9", "knowledge": "好消息：1990–2001 年，行政诉讼原告以不同方式胜诉的比例为 31.3%——法院撤销行政行为 14.9%；政府机构纠正行为后原告撤诉 12.9%；法院判决责令国家机构履职 2.5%；法院变更国家机构行为 0.9%。", "understand": "「31.3% 胜诉率」的计算方式：把「政府纠错后撤诉」也算原告胜诉（12.9%）——说明高撤诉率中有一部分实际是原告达到了目的。", "image": "study-assets/lecture-6/slide-026.jpg", "extract": "好消息：1990–2001年，行政诉讼原告以不同方式胜诉31.3%：法院撤销行政行为14.9%；政府机构纠正行为后原告撤诉12.9%；法院判决责令国家机构履职2.5%；法院变更国家机构行为0.9%"}, {"id": "L6-027", "lecture": 6, "page": 27, "title": "Case 1", "section": "行政诉讼的兴起与案例", "source": "27\n27\nCase 1\n\nIn Shenyang of Liaoning province, local government agencies committed 39 law or rule violations against a private supermarket between 2000 and 2002. \n\nAbout 11 agencies continually confiscated its goods, imposed fines, and collected unauthorized fees on the basis of the departmental regulations. \n\nThe manager of the market had tried to cultivate good relations with these organs by serving cadres feasts and inviting them to entertainments. \n\nBut soon she found that it not only wasted a large amount of money but also consumed much time. She then turned to the law for protection.", "knowledge": "案例一（1/2）：2000–2002 年沈阳一私营超市遭地方政府机构 39 次违法违规侵害；约 11 个机构以部门规章为由持续没收货物、罚款、乱收费；经理起初宴请娱乐拉拢关系，但发现既费钱又耗时，转而寻求法律保护……", "understand": "案例展示「关系策略 vs 法律策略」的转换：请客送礼成本太高，法律反而更便宜。39 次侵害、11 个机构说明基层乱执法的密度。", "image": "study-assets/lecture-6/slide-027.jpg", "extract": "案例一：2000–2002年，沈阳一私营超市遭地方政府机构39次违法违规侵害；约11个机构以部门规章为由持续没收货物、罚款、乱收费；经理起初通过宴请娱乐拉拢关系，但发现既费钱又耗时，转而寻求法律保护……"}, {"id": "L6-028", "lecture": 6, "page": 28, "title": "A local traffic station under the traffic bureau frequently ", "section": "行政诉讼的兴起与案例", "source": "28\n28\nA local traffic station under the traffic bureau frequently held the truck of her supermarket without just reasons. Usually, the owner of a vehicle paid a 3,000 to 5,000 yuan fine to get it back, in addition to offering gifts to cadres. \nThis manager filed a lawsuit against the traffic bureau. \nThe case was tabled because the traffic station was dismantled after its misconduct was disclosed by the central television. \nFrom then on, whenever her truck was held, she would use the indictment to get it back, and the indictment became a pass permit. \nIn the end she posted the indictment in the truck and it was never held again.", "knowledge": "案例一（2/2）：交通局下属一交通站常无故扣超市的货车，车主通常交 3,000–5,000 元罚款加送礼才能取回；经理起诉交通局；因央视曝光该站恶行后被撤销，案件搁置；此后每当货车被扣，她就拿出起诉书要回货车——起诉书成了「通行证」，最后她把起诉书贴在……", "understand": "「起诉书当通行证」：法律的威慑功能——不必真的打完官司，起诉的威胁本身就能阻止侵害。这是「在法律阴影下」的又一表现。", "image": "study-assets/lecture-6/slide-028.jpg", "extract": "当地交通局下属一交通站常无故扣她超市的货车，车主通常交3,000–5,000元罚款加送礼才能取回；经理起诉交通局；因该站恶行被央视曝光后被撤销，案件搁置；此后每当货车被扣，她就拿出起诉书要回货车——起诉书成了通行证；最后她把起诉书贴在……"}, {"id": "L6-029", "lecture": 6, "page": 29, "title": "Case 2", "section": "行政诉讼的兴起与案例", "source": "29\n29\nCase 2\nA 19-year-old girl in a county of Shaanxi province was arrested by a local police station under the charge of prostitution on 9 January 2001. The county public bureau then issued a verdict announcing a 15-day detention of the girl. But in that verdict, the gender of the girl was indicated as male, and the date of the issuance of verdict was 9 February 2001, or one month later than the actual date. The girl then had several medical examinations and it turned out that she was still a virgin. The girl then sued the county public security bureau, won the case, and received 9,100 yuan in compensation.", "knowledge": "案例二：2001 年 1 月 9 日陕西某县 19 岁女孩被派出所以「卖淫」为由拘捕，县公安局裁决拘留 15 天；但裁决书上性别写成「男」，日期写成 2001 年 2 月 9 日（晚于实际日期一个月）；女孩多次体检证明仍是处女；她起诉县公安局并胜诉，获赔 9,100 元。", "understand": "麻旦旦案：裁决书的低级错误（性别男、日期错）暴露执法的粗糙，医学证据（处女）直接推翻指控。程序瑕疵成为胜诉关键。", "image": "study-assets/lecture-6/slide-029.jpg", "extract": "案例二：2001年1月9日，陕西某县19岁女孩被派出所以「卖淫」为由拘捕，县公安局裁决拘留15天；但裁决书上性别写成「男」，日期写成2001年2月9日（晚于实际日期一个月）；女孩多次体检证明仍是处女；她起诉县公安局并胜诉，获赔9,100元"}, {"id": "L6-030", "lecture": 6, "page": 30, "title": "Case 3", "section": "行政诉讼的兴起与案例", "source": "30\n30\nCase 3\nIn Sichuan province in 1998, a peasant was harassed by a person with mental problems for four consecutive days. He requested help from the local police department but was denied. One night when the peasant was chased by that person with a knife, he had no choice but to jump out of his building and disabled himself. The peasant then lodged a lawsuit against the police department for its inaction, partly won the case, and received 19,750 yuan in compensation.", "knowledge": "案例三：1998 年四川一农民连续四天被精神病人骚扰，向当地警方求助被拒；一晚被持刀追赶，无奈跳楼致残；农民起诉警方不作为，部分胜诉，获赔 19,750 元。", "understand": "告「不作为」的案例：警察的消极不履职也可被诉并赔偿——行政诉讼不仅针对乱作为。", "image": "study-assets/lecture-6/slide-030.jpg", "extract": "案例三：1998年四川一农民连续四天被精神病人骚扰，向当地警方求助被拒；一晚被持刀追赶，无奈跳楼致残；农民起诉警方不作为，部分胜诉，获赔19,750元"}, {"id": "L6-031", "lecture": 6, "page": 31, "title": "Case 4", "section": "行政诉讼的兴起与案例", "source": "31\n31\nCase 4\nIn Anhui, Zhang, a 23-year old student, participated in the recruitment test for government employees in 2003, and got the highest score. But later he had hepatitis B. He was not recruited. Zhang lodged a lawsuit against the government agency and won first trial. The government agency appealed to the intermediate court which rejected the appeal.", "knowledge": "案例四：安徽 23 岁学生张某 2003 年公务员考试笔试第一，后因查出乙肝未被录取；张某起诉该政府机构并一审胜诉；该机构上诉，中院驳回上诉。", "understand": "张先著案：「乙肝歧视第一案」——就业歧视通过行政诉讼获得救济的标志性案例。", "image": "study-assets/lecture-6/slide-031.jpg", "extract": "案例四：安徽23岁学生张某2003年公务员考试笔试第一，后因查出乙肝未被录取；张某起诉该政府机构并一审胜诉；该机构上诉，中院驳回上诉"}, {"id": "L6-032", "lecture": 6, "page": 32, "title": "Peasants’ use of lawsuits against the government", "section": "农民告政府", "source": "32\n32\nPeasants’ use of lawsuits against the government \n\n\n(1) Suing the government is still not a common option by peasants", "knowledge": "农民用诉讼告政府：(1) 对农民来说告政府仍不是常见选择。", "understand": "转入农民专题。先立论：农民很少告政府——下一页数据支持。", "image": "study-assets/lecture-6/slide-032.jpg", "extract": "农民用诉讼告政府：(1) 告政府对农民仍不是常见选择"}, {"id": "L6-033", "lecture": 6, "page": 33, "title": "P e a s a n t s ’   c h o i c e   S e t t l i n g   d i s p ", "section": "农民告政府", "source": "33\n33\nP e a s a n t s ’   c h o i c e   S e t t l i n g   d i s p u t e s   w i t h   s t a t e   a c t o r s   ( % )   S e t t l i n g   d i s p u t e s   w i t h   o t h e r   p e o p l e   \n ( % ) A p p r o a c h i n g   l e a d e r s   c o n c e r n e d     5 1 . 1   4 1 . 5 U s i n g   p e r s o n a l   c o n n e c t i o n s   t o   m e d i a t e   2 0 . 8   4 2 . 7 A p p r o a c h i n g   l a w y e r s   o r   c o u r t s       9 . 9     6 . 2 A p p r o a c h   p e a s a n t   o r g a n i z a t i o n s       6 . 0           . 4 T a k i n g   n o   a c t i o n         5 . 0     2 . 8 R e p o r t i n g   t o   m e d i a       2 . 0     3 . 7 U s i n g   f o r c e   w i t h   t h e   h e l p   o f   r e l a t i v e s                                                             2 . 7 M i s c e l l a n e o u s                                 5 . 2   T o t a l                       1 0 0                         1 0 0\nPeasants’ Choice of Settling Disputes in Shanxi Province (N= 745)", "knowledge": "表格：山西农民解决纠纷的选择（N=745）——与国家机关的纠纷：找相关领导 51.1%、托关系调解 20.8%、找律师或法院 9.9%、找农民组织 6.0%、不行动 5.0%、报媒体 2.0%……；与他人的纠纷：找领导 41.5%、托关系 42.7%、找律师或法院 6.2%……", "understand": "农民解纷偏好：找领导过半，走法律的仅约十分之一。官民纠纷中「找领导」比法律高 5 倍——人治路径依赖在农村最强。", "image": "study-assets/lecture-6/slide-033.jpg", "extract": "山西农民解决纠纷的选择（N=745）：与国家机关的纠纷——找相关领导51.1%、托关系调解20.8%、找律师或法院9.9%、找农民组织6.0%、不行动5.0%、报媒体2.0%、借亲属用武力……；与他人的纠纷——找领导41.5%、托关系42.7%、找律师或法院6.2%、找农民组织0.4%、不行动2.8%、报媒体3.7%"}, {"id": "L6-034", "lecture": 6, "page": 34, "title": "(2) Peasants’ awareness of rights is on the rise", "section": "农民告政府", "source": "34\n34\n(2) Peasants’ awareness of rights is on the rise \n\na. “Peasants’ courage to resist is the fault of the legal education.” \nb. A township head in Hunan province said, “China has done two wrong things. One is the enactment of the Administrative Litigation Law and the other is the denial of the township’s right to arrest peasants.”", "knowledge": "(2) 农民权利意识在上升：a「农民敢反抗是普法教育的错」；b 湖南一乡长说「中国做错了两件事：一是颁布《行政诉讼法》，二是取消乡镇拘留农民的权力」。", "understand": "官员的两句抱怨从反面证明普法与行政诉讼的实效——农民懂得用法律了，官员不习惯了。这两句引语是生动考点。", "image": "study-assets/lecture-6/slide-034.jpg", "extract": "(2) 农民权利意识在上升：a「农民敢反抗是普法教育的错」；b 湖南一乡长说：「中国做错了两件事：一是颁布《行政诉讼法》，二是取消乡镇拘留农民的权力。」"}, {"id": "L6-035", "lecture": 6, "page": 35, "title": "Reasons for peasants’ lawsuits:", "section": "农民告政府", "source": "35\n35\n\nReasons for peasants’ lawsuits:\n\n(1) Peasants’ financial burdens in the past\n(2) Village elections \n(3) Land use\n(4) Others", "knowledge": "农民诉讼的原因：(1) 过去农民的经济负担；(2) 村委会选举；(3) 土地使用；(4) 其他。", "understand": "农民告政府的四大案由，接下来分别展开：负担、选举、土地。", "image": "study-assets/lecture-6/slide-035.jpg", "extract": "农民诉讼的原因：(1) 过去农民的经济负担；(2) 村委会选举；(3) 土地使用；(4) 其他"}, {"id": "L6-036", "lecture": 6, "page": 36, "title": "The tricky part of the Chinese political system:", "section": "农民告政府", "source": "36\n36\nThe tricky part of the Chinese political system:\n\nCentral government vs. local government \n\nFiscal arrangement in China:", "knowledge": "中国政治体制的微妙之处：中央政府 vs 地方政府；中国的财政安排。", "understand": "过渡页：农民负担问题的根源在央地财政关系——下一页展开。", "image": "study-assets/lecture-6/slide-036.jpg", "extract": "中国政治体制的微妙之处：中央政府 vs 地方政府；中国的财政安排"}, {"id": "L6-037", "lecture": 6, "page": 37, "title": "Local governments: share/responsibilities", "section": "农民告政府", "source": "37\n37\nLocal governments: share/responsibilities", "knowledge": "图表页：地方政府的分成/责任。", "understand": "财政分权示意图：地方政府承担大量支出责任但财力不足——逼出乱收费。", "image": "study-assets/lecture-6/slide-037.jpg", "extract": "地方政府：分成/责任（图示）"}, {"id": "L6-038", "lecture": 6, "page": 38, "title": "Pressure of revenue generation on local officials:", "section": "农民告政府", "source": "38\n38\nPressure of revenue generation on local officials:\nDeveloping economy \nExtracting revenue from peasants", "knowledge": "地方官员的创收压力：发展经济；向农民伸手。", "understand": "两条创收路径：发展经济是正路，向农民收费是捷径——农民负担的动机根源。", "image": "study-assets/lecture-6/slide-038.jpg", "extract": "地方官员的创收压力：发展经济；从农民身上收钱"}, {"id": "L6-039", "lecture": 6, "page": 39, "title": "An introduction to peasants’ financial burdens in China; bef", "section": "农民告政府", "source": "39\n39\nAn introduction to peasants’ financial burdens in China; before 2004\n\nTypes: \nState tax\nTownship-retained fee and village-retained fee\nObligatory work\nOther fees", "knowledge": "2004 年前农民负担的种类：国家税；乡统筹、村提留；义务工；其他费用。", "understand": "农民负担的四类构成是考点：税（合法）+ 统筹提留（制度性）+ 义务工 + 乱收费。2006 年农业税取消前的背景。", "image": "study-assets/lecture-6/slide-039.jpg", "extract": "2004年前中国农民负担简介——种类：国家税；乡统筹费、村提留费；义务工；其他费用"}, {"id": "L6-040", "lecture": 6, "page": 40, "title": "Grassroots government and revenue generation in China: burde", "section": "农民告政府", "source": "40\n40\nGrassroots government and revenue generation in China: burden shifting \n\nPeasants’ resistance:\nProtests\nDeadly confrontation \nLawsuits", "knowledge": "基层政府与创收：负担转嫁。农民的反抗：抗议、流血冲突、诉讼。", "understand": "负担转嫁链条与农民的三种反应：从抗议到暴力到诉讼——诉讼是制度化程度最高的反应。", "image": "study-assets/lecture-6/slide-040.jpg", "extract": "基层政府与创收：负担转嫁。农民的反抗：抗议；流血冲突；诉讼"}, {"id": "L6-041", "lecture": 6, "page": 41, "title": "Y e a r   C a s e s   D e a t h s   o f   P e a s a n t s   ", "section": "农民告政府", "source": "41\n41\nY e a r   C a s e s   D e a t h s   o f   P e a s a n t s   C a d r e s   P u n i s h e d 1 9 9 2   1 7   1 7   - - 1 9 9 3   3 0   - -   - - 1 9 9 4       9       9   - - 1 9 9 5   1 3   1 2   - - 1 9 9 6   2 6   2 6   - - 1 9 9 7   1 6   - -   - - 1 9 9 8   1 6   - -   - - 1 9 9 9         8         8       4 2 2 0 0 0   1 9   - -   - - 2 0 0 1   2 6   - -   - - 2 0 0 2   1 3   1 3   1 2 6 2 0 0 3   1 5   1 4   1 4 2 2 0 0 4     3     3       2 9", "knowledge": "表格：历年因负担引发的冲突——案件数、农民死亡数、被处分干部数：1992 年 17 案/17 死；1993 年 30 案；1994 年 9 案/9 死；1995 年 13 案/12 死；1996 年 26 案/26 死；1997 年 16 案；1998 年 16 案；1999 年 8 案/8 死/42 人被处分；2000 年 19 案；2001 年 26 案；2002 年 13 案/13 死/126 人；2003 年 15 案/14 死/142 人；2004 年 3 案/3 死/29 人。", "understand": "农民负担引发冲突的死伤数据：每年都有农民因此死亡。注意 1999 年起干部开始被处分（中央施压），2004 年骤降至 3 起——农业税改革前夕。", "image": "study-assets/lecture-6/slide-041.jpg", "extract": "历年冲突：1992年17案/17死；1993年30案；1994年9案/9死；1995年13案/12死；1996年26案/26死；1997年16案；1998年16案；1999年8案/8死/42名干部被处分；2000年19案；2001年26案；2002年13案/13死/126人；2003年15案/14死/142人；2004年3案/3死/29人"}, {"id": "L6-042", "lecture": 6, "page": 42, "title": "Legal basis for lawsuits:", "section": "农民告政府", "source": "42\n42\nLegal basis for lawsuits: \n\n   Township-retained fee and village-retained fee (no more than 5 percent of peasants’ income of the previous year). \n\nBut this 5%-limit is not applicable to other types of fees.", "knowledge": "诉讼的法律依据：乡统筹、村提留不得超过上年农民收入的 5%；但 5% 上限不适用于其他种类的收费。", "understand": "5% 规则：有法可依但留了漏洞——其他收费无上限，农民依 5% 规则起诉统筹提留，但乱收费部分难以起诉。", "image": "study-assets/lecture-6/slide-042.jpg", "extract": "诉讼的法律依据：乡统筹费、村提留费不得超过上年农民收入的5%；但5%上限不适用于其他种类的收费"}, {"id": "L6-043", "lecture": 6, "page": 43, "title": "(1). According to an incomplete account of administrative li", "section": "农民告政府", "source": "43\n43\n(1). According to an incomplete account of administrative litigations in 15 provinces, peasants lodged 12,000 lawsuits against governments or state agencies for fee collection between 1996 and 1998.\n(2). In Heilongjiang province in 1996, the courts accepted more than 2,000 cases of peasant burdens. \n(3) In 1999, about 12,670 peasants in a township of Shaanxi province sued the township government for unauthorized fee collection and won the case.", "knowledge": "农民负担诉讼的规模：(1) 据 15 省不完全统计，1996–1998 年农民因收费问题起诉政府 12,000 件；(2) 黑龙江 1996 年法院受理农民负担案件 2,000 多件；(3) 1999 年陕西某乡约 12,670 名农民起诉乡政府乱摊派并胜诉。", "understand": "三个数据点：12,000 件（15 省三年）、2,000 件（一省一年）、12,670 人（一乡一案）——农民集体诉讼的规模可观。", "image": "study-assets/lecture-6/slide-043.jpg", "extract": "(1) 据15省不完全统计，1996–1998年农民因收费问题起诉政府或国家机构12,000件；(2) 黑龙江1996年法院受理农民负担案件2,000多件；(3) 1999年陕西某乡约12,670名农民起诉乡政府乱摊派并胜诉"}, {"id": "L6-044", "lecture": 6, "page": 44, "title": "Disputes over village elections:", "section": "农民告政府", "source": "44\n44\nDisputes over village elections: \n\n\nDifferent parties have different interests in village elections:\n\na. Township leaders (can be reluctant)\nb. Villagers", "knowledge": "村委会选举纠纷：不同主体在村选举中利益不同——a 乡镇领导（可能不情愿）；b 村民。", "understand": "选举纠纷的利益结构：乡镇想控制选举结果（便于收税、执行政策），村民想选自己人——冲突由此产生。", "image": "study-assets/lecture-6/slide-044.jpg", "extract": "村委会选举纠纷：不同主体在村选举中利益不同——a 乡镇领导（可能不情愿）；b 村民"}, {"id": "L6-045", "lecture": 6, "page": 45, "title": "Power structure in Chinese villages:", "section": "农民告政府", "source": "45\n45\nPower structure in Chinese villages:\n\nThe village party secretary\nThe village director \n\nThe relationship between the village authority and the township government.", "knowledge": "中国村庄的权力结构：村党支部书记；村委会主任；村组织与乡镇政府的关系。", "understand": "村两委格局：书记（党）与主任（选）。谁说了算？下一页数据回答。", "image": "study-assets/lecture-6/slide-045.jpg", "extract": "中国村庄的权力结构：村党支部书记；村委会主任；村组织与乡镇政府的关系"}, {"id": "L6-046", "lecture": 6, "page": 46, "title": "Is township recommendation better than sea election? (115 to", "section": "农民告政府", "source": "46\n46\nIs township recommendation better than sea election? (115 township officials)", "knowledge": "图表页：乡镇推荐与海选哪个更好？（115 名乡镇官员）", "understand": "乡镇官员对选举方式的偏好调查——看官员是否信任直接选举（预期：偏好可控的推荐制）。", "image": "study-assets/lecture-6/slide-046.jpg", "extract": "乡镇推荐是否比海选更好？（115名乡镇官员的调查图）"}, {"id": "L6-047", "lecture": 6, "page": 47, "title": "Village directors’ view of the relationship with the village", "section": "农民告政府", "source": "47\n47\nVillage directors’ view of the relationship with the village party secretary (N  111)\n  F r e q u e n c y   ( % ) 1 .   T h e   p a r t y   s e c r e t a r y   h a s   m o r e   p o w e r   b e c a u s e   s / h e   i s   t h e   c o r e   o f   t h e   p a r t y .   5 5 . 9 2 .   Y o u   h a v e   m o r e   p o w e r   t h a n   t h e   p a r t y   s e c r e t a r y   b e c a u s e   y o u   a r e   e l e c t e d .   1 5 . 3 3 .   T h e   p a r t y   s e c r e t a r y   h a s   m o r e   p o w e r   b e c a u s e   s / h e   c o n t r o l s   e c o n o m i c   r e s o u r c e s .   1 5 . 3 4 .   N o   a n s w e r   1 3 . 5 T o t a l   1 0 0 . 0", "knowledge": "表格：村主任眼中与村支书的关系（N=111）——支书权力更大，因为他是党的核心 55.9%；我权力更大，因为我是选出来的 15.3%；支书权力更大，因为他掌握经济资源 15.3%；不回答 13.5%。", "understand": "村主任自己的回答：56% 承认支书更大——民选主任斗不过任命的书记，「党领导一切」在村一级的体现。", "image": "study-assets/lecture-6/slide-047.jpg", "extract": "村主任眼中与村支书的关系（N=111）：支书权力更大，因为他是党的核心55.9%；我权力更大，因为我是选出来的15.3%；支书权力更大，因为他掌握经济资源15.3%；不回答13.5%"}, {"id": "L6-048", "lecture": 6, "page": 48, "title": "e.g., in 2001, a village director in Shandong province was r", "section": "农民告政府", "source": "48\n48\ne.g., in 2001, a village director in Shandong province was removed by the township government because he had not fulfilled their fee collection quota. He appealed to the township government many times but in vain. He then sold some of his agricultural produce, hired a lawyer, and filed a lawsuit against the township government on the grounds that he was elected by the villagers and that the township government did not have the right to remove him. In the end, the township government had to reverse its decision and compensate the director.", "knowledge": "例：2001 年山东一村主任因未完成收费任务被乡镇政府免职；他多次向乡镇政府申诉无果，卖掉部分农产品，请律师起诉乡镇政府——理由是他由村民选出，乡镇政府无权罢免；最终乡镇政府被迫撤销决定并赔偿该主任。", "understand": "选举纠纷诉讼的完整案例：乡镇无权罢免民选主任（《村委会组织法》）。农民（主任）用法律击败上级政府，是民告官的积极样本。", "image": "study-assets/lecture-6/slide-048.jpg", "extract": "例：2001年山东一村主任因未完成收费任务被乡镇政府免职；他多次向乡镇政府申诉无果；他卖掉部分农产品，请律师起诉乡镇政府——理由是他由村民选出，乡镇政府无权罢免；最终乡镇政府被迫撤销决定并赔偿该主任"}, {"id": "L6-049", "lecture": 6, "page": 49, "title": "Other cases (the government’s inaction)", "section": "农民告政府", "source": "49\n49\nOther cases (the government’s inaction)\nThere was a dispute between two villages over water in a county of Zhejiang province. \nIn 1986, Village A built a reservoir, but peasants in Village B began to use the water in the reservoir in 1996 by draining the water to their village. Because of the higher location of Village B, Village A could no longer receive any water from its reservoir. Peasants from Village A made many petitions to the township and county governments, but failed to have the disputes resolved. The county government then became reluctant to intervene.", "knowledge": "其他案例（政府不作为，1/2）：浙江某县两村争水。1986 年 A 村修了水库，1996 年 B 村开始引水到自己村；因 B 村地势更高，A 村的水库断水；A 村农民多次向乡镇和县政府请求解决未果，县政府后来不愿介入。", "understand": "不作为诉讼的案例：政府不作为也可以是被告理由（呼应 L6-025 的被诉原因 2）。", "image": "study-assets/lecture-6/slide-049.jpg", "extract": "其他案例（政府的不作为）：浙江某县两村争水。1986年A村修了水库，1996年B村开始引水到自己村；因B村地势更高，A村的水库断水；A村农民多次向乡镇和县政府请求解决未果；县政府后来不愿介入"}, {"id": "L6-050", "lecture": 6, "page": 50, "title": "In 2000, 110 peasants from Village A lodged an administrativ", "section": "农民告政府", "source": "50\n50\nIn 2000, 110 peasants from Village A lodged an administrative litigation against the county government to the city court on the ground that the county government failed to perform its duty. The court ruled that county government address the water issue within two months. Surprised by the result, the county government appealed to the provincial high court but was rejected.", "knowledge": "不作为案例（2/2）：2000 年 A 村 110 名农民向市法院起诉县政府不履行法定职责；法院判县政府两个月内解决水问题；县政府惊讶上诉，被省高院驳回。", "understand": "「判政府限期履职」的判决让县政府「惊讶」——说明这种判决之罕见。110 人联名也显示集体诉讼的形态。", "image": "study-assets/lecture-6/slide-050.jpg", "extract": "2000年A村110名农民向市法院起诉县政府不履行法定职责；法院判县政府两个月内解决水问题；县政府惊讶上诉，被省高院驳回"}, {"id": "L6-051", "lecture": 6, "page": 51, "title": "Collective lawsuits by peasants", "section": "农民告政府", "source": "51\n51\nCollective lawsuits by peasants \n\n C o l l e c t i v e   s u i t s     T o t a l     B y   p e a s a n t s 2 - 5   p e r s o n s     2 3   8 6 - 2 4   4   1 2 5   o r   m o r e     3   1 T o t a l     3 0   1 1", "knowledge": "表格：农民集体诉讼的规模分布——2–5 人：共 23 起（农民 8 起）；6–24 人：4 起（农民 1）；25 人以上：3 起（农民 1）；合计 30 起（农民 10）。", "understand": "集体诉讼以 2–5 人的小规模为主；25 人以上的大案很少——大规模集体行动被制度性抑制。", "image": "study-assets/lecture-6/slide-051.jpg", "extract": "农民集体诉讼：2–5人：共23起（农民8起）；6–24人：4起（农民1起）；25人以上：3起（农民1起）；合计30起（农民10起）"}, {"id": "L6-052", "lecture": 6, "page": 52, "title": "Problems with administrative litigations", "section": "行政诉讼的问题与2015年修法", "source": "52\n52\nProblems with administrative litigations \nAwareness of the law", "knowledge": "章节页：行政诉讼的问题——法律意识。", "understand": "转入行政诉讼的问题板块，第一个问题：法律意识。", "image": "study-assets/lecture-6/slide-052.jpg", "extract": "行政诉讼的问题：法律意识"}, {"id": "L6-053", "lecture": 6, "page": 53, "title": "A survey of citizens in 15 province in 2012", "section": "行政诉讼的问题与2015年修法", "source": "53\n53\nA survey of citizens in 15 province in 2012\n(Do you know there is an administrative litigation law that allows citizens to sue the government ?\n  P e o p l e   F r e q u e n c y   ( % ) Y e s   1 6 7 8   6 6 N o   8 6 5   3 4 . 9 s u b t o t a l   2 4 5 3   1 0 0 M i s s i n g   1 4   T o t a l   2 5 5 7", "knowledge": "表格：2012 年 15 省调查「你知道有允许公民告政府的行政诉讼法吗？」——知道 1,678 人（66%）；不知道 865 人（34.9%）；小计 2,453 人（缺答 14，总计 2,557）。", "understand": "立法 22 年后仍有三分之一人不知道行政诉讼法存在——普法的不彻底。注意百分比有小误差（66+34.9>100），原文如此。", "image": "study-assets/lecture-6/slide-053.jpg", "extract": "2012年15省调查「你知道有允许公民告政府的行政诉讼法吗？」：知道1,678人（66%）；不知道865人（34.9%）；小计2,453人；缺答14；总计2,557人"}, {"id": "L6-054", "lecture": 6, "page": 54, "title": "(2) Local officials’ ignorance of their legal obligation (se", "section": "行政诉讼的问题与2015年修法", "source": "54\n(2) Local officials’ ignorance of their legal obligation (seldom appear in court)\n\n    In 1992, a citizen who sued a city public security bureau in Fujian province was arrested in the court. The People’s Congress of Fujian province investigated the case and removed the head of the bureau. Seven years later in 1999, a peasant in this province sued his township government for unauthorized fines. When he walked out of the court, he was knocked down and thrown into a car. Although he was seriously wounded and hospitalized, the authorities merely warned the cadres who beat him after the case was disclosed in the media.", "knowledge": "(2) 地方官员无视法律义务（很少出庭）：1992 年福建一公民起诉市公安局，竟在法庭上被捕；省人大调查后免了局长的职；七年后的 1999 年，该省一农民起诉乡政府乱罚款，走出法庭时被打倒塞进车里，重伤住院，而打人干部仅被警告。", "understand": "「法庭上逮捕原告」「庭外殴打原告」——告官者的人身风险。两个案例相隔七年同一省，说明问题的顽固性。", "image": "study-assets/lecture-6/slide-054.jpg", "extract": "(2) 地方官员无视法律义务（很少出庭）：1992年福建一公民起诉市公安局，竟在法庭上被捕；省人大调查后免了局长的职；七年后的1999年，该省一农民起诉乡政府乱罚款，走出法庭时被打倒塞进车里，重伤住院，而打人干部仅被警告"}, {"id": "L6-055", "lecture": 6, "page": 55, "title": "In Wuhan, for example, between 1990 and 2000, the number of ", "section": "行政诉讼的问题与2015年修法", "source": "55\n55\nIn Wuhan, for example, between 1990 and 2000, the number of administrative litigations totaled 4,250. About 67 percent were withdrawn, and only 6.3 percent were upheld. No single government official appeared in the court.", "knowledge": "武汉 1990–2000 年行政诉讼共 4,250 件：约 67% 撤诉，仅 6.3% 被维持（原文表述），没有一名政府官员出庭。", "understand": "十年无一名官员出庭——「民告官不见官」是行政诉讼最直观的问题。67% 撤诉与全国数据一致。", "image": "study-assets/lecture-6/slide-055.jpg", "extract": "武汉1990–2000年行政诉讼共4,250件：约67%撤诉，仅6.3%维持；没有一名政府官员出庭"}, {"id": "L6-056", "lecture": 6, "page": 56, "title": "(3) It requires knowledge, courage, and political wisdom", "section": "行政诉讼的问题与2015年修法", "source": "56\n56\n(3) It requires knowledge, courage, and political wisdom \ne.g., a peasant in Shandong \n\nFirst lawsuits\nIn 1991, a city government required peasants to sell their family ships to the government at about 60 percent of the market value. \nIf anyone refused, he or she would not be allowed to fish and his or her ship would be confiscated. \nZhang decided to sue the local government, but most peasants doubted that he would succeed. \nThey first agreed to help pay for Zhang’s lawsuit, but most of them very soon withdrew their money, as they believed his cause was hopeless. Yet Zhang did not give up and sued the government using his own money.", "knowledge": "(3) 告政府需要知识、勇气和政治智慧。例：山东农民张某第一案——1991 年市政府要求农民把家庭船只以约市场价 60% 卖给政府，不从者不许打鱼、没收船只；张某决定起诉，多数农民怀疑他会成功；他们起初同意凑钱帮他诉讼，但很快大多撤资，认为没有希望；张某没有放弃……", "understand": "张某案例（1/2）：农民告政府的策略教科书开始。注意村民态度的转变——集体行动的搭便车与悲观预期。", "image": "study-assets/lecture-6/slide-056.jpg", "extract": "(3) 告政府需要知识、勇气和政治智慧。例：山东农民张某。第一案：1991年市政府要求农民把家庭船只以约市场价60%卖给政府；不从者不许打鱼、没收船只；张某决定起诉，多数农民怀疑他会成功；他们起初同意凑钱帮他诉讼，但很快大多撤资，认为没有希望；张某没有放弃……"}, {"id": "L6-057", "lecture": 6, "page": 57, "title": "He first approached the provincial complaints bureau which s", "section": "行政诉讼的问题与2015年修法", "source": "57\n57\nHe first approached the provincial complaints bureau which supported the lawsuit. \nAfter the city court agreed to accept the case, he approached the media in Beijing, including Peasant Daily and Economic Daily, which reported the story. \nTo ensure a fair trial, Zhang brought deputies of the higher-level people’s congress to attend the hearing. \nIn the end, the court ruled that the government could not force peasants to sell their ships, and the government apologized to the peasants.", "knowledge": "张某先找省信访局并获支持；市法院受理后，他联系北京的媒体（《农民日报》《经济日报》）报道；为确保公正审判，他还请上级人大代表旁听庭审；最终法院判政府不得强购船只，政府向农民道歉。", "understand": "胜诉策略清单：上级信访 + 中央媒体 + 人大监督——把案子「抬出地方」是制胜关键。", "image": "study-assets/lecture-6/slide-057.jpg", "extract": "他先找省信访局并获支持；市法院受理后，他联系北京的媒体（《农民日报》《经济日报》）报道；为确保公正审判，他还请上级人大代表旁听庭审；最终法院判政府不得强购船只，政府向农民道歉"}, {"id": "L6-058", "lecture": 6, "page": 58, "title": "Second lawsuit:", "section": "行政诉讼的问题与2015年修法", "source": "58\n58\nSecond lawsuit:\nIn 1998 and 1999, the city government required each laborer in the city to purchase 100 yuan in shares to finance the construction of a road. \nThe government claimed that anyone who refused would be detained. \nZhang thought that the fee violated the directive regarding peasant burdens issued by the central government in 1996. \nOn behalf of over 200 peasants, he filed a lawsuit against the city government in 1999. \nBut the court refused to accept the case, and Zhang and a few other peasants were threatened and suffered tremendous pressure. \nBecause of his persistent efforts, the court agreed to accept the case.", "knowledge": "第二案：1998–1999 年市政府要求全市每名劳动力购买 100 元股份为修路筹资，不从者拘留；张某认为这违反中央 1996 年关于农民负担的文件；1999 年他代表 200 多名农民起诉市政府；法院拒绝受理，张某和几名农民受到威胁、承受巨大压力；因其坚持……", "understand": "第二案更艰难：法院直接拒收 + 人身威胁——敏感案件的三难（立案难）全面展现。", "image": "study-assets/lecture-6/slide-058.jpg", "extract": "第二案：1998–1999年市政府要求全市每名劳动力购买100元股份为修路筹资，不从者拘留；张某认为这违反中央1996年关于农民负担的文件；1999年他代表200多名农民起诉市政府；法院拒绝受理，张某和几名农民受到威胁、承受巨大压力；因其坚持……"}, {"id": "L6-059", "lecture": 6, "page": 59, "title": "The government then took action to stop Zhang by sending a w", "section": "行政诉讼的问题与2015年修法", "source": "59\n59\nThe government then took action to stop Zhang by sending a work team led by a chamber head of the court to Zhang’s village for persuasion. \nIt also sent a propaganda car to the area where Zhang’s village was located. \nThe car broadcasted with a microphone for 12 hours a day that resistance to fee collection was illegal and those who refused would be detained. \nIt stopped at Zhang’s house and broadcasted for a few hours every day. \nThe city government expected that with these efforts, Zhang would give in and withdraw the lawsuit. \nYet after 10 days, Zhang not only refused to back down but also planned to lodge complaints with higher-level authorities.", "knowledge": "市政府派法院庭长带队的工作组到张村劝退；又派宣传车每天广播 12 小时，称抗费违法、不从者拘留；宣传车专门停在张家门口每天播几小时；市政府期望张某屈服撤诉；但 10 天后张某不仅拒绝退让……", "understand": "施压手段的全景：工作组 + 宣传车家门口广播——心理战。但压而不服。", "image": "study-assets/lecture-6/slide-059.jpg", "extract": "市政府派法院庭长带队的工作组到张村劝退；又派宣传车每天广播12小时，称抗费违法、不从者拘留；宣传车专门停在张家门口每天播几小时；市政府期望张某屈服撤诉；但10天后张某不仅拒绝退让……"}, {"id": "L6-060", "lecture": 6, "page": 60, "title": "In this circumstance, the leaders of the city people’s congr", "section": "行政诉讼的问题与2015年修法", "source": "60\n60\nIn this circumstance, the leaders of the city people’s congress and the head of the public security bureau approached Zhang and pleaded with him to withdraw the case. \nZhang agreed, but on the condition that the township party secretary should hold a meeting in his village and acknowledge that the township party committee instead of the peasants was to blame for this event. \nThe city leaders agreed, and the township party committee apologized and cancelled the fee collection.", "knowledge": "在这种情况下，市人大领导和公安局长亲自找张某，请他撤诉；张某同意，条件是乡党委书记到村里开会，承认错在乡党委而非农民；市领导同意，乡党委道歉并取消了收费。", "understand": "结局是政治交易：撤诉换公开认错——双方都「保面子」。张某的政治智慧：知道什么时候收、收什么价。", "image": "study-assets/lecture-6/slide-060.jpg", "extract": "在这种情况下，市人大领导和公安局长亲自找张某，请他撤诉；张某同意，条件是乡党委书记到村里开会，承认错在乡党委而非农民；市领导同意，乡党委道歉并取消了收费"}, {"id": "L6-061", "lecture": 6, "page": 61, "title": "Lawsuits against the governments and their agencies are stil", "section": "行政诉讼的问题与2015年修法", "source": "61\n61\n  Lawsuits against the governments and their agencies are still proportionally fewer. \nOver the years the total number of administrative litigations has never exceeded 2 percent of the total number of lawsuits accepted by the courts.", "knowledge": "告政府的诉讼占比仍然很小：多年来行政诉讼从未超过法院受理案件总数的 2%。", "understand": "收束判断：行政诉讼的边缘地位——2% 上限。", "image": "study-assets/lecture-6/slide-061.jpg", "extract": "告政府及其机构的诉讼占比仍然很小：多年来行政诉讼从未超过法院受理案件总数的2%"}, {"id": "L6-062", "lecture": 6, "page": 62, "title": "Between 1990 and 2012, the courts in China accepted about 1.", "section": "行政诉讼的问题与2015年修法", "source": "62\nBetween 1990 and 2012, the courts in China accepted about 1.91 million cases of administrative litigation, or about 83,000 each year. \n\n   This number is very small compared with the violation of citizens’ rights by state agencies.", "knowledge": "1990–2012 年，全国法院受理行政诉讼约 191 万件，年均约 8.3 万件——与国家机构侵权的实际规模相比，这个数字很小。", "understand": "总量数据：22 年 191 万件。年均 8.3 万件对 13 亿人口——权利救济渠道的使用率极低。", "image": "study-assets/lecture-6/slide-062.jpg", "extract": "1990–2012年，全国法院受理行政诉讼约191万件，年均约8.3万件——与国家机构侵权的实际规模相比，这个数字很小"}, {"id": "L6-063", "lecture": 6, "page": 63, "title": "It is difficult to:", "section": "行政诉讼的问题与2015年修法", "source": "63\nIt is difficult to:\nFile a case/ 立案\nMake a ruling/ 审理\nEnforce a case/执行\n\nLocal intervention is still strong.\nIn a city in Zhejiang, a system of trial outside the locality (异地管辖/审理)\nThe percentage that state agencies lost cases increased from 13.1 % to 62.5 %", "knowledge": "三难：立案难、审理难、执行难；地方干预仍强。浙江某市实行异地管辖/审理后，国家机构败诉率从 13.1% 升至 62.5%。", "understand": "「三难」是行政诉讼的核心问题表述。异地审理的效果数据是重要考点：摆脱地方干预后政府败诉率从 13% 飙到 63%——地方干预对结果的扭曲程度被量化了。", "image": "study-assets/lecture-6/slide-063.jpg", "extract": "三难：立案难、审理难、执行难；地方干预仍强。浙江某市实行异地管辖/审理后，国家机构败诉率从13.1%升至62.5%"}, {"id": "L6-064", "lecture": 6, "page": 64, "title": "It is difficult to file a lawsuit based on a government dire", "section": "行政诉讼的问题与2015年修法", "source": "64\nIt is difficult to file a lawsuit based on a government directive (红头文件)/abstract behavior. (抽象行为).\n\nIn 2007, in a county in Fujian, it was stipulated: \n没有初中毕业,不能办理结婚证 \n\nBut such directives could not be the base for lawsuit.", "knowledge": "难以依据政府文件（红头文件）/抽象行为起诉。例：2007 年福建某县规定「没有初中毕业不能办结婚证」——但这类文件不能成为诉讼对象。", "understand": "抽象行政行为不可诉：公民只能告具体行政行为，不合理的「红头文件」本身无法直接挑战——制度空白。", "image": "study-assets/lecture-6/slide-064.jpg", "extract": "难以依据政府文件（红头文件）/抽象行为起诉。例：2007年福建某县规定：没有初中毕业不能办结婚证；但这类文件不能成为诉讼对象"}, {"id": "L6-065", "lecture": 6, "page": 65, "title": "(5)The government or its agencies may not be allowed to be s", "section": "行政诉讼的问题与2015年修法", "source": "65\n65\n(5)The government or its agencies may not be allowed to be sued\nCourts may refuse to accept the case\n\n\nFood and Drug Agency \n2004:\nU.S: 184 new medicines\nChina: 10,009\n\nLawsuits against two agencies of FAD (for its inaction). \nOne person reported the case for 11 years.", "knowledge": "(5) 政府或其机构可能不允许被诉：法院可以拒绝受理。药监局案例：2004 年美国批准新药 184 种、中国 10,009 种；对药监局两个下属机构的不作为起诉；有人为一起案件举报了 11 年。", "understand": "与 L5-037 相同的药监局材料，从行政诉讼角度重用：对监管机构的诉讼法院可以不受理——管辖禁区。", "image": "study-assets/lecture-6/slide-065.jpg", "extract": "(5) 政府或其机构可能不允许被诉：法院可以拒绝受理。药监局案例：2004年美国批准新药184种、中国10,009种；对药监局两个下属机构的不作为起诉；有人为一起案件举报了11年"}, {"id": "L6-066", "lecture": 6, "page": 66, "title": "Sentenced to death in June 2007", "section": "行政诉讼的问题与2015年修法", "source": "66\n66\nSentenced to death in June 2007", "knowledge": "（郑筱萸）2007 年 6 月被判死刑。", "understand": "药监局长郑筱萸的结局（与 L5-038 相同），此处说明行政系统内部的追责。", "image": "study-assets/lecture-6/slide-066.jpg", "extract": "2007年6月被判死刑"}, {"id": "L6-067", "lecture": 6, "page": 67, "title": "If you do not agree to the decision of state agencies,", "section": "行政诉讼的问题与2015年修法", "source": "67\nIf you do not agree to the decision of state agencies, \nwhat will you do?\n  \n F r e q u e n c y   ( % ) N o   a c t i o n   忍 耐   1 6 . 4 N e g o t i a t e   w i t h   t h e   a g e n c y   沟 通   2 0 . 1 P r i v a t e   s o l u t i o n   t h r o u g h   c o n n e c t i o n   私 了   1 3 . A d m i n i s t r a t i o n   r e v i e w ,   行 政 复 议   1 9 . 3 L a w s u i t     1 1 . 2 P e t i t i o n     5 . 6 M e d i a   1 2 . 9 M i s c e l l a n e o u s     1 . 5 T o t a l     2 5 1 1", "knowledge": "表格：不同意国家机构的决定时你会怎么办？（N=2,511）——忍耐 16.4%；与机构沟通 20.1%；托关系私了 13%；行政复议 19.3%；诉讼 11.2%；上访 5.6%；找媒体 12.9%；其他 1.5%。", "understand": "公民应对政府侵权的选择排序：沟通 > 复议 > 忍耐 > 私了 > 媒体 > 诉讼 > 上访。诉讼仅 11.2%——法律渠道仍非首选。", "image": "study-assets/lecture-6/slide-067.jpg", "extract": "不同意国家机构的决定时你会怎么办？：忍耐16.4%；与机构沟通20.1%；托关系私了13%；行政复议19.3%；诉讼11.2%；上访5.6%；找媒体12.9%；其他1.5%（合计2,511人）"}, {"id": "L6-068", "lecture": 6, "page": 68, "title": "M o d e s     I n t e n t i o n", "section": "行政诉讼的问题与2015年修法", "source": "68\n68\nM o d e s     I n t e n t i o n \n ( % )   A c t i o n \n ( % )     L a w     4 1 . 3   2 7 . 1 A p p r o a c h i n g   l e a d e r s   o f   t h i s   \n         A g e n c y   1 4 . 4   1 8 . 3 A p p r o a c h i n g   u p p e r - l e v e l   l e a d e r s   2 5 . 1   2 6 . 8 C o l l e c t i v e   P e t i t i o n         2 . 3   1 3 . 4 A p p r o a c h i n g   t h e   m e d i a       4 . 2       4 . 6 N o   a c t i o n     1 1 . 8   2 6 . 0 M i s c e l l a n e o u s         1 . 0       3 . 8 T o t a l   c a s e s     1 0 , 1 1 1       2 6 1\nBehavioral intention and actual action in suing the government", "knowledge": "表格：告政府的行为意向与实际行动对比——意向用法律 41.3% vs 实际 27.1%；找本机构领导 14.4% vs 18.3%；找上级领导 25.1% vs 26.8%；集体上访 2.3% vs 13.4%；找媒体 4.2% vs 4.6%；不行动 11.8% vs 26.0%（意向 N=10,111，行动 N=261）。", "understand": "意向与行动的落差：想用法律的 41% 实际只有 27% 做到；想不行动的 12% 实际 26% 放弃了；想集体上访的 2.3% 实际 13.4%——行动比意愿更保守也更两极。", "image": "study-assets/lecture-6/slide-068.jpg", "extract": "告政府的行为意向与实际行动：意向——用法律41.3%、找本机构领导14.4%、找上级领导25.1%、集体上访2.3%、找媒体4.2%、不行动11.8%、其他1.0%（N=10,111）；实际行动——27.1%、18.3%、26.8%、13.4%、4.6%、26.0%、3.8%（N=261）"}, {"id": "L6-069", "lecture": 6, "page": 69, "title": "How much do you know about the administrative", "section": "行政诉讼的问题与2015年修法", "source": "69\nHow much do you know about the administrative \nlitigation system? 2012\n  \n F r e q u e n c y   ( % ) V e r y   m u c h   3 . 8 S o m e   一 般   3 7 . 5 N o t   v e r y   m u c h / 不 太 了 解   4 4 . 0 N o t   a t   a l l   1 4 . 4 T o t a l     2 5 5 0", "knowledge": "表格：你对行政诉讼制度了解多少？（2012，N=2,550）——非常了解 3.8%；一般 37.5%；不太了解 44.0%；完全不了解 14.4%。", "understand": "制度知晓度：近六成不了解——知法是用法的前提，认知缺口是行政诉讼少的第一道原因。", "image": "study-assets/lecture-6/slide-069.jpg", "extract": "你对行政诉讼制度了解多少？（2012，N=2,550）：非常了解3.8%；一般37.5%；不太了解44.0%；完全不了解14.4%"}, {"id": "L6-070", "lecture": 6, "page": 70, "title": "Do you believe that the Administrative litigation system can", "section": "行政诉讼的问题与2015年修法", "source": "70\nDo you believe that the Administrative litigation system can \nprotect the people’s interests?\n  \n F r e q u e n c y   ( % ) Y e s   1 7 . 4 L i m i t e d   u s e   4 7 . 9 N o     1 0 . 4 W i n   a   c a s e ,   l o s e   f o r   a   l i f e :     8 . 8 C a n n o t   t e l l   1 5 . 1 T o t a l     2 5 5 7", "knowledge": "表格：你相信行政诉讼制度能保护人民利益吗？——相信 17.4%；作用有限 47.9%；不信 10.4%；「赢一场官司，输一辈子」8.8%；说不清 15.1%（N=2,557）。", "understand": "制度信任度：只有 17% 相信。注意 8.8% 的人选了「赢官司输一辈子」——担心被报复的寒蝉效应。", "image": "study-assets/lecture-6/slide-070.jpg", "extract": "你相信行政诉讼制度能保护人民利益吗？：相信17.4%；作用有限47.9%；不信10.4%；「赢一场官司，输一辈子」8.8%；说不清15.1%（N=2,557）"}, {"id": "L6-071", "lecture": 6, "page": 71, "title": "What is your impression of judges? (2012)", "section": "行政诉讼的问题与2015年修法", "source": "71\nWhat is your impression of judges? (2012)\n  \n H a v i n g   c o n t a c t   ( % )   N o   c o n t a c t   ( % ) V e r y   g o o d   4 . 2   3 . 6 R e l a t i v e l y   g o o d   2 5 . 9   1 3 . 9 O k   一 般   4 8 . 4   3 7 . 2 N o t   g o o d   1 0 . 1   9 . 0 V e r y   b a d   5 . 4   6 . 5 C a n n o t   t e l l   6 . 0   2 9 . 8 T o t a l   8 8 8   1 6 5 5", "knowledge": "表格：你对法官的印象（2012）——接触过法官的（N=888）：很好 4.2%、较好 25.9%、一般 48.4%、不好 10.1%、很差 5.4%、说不清 6.0%；未接触过的（N=1,655）：3.6%、13.9%、37.2%、9.0%、6.5%、29.8%。", "understand": "接触效应：接触过法官的人评价（较好以上 30%）明显高于未接触者（17.6%）——负面印象部分来自想象和媒体，实际体验反而较好。", "image": "study-assets/lecture-6/slide-071.jpg", "extract": "你对法官的印象（2012）：接触过（N=888）——很好4.2%、较好25.9%、一般48.4%、不好10.1%、很差5.4%、说不清6.0%；未接触过（N=1,655）——3.6%、13.9%、37.2%、9.0%、6.5%、29.8%"}, {"id": "L6-072", "lecture": 6, "page": 72, "title": "In 2014, the Chinese authority began the amendments of the A", "section": "行政诉讼的问题与2015年修法", "source": "72\nIn 2014, the Chinese authority began the amendments of the Administration Litigation Law, which took effect in May 2015. \n\nThe amendments target:\nFile a case/ 立案\nMake a ruling/ 审理\nEnforce a case/执行\n\nIn Germany that has a population of 80 million, it accepts about 600,00 cases of administration litigation per year. \u000bIn China, it used to be around 120,000.", "knowledge": "2014 年中国启动《行政诉讼法》修改，2015 年 5 月生效；针对三难：立案、审理、执行。对比：德国 8,000 万人口每年受理约 60 万件行政诉讼，中国过去约 12 万件。", "understand": "修法背景：中德对比最有冲击力——人口 1/16 的德国案件量是中国的 5 倍，说明中国行政诉讼的潜力远未释放。", "image": "study-assets/lecture-6/slide-072.jpg", "extract": "2014年中国启动《行政诉讼法》修改，2015年5月生效；针对三难：立案难、审理难、执行难。德国8,000万人口每年受理约60万件行政诉讼；中国过去约12万件"}, {"id": "L6-073", "lecture": 6, "page": 73, "title": "Major amendments taking effect in 2015:", "section": "行政诉讼的问题与2015年修法", "source": "73\nMajor amendments taking effect in 2015:\nIncreasing the scope: from 8 to 10\n2. State agencies are not allowed to prevent courts from accepting cases.\n3. Lawsuits can be orally presented.\n4. The time period of filing a lawsuit is extended from 3 to six months. \n5. Leaders of the sued agency should appear in the court.\n6. A case can be tried outside the place where the state agency is located. \n7. Leaders of a sued agency can be detained if it refuses to enforce a court ruling.", "knowledge": "2015 年生效的主要修改：1 受案范围从 8 类增至 10 类；2 国家机构不得阻止法院受理案件；3 可口头起诉；4 起诉期限从 3 个月延长至 6 个月；5 被诉机构负责人应当出庭；6 案件可异地审理；7 被诉机构负责人拒不执行判决可被拘留。", "understand": "七项修改是考点清单，每项都对应前文的一个痛点（受理难→登记制/口头起诉；不见官→负责人出庭；地方干预→异地审理；执行难→拘留负责人）。", "image": "study-assets/lecture-6/slide-073.jpg", "extract": "2015年生效的主要修改：1 受案范围从8类增至10类；2 国家机构不得阻止法院受理案件；3 可口头起诉；4 起诉期限从3个月延长至6个月；5 被诉机构负责人应当出庭；6 案件可异地审理；7 被诉机构负责人拒不执行判决可被拘留"}, {"id": "L6-074", "lecture": 6, "page": 74, "title": "Dealing with the difficulties to file a lawsuit:", "section": "行政诉讼的问题与2015年修法", "source": "74\nDealing with the difficulties to file a lawsuit:\nOriginal:\nAcceptance based on the review outcome\n(some local governments’ “three Nos”\nNot accepting a case; not accepting materials; not making a rule  \n\nAmended:\nCase acceptance based on registration.", "knowledge": "解决立案难：原状——立案需经审查（一些地方政府的「三不」：不受理案件、不接收材料、不出裁定）；修改后——立案登记制。", "understand": "「三不」土政策是立案难的土办法根源：连材料都不收、书面裁定都不给，原告连上诉凭据都没有。登记制 = 有案必立。", "image": "study-assets/lecture-6/slide-074.jpg", "extract": "解决立案难：原状——立案需经审查（一些地方政府的「三不」：不受理案件、不接收材料、不出裁定）；修改后——立案登记制"}, {"id": "L6-075", "lecture": 6, "page": 75, "title": "Changes:", "section": "行政诉讼的问题与2015年修法", "source": "75\nChanges:\n1. Increase in cases accepted \nIn May, 2015, cases accepted by the courts:\n26,000, an increase of 221%\n\nFrom May 2015 to March 2016: 220,259, an increase of 59.23%", "knowledge": "变化 1：受理案件大增——2015 年 5 月法院受理 26,000 件，增长 221%；2015 年 5 月至 2016 年 3 月受理 220,259 件，增长 59.23%。", "understand": "登记制的立竿见影：首月受理量增 2.2 倍——证明此前大量案件被挡在门外。", "image": "study-assets/lecture-6/slide-075.jpg", "extract": "变化：1 受理案件大增——2015年5月法院受理26,000件，增长221%；2015年5月至2016年3月受理220,259件，增长59.23%"}, {"id": "L6-076", "lecture": 6, "page": 76, "title": "Total Number of Accepted Administrative Litigation Cases, 20", "section": "行政诉讼的问题与2015年修法", "source": "Total Number of Accepted Administrative Litigation Cases, 2007-2016", "knowledge": "图表页：2007–2016 年行政诉讼受理案件总数。", "understand": "趋势图看 2015 年修法前后的跳升拐点。", "image": "study-assets/lecture-6/slide-076.jpg", "extract": "2007–2016年行政诉讼受理案件总数（趋势图）"}, {"id": "L6-077", "lecture": 6, "page": 77, "title": "Maintaining government agencies’ decisions", "section": "行政诉讼的问题与2015年修法", "source": "77\nMaintaining government agencies’ decisions \n  G o v e r n m e n t   a g e n c i e s   \n R e s p o n s i b l e   f o r   a d m i n i s t r a t i v e   r e v i e w     ( % )   C o u r t s   \n ( % ) 2 0 1 1   5 9 . 2   2 2 . 5 2 0 1 2   5 7 . 8   2 0 . 2 2 0 1 3   5 5 . 8   2 2 . 0 2 0 1 4   5 9 . 7   2 2 . 2\n2. The reviewing agencies face more pressure", "knowledge": "表格：维持政府机构决定的比例——行政复议机关：2011 年 59.2%、2012 年 57.8%、2013 年 55.8%、2014 年 59.7%；法院：22.5%、20.2%、22.0%、22.2%。变化 2：复议机关面临更大压力。", "understand": "复议维持率（约 58%）远高于法院（约 22%）——行政复议偏向维持原决定，「官官相护」的量化证据；这也解释了修法后复议机关当被告的压力。", "image": "study-assets/lecture-6/slide-077.jpg", "extract": "维持政府机构决定的比例：行政复议机关——2011年59.2%、2012年57.8%、2013年55.8%、2014年59.7%；法院——22.5%、20.2%、22.0%、22.2%。2. 复议机关面临更大压力"}, {"id": "L6-078", "lecture": 6, "page": 78, "title": "In administrative review cases, the party that applies for t", "section": "行政诉讼的问题与2015年修法", "source": "78\nIn administrative review cases, the party that applies for the review may refuse to accept the review outcome. \nThe reviewing agency will be the defendant if it is sued by the applier.\nIf the reviewing agency (A) has maintained the decision made by the complaint agency (B), both A and B will be defendants.  \n \nIn 2015, the Ministry of Land and Resources was sued as the sole defendant in 128 cases; it was sued as a co-defendant in 163 cases.", "knowledge": "行政复议案件：申请人不服复议结果的，复议机关将成被告；复议机关 A 维持原机关 B 决定的，A、B 为共同被告。2015 年国土资源部单独被诉 128 件，作为共同被告被诉 163 件。", "understand": "2015 年修法的关键制度：复议维持也要当共同被告——堵住复议机关「和稀泥」的退路。国土部一年被诉近 300 件显示中央部委也被卷入。", "image": "study-assets/lecture-6/slide-078.jpg", "extract": "行政复议案件：申请人不服复议结果的，复议机关将成被告；复议机关A维持原机关B决定的，A、B为共同被告。2015年国土资源部单独被诉128件，作为共同被告被诉163件"}, {"id": "L6-079", "lecture": 6, "page": 79, "title": "State Compensation", "section": "国家赔偿", "source": "79\nState Compensation", "knowledge": "章节页：国家赔偿。", "understand": "进入国家赔偿板块。", "image": "study-assets/lecture-6/slide-079.jpg", "extract": "国家赔偿"}, {"id": "L6-080", "lecture": 6, "page": 80, "title": "State Compensation", "section": "国家赔偿", "source": "80\n80\nState Compensation \nFrom 1995 to 2004, courts accepted 15,867 cases of state compensation. In 5,442 cases, compensation was made.", "knowledge": "国家赔偿：1995–2004 年法院受理国家赔偿案件 15,867 件，其中 5,442 件获得赔偿。", "understand": "十年总量：年均不到 1,600 件，获赔率约 34%——规模小、获赔难。", "image": "study-assets/lecture-6/slide-080.jpg", "extract": "国家赔偿：1995–2004年法院受理国家赔偿案件15,867件，其中5,442件获得赔偿"}, {"id": "L6-081", "lecture": 6, "page": 81, "title": "The scope of state compensation:", "section": "国家赔偿", "source": "81\n81\nThe scope of state compensation:\nIn criminal cases:\n(1) Mistaken detention \n(2) Mistaken arrest\n(3) Mistaken judgment \n(4) Being tortured or hurt in other ways when being questioned \n(5) Failing to protect the rights of citizens of other social actors or “inaction”\n (6) Failing to protect the rights of citizens of other social actors or “inaction”\n (7) Being wounded or killed because of police’s illegal use of weapons or other equipment", "knowledge": "国家赔偿的范围——刑事案件中：(1) 错误拘留；(2) 错误逮捕；(3) 错误判决；(4) 审讯中被刑讯或以其他方式伤害；(5)/(6) 未能保护公民或社会主体的权利（不作为）；(7) 因警察非法使用武器或警械致伤致死。", "understand": "刑事赔偿范围的七项清单（5、6 条原文重复列出不作为）。与冤案专题（佘祥林等）直接对应。", "image": "study-assets/lecture-6/slide-081.jpg", "extract": "国家赔偿的范围——刑事案件中：(1) 错误拘留；(2) 错误逮捕；(3) 错误判决；(4) 审讯中被刑讯或以其他方式伤害；(5)(6) 未能保护公民或社会主体的权利（不作为）；(7) 因警察非法使用武器或警械致伤致死"}, {"id": "L6-082", "lecture": 6, "page": 82, "title": "Other situations:", "section": "国家赔偿", "source": "82\n82\nOther situations:\n(1) Illegal freezing of property\n\n(2) Fine paid, property confiscated, but later found not guilty", "knowledge": "其他情形：(1) 违法冻结财产；(2) 已缴罚款、财产被没收，后查明无罪。", "understand": "财产类赔偿情形：冻结 + 罚没错误。", "image": "study-assets/lecture-6/slide-082.jpg", "extract": "其他情形：(1) 违法冻结财产；(2) 已缴罚款、财产被没收，后查明无罪"}, {"id": "L6-083", "lecture": 6, "page": 83, "title": "State compensation cases", "section": "国家赔偿", "source": "83\nState compensation cases \n  C a s e s   C o m p e n s a t i o n   c a s e s   1 9 9 5   1 5 4   6 4   ( 4 2 % ) 1 9 9 6   1 1 0   4 4   ( 4 0 % ) 1 9 9 8 - 2 0 0 2   1 1 , 3 2 1   4 , 0 1 3   ( 3 5 ) 2 0 0 3 - 2 0 0 7   1 3 , 0 0 0   2 0 0 8 - 2 0 1 2         8 , 6 8 4   2 0 1 3         2 , 0 4 5   2 0 1 4         2 , 7 0 8   2 0 1 3 - 2 0 1 6   1 6 , 8 8 9", "knowledge": "表格：历年国家赔偿案件——1995 年 154 件（赔偿 64 件，42%）；1996 年 110 件（44，40%）；1998–2002 年 11,321 件（4,013，约 35%）；2003–2007 年 13,000 件；2008–2012 年 8,684 件；2013 年 2,045 件；2014 年 2,708 件；2013–2016 年 16,889 件。", "understand": "获赔率从 42% 降至 35%；案件量在 1998–2007 达峰后下降——注意下降未必是侵权减少。", "image": "study-assets/lecture-6/slide-083.jpg", "extract": "历年国家赔偿案件：1995年154件（赔偿64件，42%）；1996年110件（44件，40%）；1998–2002年11,321件（4,013件，约35%）；2003–2007年13,000件；2008–2012年8,684件；2013年2,045件；2014年2,708件；2013–2016年16,889件"}, {"id": "L6-084", "lecture": 6, "page": 84, "title": "Effectiveness?", "section": "国家赔偿", "source": "84\nEffectiveness?", "knowledge": "设问页：有效吗？", "understand": "对国家赔偿制度实效的提问，由后续案例和数据回答。", "image": "study-assets/lecture-6/slide-084.jpg", "extract": "有效吗？"}, {"id": "L6-085", "lecture": 6, "page": 85, "title": "State compensation cases", "section": "国家赔偿", "source": "85\nState compensation cases", "knowledge": "图表页：国家赔偿案件。", "understand": "国家赔偿案件数量的图示页。", "image": "study-assets/lecture-6/slide-085.jpg", "extract": "国家赔偿案件（图示）"}, {"id": "L6-086", "lecture": 6, "page": 86, "title": "Case 1", "section": "国家赔偿", "source": "86\n86\nCase 1\nThe case involving the largest amount of state compensation in China. A company (Company Y) sued the urban land bureau and received 8.7 million yuan in state compensation in 2003 after six years of litigation. \nCompany A borrowed 8.7 million yuan from Company Y with the mortgage of the ownership of a building and the land use right. But the land use right and the ownership building belonged to another company. After A got the money, it declared bankrupt and disappeared. \nWhy won? The land bureau could not grant the ownership of the building to two companies.", "knowledge": "案例一：中国最大额国家赔偿案。Y 公司诉市土地局，经六年诉讼 2003 年获赔 870 万元。A 公司以一栋楼的所有权和土地使用权作抵押向 Y 公司借款 870 万，但该权利实际属于另一公司；A 拿到钱后破产消失。为何胜诉？土地局不能把同一栋楼的所有权授予两家公司。", "understand": "最大国赔案（870 万）的法律逻辑：重复登记是土地局的错误——行政机关的登记错误导致第三人损失。", "image": "study-assets/lecture-6/slide-086.jpg", "extract": "案例一：中国最大额国家赔偿案。Y公司诉市土地局，经六年诉讼2003年获赔870万元。A公司以一栋楼的所有权和土地使用权作抵押向Y公司借款870万，但该权利实际属于另一公司；A拿到钱后破产消失。为何胜诉？土地局不能把同一栋楼的所有权授予两家公司"}, {"id": "L6-087", "lecture": 6, "page": 87, "title": "Case 2", "section": "国家赔偿", "source": "87\n87\nCase 2\nA peasant in Hubei province was detained as the suspect of a murder in 1989. In 1999, the court eventually ruled that he was not guilty and released him. He was illegally detained for 3879 days. He received 191,932 yuan in state compensation.", "knowledge": "案例二：湖北一农民 1989 年作为杀人嫌疑人被拘押，1999 年法院终判无罪释放；被非法羁押 3,879 天，获国家赔偿 191,932 元。", "understand": "3,879 天（约 10.6 年）自由 = 19.2 万元——折算每天约 50 元，国赔标准的低廉一目了然。", "image": "study-assets/lecture-6/slide-087.jpg", "extract": "案例二：湖北一农民1989年作为杀人嫌疑人被拘押，1999年法院终判无罪释放；被非法羁押3,879天，获国家赔偿191,932元"}, {"id": "L6-088", "lecture": 6, "page": 88, "title": "Case 3", "section": "国家赔偿", "source": "88\n88\nCase 3\nIn 2002, a couple in Shanxi province were watching a movie CD for adults (i.e, porn) at home and were caught by the police. The husband resisted, and he was taken to the police station and fined 1,000 yuan. The case was then widely reported in the media, and the couple was very embarrassed. The husband was seriously affected mentally. His wife decided to hire a lawyer to sue the police department. In 2003, the police bureau made an apology and paid 29,137 yuan in compensation.", "knowledge": "案例三：2002 年陕西一对夫妇在家看成人影碟被警察抓获，丈夫反抗被带到派出所罚款 1,000 元；案件被媒体广泛报道，夫妇深受羞辱，丈夫精神严重受创；妻子聘请律师起诉公安部门；2003 年公安局道歉并赔偿 29,137 元。", "understand": "「夫妻看黄碟案」：住宅隐私权对抗执法权的经典案例。道歉 + 赔偿的结果确立了公权力进入私宅的边界。", "image": "study-assets/lecture-6/slide-088.jpg", "extract": "案例三：2002年陕西一对夫妇在家看成人影碟被警察抓获，丈夫反抗被带到派出所罚款1,000元；案件被媒体广泛报道，夫妇深受羞辱，丈夫精神严重受创；妻子聘请律师起诉公安部门；2003年公安局道歉并赔偿29,137元"}, {"id": "L6-089", "lecture": 6, "page": 89, "title": "Case 4", "section": "国家赔偿", "source": "89\n89\nCase 4\nA peasant and his son were selling water melons in a city. A group of people came to them and tasted the water melons. As more people came, some of them began to take the water melons without paying the money. The peasant asked his son go to the police station for help. But the police did not take action under the pretext of a lack of manpower. The peasant incurred a loss worth 1,000 yuan. He presented a petition to the county police bureau for compensation, and received 980 yuan in compensation.", "knowledge": "案例四：一农民带儿子在城里卖西瓜，一群人尝瓜后越聚越多，有人开始白拿不付钱；农民让儿子去派出所求助，警察以人手不足为由未出警；农民损失 1,000 元；他向县公安局申请赔偿，获赔 980 元。", "understand": "不作为也可赔（呼应 L6-081 的第 5/6 条）：警察不出警导致损失，赔偿 980 元——数额微小但原则重要。", "image": "study-assets/lecture-6/slide-089.jpg", "extract": "案例四：一农民带儿子在城里卖西瓜，一群人尝瓜后越聚越多，有人开始白拿不付钱；农民让儿子去派出所求助，警察以人手不足为由未出警；农民损失1,000元；他向县公安局申请赔偿，获赔980元"}, {"id": "L6-090", "lecture": 6, "page": 90, "title": "But the law does not apply to old cases that were closed bef", "section": "国家赔偿", "source": "90\n90\nBut the law does not apply to old cases that were closed before the compensation law took effect (i.e., 1 January 1995)\n\nExample:\nIn 1977, a peasant was detained for corruption and was then sentenced to seven years in prison. In 1996, the county court revoked the original verdict. The peasant applied to the court for compensation. But his application was rejected by both the county court and intermediate court.", "knowledge": "但法律不溯及既往：国家赔偿法生效日（1995 年 1 月 1 日）前已结的旧案不适用。例：一农民 1977 年因贪污被拘后判刑七年，1996 年县法院撤销原判；他申请赔偿，被县法院和中院先后驳回。", "understand": "法不溯及既往原则：1995 年前的冤案拿不到国家赔偿——历史欠账被制度性豁免。", "image": "study-assets/lecture-6/slide-090.jpg", "extract": "但法律不溯及既往：国家赔偿法生效日（1995年1月1日）前已结的旧案不适用。例：一农民1977年因贪污被拘后判刑七年，1996年县法院撤销原判；他申请赔偿，被县法院和中院先后驳回"}, {"id": "L6-091", "lecture": 6, "page": 91, "title": "第 91 页", "section": "国家赔偿", "source": "91", "knowledge": "（图片过渡页）", "understand": "国家赔偿主题图片页。", "image": "study-assets/lecture-6/slide-091.jpg", "extract": "（本页无提取文字，为图片页）"}, {"id": "L6-092", "lecture": 6, "page": 92, "title": "Anhui, 2013 released, 1996", "section": "国家赔偿", "source": "92\nAnhui, 2013 released, 1996", "knowledge": "图片页：安徽，2013 年释放（1996 年被关押）。", "understand": "一起 1996 年关押、2013 年平反的冤案照片——17 年冤狱的视觉记录。", "image": "study-assets/lecture-6/slide-092.jpg", "extract": "安徽：2013年释放，1996年被关押"}, {"id": "L6-093", "lecture": 6, "page": 93, "title": "Limitations of state compensation", "section": "国家赔偿", "source": "93\n93\nLimitations of state compensation \n\n(1) It is difficult to win such cases \nNationwide it is estimated that about 22.7 percent of the cases were supported by the court.", "knowledge": "国家赔偿的局限 (1)：难赢——全国估计仅约 22.7% 的案件获法院支持。", "understand": "国赔三难之一：胜诉率仅约 1/5。", "image": "study-assets/lecture-6/slide-093.jpg", "extract": "国家赔偿的局限：(1) 难赢——全国估计仅约22.7%的案件获法院支持"}, {"id": "L6-094", "lecture": 6, "page": 94, "title": "(2) The amount is normally small (based on the average daily", "section": "国家赔偿", "source": "94\n94\n(2) The amount is normally small (based on the average daily income of the people in the previous year). Now raised to 425 yuan/day\n\nIn contrast\n(e.g., an American woman was mistakenly taken away for questioning and then released. She then received one million U.S dollars form compensation; the story of a pair of trousers).", "knowledge": "(2) 数额通常很小（按上年度职工日平均工资计，现已提高到每天 425 元）。对比：一美国女子被误带走讯问后释放，获赔 100 万美元（裤子的故事）。", "understand": "中美赔偿标准的悬殊：按平均工资计赔 vs 惩罚性赔偿。「裤子的故事」指美国法官因干洗店弄丢裤子索赔天价（或类似讹传案例），用来反衬美国赔偿之高。", "image": "study-assets/lecture-6/slide-094.jpg", "extract": "(2) 数额通常很小（按上年度职工日平均工资计，现已提高到每天425元）。对比：一美国女子被误带走讯问后释放，获赔100万美元（裤子的故事）"}, {"id": "L6-095", "lecture": 6, "page": 95, "title": "In 1995, Zhou, a female was detained by a police station for", "section": "国家赔偿", "source": "95\n95\nIn 1995, Zhou, a female was detained by a police station for “prostitution” for 26 hours. Later Zhou was released because the charge was false. But a few weeks later, Zhou was again detained on the charge of “immoral behavior.” She was then released again on probation for 42 days.\nZhou appealed to a number of authorities. In 1996 the county public security bureau decided to pay Zhou 633 yuan in compensation.\nZhou did not accept this amount and lodged an administrative litigation to the county court, asking a total amount of compensation of 183,800 yuan.", "knowledge": "案例：1995 年周某（女）被派出所以「卖淫」为由拘留 26 小时，后查无实据释放；几周后又以「行为不检」被拘，后获释但被取保候审 42 天；周某向多个机关申诉，1996 年县公安局决定赔 633 元；周某不服，向县法院提起行政诉讼，索赔 183,800 元。", "understand": "国赔数额争议的完整案例（1/2）：公安自定价 633 元 vs 当事人要价 18.4 万——差距近 300 倍。", "image": "study-assets/lecture-6/slide-095.jpg", "extract": "1995年周某（女）被派出所以「卖淫」为由拘留26小时，后查无实据释放；几周后又以「行为不检」被拘，后获释但被取保候审42天；周某向多个机关申诉，1996年县公安局决定赔633元；周某不服，向县法院提起行政诉讼，索赔183,800元"}, {"id": "L6-096", "lecture": 6, "page": 96, "title": "The court ruled that the public security bureau paid 909.45 ", "section": "国家赔偿", "source": "96\n96\nThe court ruled that the public security bureau paid 909.45 yuan in compensation for the 42 days.\u000b\nZhou did not accept the verdict and appealed to the intermediate court. The court ruled that the public security bureau paid 16,974 yuan in compensation. 14,895 yuan of it was paid to compensate her time spent on petitions.", "knowledge": "（接上页）法院判公安局为 42 天赔偿 909.45 元；周某不服上诉中院；中院判公安局赔 16,974 元，其中 14,895 元是补偿她上访花费的时间。", "understand": "三级结果：633 → 909 → 16,974 元。亮点：中院把上访成本计入赔偿——对「维权成本」的罕见认可。", "image": "study-assets/lecture-6/slide-096.jpg", "extract": "法院判公安局为42天赔偿909.45元；周某不服上诉中院；中院判公安局赔16,974元，其中14,895元是补偿她上访花费的时间"}, {"id": "L6-097", "lecture": 6, "page": 97, "title": "(3) Some people cannot receive the compensation or cannot re", "section": "国家赔偿", "source": "97\n97\n(3) Some people cannot receive the compensation or cannot receive it in time (i.e., enforcement is difficult). \n\ne.g., in a case in Xinjiang, a person was illegally detained for 1,380 days, his property worth 200,000 yuan was confiscated. Because of the detention, he was unable to receive medical treatment in time, and was disabled. In the end when his case was corrected, he was supposed to get compensation and get back his property. But he only received 86,000 yuan.", "knowledge": "(3) 有些人拿不到或不能及时拿到赔偿（执行难）。例：新疆一案，一人被非法羁押 1,380 天，价值 20 万元的财产被没收；因羁押延误治疗致残；案件纠正后本应获赔并返还财产，但只拿到 86,000 元。", "understand": "国赔三难之三：执行难。应得与实际到手的落差（20 万财产 + 4 年自由 → 8.6 万）。", "image": "study-assets/lecture-6/slide-097.jpg", "extract": "(3) 有些人拿不到或不能及时拿到赔偿（执行难）。例：新疆一案，一人被非法羁押1,380天，价值20万元的财产被没收；因羁押延误治疗致残；案件纠正后本应获赔并返还财产，但只拿到86,000元"}, {"id": "L6-098", "lecture": 6, "page": 98, "title": "New developments:", "section": "国家赔偿", "source": "98\n98\nNew developments:\nAn amended version was passed by the National People’s Congress and took effect in 2010. \n\nNew areas to be covered:\n1. Extended detention  \n2. Psychological or mental suffering \n\nThe payment process is simplified and speeded up, no longer than 22 days.", "knowledge": "新发展：2010 年通过修正案并生效。新覆盖：1 超期羁押；2 精神损害；支付程序简化提速，不超过 22 天。", "understand": "2010 年修法要点：精神损害赔偿入法（呼应麻旦旦案的精神创伤问题）+ 支付提速。", "image": "study-assets/lecture-6/slide-098.jpg", "extract": "新发展：2010年通过修正案并生效。新覆盖：1 超期羁押；2 精神损害；支付程序简化提速，不超过22天"}, {"id": "L6-099", "lecture": 6, "page": 99, "title": "Some remaining problems:", "section": "国家赔偿", "source": "99\nSome remaining problems:\nthe scope of compensation is still limited in criminal cases \n\n  If the legal agency claims that a suspect has some problems (not crime), it does not need to provide compensation. \n      “因公民自己故意作虚伪供述”而 被羁押或者被判处刑罚的，国家不承担赔偿责任。", "knowledge": "遗留问题：刑事案件赔偿范围仍有限——如法律机关称嫌疑人自身有问题（非犯罪），无需赔偿：「因公民自己故意作虚伪供述」而被羁押或判刑的，国家不承担赔偿责任。", "understand": "「虚伪供述」条款的争议：嫌疑人被逼供认罪后，国家可主张是公民「自己」作的假供述而免责——逼供后果的漏洞条款。", "image": "study-assets/lecture-6/slide-099.jpg", "extract": "遗留问题：刑事案件赔偿范围仍有限——如法律机关称嫌疑人自身有问题（非犯罪），无需赔偿：「因公民自己故意作虚伪供述」而被羁押或判刑的，国家不承担赔偿责任"}, {"id": "L6-100", "lecture": 6, "page": 100, "title": "b. The definition of “violating law” is controversial", "section": "国家赔偿", "source": "100\nb. The definition of “violating law” is controversial \n\nIf a state agency or the legal department takes “inappropriate” but “not illegal” measure, it does not need to make compensation.", "knowledge": "b 「违法」的定义有争议：国家机构或法律部门采取「不当」但「不违法」的措施，无需赔偿。", "understand": "赔偿以「违法」为前提：不当但合法的侵害不赔——大量灰色地带被排除在外。", "image": "study-assets/lecture-6/slide-100.jpg", "extract": "b 「违法」的定义有争议：国家机构或法律部门采取「不当」但「不违法」的措施，无需赔偿"}, {"id": "L6-101", "lecture": 6, "page": 101, "title": "c. Damage caused by public facilities is not compensated.", "section": "国家赔偿", "source": "101\nc. Damage caused by public facilities is not compensated. \n  \ne.g., If roads and bridges are not well managed and cause damage, people who suffer will not be compensated under this scheme of state compensation.", "knowledge": "c 公共设施致害不赔：如道路桥梁管理不善致人损害，不属于国家赔偿范围。", "understand": "国赔空白之三：公共基础设施的侵权责任不在国赔范围内（只能走民事途径）。", "image": "study-assets/lecture-6/slide-101.jpg", "extract": "c 公共设施致害不赔：如道路桥梁管理不善致人损害，受害人不能依国家赔偿获得赔偿"}, {"id": "L6-102", "lecture": 6, "page": 102, "title": "d. Compensation should be made to those who incur loss for p", "section": "国家赔偿", "source": "102\nd. Compensation should be made to those who incur loss for public interests. \n    \n   e.g., military drills; saving other people, etc.   \n  例如，因军队演习、训练、配合执行国家公务，见义勇为，国家保护的野生动物致人身、财产损害等，需 要采取适当方式给予补偿。", "knowledge": "d 为公共利益受损者应获补偿：如军事演习、救人等。原文：因军队演习、训练、配合执行国家公务、见义勇为、国家保护野生动物致人身财产损害等，需采取适当方式给予补偿。", "understand": "「赔偿」与「补偿」的区分：为公益受损（合法行为）叫补偿不叫赔偿——制度仍待完善。", "image": "study-assets/lecture-6/slide-102.jpg", "extract": "d 为公共利益受损者应获补偿：如军事演习、救人等。例如，因军队演习、训练、配合执行国家公务、见义勇为、国家保护野生动物致人身、财产损害等，需要采取适当方式给予补偿"}, {"id": "L6-103", "lecture": 6, "page": 103, "title": "e. Compensation is still relatively low,  raised to 425 yuan", "section": "国家赔偿", "source": "103\ne. Compensation is still relatively low,  raised to 425 yuan/day", "knowledge": "e 赔偿数额仍偏低，已提高到每天 425 元。", "understand": "国赔标准小结：每天 425 元。", "image": "study-assets/lecture-6/slide-103.jpg", "extract": "e 赔偿数额仍偏低，已提高到每天425元"}, {"id": "L6-104", "lecture": 6, "page": 104, "title": "The abolition of the labor-camp system", "section": "劳动教养制度的废除", "source": "104\nThe abolition of the labor-camp system", "knowledge": "章节页：劳动教养制度的废除。", "understand": "进入本讲最后板块：劳教制度的存废——行政权力不经审判剥夺人身自由的典型制度。", "image": "study-assets/lecture-6/slide-104.jpg", "extract": "劳动教养制度的废除"}, {"id": "L6-105", "lecture": 6, "page": 105, "title": "The case of the labor camp (劳动教养)", "section": "劳动教养制度的废除", "source": "105\nThe case of the labor camp (劳动教养)", "knowledge": "图片页：劳动教养案。", "understand": "劳教主题的开场图片。", "image": "study-assets/lecture-6/slide-105.jpg", "extract": "劳动教养案"}, {"id": "L6-106", "lecture": 6, "page": 106, "title": "Sending a person to work in a labor camp, prohibiting the pe", "section": "劳动教养制度的废除", "source": "106\n106\nSending a person to work in a labor camp, prohibiting the person from leaving the camp (no freedom). \n\nIt is based on the regulation of the police department; it is often used because it makes it easier for the police department and local governments to deal with those who commit less serious crimes or political crimes. No need to go through the court.", "knowledge": "劳教制度：把人送进劳教所劳动、不得离开（无人身自由）；依据是公安部门的规定；常被用来处理轻微犯罪或政治性犯罪，因为这对公安和地方政府更方便——无需经过法院。", "understand": "劳教的本质：不经法院审判，公安自己决定剥夺人身自由——行政权对司法权的僭越，违宪性争议的根源。", "image": "study-assets/lecture-6/slide-106.jpg", "extract": "劳教制度：把人送进劳教所劳动、不得离开（无人身自由）；依据是公安部门的规定；常被用来处理轻微犯罪或政治性犯罪，因为这对公安和地方政府更方便——无需经过法院"}, {"id": "L6-107", "lecture": 6, "page": 107, "title": "The system was created in 1955 and abolished in 2013.", "section": "劳动教养制度的废除", "source": "107\nThe system was created in 1955 and abolished in 2013.", "knowledge": "劳教制度 1955 年创立，2013 年废除。", "understand": "起止年份是考点：1955–2013，存续 58 年。", "image": "study-assets/lecture-6/slide-107.jpg", "extract": "该制度1955年创立，2013年废除"}, {"id": "L6-108", "lecture": 6, "page": 108, "title": "第 108 页", "section": "劳动教养制度的废除", "source": "108", "knowledge": "（图片过渡页）", "understand": "劳教制度历史图片页。", "image": "study-assets/lecture-6/slide-108.jpg", "extract": "（本页无提取文字，为图片页）"}, {"id": "L6-109", "lecture": 6, "page": 109, "title": "Beginning in 1956, political enemies needed to be put in a p", "section": "劳动教养制度的废除", "source": "109\n109\nBeginning in 1956, political enemies needed to be put in a place work to support themselves.\n1957, the State Council decided to put those who did not want to work and violated laws and regulations in a place to work. \nLater it was extended to those who were not qualified for arrest; but if they were released, they would increase the unemployment \nBefore 1979, there was no regulation on the maximum period of labor education, and some people were detained as long as 20 years.\nIn 1979, the State Council regulated that a person can be denied personal freedom for 1 to 3 years. It can also be extended for one more year if necessary.", "knowledge": "劳教简史：1956 年起政治敌人需要被集中劳动自养；1957 年国务院决定把不务正业、违法乱纪者集中劳动；后扩展到不够逮捕条件但放了会增加失业的人；1979 年前没有最长时限规定，有人被关押长达 20 年；1979 年国务院规定剥夺人身自由 1–3 年，可延长至 4 年。", "understand": "劳教的演变：从政治工具到治安工具；1979 年前可以无限期（20 年！）——制度之恶的顶点。", "image": "study-assets/lecture-6/slide-109.jpg", "extract": "劳教简史：1956年起政治敌人需要被集中劳动自养；1957年国务院决定把不务正业、违法乱纪者集中劳动；后扩展到不够逮捕条件但放了会增加失业的人；1979年前没有最长时限规定，有人被关押长达20年；1979年国务院规定剥夺人身自由1–3年，可延长"}, {"id": "L6-110", "lecture": 6, "page": 110, "title": "In later years, the categories of those who can be put in th", "section": "劳动教养制度的废除", "source": "110\n110\nIn later years, the categories of those who can be put in the labor camp kept increasing.\nIn 2004, some people in Guangdong proposed to abolish this camp system \nIn 2005, the central authority once planned to work a new law to replace the labor camp system, but it was resisted by the Ministry of Public Security \nYet the pressure was mounting", "knowledge": "后期可被劳教的对象不断扩大；2004 年广东有人提议废除劳教；2005 年中央曾计划立一部新法取代劳教，但遭公安部抵制；压力持续积聚。", "understand": "废除过程的博弈：公安部是劳教的最大受益者也是改革的最大阻力——部门利益阻碍制度变革的典型案例。", "image": "study-assets/lecture-6/slide-110.jpg", "extract": "后期可被劳教的对象不断扩大；2004年广东有人提议废除劳教；2005年中央曾计划立一部新法取代劳教，但遭公安部抵制；压力持续积聚"}, {"id": "L6-111", "lecture": 6, "page": 111, "title": "第 111 页", "section": "劳动教养制度的废除", "source": "111", "knowledge": "（图片过渡页）", "understand": "劳教制度改革相关图片页。", "image": "study-assets/lecture-6/slide-111.jpg", "extract": "（本页无提取文字，为图片页）"}, {"id": "L6-112", "lecture": 6, "page": 112, "title": "e.g., In 2004, Hu was arrested by the county police departme", "section": "劳动教养制度的废除", "source": "112\n112\ne.g., In 2004, Hu was arrested by the county police department for gambling. Later, the city authority ruled that he would be in the labor camp for 15 months.\n\nLegislation Law (中华人民共和国立法法) (passed in 2000, took effect in 2001)\nDepriving a person’s freedom must be based on law. \n\nPolice department’s problems (e.g., theft 700 yuan and 800 yuan)", "knowledge": "例：2004 年胡某因赌博被县公安局逮捕，后市里裁定劳教 15 个月。《立法法》（2000 年通过，2001 年生效）：剥夺人身自由必须以法律为依据。公安部门的冲突案例（如盗窃 700 元与 800 元的处理）。", "understand": "劳教的合法性质疑：《立法法》要求限制人身自由必须有「法律」依据，而劳教依据只是行政法规/公安规定——劳教制度与上位法冲突。", "image": "study-assets/lecture-6/slide-112.jpg", "extract": "例：2004年胡某因赌博被县公安局逮捕，后市里裁定劳教15个月。《立法法》（2000年通过，2001年生效）：剥夺人身自由必须以法律为依据。公安部门的问题（如盗窃700元与800元的处理）"}, {"id": "L6-113", "lecture": 6, "page": 113, "title": "第 113 页", "section": "劳动教养制度的废除", "source": "113", "knowledge": "（图片过渡页）", "understand": "劳教制度相关图片页。", "image": "study-assets/lecture-6/slide-113.jpg", "extract": "（本页无提取文字，为图片页）"}, {"id": "L6-114", "lecture": 6, "page": 114, "title": "The case of Tanghui (唐慧案)", "section": "劳动教养制度的废除", "source": "114\nThe case of Tanghui (唐慧案)\n2006， the 10-year old girl was raped and then was kept by an entertainment site for prostitution. \n\nHer mother fought for justice:\nThe police officers were irresponsible\nSevere punishment of those people keeping her daughter.", "knowledge": "唐慧案（1/3）：2006 年，10 岁女孩被强奸后又被娱乐场所控制卖淫；母亲唐慧为正义而战：警察不负责任；要求严惩控制其女儿的人。", "understand": "唐慧案——推动劳教废除的标志性案例的开端。幼女受害 + 母亲上访。", "image": "study-assets/lecture-6/slide-114.jpg", "extract": "唐慧案：2006年，10岁女孩被强奸后又被娱乐场所控制卖淫；母亲唐慧为正义而战：警察不负责任；要求严惩控制其女儿的人"}, {"id": "L6-115", "lecture": 6, "page": 115, "title": "The case was tried in April 2008:", "section": "劳动教养制度的废除", "source": "115\n   The case was tried in April 2008:\n2 people: death penalty \n2: life in jail\n2: 15 years in jail\n90,000 yuan in compensation \n\nBoth parties appealed.", "knowledge": "案件 2008 年 4 月开审：2 人死刑；2 人无期；2 人 15 年有期徒刑；赔偿 9 万元。双方均上诉。", "understand": "刑事部分的严厉判决（2 死 2 无期），但唐慧仍不满——她的持续上访成为后续冲突的导火索。", "image": "study-assets/lecture-6/slide-115.jpg", "extract": "案件2008年4月开审：2人死刑；2人无期；2人15年有期徒刑；赔偿9万元。双方均上诉"}, {"id": "L6-116", "lecture": 6, "page": 116, "title": "In August 2012, Tang was put in labor camp for 18 months.", "section": "劳动教养制度的废除", "source": "116\n  In August 2012, Tang was put in labor camp for 18 months. \nNine days later, Tang was released. \nIn November 2012, she sued for state compensation, lost. \nIn Jan. 2013, she sued the Labor Management committee, lost in the first instance trial.\nIn July, 2013, second instance trial:\nThe labor management committee paid 1,641 yuan in compensation for the detaining, 1,000 yuan compensation for psychological suffering.", "knowledge": "2012 年 8 月唐慧被劳教 18 个月；9 天后获释；2012 年 11 月她起诉要求国家赔偿，败诉；2013 年 1 月起诉劳教委，一审败诉；2013 年 7 月二审：劳教委赔偿羁押损失 1,641 元、精神损害抚慰金 1,000 元。", "understand": "核心情节：上访母亲反被劳教——劳教被用作打压上访者的工具。舆论哗然后 9 天放人；最终胜诉获赔 2,641 元——数额之小与意义之大形成反差。", "image": "study-assets/lecture-6/slide-116.jpg", "extract": "2012年8月唐慧被劳教18个月；9天后获释；2012年11月她起诉要求国家赔偿，败诉；2013年1月起诉劳教委，一审败诉；2013年7月二审：劳教委赔偿羁押损失1,641元、精神损害抚慰金1,000元"}, {"id": "L6-117", "lecture": 6, "page": 117, "title": "December 28, 2013, It was abolished. Becoming addiction trea", "section": "劳动教养制度的废除", "source": "117\n\u000bDecember 28, 2013, It was abolished. Becoming addiction treatment center", "knowledge": "2013 年 12 月 28 日，劳教制度被废除，劳教所转为戒毒中心。", "understand": "历史终点：58 年的劳教制度正式终结。唐慧案等个案的舆论压力直接推动了改革——公民行动改变制度的案例，也是本讲「民告官」主题的最有力收束。", "image": "study-assets/lecture-6/slide-117.jpg", "extract": "2013年12月28日，劳教制度被废除，（劳教所）转为戒毒中心"}], "sections": [{"lecture": 1, "start": 1, "end": 4, "name": "课程导入与学习要求", "count": 4}, {"lecture": 1, "start": 5, "end": 34, "name": "为什么需要法律：秩序、权利与纠纷解决", "count": 30}, {"lecture": 1, "start": 35, "end": 58, "name": "传统中国社会的法律与调解", "count": 24}, {"lecture": 1, "start": 59, "end": 87, "name": "毛泽东时代：社会组织与法律", "count": 29}, {"lecture": 1, "start": 88, "end": 126, "name": "改革开放后的法治建设", "count": 39}, {"lecture": 2, "start": 1, "end": 21, "name": "中国法律机构与党政关系", "count": 21}, {"lecture": 2, "start": 22, "end": 33, "name": "诉讼类型与案件流程", "count": 12}, {"lecture": 2, "start": 34, "end": 47, "name": "法律机构的独立性与法院结构", "count": 14}, {"lecture": 2, "start": 48, "end": 71, "name": "刑事治理、严打与巡回法院", "count": 24}, {"lecture": 2, "start": 72,
