l institutions in China", "section": "中国法律机构与党政关系", "source": "Legal institutions in China:\rPeople’s courts 人民法院:\r1. The Supreme Court 最高法院\r2. High court 高级法院 (often at the provincial-level)\r3. Intermediate court 中级法院 (at the city level)\r4. Grassroots court 基层法院 (at the county-level or lower)\r5. Other specialized courts 专门法院, e.g., military court\n10\n10", "knowledge": "法院系统四级：最高法院 → 高级法院（省级）→ 中级法院（市级）→ 基层法院（县级）。", "understand": "中国法院的四级架构与行政层级一一对应——这正是地方干预的制度通道：法院的级别、人事、经费都跟着行政区划走。", "image": "study-assets/lecture-2/slide-010.jpg", "extract": "中国的法律机构：人民法院——1 最高法院；2 高级法院（通常在省级）；3 中级法院（市级）；4 基层……"}, {"id": "L2-011", "lecture": 2, "page": 11, "title": "第 11 页", "section": "中国法律机构与党政关系", "source": "11", "knowledge": "（图片过渡页）", "understand": "无提取文字，为法院建筑或庭审场景图片页。", "image": "study-assets/lecture-2/slide-011.jpg", "extract": "（本页无可提取文字，为图片页）"}, {"id": "L2-012", "lecture": 2, "page": 12, "title": "People’s procuracy 人民检察院", "section": "中国法律机构与党政关系", "source": "People’s procuracy 人民检察院\rRepresenting the state in the court; monitoring the courts and the public security bureaus; responsible for anti-corruption in China\r1. the Supreme Procuracy 最高人民检察院\r2. Provincial (or municipal) procuracy 省检察院\r3. City 市检察院\r4. County 县检察院\n12\n12", "knowledge": "检察院：代表国家出庭、监督法院和公安局、（改革前）负责反贪。层级：最高检到地方各级检察院。", "understand": "检察院的三重职能：公诉 + 法律监督 + （2018 年前）反贪侦查。注意监察委成立后反贪职能已划出——L2-016 会讲。", "image": "study-assets/lecture-2/slide-012.jpg", "extract": "人民检察院：在法庭上代表国家；监督法院和公安局；负责中国的反贪工作。1 最高检……"}, {"id": "L2-013", "lecture": 2, "page": 13, "title": "Public security bureau (police department)", "section": "中国法律机构与党政关系", "source": "Public security bureau (police department)\r公安局\rResponsible for public security and investigation of crimes \r1. The Ministry of Public Security 公安部\r2. Provincial or municipal bureau of public security 省公安厅\r3. City public security bureau 市公安局\r4. County public security bureau 县公安局\r5. Police station 派出所\n13\n13", "knowledge": "公安局：负责社会治安和刑事侦查。层级：公安部 → 省/市公安局 → 县局。", "understand": "公安的双重角色：行政机关 + 刑事侦查机关。它在刑事诉讼中的强势地位（后文「公安做饭」比喻）源于此。", "image": "study-assets/lecture-2/slide-013.jpg", "extract": "公安局（警察部门）：负责社会治安和刑事侦查。1 公安部；2 省或市级公安局……"}, {"id": "L2-014", "lecture": 2, "page": 14, "title": "National security bureau 国家安全局", "section": "中国法律机构与党政关系", "source": "National security bureau 国家安全局\rDealing with national security issues (e.g., monitoring foreigners in China)\r1. At the national level /国家安全局\r2. At the provincial level/省安全局\r3. At the city level/ 市安全局\n14", "knowledge": "国家安全局：处理国家安全事务（如监控在华外国人）。层级：国安部 → 省安全局 → 地方。", "understand": "第四套执法机构：国安系统，与公安平行但分管国家安全领域。", "image": "study-assets/lecture-2/slide-014.jpg", "extract": "国家安全局：处理国家安全事务（如监控在华外国人）。1 国家级/国家安全部；2 省级/省安全局；3 ……"}, {"id": "L2-015", "lecture": 2, "page": 15, "title": "The party and government versus legal departments", "section": "中国法律机构与党政关系", "source": "The party and government versus legal departments:\r\rThe party and government have much influence or even control over legal departments\ra. personnel appointment \rb. financial resources\rc. coordination organizations: (political-legal affairs committee) \rd. intervention in corruption investigation\n15\n15", "knowledge": "党和政府与法律部门的关系：党政对法律部门有很大影响甚至控制，途径：a 人事任命；b 财政资源。", "understand": "本讲核心命题之二：司法不独立的两大机制——管人的（任命权）和管钱的（财政）都在地方党政手中。后面所有司法问题都可追溯到这里。", "image": "study-assets/lecture-2/slide-015.jpg", "extract": "党和政府与法律部门：党政对法律部门有很大影响甚至控制——a 人事任命；b 财政资源……"}, {"id": "L2-016", "lecture": 2, "page": 16, "title": "The Supervision Commission (监察委)", "section": "中国法律机构与党政关系", "source": "The Supervision Commission (监察委)\r纪委\rDiscipline inspection commission \r\r\rCreated in 2018;\rMonitoring and investigating all the employees in the public sector.\n16", "knowledge": "监察委员会（2018 年设立）：监察所有公职人员；与纪委（纪律检查委员会）合署。", "understand": "2018 年体制变革：监察委接管原属检察院的反贪职能，实现公职人员监察全覆盖。注意纪委（党内）与监察委（国家）一套人马两块牌子。", "image": "study-assets/lecture-2/slide-016.jpg", "extract": "监察委员会/纪委（纪律检查委员会）：2018年设立；监察调查所有公共部门的工作人员。"}, {"id": "L2-017", "lecture": 2, "page": 17, "title": "Coordination organization", "section": "中国法律机构与党政关系", "source": "Coordination organization \r(1) Political-legal affairs committee政法委员会\rIn 1980, the central party committee decided to establish the central political-legal affairs committee. \rThe PLC coordinates the legal departments, and its head is also in the standing committee of the party committee at each level.\n17\n17", "knowledge": "协调机构（1）：政法委员会——1980 年中央决定设立中央政法委。", "understand": "党协调政法各部门的装置：政法委把法院、检察院、公安置于党的统一协调之下，是党管政法的制度化渠道。", "image": "study-assets/lecture-2/slide-017.jpg", "extract": "协调机构：(1) 政法委员会——1980年党中央决定成立中央政法委员会……"}, {"id": "L2-018", "lecture": 2, "page": 18, "title": "The central political-legal affairs committee 中央政法委", "section": "中国法律机构与党政关系", "source": "The central political-legal affairs committee 中央政法委\rProvincial or municipal political-level affairs committee省政法委\rCity political-legal affairs committee 市政法委\rCounty political-legal affairs committee 县政法委\r常委会\rWho heads this committee?\rAt the local level, the head can be one of the heads of the legal departments (e.g., the public security bureau).\n18\n18", "knowledge": "政法委的层级：中央政法委 → 省政法委 → 市政法委 → 县政法委。", "understand": "政法委与行政层级一一对应，层层设置。它解释了重大敏感案件为何常由地方党委「协调」定调。", "image": "study-assets/lecture-2/slide-018.jpg", "extract": "中央政法委；省政法委；市政法委；县政法委……"}, {"id": "L2-019", "lecture": 2, "page": 19, "title": "(2) Corruption case", "section": "中国法律机构与党政关系", "source": "(2) Corruption case: \rDiscipline inspection committee/inspection bureau; procuracy; the court\rDiscipline inspection committee (纪律检查委员会) in the party； 纪委\rInspection bureau (监察局) in the government\r\rThe two organizations work together on corruption cases: \ra. Receiving reports on corruption and/or investigation  \rb. Collecting evidence\n19\n19", "knowledge": "协调机构（2）：腐败案件流程——纪委（党内）/监察局（政府）先查，再移交。", "understand": "腐败案件的双轨起点：纪委（党内纪律）与监察局（行政监察）先行调查，之后才进入司法程序。", "image": "study-assets/lecture-2/slide-019.jpg", "extract": "(2) 腐败案件：纪检委/监察局；检察院；法院。党内的纪律检查委员会（纪委）；政府的监察局……"}, {"id": "L2-020", "lecture": 2, "page": 20, "title": "c. Transfer the case to the procuracy (检察院) for public prosecution/anticorruption …", "section": "中国法律机构与党政关系", "source": "c. Transfer the case to the procuracy (检察院) for public prosecution/anticorruption bureau  \rd. The procuracy lodges a lawsuit against suspected corrupt public employee to the court \r\r双规: reporting your problems in a regulated place at a regulated time.\n20\n20", "knowledge": "腐败案件流程（续）：c 移交检察院提起公诉/反贪部门；d 检察院向法院起诉涉嫌腐败的公职人员。", "understand": "完整链条：纪委/监察调查 → 检察院 → 法院审判。注意纪委前置意味着党员干部先受党纪审查、后受法律审判。", "image": "study-assets/lecture-2/slide-020.jpg", "extract": "c 把案件移交检察院（反贪部门）提起公诉；d 检察院向法院起诉涉嫌腐败的公职人员……"}, {"id": "L2-021", "lecture": 2, "page": 21, "title": "The Supervision Commission (监察委)", "section": "中国法律机构与党政关系", "source": "The Supervision Commission (监察委)\r纪委\rDiscipline inspection commission \r\r留置/双规\rCreated in 2018;\rMonitoring and investigating all the employees in the public sector.\n21", "knowledge": "监察委（2018）：与纪委合署，手段包括留置（取代「双规」），监察所有公职人员。", "understand": "「双规」到「留置」的变化是法治化的名义进步：从党纪措施变成法定强制措施。记住两个术语：留置 / 双规。", "image": "study-assets/lecture-2/slide-021.jpg", "extract": "监察委员会/纪委：留置/双规；2018年设立；监察调查所有公共部门的工作人员。"}, {"id": "L2-022", "lecture": 2, "page": 22, "title": "Interactions among legal departments", "section": "诉讼类型与案件流程", "source": "Interactions among legal departments:\r\rTypes of lawsuits in China\rCivil 民事 \rCriminal 刑事\rAdministrative litigation 行政诉讼\r\rParties involved:\rPlaintiff: the party filing the lawsuit, 原告\rDefendant: the party sued, 被告\n22\n22", "knowledge": "法律部门的互动；中国三类诉讼：民事、刑事、行政诉讼。当事人：原告（plaintiff）与被告（defendant）。", "understand": "进入诉讼类型板块。三类诉讼的区分是必考：民事（私人之间）、刑事（国家诉犯罪人）、行政（民告官）。", "image": "study-assets/lecture-2/slide-022.jpg", "extract": "法律部门之间的互动：中国诉讼的类型——民事、刑事、行政诉讼；当事人：原告（提起诉讼的一方）……"}, {"id": "L2-023", "lecture": 2, "page": 23, "title": "Criminal 刑事", "section": "诉讼类型与案件流程", "source": "Criminal 刑事\r\rCriminal matters are brought by the government for criminal violations of law such as theft, murder, fraud, assault, robbery, and corruption.\n23\n23", "knowledge": "刑事诉讼：由政府（检察院）对盗窃、谋杀、诈骗、伤害、抢劫、腐败等违法犯罪提起公诉。", "understand": "刑事案件的特征：原告是国家而非受害者个人，后果是刑罚。列举的罪名了解即可。", "image": "study-assets/lecture-2/slide-023.jpg", "extract": "刑事：刑事事项由政府就盗窃、谋杀、诈骗、伤害、抢劫、腐败等违法犯罪提起公诉。"}, {"id": "L2-024", "lecture": 2, "page": 24, "title": "Civil 民事", "section": "诉讼类型与案件流程", "source": "Civil 民事 \rCivil cases include a wide range of non-criminal legal matters such as divorce, real estate, contracts and business litigation. Civil matters are brought by businesses, the government, and private individuals as a means of enforcing their rights. \r\rCommercial cases belong to the category of civil cases in China\n24\n24", "knowledge": "民事诉讼：离婚、房产、合同、商事纠纷等非刑事事务，由企业、个人等社会主体提起。", "understand": "民事案件的特征：私人对私人，解决的是权利义务纠纷，救济方式多为赔偿。", "image": "study-assets/lecture-2/slide-024.jpg", "extract": "民事：民事案件包括离婚、房产、合同、商事诉讼等广泛的非刑事法律事务；由企业、个人等提起……"}, {"id": "L2-025", "lecture": 2, "page": 25, "title": "Administrative litigation:行政诉讼", "section": "诉讼类型与案件流程", "source": "Administrative litigation:行政诉讼\rState compensation: 国家赔偿\r\rCitizens, business, or other social actors sue the government or its agencies for its law violation.\n25\n25", "knowledge": "行政诉讼：公民、企业或其他社会主体起诉政府及其机构的违法行为；相关制度是国家赔偿。", "understand": "「民告官」是行政诉讼的标志。它的立案难、胜诉难正是后面 L2-038 起「法院受地方干预」讨论的焦点。", "image": "study-assets/lecture-2/slide-025.jpg", "extract": "行政诉讼/国家赔偿：公民、企业或其他社会主体起诉政府或其机构的违法行为。"}, {"id": "L2-026", "lecture": 2, "page": 26, "title": "In criminal cases in China", "section": "诉讼类型与案件流程", "source": "In criminal cases in China:\rThe public security bureau is responsible for the investigation and evidence collection.\r公安做饭\rThe procuracy is responsible for filing the lawsuit against the defendant on behalf of the government. 检察院送饭\rThe court makes the ruling 法院吃饭\rThe lawyer defends the accused, facing many difficulties (to be discussed in a later lecture) 律师讨饭\n26\n26", "knowledge": "刑事案件的部门分工（形象说法）：公安局侦查取证（公安做饭）→ 检察院起诉（检察院端饭）→ 法院审判（法院吃饭）。", "understand": "著名比喻：做饭—端饭—吃饭，形容流水线上公安主导、检法配合的模式。批评点：法院应是中立的裁判，「吃饭」比喻暗示其被动接受公安的结论。", "image": "study-assets/lecture-2/slide-026.jpg", "extract": "中国的刑事案件：公安局负责侦查取证——公安做饭；检察院负责起诉——检察院端饭；法院审判——法院吃饭……"}, {"id": "L2-027", "lecture": 2, "page": 27, "title": "Example: a murder case", "section": "诉讼类型与案件流程", "source": "Example: a murder case:\rThe police officers investigate the case and collect evidence.\rIf they find a suspect and have some evidence, they will apply to the procuratorate for arresting the suspect.\rAfter they obtain enough evidence, they will transfer the case to the procuratorate.\rThe procuratorate represents the state and file the lawsuit against the suspect to the court.\r\r(elsewhere, the police and the procuratorate work together)\n27\n27", "knowledge": "示例：谋杀案流程——警察侦查取证 → 有嫌疑人后向检察院申请批捕 → 进入起诉审判。", "understand": "具体化上一页的分工：侦查权在公安，批捕权和起诉权在检察院，审判权在法院。 箭头顺序：police investigate → apply to procuratorate for arrest → prosecution → trial。", "image": "study-assets/lecture-2/slide-027.jpg", "extract": "例：谋杀案——警察侦查案件、收集证据；如发现嫌疑人并有一定证据，向检察院申请批捕……"}, {"id": "L2-028", "lecture": 2, "page": 28, "title": "An example of civil and criminal case in Hebei", "section": "诉讼类型与案件流程", "source": "An example of civil and criminal case in Hebei\r\rIn 1997, Kang, a girl began to work for a barbershop opened by Zhou in Hebei province.\r\rOral agreement:\ra. Kang will receive 2,000 yuan if she worked there for one year.\r\rb. Kang will pay Zhou 350 yuan in tuition fee per month if she fails to work for one year there.\n28\n28", "knowledge": "河北案例：1997 年康某到周某理发店打工，口头约定报酬 2,000 元。", "understand": "民刑交叉案例的开端。注意细节：oral agreement（口头协议）——后面案情转折都因这个不规范的约定而起。", "image": "study-assets/lecture-2/slide-028.jpg", "extract": "河北一个民事与刑事交叉的案例：1997年，女孩康某开始为周某在河北开的理发店工作；口头约定：a 康某可得2,000元……"}, {"id": "L2-029", "lecture": 2, "page": 29, "title": "By May 1998, Kang worked there for eight months, but did not receive a penny. She …", "section": "诉讼类型与案件流程", "source": "By May 1998, Kang worked there for eight months, but did not receive a penny. She then quit and found another job.\r\rZhou found Kang and asked her to pay 2,000 yuan in tuition.\r\rWas Zhou’s demand reasonable?\n29\n29", "knowledge": "案情：到 1998 年 5 月康某干了八个月分文未得，辞职另找工作；周某找到她反要她付 2,000 元学费。", "understand": "纠纷升级：欠薪在前、索赔在后，双方各执一词。口头约定的模糊性使案件性质难以简单界定。", "image": "study-assets/lecture-2/slide-029.jpg", "extract": "到1998年5月，康某干了八个月却分文未得，于是辞职另找工作；周某找到康某，反要她付2,000元学费。……"}, {"id": "L2-030", "lecture": 2, "page": 30, "title": "Zhou and her people brought Kang back to the barbershop and detained her there, re…", "section": "诉讼类型与案件流程", "source": "Zhou and her people brought Kang back to the barbershop and detained her there, requiring her to pay the 2,000 yuan. \r\rWorse:\rWith the help of her people, Zhou shaved some parts of Kang’s hairs (i.e., the top of the head and the back of the head: half bold) (阴阳头).\n30\n30", "knowledge": "案情恶化：周某带人把康某强行带回理发店扣留，逼要 2,000 元，并剃了康某部分头发羞辱她。", "understand": "民事纠纷质变为刑事犯罪：扣留（非法拘禁）+ 剃阴阳头（侮辱）。案件性质的转变是本页核心。", "image": "study-assets/lecture-2/slide-030.jpg", "extract": "周某带人把康某带回理发店扣留，要她付2,000元；更过分的是：周某在他人协助下剃掉了康某部分头发……"}, {"id": "L2-031", "lecture": 2, "page": 31, "title": "阴阳头", "section": "诉讼类型与案件流程", "source": "阴阳头 \r(partly bold head)\n31\n31", "knowledge": "插图页：阴阳头（partly bald head）。", "understand": "图片说明羞辱方式。剃阴阳头是公开的、标记性的侮辱，构成侮辱罪的直观证据。", "image": "study-assets/lecture-2/slide-031.jpg", "extract": "阴阳头（剃掉部分头发的头）。"}, {"id": "L2-032", "lecture": 2, "page": 32, "title": "What was the nature of this case?", "section": "诉讼类型与案件流程", "source": "What was the nature of this case? \rIt is a case involving both civil and criminal issues.\rCivil: work pay (the oral agreement was illegal)\r\rCriminal: insult/hurt other people \rThe procuratorate sued Zhou to the court.\n32\n32", "knowledge": "案件定性：民刑交叉——民事部分是劳动报酬（口头协议违法）；刑事部分是侮辱伤害他人。", "understand": "本案例的教学要点：一个纠纷可以同时包含民事和刑事两个面向，分别走不同程序、承担不同责任。", "image": "study-assets/lecture-2/slide-032.jpg", "extract": "案件的性质？这是民事与刑事交叉的案件：民事——劳动报酬（口头协议不合法）；刑事——侮辱/伤害他人……"}, {"id": "L2-033", "lecture": 2, "page": 33, "title": "Result", "section": "诉讼类型与案件流程", "source": "Result:\r\ra. Civil part: \rZhou needed to pay the owed salary, transportation, and compensation (mental pressure), 40,000 yuan. \r\rb. criminal part:\rZhou used violence to insult other people, sentenced to jail for six months.\n33\n33", "knowledge": "结果：民事部分——周某须补发工资、交通费及精神赔偿共 4 万元；刑事部分——周某因暴力侮辱他人获刑。", "understand": "判决验证了民刑分立：赔钱解决民事，坐牢解决刑事。精神赔偿（mental pressure）获支持是细节考点。 40,000 元是民事赔偿总额（含欠薪、交通、精神赔偿），不要与刑事刑罚混淆。", "image": "study-assets/lecture-2/slide-033.jpg", "extract": "结果：a 民事部分：周某须支付所欠工资、交通费和精神赔偿共4万元；b 刑事部分：周某用暴力侮辱他人……"}, {"id": "L2-034", "lecture": 2, "page": 34, "title": "Party/Government and legal departments in China", "section": "法律机构的独立性与法院结构", "source": "Party/Government and legal departments in China\r\rThe problem of independence\n34\n34", "knowledge": "章节页：中国党和政府与法律部门——独立性问题。", "understand": "过渡页，进入本讲最核心议题：司法独立（的缺失）。", "image": "study-assets/lecture-2/slide-034.jpg", "extract": "中国的党/政府与法律部门：独立性问题。"}, {"id": "L2-035", "lecture": 2, "page": 35, "title": "The party and/or government versus legal departments", "section": "法律机构的独立性与法院结构", "source": "The party and/or government versus legal departments:\r\rThe party and government have much influence or even control over legal departments\ra. personnel appointment \rb. financial resources\rc. coordination organizations: (political-legal affairs committee) \rd. intervention in corruption investigation\n35\n35", "knowledge": "党政对法律部门的影响甚至控制：a 人事任命；b 财政资源。", "understand": "与 L2-015 同构的重申——本节将展开讨论这两条机制如何具体运作。", "image": "study-assets/lecture-2/slide-035.jpg", "extract": "党和政府与法律部门：党政对法律部门有很大影响甚至控制——a 人事任命；b 财政资源……"}, {"id": "L2-036", "lecture": 2, "page": 36, "title": "Types of law in China", "section": "法律机构的独立性与法院结构", "source": "Types of law in China:\r (1) Laws made by the NPC or its standing committee; \r(2) Administrative stipulations made by the State Council; 国务院\r(3) Local stipulations made by the provincial or lower-level people’s congress or its       standing committee; \r(4) Autonomous or special stipulations made by the people’s congress of an autonomous region.\n36\n36", "knowledge": "中国法律渊源的层级：1 全国人大及其常委会制定的法律；2 国务院行政法规；3 省级地方性法规。", "understand": "法的形式层级：法律 > 行政法规 > 地方性法规。下位法服从上位法。三类渊源是考点。", "image": "study-assets/lecture-2/slide-036.jpg", "extract": "中国的法律类型：(1) 全国人大或其常委会制定的法律；(2) 国务院制定的行政法规；(3) 省级制定的地方性法规……"}, {"id": "L2-037", "lecture": 2, "page": 37, "title": "Implications", "section": "法律机构的独立性与法院结构", "source": "Implications:\rThe governments at each level can make local regulations to enforce policies, and some of these policies can be controversial.\n37\n37", "knowledge": "影响：各级地方政府可以制定地方性规章执行政策，其中一些政策可能引发争议。", "understand": "立法权的分散意味着地方可以用「合法形式」推行有争议的政策（如计划生育、拆迁），法院面对这些政策时处境尴尬——引出下一页立案问题。", "image": "study-assets/lecture-2/slide-037.jpg", "extract": "影响：各级政府可以制定地方性规章来执行政策，其中一些政策可能有争议。"}, {"id": "L2-038", "lecture": 2, "page": 38, "title": "Lawsuit acceptance", "section": "法律机构的独立性与法院结构", "source": "Lawsuit acceptance \r(1) Cases related to the implementation of central or local policies may not be accepted by the courts: \r\re.g., \rFamily planning;\rHousing demolition\n38\n38", "knowledge": "立案问题（1）：涉及中央或地方政策执行的案件，法院可能不予受理——如计划生育、房屋拆迁。", "understand": "法院的第一道闸门：立案（acceptance）。政策敏感案件被挡在门外，说明司法救济的可及性受政策制约。两个例子（计生、拆迁）是考点。", "image": "study-assets/lecture-2/slide-038.jpg", "extract": "立案：(1) 涉及中央或地方政策执行的案件，法院可能不予受理——如计划生育、房屋拆迁……"}, {"id": "L2-039", "lecture": 2, "page": 39, "title": "Cases Courts Refused to Take as Reported by Lawyers (N=248)", "section": "法律机构的独立性与法院结构", "source": "Cases Courts Refused to Take as Reported by Lawyers (N=248)\nCategories  | Number of Lawyers | Frequencies (%)\nState compensation, administrative litigation  | 125 | 50.4\nCivil  |  66 | 26.6\nCriminal  |  17 |   6.9\nEconomic  |    5 |   2.0\nOthers  |  35 | 14.1\nTotal  | 248 |            100\n39\n39", "knowledge": "表格：律师报告的法院拒收案件类型（N=248）——国家赔偿、行政诉讼居首（125 人，50.4%）。", "understand": "数据证实上页判断：被拒最多的正是「民告官」类案件（超半数律师报告过）。说明行政诉讼立案难是普遍现象而非个案。 N=248 是受访律师总数；第二列是报告该类案件被拒的律师人数，第三列是占比（%）。第一行 50.4% 是最高项，说明行政类案件被拒最普遍。百分比的分母是律师人数而非案件数。", "image": "study-assets/lecture-2/slide-039.jpg", "extract": "律师报告的法院拒收案件（N=248）：国家赔偿、行政诉讼——125名律师、占50.4%；民事……"}, {"id": "L2-040", "lecture": 2, "page": 40, "title": "(2) Some cases are accepted with the permission of the local leaders", "section": "法律机构的独立性与法院结构", "source": "(2) Some cases are accepted with the permission of the local leaders\r\re.g., peasants sued the government \r\rA woman in a production group of a village in Hunan province gave birth to a fourth child in 1996.\rThe township family planning office took away the baby four days after she was born and returned the baby 10 days later after she was ill.\n40\n40", "knowledge": "立案问题（2）：有些案件需经地方领导同意才受理。例：农民告政府——湖南某村一妇女生育……", "understand": "立案的第二道闸门：领导批案。受理与否取决于地方领导态度而非法律标准，司法的自主性让位于行政意志。", "image": "study-assets/lecture-2/slide-040.jpg", "extract": "(2) 有些案件需经地方领导同意才受理。例：农民告政府——湖南某村一生产组的一名妇女生了……"}, {"id": "L2-041", "lecture": 2, "page": 41, "title": "A group of township cadres went to the village to collect fines.", "section": "法律机构的独立性与法院结构", "source": "A group of township cadres went to the village to collect fines. \rIf a family in a production group violated family planning, all the people in that group would be fined. \rEach of the 62 villagers in this group was fined 50 yuan. \rPeasants refused to pay.\rTownship officials arrested and beat the villagers, and each person paid. \rThe villagers lodged a lawsuit against the township government in the city court. \rThe judges were reluctant to accept the case.\n41\n41", "knowledge": "案例背景：乡镇干部进村收罚款——某生产组有家庭违反计生政策，全组都要被罚。", "understand": "连坐式罚款是案件的导火索：一户超生全组受罚，引发农民起诉乡政府。政策本身的争议性使法院夹在法律与地方政策之间。", "image": "study-assets/lecture-2/slide-041.jpg", "extract": "一群乡镇干部进村收罚款：生产组有家庭违反计划生育，全组人都被罚款；每人……"}, {"id": "L2-042", "lecture": 2, "page": 42, "title": "After consulting with the city people’s congress and the city family planning comm…", "section": "法律机构的独立性与法院结构", "source": "After consulting with the city people’s congress and the city family planning commission, it accepted the case a month later. \rThe city party committee held a meeting attended by the leaders from the city government, the people’s congress, the family planning committee, the women’s association, and the township government. \rThe government and the court persuaded peasants to withdraw the case\rPeasants were compensated, but township officials were not punished.\n42\n42", "knowledge": "案件后续：法院咨询市人大和市计生委后，一个月才受理；市委还专门开会研究。", "understand": "一个普通行政案件要走完「请示—协调—开会」的漫长流程才能立案，直观展示 L2-035 的两条机制如何运作：法院不敢独立决定。", "image": "study-assets/lecture-2/slide-042.jpg", "extract": "法院咨询市人大和市计生委后，一个月才受理此案；市委召开了有……参加的会议"}, {"id": "L2-043", "lecture": 2, "page": 43, "title": "(3) Some civil cases that are difficult to handle may also be rejected by the cour…", "section": "法律机构的独立性与法院结构", "source": "(3) Some civil cases that are difficult to handle may also be rejected by the courts (e.g., lack of laws or explicit stipulations)\r\re.g., females who marry someone outside the village want to come back\r\rAlso, courts’ performance is assessed on the basis of the enforcement of their rulings in some places.\n43\n43", "knowledge": "立案问题（3）：难办的民事案件也可能被法院拒之门外（缺乏法律或明确规定）——如外嫁女的土地权益纠纷。", "understand": "第三道闸门：法律空白成为拒绝受理的借口。外嫁女（嫁出村的女性）土地权益是典型例子——村规与法律冲突，法院不愿碰。", "image": "study-assets/lecture-2/slide-043.jpg", "extract": "(3) 难办的民事案件也可能被法院拒收（缺乏法律或明确规定）——如嫁到外村的女性……"}, {"id": "L2-044", "lecture": 2, "page": 44, "title": "Court rulings", "section": "法律机构的独立性与法院结构", "source": "Court rulings:\r\rCourt rulings may be affected by external or social factors  \r\rExamples about the “underground societies”\n44\n44", "knowledge": "法院判决可能受外部或社会因素影响。例：与「黑社会」（underground societies）相关的案件。", "understand": "从立案转向审判环节：即使立了案，判决也会受政治运动等因素干扰。「打黑」运动是下文的例子。", "image": "study-assets/lecture-2/slide-044.jpg", "extract": "法院判决：判决可能受外部或社会因素影响——关于「黑社会」的例子……"}, {"id": "L2-045", "lecture": 2, "page": 45, "title": "Court Structure", "section": "法律机构的独立性与法院结构", "source": "Court Structure:\r\rJudicial committee: 审判委员会\rMembers:\rPresidents, division chiefs and experienced judges, selected by the standing committee of the people’s congress, upon the recommendation of the president of the court. (correcting the error in the reading)\n45", "knowledge": "法院内部结构：审判委员会——成员包括院长、庭长和资深法官，由人大常委会根据院长提名选任。", "understand": "审判委员会（judicial committee）是中国法院特有的内部权力机构：重大疑难案件由它讨论决定，承办法官反而没有最终决定权——「审者不判、判者不审」的问题。", "image": "study-assets/lecture-2/slide-045.jpg", "extract": "法院结构：审判委员会——成员为院长、庭长和资深法官，由人大常委会根据院长提名选任……"}, {"id": "L2-046", "lecture": 2, "page": 46, "title": "Collegial panel: 合议庭", "section": "法律机构的独立性与法院结构", "source": "Collegial panel: 合议庭\r\r3-7 members, odd number\r\rThe president judge of the panel is appointed by the court president or the division chief.\n46", "knowledge": "合议庭：3–7 人组成，人数为奇数；审判长由院长或庭长指定。", "understand": "合议庭是常规审判组织。两个数字考点：3–7 人、奇数（便于投票表决）；审判长任命权在院庭长手中——行政化的又一体现。", "image": "study-assets/lecture-2/slide-046.jpg", "extract": "合议庭：3–7人，奇数；审判长由院长或庭长指定。"}, {"id": "L2-047", "lecture": 2, "page": 47, "title": "Courts’ independence", "section": "法律机构的独立性与法院结构", "source": "Courts’ independence: \rWhen campaigns are launched, government regulations may be more influential than the law (e.g., campaigns of wiping out underground societies).\n47", "knowledge": "法院的独立性：运动来临时，政府规章可能比法律更有影响力（如打黑运动）。", "understand": "规律总结：日常时期法院按法办事，运动（campaign）时期政策压倒法律。「运动式治理」对司法的冲击是下一板块主题。", "image": "study-assets/lecture-2/slide-047.jpg", "extract": "法院的独立性：运动来临时，政府规章可能比法律更有影响力（如打黑运动）。"}, {"id": "L2-048", "lecture": 2, "page": 48, "title": "The rationale behind the punishment of organized crimes/under ground society.", "section": "刑事治理、严打与巡回法院", "source": "The rationale behind the punishment of organized crimes/under ground society. \r\rThreaten social stability \rChallenge state authority\n48", "knowledge": "打击有组织犯罪/黑社会的理由：威胁社会稳定；挑战国家权威。", "understand": "为什么对黑社会从重从快：它不仅是治安问题更是政治问题——有组织的犯罪形成与政权竞争的力量。两条理由（stability + authority）是考点。", "image": "study-assets/lecture-2/slide-048.jpg", "extract": "打击有组织犯罪/黑社会的理由：威胁社会稳定；挑战国家权威。"}, {"id": "L2-049", "lecture": 2, "page": 49, "title": "Criminal Groups and Members", "section": "刑事治理、严打与巡回法院", "source": "Criminal Groups and Members\rYear      Groups      Members\r1985       27,000     106,000\r1990      100,527    368,885\r1995     140,000     540,000\r1996     136,225     670,000\r     105,915     n/a\r1998     102,314    361,927\r1999      95,000      N/A\r2000      82,000     N/A\r2001      73,000       N/A\r2002      56,000       n/a\n49", "knowledge": "表格：犯罪团伙与成员数量——1985 年 2.7 万个团伙/10.6 万人 → 1990 年 10 万个/36.9 万人 → 1995 年 14 万个/54 万人 → 1996 年 13.6 万个/67 万人。", "understand": "数据说明有组织犯罪在 1980–90 年代快速膨胀：十年间团伙数增长约 5 倍、成员增长约 6 倍。这为严打提供了「治安恶化」的背景依据。 三列分别是年份、团伙数、成员数。看趋势不看单点：1985→1996 全面上升；成员增速快于团伙增速，说明团伙在变大。均为存量统计。", "image": "study-assets/lecture-2/slide-049.jpg", "extract": "犯罪团伙与成员：1985年27,000团伙/106,000人；1990年100,527/368,885；1995年140,000/540,000；1996年136,225/670,000……"}, {"id": "L2-050", "lecture": 2, "page": 50, "title": "Provinces that have more such groups", "section": "刑事治理、严打与巡回法院", "source": "Provinces that have more such groups:\r\rGuangdong; Guangxi\rHunan; Hubei; \rHenan, Hebei, \rShanxi, Shaanxi, \rAnhui, Liaoning,\n50", "knowledge": "犯罪团伙较多的省份：广东、广西、湖南、湖北、河南、河北、山西、陕西、安徽、辽宁。", "understand": "地域分布：经济活跃省份（广东）与中部人口大省并存，说明有组织犯罪既跟流动人口也跟经济机会走。", "image": "study-assets/lecture-2/slide-050.jpg", "extract": "此类团伙较多的省份：广东、广西、湖南、湖北、河南、河北、山西、陕西、安徽、辽宁。"}, {"id": "L2-051", "lecture": 2, "page": 51, "title": "Defining organized crimes/underground societies in China.", "section": "刑事治理、严打与巡回法院", "source": "Defining organized crimes/underground societies in China. \r\rReceiving protection from party or government officials (i.e., protective umbrella/保护伞, casinos/ nigh clubs/other businesses). campaigns\n51", "knowledge": "中国有组织犯罪/黑社会的定义特征：获得党政官员庇护（「保护伞」——赌场、夜总会等生意）。", "understand": "中国式黑社会的关键不在暴力而在「关系」：没有官员保护伞就成不了气候。「保护伞」（protective umbrella）是核心术语。", "image": "study-assets/lecture-2/slide-051.jpg", "extract": "中国有组织犯罪/黑社会的界定：获得党政官员庇护（即保护伞——赌场、夜总会及其他生意……"}, {"id": "L2-052", "lecture": 2, "page": 52, "title": "Legal institutions and political need.", "section": "刑事治理、严打与巡回法院", "source": "Legal institutions and political need. \rThe case of striking hard (严打) (1983-1984):\r\rBackground:\rDeteriorating public security in the early 1980s (e.g., rape, robbery, thefts) \r\rCampaigns:\rMobilize resources and manpower to achieve a policy goal within a certain period of time (etc., family planning)://quota or clear targets\n52\n52", "knowledge": "法律机构与政治需要：1983–1984 年「严打」——背景是 1980 年代初治安恶化（强奸、抢劫、盗窃等）。", "understand": "进入严打板块。严打是运动式司法的典型：用政治运动方式搞刑事司法。记住首次严打时间 1983–1984。", "image": "study-assets/lecture-2/slide-052.jpg", "extract": "法律机构与政治需要：1983–1984年严打案——背景：1980年代初治安恶化（强奸、抢劫、盗窃等）……"}, {"id": "L2-053", "lecture": 2, "page": 53, "title": "Targets", "section": "刑事治理、严打与巡回法院", "source": "Targets: \ra. “hooligan” gang members/地坯流氓  \rb. criminals who fled from place to place/流窜犯 \rc. murderers, arsonists, bombers, narcotic traffickers, rapists, robbers and serious thieves\rd. traffickers in women and children \re. other types of criminals, including “counter-revolutionary elements/反革命分子) overthrowing the government/颠覆政府罪\n53\n53", "knowledge": "严打对象：a 流氓团伙成员（地痞流氓）；b 流窜犯；c 杀人、放火、爆炸、贩毒、强奸、抢劫和重大盗窃犯。", "understand": "打击目标分两类：团伙/流窜（组织形态）与重罪（行为性质）。「流氓罪」这个已取消的口袋罪是历史细节考点。", "image": "study-assets/lecture-2/slide-053.jpg", "extract": "打击对象：a 流氓团伙成员/地痞流氓；b 流窜作案的罪犯/流窜犯；c 杀人犯、纵火犯、爆炸犯、毒贩、强奸犯、抢劫犯和重大盗窃犯……"}, {"id": "L2-054", "lecture": 2, "page": 54, "title": "Principles", "section": "刑事治理、严打与巡回法院", "source": "Principles:\rHarsh punishment (e.g., quota system in some places)\r\rAgencies involved:\rPublic security bureaus\rProcuracies \rCourts \r\rProcedures:\rSwift; extensive \rLocal officials arrested too many small offenders and re-arrested former felons for previous crimes\n54\n54", "knowledge": "严打原则：从重（有些地方有指标配额制）；公检法三家参与；程序从快、范围从宽；地方官员安排……", "understand": "严打的运作机制：配额制（quota system）最触目惊心——抓人判人有指标，法治让位于数字任务。公检法协同作战而非相互制约。", "image": "study-assets/lecture-2/slide-054.jpg", "extract": "原则：从重惩处（有些地方有指标配额制）；参与机构：公安、检察院、法院；程序：从快、范围从宽；地方官员安排……"}, {"id": "L2-055", "lecture": 2, "page": 55, "title": "Consequences", "section": "刑事治理、严打与巡回法院", "source": "Consequences:\ra. Judges felt sick or collapsed, dying from exhaustion after several strenuous days of adjudication. \rb. Death penalty and life imprisonment cases were delegated to the grassroots courts (then recalled due to their incapability) \rc. 1.65 million criminal cases were addressed, 1.77 million suspects were arrested, 320,00 were sent to labor education camp.\n55\n55", "knowledge": "严打后果：a 法官连续高强度办案后病倒甚至累死；b 死刑和无期案件被下放……", "understand": "从快从重的代价：审判质量让位于速度，法官过劳，死刑案件的审理权被下放到更低层级——程序保障被系统性削弱。", "image": "study-assets/lecture-2/slide-055.jpg", "extract": "后果：a 法官连续多日高强度办案后病倒甚至累死；b 死刑和无期案件被下放……"}, {"id": "L2-056", "lecture": 2, "page": 56, "title": "d. The central authority lost some control over the situation", "section": "刑事治理、严打与巡回法院", "source": "d. The central authority lost some control over the situation\r\rThe Ministry of Public Security required local officials to show “revolutionary humanitarianism.”\rPreventing prisoners from being “frozen to death (冻死); starved to death (饿死), or dying of illness (病死)\rErrors were not rare in these cases.\n56\n56", "knowledge": "d 中央一度失去对局面的控制——公安部要求地方表现「革命人道主义」，防止囚犯……", "understand": "运动的悖论：中央发动运动，地方执行失控，中央又不得不踩刹车。说明运动式治理存在「一放就乱、一收就死」的内在缺陷。", "image": "study-assets/lecture-2/slide-056.jpg", "extract": "d 中央一度失去对局面的控制：公安部要求地方官员表现「革命人道主义」，防止囚犯……"}, {"id": "L2-057", "lecture": 2, "page": 57, "title": "The “Striking-hard cycle”", "section": "刑事治理、严打与巡回法院", "source": "The “Striking-hard cycle”:\rThe campaign was launched in 1983, 1990, and 1996. \r\rEffect: \r(1) Each time after a campaign, the crimes would decline for a while and then rebounded. \r(2) While the 1983 campaign was more effective, the one in 1996 was not very effective.\n57\n57", "knowledge": "「严打周期」：1983、1990、1996 年三次严打。效果：1 每次运动后犯罪短暂下降随即反弹；2 ……", "understand": "三次严打的时间点要记住（1983/1990/1996）。效果评估是重点：短期有效、长期反弹——威慑不能替代制度建设，所以呈现周期性循环。", "image": "study-assets/lecture-2/slide-057.jpg", "extract": "「严打周期」：运动分别于1983、1990、1996年发动。效果：(1) 每次运动后犯罪下降一段时间，然后反弹；(2) ……"}, {"id": "L2-058", "lecture": 2, "page": 58, "title": "Crime cases 1978-1991", "section": "刑事治理、严打与巡回法院", "source": "Crime cases 1978-1991\n58\n58", "knowledge": "图表页：1978–1991 年刑事案件数量变化。", "understand": "用数据验证「严打周期」：运动年犯罪率下降，间隔年反弹上升，曲线呈锯齿状。 横轴年份 1978–1991，纵轴案件数。对照 1983、1990 两个严打年份找下降拐点；整体趋势上升说明反弹。", "image": "study-assets/lecture-2/slide-058.jpg", "extract": "1978–1991年刑事案件数。"}, {"id": "L2-059", "lecture": 2, "page": 59, "title": "Recent “striking hard” in the early 2000s focused on serious criminal activities.", "section": "刑事治理、严打与巡回法院", "source": "Recent “striking hard” in the early 2000s focused on serious criminal activities. \r\r In 2001, the police departments solved 2.41 million criminal cases, caught 120,000 suspects through the Internet, confiscated 1.38 million guns, arrested 240,000 people who illegally kept guns.\n59\n59", "knowledge": "2000 年代初的严打聚焦严重刑事犯罪：2001 年公安破获 241 万起刑事案件，抓获 12 万嫌疑人。", "understand": "新一轮严打（2001）的数据规模。与 1980 年代相比更聚焦重罪，但运动式逻辑未变。 2.41 million 是破案数，120,000 是抓捕人数，均为 2001 年年度流量。", "image": "study-assets/lecture-2/slide-059.jpg", "extract": "2000年代初的严打聚焦严重刑事犯罪：2001年公安机关破获241万起刑事案件，抓获12万嫌疑人……"}, {"id": "L2-060", "lecture": 2, "page": 60, "title": "In Beijing", "section": "刑事治理、严打与巡回法院", "source": "In Beijing\n60\n60", "knowledge": "插图页：北京的严打场景。", "understand": "图片页，展示各地严打宣传或公判大会场景。", "image": "study-assets/lecture-2/slide-060.jpg", "extract": "在北京。"}, {"id": "L2-061", "lecture": 2, "page": 61, "title": "In Guangzhou", "section": "刑事治理、严打与巡回法院", "source": "In Guangzhou\n61\n61", "knowledge": "插图页：广州的严打场景。", "understand": "图片页，同上。", "image": "study-assets/lecture-2/slide-061.jpg", "extract": "在广州。"}, {"id": "L2-062", "lecture": 2, "page": 62, "title": "In Sichuan", "section": "刑事治理、严打与巡回法院", "source": "In Sichuan\n62\n62", "knowledge": "插图页：四川的严打场景。", "understand": "图片页，同上。", "image": "study-assets/lecture-2/slide-062.jpg", "extract": "在四川。"}, {"id": "L2-063", "lecture": 2, "page": 63, "title": "第 63 页", "section": "刑事治理、严打与巡回法院", "source": "63\n63", "knowledge": "（图片过渡页）", "understand": "无提取文字，为严打主题的图片页。", "image": "study-assets/lecture-2/slide-063.jpg", "extract": "（本页无可提取文字，为图片页）"}, {"id": "L2-064", "lecture": 2, "page": 64, "title": "第 64 页", "section": "刑事治理、严打与巡回法院", "source": "64\n64", "knowledge": "（图片过渡页）", "understand": "无提取文字，为严打主题的图片页。", "image": "study-assets/lecture-2/slide-064.jpg", "extract": "（本页无可提取文字，为图片页）"}, {"id": "L2-065", "lecture": 2, "page": 65, "title": "Cultural background for “striking hard,”", "section": "刑事治理、严打与巡回法院", "source": "Cultural background for “striking hard,”\r\rQuestion:\rWhich of the following is worse?\r\rInnocent people are jailed \rGuilty people are released\n65\n65", "knowledge": "严打的文化背景：哪个更糟——无辜者入狱，还是有罪者被释放？", "understand": "价值取向问题：中国传统偏向「宁枉勿纵」（错判无辜比放走罪犯更被容忍），与西方「宁纵勿枉」（无罪推定）相反。这种文化偏好是严打从严的社会心理基础。", "image": "study-assets/lecture-2/slide-065.jpg", "extract": "「严打」的文化背景：问题——以下哪个更糟？无辜者入狱；有罪者被释放。"}, {"id": "L2-066", "lecture": 2, "page": 66, "title": "New Measures", "section": "刑事治理、严打与巡回法院", "source": "New Measures: \rthe “110” system was established to deal with criminals.\n66\n66", "knowledge": "新举措：建立「110」报警系统打击犯罪。", "understand": "运动之外的制度化建设：110 报警系统把治安响应常态化。了解即可。", "image": "study-assets/lecture-2/slide-066.jpg", "extract": "新举措：建立「110」系统打击犯罪。"}, {"id": "L2-067", "lecture": 2, "page": 67, "title": "New developments in courts’ independence", "section": "刑事治理、严打与巡回法院", "source": "New developments in courts’ independence\rGovernment direct intervention in courts is more limited than before. \r\rb. Judges may also use some measures to counterbalance local governments’ intervention   (e.g., release a case to outside media; report it to higher-level authorities)\n67\n67", "knowledge": "法院独立性的新进展：a 政府对法院的直接干预比以前少了；b 法官也开始用一些办法抗衡地方政府。", "understand": "转折页：司法独立在改善但仍有博弈。法官的「抗衡」手段（如请示上级法院、借助媒体）说明制度性问题靠个体策略弥补。", "image": "study-assets/lecture-2/slide-067.jpg", "extract": "法院独立性的新进展：a 政府对法院的直接干预比以前少了；b 法官也可用一些办法抗衡地方政府……"}, {"id": "L2-068", "lecture": 2, "page": 68, "title": "In 2015, a “lifetime responsibility” (终生负责制) began to be adopted. Judges are requi…", "section": "刑事治理、严打与巡回法院", "source": "In 2015, a “lifetime responsibility” (终生负责制) began to be adopted. Judges are required to be responsible for the cases for their whole life. 法官被要求终生为自己审判的案件负责。\r\rThe establishment of circuit courts (试点建立巡回法院)\r\r      \rThe court will hear important administrative and civil and commercial cases. \r     最高人民法院設立巡迴法庭，審理跨行政區域重大行政和民商事案件。」\n68", "knowledge": "2015 年起实行案件质量终身负责制：法官对所办案件终身负责；同时建立……", "understand": "改革双刃剑：终身负责制倒逼法官审慎办案、防止外部干预（判错要背一辈子），但也可能让法官更依赖审判委员会分摊责任。记住 2015 和「终身负责制」。", "image": "study-assets/lecture-2/slide-068.jpg", "extract": "2015年起开始实行「终身负责制」：法官被要求终身为自己审判的案件负责。建立……"}, {"id": "L2-069", "lecture": 2, "page": 69, "title": "Shenzhen/深圳， 2015", "section": "刑事治理、严打与巡回法院", "source": "Shenzhen/深圳， 2015\nGuangdong,\rGuangxi\rHainan\n69", "knowledge": "图表页：深圳（2015）——第一巡回法庭设立，管辖广东、广西、海南。", "understand": "巡回法庭制度：最高法院在地方设巡回法庭，深圳第一巡回法庭覆盖华南三省。目的是让司法「跨出」行政区划，减少地方干预。 看管辖范围（广东、广西、海南）与驻地（深圳）的对应关系。设立年份 2015。", "image": "study-assets/lecture-2/slide-069.jpg", "extract": "深圳，2015：广东、广西、海南。"}, {"id": "L2-070", "lecture": 2, "page": 70, "title": "Shenyang 沈阳, 2015", "section": "刑事治理、严打与巡回法院", "source": "Shenyang 沈阳, 2015\nLiaoning \r      Jilin \r       Heilongjiang\n70", "knowledge": "图表页：沈阳（2015）——第二巡回法庭，管辖辽宁、吉林、黑龙江。", "understand": "与上页一组：沈阳第二巡回法庭覆盖东北三省。两页说明巡回法庭按大区设置。 驻地沈阳 + 管辖辽吉黑。", "image": "study-assets/lecture-2/slide-070.jpg", "extract": "沈阳，2015：辽宁、吉林、黑龙江。"}, {"id": "L2-071", "lecture": 2, "page": 71, "title": "There are now six circuit courts in China", "section": "刑事治理、严打与巡回法院", "source": "There are now six circuit courts in China \rAbout the circuit courts\r1. Judges would be rotated \r2. Directly under the Supreme Court\r    (Staff, resources)\r3. Important administrative litigations, civil cases, and commercial cases\n71", "knowledge": "中国现有六个巡回法庭。特点：1 法官轮换；2 直属最高法院（人事、经费）；3 审理重要行政案件……", "understand": "巡回法庭制度的核心设计：人事经费直属最高法，绕开地方党政——这是针对 L2-015 两条干预机制（人事、财政）的对症改革。法官轮换防止本地化。", "image": "study-assets/lecture-2/slide-071.jpg", "extract": "中国现有六个巡回法庭。关于巡回法庭：1 法官轮换；2 直属最高法院（人员、资源）；3 重要行政案件……"}, {"id": "L2-072", "lecture": 2, "page": 72, "title": "The autonomy of legal departments", "section": "公安机关、执法压力与冤错案", "source": "The autonomy of legal departments: \rThe case of the police department  \r\rThe dual face of legal institutions in China:\r\rThey can be influenced by state agencies.\r\rThey can be too powerful versus individual citizens.\n72\n72", "knowledge": "法律部门的自主性：公安部门案例。中国法律机构的「两张面孔」：既受国家机关影响，又可能权力过大。", "understand": "板块转折：前面讲法律部门「太弱」（受党政干预），现在讲另一面「太强」（公安的权力滥用）。dual face 是核心概念。", "image": "study-assets/lecture-2/slide-072.jpg", "extract": "法律部门的自主性：公安部门案例。中国法律机构的两张面孔：既受国家机关影响，又可能权力过大……"}, {"id": "L2-073", "lecture": 2, "page": 73, "title": "The case of the public security bureaus", "section": "公安机关、执法压力与冤错案", "source": "The case of the public security bureaus\r\rThey are responsible for maintaining social stability and the investigation of criminal cases\n73\n73", "knowledge": "公安局案例：负责维护社会稳定和刑事案件侦查。", "understand": "过渡页，重申公安的两大职能，后面用数据展开公安的权力与困境。", "image": "study-assets/lecture-2/slide-073.jpg", "extract": "公安局案例：负责维护社会稳定和刑事案件侦查。"}, {"id": "L2-074", "lecture": 2, "page": 74, "title": "Police: 2.0 million (2013)", "section": "公安机关、执法压力与冤错案", "source": "Police: 2.0 million (2013)\rArmed police/武装警察: 1.2 million \r         Internal security: 800,000\r         Others: border security, security, etc. \r                  400, 000\rRiot police dealing with protests or riots \r\r辅警Auxiliary Police\n74", "knowledge": "警力规模（2013）：警察 200 万；武装警察 120 万（内卫 80 万，边防等其他 40 万）；另有防暴警察等。", "understand": "中国治安力量的总量与构成。武警（armed police）与公安警察分属不同系统，是细节考点。 警察 2.0 million 与武警 1.2 million 是并列两支队伍；武警内部再分内卫 80 万与其他 40 万（80+40=120，注意括号内的分解）。年份口径 2013。", "image": "study-assets/lecture-2/slide-074.jpg", "extract": "警察：200万（2013年）；武装警察：120万——内卫80万；其他（边防、警卫等）40万；防暴警察……"}, {"id": "L2-075", "lecture": 2, "page": 75, "title": "In 2003, the Ministry of Public Security announced that cases involving death must…", "section": "公安机关、执法压力与冤错案", "source": "In 2003, the Ministry of Public Security announced that cases involving death must be solved (命案必破)\r\rOver 90 % of the cases involving death have been solved\n75", "knowledge": "2003 年公安部提出「命案必破」；命案侦破率超过 90%。", "understand": "目标管理的正面样本：高破案率展示公安的执行能力。但「必破」的压力也是逼供和冤案的温床——与后面佘祥林、聂树斌案呼应。 over 90% 是命案侦破率（已破/发生），年份口径 2003 起。", "image": "study-assets/lecture-2/slide-075.jpg", "extract": "2003年，公安部宣布命案必破；90%以上的命案已破。"}, {"id": "L2-076", "lecture": 2, "page": 76, "title": "Within five years leading to 2013, the police department confiscated 492,000 guns .", "section": "公安机关、执法压力与冤错案", "source": "Within five years leading to 2013, the police department confiscated 492,000 guns . \r\rCases involving the use of guns持枪犯罪案 declined from 1,783 in 2008 to 314 in 2012. \r\rBombing cases declined from over 2,000 in 2002 to 100 or so in 2012.\n76", "knowledge": "五年间（至 2013）警方收缴枪支 49.2 万支；涉枪案件从 2008 年 1,783 起降至 2012 年 314 起；爆炸案件……", "understand": "治安治理成效的量化展示：枪支收缴 + 涉枪案件五年下降超八成。数据说明强警力在控枪上的有效性。 492,000 是五年累计收缴数（存量流量混合）；1,783→314 是年度发案数对比，降幅约 82%，是本页最强的趋势信号。", "image": "study-assets/lecture-2/slide-076.jpg", "extract": "截至2013年的五年间，警方收缴枪支49.2万支；涉枪案件从2008年的1,783起降至2012年的314起；爆炸案件……"}, {"id": "L2-077", "lecture": 2, "page": 77, "title": "Average number of deaths of the police in China", "section": "公安机关、执法压力与冤错案", "source": "Average number of deaths of the police in China:\r1949-1980: 32 \r1981-1989: 131\r1990-1995: 395\r1996-2001: 484\rIn recent 20 years, 6,000 died. \r\rSeveral times more than the number in the U.S\rIn 2001, 450 police officers died in China, it was 2 in Japan.\n77\n77", "knowledge": "中国警察年均死亡人数：1949–1980 年 32 人 → 1981–1989 年 131 人 → 1990–1995 年 395 人 → 1996–2001 年 484 人；近 20 年约 6,000 人牺牲，数倍于……", "understand": "警察死亡数的快速攀升折射治安压力与职业风险的上升。数据为后面「警察的困境与行为扭曲」铺垫。 各时段是「年均」死亡数（注意是 average per year，不是总数），时段长度不同，不能直接相加；6,000 是近 20 年总数。趋势是显著上升。", "image": "study-assets/lecture-2/slide-077.jpg", "extract": "中国警察年均死亡人数：1949–1980：32；1981–1989：131；1990–1995：395；1996–2001：484；近20年有6,000人牺牲，数倍于……"}, {"id": "L2-078", "lecture": 2, "page": 78, "title": "Causes of deaths", "section": "公安机关、执法压力与冤错案", "source": "Causes of deaths:\ra. traffic \rb. overworked and sickness \rc. attacked \rd. helping in risk situations/110\n78\n78", "knowledge": "警察死亡原因：a 交通事故；b 过劳与疾病；c 遇袭；d 在危险情境中救助（110 出警）。", "understand": "死因构成说明：最大杀手不是犯罪分子而是事故和过劳——印证警力不足、工作强度大的结构性问题。", "image": "study-assets/lecture-2/slide-078.jpg", "extract": "死亡原因：a 交通事故；b 过劳与疾病；c 遇袭；d 在危险情境中救助/110。"}, {"id": "L2-079", "lecture": 2, "page": 79, "title": "Attack on the police", "section": "公安机关、执法压力与冤错案", "source": "Attack on the police \r\rExample \r\rBetween 2004 and 2005, Shaanxi province saw 403 cases in which 519 police officers were wounded. As presented in the Table, peasants accounted for the largest portion of those who attacked the police.\n79\n79", "knowledge": "袭警案例：2004–2005 年陕西发生 403 起袭警案，519 名警察受伤；袭击者中农民占比最高。", "understand": "袭警数据引出下一页的职业分布表。农民占比最高反映警民冲突的结构性来源（征地、罚款、执法冲突多发生在农村）。 403 是案件数，519 是受伤警察数（一案可伤多人，所以 519>403）；时间范围 2004–2005。", "image": "study-assets/lecture-2/slide-079.jpg", "extract": "袭警：例——2004至2005年，陕西发生403起案件，519名警察受伤；如下表所示，农民占……"}, {"id": "L2-080", "lecture": 2, "page": 80, "title": "Attacks on Police in Shaanxi Province by Occupation", "section": "公安机关、执法压力与冤错案", "source": "Attacks on Police in Shaanxi Province by Occupation\nCategory | Frequency (%)\nPeasants  |   42.3\nUnemployed |   23.1\nIndividual Businessmen  |   12.5\nWorkers |     9.5\nStudents |     4.6\nMiscellaneous  |     8.0\nTotal  | 100.0\n80\n80", "knowledge": "表格：陕西袭警者职业分布——农民 42.3%、无业 23.1%、个体户 12.5%、工人 9.5%……", "understand": "袭警者画像：农民 + 无业者合计约三分之二，说明警民冲突集中在社会弱势群体，反映基层执法矛盾。 第二列是百分比（Frequency %），各职业合计 100%。重点看排序：农民 42.3% 居首，前两项合计约 65%。这是构成数据（占比），不是数量。", "image": "study-assets/lecture-2/slide-080.jpg", "extract": "陕西袭警者职业分布：农民42.3%；无业23.1%；个体户12.5%；工人9.5%；其……"}, {"id": "L2-081", "lecture": 2, "page": 81, "title": "Difficulties faced by the police", "section": "公安机关、执法压力与冤错案", "source": "Difficulties faced by the police:\ra. Limited manpower (e.g., Shenzhen)\r\rThe population/police ratio:\rThe U.S:         379: 1\rU.K:                384: 1 \rJapan:            566: 1\rChina:         1,100: 1\rHong Kong:   170: 1\n81\n81", "knowledge": "警力困境 a：人手不足——人口/警察比：美国 379:1，英国 384:1，日本 566:1，中国更低。", "understand": "国际比较说明中国警力相对人口明显不足，这是「警察困境」的结构性根源。比例数字是考点。 379:1 表示每 379 个居民对应 1 名警察，数值越大警力越稀薄。中国是列表中警力最紧张的。这是跨国横截面比较。", "image": "study-assets/lecture-2/slide-081.jpg", "extract": "警力困境：a 人手不足（如深圳）——人口/警察比：美国379:1；英国384:1；日本566:1；中国……"}, {"id": "L2-082", "lecture": 2, "page": 82, "title": "Numbers of police Population", "section": "公安机关、执法压力与冤错案", "source": "Numbers of police              Population \rGuagnzhou: 25,000          11 million \rShenzhen: 16,000            10 million \rShanghai: 40,000             13 million\rHong Kong: 40,000             7 million \r\rChinese cities:\r“110” in China (too many calls to deal with)\n82\n82", "knowledge": "城市警力与人口：广州 2.5 万警察/1,100 万人；深圳 1.6 万/1,000 万；上海 4 万/1,300 万；香港 4 万/……", "understand": "用具体城市算警力账：深圳 1.6 万警察对 1,000 万人口（约 625:1），远比香港紧张。深圳是警力不足的最典型例子。 两列分别是警察人数与人口数，可自算比值（如深圳 10,000,000/16,000=625:1）。与上一页国际比值对照，体会差距。", "image": "study-assets/lecture-2/slide-082.jpg", "extract": "警力与人口：广州25,000警察/1,100万人；深圳16,000/1,000万；上海40,000/1,300万；香港40,000……"}, {"id": "L2-083", "lecture": 2, "page": 83, "title": "b. Large numbers of migrant people", "section": "公安机关、执法压力与冤错案", "source": "b. Large numbers of migrant people\r\rPeasants who committed crimes in cities in late 1990s\nCities  | Peasants arrested | Peasants in the total (%)\nShanghai  | 16,328 |        53.5\nGuangzhou  | 12,373 |        52.3\nShenyang  |    2,807 |        26.9\nDongguan  |    2,192 |        80.9\n83\n83", "knowledge": "警力困境 b：流动人口庞大——1990 年代末城市犯罪中的农民：上海被捕农民 16,328 人（占 53%）……", "understand": "流动人口与犯罪治理难题：城市被捕者中农村流动人口过半，给以户籍为基础的治安管理带来巨大压力。 三列为城市、被捕农民数、占被捕总数百分比。上海 53% 表示被捕者中过半是农民。注意「农民」此处指外来农村流动人口。", "image": "study-assets/lecture-2/slide-083.jpg", "extract": "b 流动人口庞大：1990年代末在城市犯罪的农民——上海：被捕农民16,328人，占总数53%……"}, {"id": "L2-084", "lecture": 2, "page": 84, "title": "Pressure leading to two opposite behaviors of the police in China", "section": "公安机关、执法压力与冤错案", "source": "Pressure leading to two opposite behaviors of the police in China:\r\ra. Ignoring citizens’ sufferings/injustice \rb. Ignoring the rights of suspects\n84\n84", "knowledge": "压力导致中国警察两种相反的行为：a 漠视公民的苦难/不公；b 漠视嫌疑人的权利。", "understand": "结构性压力的行为后果：警力不足 + 考核压力 → 要么不作为（该管的不管），要么乱作为（刑讯逼供）。两种扭曲引出下一板块「公安的权力滥用」。", "image": "study-assets/lecture-2/slide-084.jpg", "extract": "压力导致中国警察两种相反行为：a 漠视公民的苦难/不公；b 漠视嫌疑人的权利。"}, {"id": "L2-085", "lecture": 2, "page": 85, "title": "The police’s autonomy or abuse of power", "section": "公安机关、执法压力与冤错案", "source": "The police’s autonomy or abuse of power \r(1) Decisions on accepting cases \rCases that are regarded as “not important” or too difficult to solve may not be accepted by the public security bureaus (e.g., small thefts, uninvestigated murders, appealing for years, e.g., a mother fought for her son’s murder case for more than 10 years, but to no avail).\n85\n85", "knowledge": "公安的自主性或滥权（1）受案决定：被认为「不重要」或太难破的案件，公安可以不予受理。", "understand": "滥权第一环：立案自由裁量。公安自行决定是否受案，导致「立案难」不仅存在于法院也存在于公安。", "image": "study-assets/lecture-2/slide-085.jpg", "extract": "公安的自主性或滥权：(1) 受案决定——被认为「不重要」或太难破的案件，公安可以不予受理……"}, {"id": "L2-086", "lecture": 2, "page": 86, "title": "The 1997 Criminal Law", "section": "公安机关、执法压力与冤错案", "source": "The 1997 Criminal Law:\r\rBetween 1998 and 2002, the procuracies required the police departments to investigate over 36,000 cases and arrest over 50,800 suspects and sued another 25,000 suspects.\n86\n86", "knowledge": "1997 年刑法背景下：1998–2002 年检察院要求公安补充侦查 3.6 万余件、追捕 5.08 万余人、追加起诉 2.5 万……", "understand": "检察监督的数据侧面：大量案件需要检察院纠偏，说明公安侦查质量存在系统性问题。 36,000 / 50,800 / 25,000 是 1998–2002 五年累计数，口径分别是要求侦查的案件数、要求逮捕的人数、追加起诉的人数。数字越大说明前端问题越多。", "image": "study-assets/lecture-2/slide-086.jpg", "extract": "1997年刑法：1998至2002年间，检察院要求公安机关侦查3.6万余件案件、逮捕5.08万余名嫌疑人，另起诉2.5万……"}, {"id": "L2-087", "lecture": 2, "page": 87, "title": "legal procedures", "section": "公安机关、执法压力与冤错案", "source": "legal procedures: \r\r(2) Issues in detention  \rThe procuracies corrected illegal detention for more than 380,180 people between 1998 and 2002. \rIn one case, a peasant in Guangxi autonomous region was detained by the police for 28 years without trial. When he was released in 2002, he could no longer speak.\n87\n87", "knowledge": "滥权（2）拘留环节：1998–2002 年检察院纠正超期羁押等非法拘留逾 38 万人；广西一农民被……", "understand": "超期羁押的规模触目惊心：五年纠正 38 万人次非法拘留。个案（广西农民）用于展示极端情形。 380,180 是五年累计被纠正的非法拘留人次，年均约 7.6 万。这是监督机关「发现」的部分，实际规模可能更大。", "image": "study-assets/lecture-2/slide-087.jpg", "extract": "法律程序：(2) 拘留环节的问题——1998至2002年间，检察院纠正非法拘留逾380,180人；广西一农民……"}, {"id": "L2-088", "lecture": 2, "page": 88, "title": "(3) Issues in obtaining evidence", "section": "公安机关、执法压力与冤错案", "source": "(3) Issues in obtaining evidence\r\rBetween 1996 and 1997, the number of people who died from violence in questioning totaled 96. \r221 cases of confessions extorted in six provinces in 1999. \rIn 21 of those cases, the suspects died after being questioned.\n88\n88", "knowledge": "滥权（3）取证环节：1996–1997 年审讯中暴力致死 96 人；六个省发现 221 起逼供……", "understand": "刑讯逼供的量化证据：两年 96 条人命。数字为后面冤案专题（佘祥林、聂树斌）提供系统性背景。 96 是两年间审讯致死人数（全国性统计），221 是六省逼供案件数（区域性口径），注意两者覆盖范围不同不可直接比较。", "image": "study-assets/lecture-2/slide-088.jpg", "extract": "(3) 取证环节的问题：1996至1997年间，审讯中暴力致死共96人；六个省发现221起逼供……"}, {"id": "L2-089", "lecture": 2, "page": 89, "title": "e.g.,", "section": "公安机关、执法压力与冤错案", "source": "e.g., \rIn Liaoning in 1995, an innocent young female engineer was tortured for four hours by the police. She was beaten and forced to undress herself.  She then became mentally deranged.\n89\n89", "knowledge": "案例：1995 年辽宁一名无辜的年轻女工程师被警察刑讯四小时，遭殴打并被强迫脱衣，此后精神失常。", "understand": "个案展示逼供的残酷性：无辜者尚且如此，嫌疑人处境可想而知。与上页统计数据互为表里。", "image": "study-assets/lecture-2/slide-089.jpg", "extract": "例：1995年辽宁，一名无辜的年轻女工程师被警察刑讯四小时，遭殴打并被强迫脱衣，此后精神失常……"}, {"id": "L2-090", "lecture": 2, "page": 90, "title": "(4) concessions", "section": "公安机关、执法压力与冤错案", "source": "(4) concessions \rAs elsewhere, the evidence obtained through torture may be rejected by the court in China. \r\rCorrecting wrong cases\n90\n90", "knowledge": "（4）退让/纠错：与其他国家一样，刑讯获得的证据可能被法院排除——纠正错案。", "understand": "制度防线：非法证据排除。刑讯证据可被法院拒绝采纳，这是对公安滥权的司法制衡，也是纠错机制的入口。", "image": "study-assets/lecture-2/slide-090.jpg", "extract": "(4) 退让：与其他国家一样，刑讯获得的证据可能被中国法院排除。纠正错案。"}, {"id": "L2-091", "lecture": 2, "page": 91, "title": "Example 1", "section": "公安机关、执法压力与冤错案", "source": "Example 1: \rIn one case, a policeman in Yunnan province was arrested in 1998 for the murderer of his wife and another policeman. \rForced to make a confession \rSentenced to death with a two-year reprieve \rHe was not immediately executed because the provincial high court found the evidence unconvincing. \rHe was proven not guilty in 2000 when the true murderer was accidentally caught in another case.\n91\n91", "knowledge": "例一：云南一警察 1998 年因涉嫌杀害妻子和另一名警察被捕，被逼供认罪，判死刑缓期……", "understand": "杜培武案（云南警察冤案）：连警察自己都可能成为逼供受害者——说明刑讯是制度性问题而非个别素质问题。死缓（death with reprieve）说明证据存疑却仍判重刑。", "image": "study-assets/lecture-2/slide-091.jpg", "extract": "例一：云南一名警察1998年因涉嫌杀害妻子和另一名警察被捕；被逼认罪；判死刑缓期……"}, {"id": "L2-092", "lecture": 2, "page": 92, "title": "SHE’s case in Hubei (佘祥林)", "section": "公安机关、执法压力与冤错案", "source": "SHE’s case in Hubei (佘祥林)\nJan. 1994. SHE’s wife missing (he was a farmer)\rApril 1994, he, aged 28 then, was arrested as the murderer. \rHe was tortured for ten days and 11 nights after being arrested \rPolice took turns to question him, not allowing him to sleep\n92\n92", "knowledge": "佘祥林案（湖北）：1994 年 1 月妻子失踪；4 月 28 岁的佘祥林作为凶手被捕；被刑讯十天十一夜。", "understand": "最著名的冤案之一的开端。关键事实链：妻子失踪 → 认定被杀 → 刑讯逼供。十天十一夜的连续审讯是考点细节。", "image": "study-assets/lecture-2/slide-092.jpg", "extract": "湖北佘祥林案：1994年1月，佘的妻子失踪（他是农民）；1994年4月，28岁的他作为凶手被捕；被刑讯十天十夜……"}, {"id": "L2-093", "lecture": 2, "page": 93, "title": "1994, he was sentenced to death", "section": "公安机关、执法压力与冤错案", "source": "1994, he was sentenced to death\r1995, his mother died after being retained and then released because of petitions. \r1998, he was re-sentenced to 15 years in jail\n93\n93", "knowledge": "佘祥林案：1994 年被判死刑；1995 年母亲因上访被关押后去世；1998 年改判 15 年有期徒刑。", "understand": "案件的中间波折：死刑 → 改判 15 年，说明法院对证据存疑却不敢判无罪（「疑罪从轻」而非「疑罪从无」）；母亲上访致死展示冤案的家庭代价。", "image": "study-assets/lecture-2/slide-093.jpg", "extract": "1994年被判死刑；1995年，母亲因上访被关押后获释、随后去世；1998年改判15年有期徒刑。"}, {"id": "L2-094", "lecture": 2, "page": 94, "title": "His wife came back", "section": "公安机关、执法压力与冤错案", "source": "His wife came back\nMarch 2005, his wife returned home \rApril 2005, the innocent SHE was released after being detained for 11 years \rHe received 460,000 yuan in state compensation\n94\n94", "knowledge": "佘祥林案结局：2005 年 3 月妻子回家；4 月无辜的佘祥林获释（被羁押 11 年）；获国家赔偿 46 万元。", "understand": "戏剧性昭雪：「被害人」活着回来，冤案不证自明。11 年羁押换来 46 万赔偿——国家赔偿的数额与代价的悬殊是考点。 11 年是羁押时长，460,000 元是国家赔偿总额。两个数字放一起看才能体会救济的有限。", "image": "study-assets/lecture-2/slide-094.jpg", "extract": "妻子回来了：2005年3月，妻子回家；2005年4月，无辜的佘祥林被羁押11年后获释；获46万元国家赔偿……"}, {"id": "L2-095", "lecture": 2, "page": 95, "title": "Nie Shubin’s case 聂树斌", "section": "公安机关、执法压力与冤错案", "source": "Nie Shubin’s case 聂树斌\n1994, aged 21, arrested for a murder; accused of murdering a 38-year-old woman in Hebei; \rEvidence: he did not go to work after the murder (he had a conflict with the leader)\rExecuted in 1995\rA person was caught in 2005 and acknowledged that he was the murderer.\n95\n95", "knowledge": "聂树斌案：1994 年 21 岁的聂树斌因谋杀被捕，被控在河北杀害一名 38 岁女性；证据：案发后他没去上班（与领导有过节）……", "understand": "比佘祥林案更沉重的冤案：证据链极其薄弱（不上班 = 嫌疑），年轻人被执行死刑。后来真凶出现推动平反，成为中国司法改革的标志性案例。", "image": "study-assets/lecture-2/slide-095.jpg", "extract": "聂树斌案：1994年，21岁的他因一起谋杀被捕，被控在河北杀害一名38岁女子；证据：案发后他没去上班（与领导有过节）……"}, {"id": "L2-096", "lecture": 2, "page": 96, "title": "Causes of cases of injustices in China", "section": "公安机关、执法压力与冤错案", "source": "Causes of cases of injustices in China:\rTechnical: e.g., lack of technologies  \rPolitical: pressure/politicized/time limitations \rProcedural: failing to follow procedures without suffering political pressure, e.g., loss of evidence. \rSome corrupt agents\n96", "knowledge": "中国冤案的成因分类：技术性（如缺乏技术手段）；政治性（压力/政治化/限期破案）；程序性（有压力时不遵守程序）。", "understand": "冤案的系统解释框架，三类成因是考点。前面所有案例都可以往这三类里装：命案必破的压力（政治）、逼供（程序）、证据技术落后（技术）。", "image": "study-assets/lecture-2/slide-096.jpg", "extract": "中国冤案的成因：技术性（如缺乏技术）；政治性（压力/政治化/时限）；程序性（有压力时不遵守程序……"}, {"id": "L2-097", "lecture": 2, "page": 97, "title": "Distribution of Wrongful Convictions Across Years", "section": "公安机关、执法压力与冤错案", "source": "Distribution of Wrongful Convictions Across Years\n97", "knowledge": "图表页：冤案的年份分布。", "understand": "数据显示冤案集中出现的年份与严打等运动时段的关联——运动式司法制造冤案。 横轴为年份，纵轴为冤案数量。找峰值年份并与严打（1983/1990/1996）对照，峰值与运动年份重合即支持「运动制造冤案」的论点。", "image": "study-assets/lecture-2/slide-097.jpg", "extract": "冤案的年份分布。"}, {"id": "L2-098", "lecture": 2, "page": 98, "title": "Wrongful Convictions-Occupation Distribution of Defendants", "section": "公安机关、执法压力与冤错案", "source": "Wrongful Convictions-Occupation Distribution of Defendants\n98", "knowledge": "图表页：冤案被告人的职业分布。", "understand": "冤案受害者画像：多为农民等社会底层——缺乏资源和社会网络的人更容易被错判，体现司法中的阶层不平等。 按职业看占比，关注占比最高的职业类别（通常是农民/无业者），并与 L2-080 袭警者职业分布对照，两者都指向底层群体。", "image": "study-assets/lecture-2/slide-098.jpg", "extract": "冤案被告人的职业分布。"}, {"id": "L2-099", "lecture": 2, "page": 99, "title": "Changes in the ruling of death penalty", "section": "公安机关、执法压力与冤错案", "source": "Changes in the ruling of death penalty  \r\r1. In 2006, the Supreme Court recalled the right to review all death penalty cases \r\r2. In 2011, 13 crimes leading to death penalty were revoked.\n99", "knowledge": "死刑制度改革：1 2006 年最高法院收回全部死刑复核权；2 2011 年取消 13 种罪名的死刑。", "understand": "慎用死刑的两步改革：复核权上收中央（统一标准、减少地方滥杀），削减死刑罪名（缩小适用范围）。两个年份是考点。", "image": "study-assets/lecture-2/slide-099.jpg", "extract": "死刑裁判的变化：1 2006年最高法院收回全部死刑案件复核权；2 2011年取消13种罪名的死刑……"}, {"id": "L2-100", "lecture": 2, "page": 100, "title": "Negative bias?", "section": "公安机关、执法压力与冤错案", "source": "Negative bias?\r\r   People tend to have  a long memory of negative events. (blame avoidance strategies?)\n100", "knowledge": "负面偏差？人们对负面事件记忆更长久（问责规避策略？）。", "understand": "方法论提醒：媒体和我们记住的都是冤案，会高估司法的糟糕程度。这是课程的平衡视角——批判的同时警惕样本偏差。", "image": "study-assets/lecture-2/slide-100.jpg", "extract": "负面偏差？人们对负面事件记忆更长久（问责规避策略？）。"}, {"id": "L2-101", "lecture": 2, "page": 101, "title": "The situation has been improved.", "section": "公安机关、执法压力与冤错案", "source": "The situation has been improved. \rFrom 1999:\r\r(1). If there is a death due to torture, the people involved will be punished. The head of the department and the head of the discipline inspection committee need to report the case to the provincial agency in charge of legal affairs.\n101\n101", "knowledge": "情况在改善。1999 年起：（1）发生刑讯致死的，相关人员将被追责，部门负责人和纪委……", "understand": "问责制度化的第一步：刑讯致死要追责到领导。用「连坐」领导的行政逻辑来遏制逼供。", "image": "study-assets/lecture-2/slide-101.jpg", "extract": "情况在改善。1999年起：(1) 发生刑讯致死的，相关人员将被追责；部门负责人和纪检……"}, {"id": "L2-102", "lecture": 2, "page": 102, "title": "(2) If there are two such cases in a province, the head of the department in charg…", "section": "公安机关、执法压力与冤错案", "source": "(2) If there are two such cases in a province, the head of the department in charge of legal affairs and the secretary of the discipline inspection committee need to report the situation to the central agency in charge of legal affairs.\n102\n102", "knowledge": "（2）一个省发生两起此类案件，主管政法的部门负责人和省纪委书记须上报……", "understand": "问责升级：省内两起刑讯致死就要惊动省级领导——把逼供变成领导的政治风险，借行政压力倒逼规范。", "image": "study-assets/lecture-2/slide-102.jpg", "extract": "(2) 一个省发生两起此类案件，主管法律事务的部门负责人和纪委书记须上报……"}, {"id": "L2-103", "lecture": 2, "page": 103, "title": "(3) If a suspect can prove that he or she has been tortured to confess, the confes…", "section": "公安机关、执法压力与冤错案", "source": "(3) If a suspect can prove that he or she has been tortured to confess, the confessions will not be used as evidence against him/her.\n103", "knowledge": "（3）嫌疑人如能证明被刑讯逼供，其供述不得作为定案证据。", "understand": "非法证据排除规则的落地：与 L2-090 呼应，但加了举证责任细节——由嫌疑人证明逼供存在，实践中门槛很高。", "image": "study-assets/lecture-2/slide-103.jpg", "extract": "(3) 嫌疑人如能证明被刑讯逼供，其供述不得作为对其不利的证据。"}, {"id": "L2-104", "lecture": 2, "page": 104, "title": "Negative impact", "section": "公安机关、执法压力与冤错案", "source": "Negative impact:\rPolice become less active; responsibility avoiding\n104\n104", "knowledge": "负面影响：警察变得不积极、规避责任。", "understand": "改革的意外后果：严问责使警察怕担责而少作为——呼应 L2-084 的「不作为」一端。制度变迁的权衡（trade-off）是本课的常考思维。", "image": "study-assets/lecture-2/slide-104.jpg", "extract": "负面影响：警察变得不积极、规避责任。"}, {"id": "L2-105", "lecture": 2, "page": 105, "title": "Use of new technologies to investigate cases", "section": "公安机关、执法压力与冤错案", "source": "Use of new technologies to investigate cases: \r\rVideo camera\rFace recognition\n105", "knowledge": "用新技术侦查案件：视频监控、人脸识别。", "understand": "收尾页：技术手段替代人海战术与口供依赖，既是破案方式升级也回应了 L2-096 的「技术性成因」。", "image": "study-assets/lecture-2/slide-105.jpg", "extract": "用新技术侦查案件：视频监控、人脸识别。"}, {"id": "L3-001", "lecture": 3, "page": 1, "title": "3    Legal Agents in China", "section": "课程导入与议题", "source": "1\n1\n            3    Legal Agents in China", "knowledge": "Lecture 3 主题：中国的法律工作者（Legal Agents in China）。", "understand": "本讲把目光从法律制度转向「制度的执行者」——法官、检察官、警察、监狱管理人员。核心问题是：这些法律代理人是否专业、是否廉洁、受什么约束。", "image": "study-assets/lecture-3/slide-001.jpg", "extract": "第三讲：中国的法律工作者"}, {"id": "L3-002", "lecture": 3, "page": 2, "title": "Topics:", "section": "课程导入与议题", "source": "Topics:\n1. Legal agents in China \n2. irregularities in the legal department \n3. Prison management and issues  \n4. Dealing with organized crimes in China \n\n2", "knowledge": "本讲四大议题：1 中国的法律工作者；2 法律部门中的不正之风；3 监狱管理与问题；4 中国的有组织犯罪。", "understand": "四个议题是一条线：先讲人（法律工作者），再讲人的问题（腐败滥权），然后讲两套管理对象（监狱、黑社会）。", "image": "study-assets/lecture-3/slide-002.jpg", "extract": "议题：1 中国的法律工作者；2 法律部门中的违规现象；3 监狱管理与问题；4 中国的有组织犯罪治理"}, {"id": "L3-003", "lecture": 3, "page": 3, "title": "1. Legal agents in China", "section": "法律工作者与职业化", "source": "1. Legal agents in China \n\n3", "knowledge": "章节页：1. 中国的法律工作者。", "understand": "进入第一个板块，先确立分析框架：国家能力。", "image": "study-assets/lecture-3/slide-003.jpg", "extract": "1. 中国的法律工作者"}, {"id": "L3-004", "lecture": 3, "page": 4, "title": "State and agents:", "section": "法律工作者与职业化", "source": "4\n4\nState and agents:\n\nState capacity/国家能力 \na. Financial resources \nb. Skillful and loyal agents\n\nAsian society:\n“The brightest and the best” (e.g., Singapore)", "knowledge": "国家能力（state capacity）的两个来源：a 财政资源；b 能干且忠诚的代理人。亚洲社会（如新加坡）相信「最优秀和最聪明的人」（the brightest and the best）治国。", "understand": "本讲的理论框架：国家能力强不强，一看钱，二看人。新加坡模式代表「精英治国」理念——用最好的人做公务员。后面讲中国法律工作者的专业化和腐败问题，都是在检验中国「人」这一维的状况。", "image": "study-assets/lecture-3/slide-004.jpg", "extract": "国家与代理人：国家能力——a 财政资源；b 能干且忠诚的代理人。亚洲社会：「最优秀和最聪明的人」（如新加坡）"}, {"id": "L3-005", "lecture": 3, "page": 5, "title": "Legal workers in China", "section": "法律工作者与职业化", "source": "5\n5\nLegal workers in China\n\na. Judges: 120,000-130,000\nb. Public prosecutors (i.e., those working in the procuratorate); 69,000 \n    budget-covered : 180,000\nc. Police officers: 2.0 million\n    Auxiliary Police Officers: 1.4-2 million", "knowledge": "中国法律工作者规模：a 法官 12–13 万；b 检察官 6.9 万（含编制内共 18 万）；c 警察 200 万，另有辅警 140–200 万。", "understand": "三类主体数量级差异极大：警察以百万计，法官以十万计。这决定了各自的组织逻辑和问题类型。注意法官与检察官人数相近但警察是他们的十倍以上。", "image": "study-assets/lecture-3/slide-005.jpg", "extract": "中国的法律工作者：a 法官：12–13万；b 检察官（在检察院工作的人）：6.9万，财政供养的共18万；c 警察：200万；辅警：140–200万"}, {"id": "L3-006", "lecture": 3, "page": 6, "title": "Public prosecutors (检察官)", "section": "法律工作者与职业化", "source": "6\nPublic prosecutors (检察官)\n         \n  1 9 9 8   2 0 1 1 P u b l i c   p r o s e c u t o r s     1 1 2 , 0 0 0   1 5 1 , 0 0 0 A p p r o v e d   a r r e s t s     4 2 2 , 0 0 0 / 3 . 5   9 2 3 , 0 0 0 / 6 . 1 C a s e s   f i l e d   w i t h   c o u r t s   2 6 2 , 0 0 0 / 2 . 3   8 2 4 , 0 0 0 / 5 . 5", "knowledge": "表格：1998 与 2011 年对比——检察官从 11.2 万增至 15.1 万；批捕数从 42.2 万（人均 3.5）增至 92.3 万（人均 6.1）；起诉案件从 26.2 万（人均 2.3）增至 82.4 万（人均 5.5）。", "understand": "看两行数字的增长方向：人员只增了约 35%，批捕和起诉量却翻了一倍多，人均工作量（斜杠后的数字）接近翻倍——为后面「基层法官工作负荷重」埋下伏笔。", "image": "study-assets/lecture-3/slide-006.jpg", "extract": "检察官：1998年11.2万 → 2011年15.1万；批准逮捕：42.2万/人均3.5 → 92.3万/人均6.1；向法院起诉案件：26.2万/人均2.3 → 82.4万/人均5.5"}, {"id": "L3-007", "lecture": 3, "page": 7, "title": "How to become legal workers in China/qualifications", "section": "法律工作者与职业化", "source": "7\n7\nHow to become legal workers in China/qualifications \n\nCriteria for a judge (in theory):\n\n“will not be diverted from their duty by any extraneous influences; nor by any hope of reward nor by the fear of penalties; nor by flattering praise nor by indignant reproach.”", "knowledge": "如何成为法律工作者/任职资格。理论上法官的标准：「不为任何外来影响偏离职责；不为奖赏的希望所动；不为惩罚的恐惧所动；不为奉承所动；不为怒斥所动」。", "understand": "先立一个理想标尺：法官应当只服从法律。这段引文是判断后文中国法官现实处境（收入低、受干预、素质参差）的对照基准。", "image": "study-assets/lecture-3/slide-007.jpg", "extract": "如何成为中国的法律工作者/任职资格。法官的标准（理论上）：「不为任何外来影响而偏离职责；不为奖赏之希望、惩罚之恐惧、谄媚之赞誉、愤怒之斥责所动。」"}, {"id": "L3-008", "lecture": 3, "page": 8, "title": "UK/HK", "section": "法律工作者与职业化", "source": "8\n           UK/HK", "knowledge": "图片页：英国/香港的法官装束。", "understand": "展示普通法系法官的职业化形象（假发、法袍），与下一页中国法官的出身形成对照。", "image": "study-assets/lecture-3/slide-008.jpg", "extract": "英国/香港"}, {"id": "L3-009", "lecture": 3, "page": 9, "title": "第 9 页", "section": "法律工作者与职业化", "source": "9", "knowledge": "（图片过渡页）", "understand": "配合英港法官形象展示的页面。", "image": "study-assets/lecture-3/slide-009.jpg", "extract": "（本页无提取文字，为图片页）"}, {"id": "L3-010", "lecture": 3, "page": 10, "title": "In China, professionalization has taken time.", "section": "法律工作者与职业化", "source": "10\nIn China, professionalization has taken time. \n\nFrom revolutionaries （职业革命者）to professionals （专业人士）", "knowledge": "中国的职业化经历了漫长过程：从职业革命者到专业人士。", "understand": "本板块的核心命题：中国的法官队伍经历了从「革命干部」到「专业法律人」的转型。这句话是后面所有数据和案例的主线。", "image": "study-assets/lecture-3/slide-010.jpg", "extract": "在中国，职业化经历了漫长过程：从职业革命者到专业人士"}, {"id": "L3-011", "lecture": 3, "page": 11, "title": "Judges in China:", "section": "法律工作者与职业化", "source": "11\n11\nJudges in China:\nIn the early 1980s, only about 1 to 2 percent had received formal legal education (trained in law schools or law programs).\n\nBackgrounds of judges in the early period:\na. cadres\nb. demobilized soldiers \nc. college graduates \nd. others", "knowledge": "1980 年代初，只有约 1%–2% 的法官受过正规法律教育。早期法官来源：a 干部；b 转业军人；c 大学毕业生；d 其他。", "understand": "起点极低：绝大多数法官没有法学背景。记住四个来源，其中「转业军人」最具时代特色——法院一度被当作安置退伍军人的单位。", "image": "study-assets/lecture-3/slide-011.jpg", "extract": "中国的法官：1980年代初，只有约1–2%受过正规法律教育（在法学院或法律专业受训）。早期法官的背景：a 干部；b 复员军人；c 大学毕业生；d 其他"}, {"id": "L3-012", "lecture": 3, "page": 12, "title": "Notorious cases", "section": "法律工作者与职业化", "source": "12\n12\nNotorious cases \n\n(e.g., from a dancer to a judge in Shanxi province): \nA primary school graduate, \nKnowing a local county leader \nBecame a judge", "knowledge": "荒唐案例：山西一名小学文化的舞蹈演员，因认识当地县领导而成为法官。", "understand": "极端个案说明早期法官任命的随意性：既无学历也无专业门槛，人事任命看关系。与 L2 讲的「党政掌握人事权」直接呼应。", "image": "study-assets/lecture-3/slide-012.jpg", "extract": "恶名案例（如山西从舞蹈演员成为法官）：小学毕业，认识当地一位县领导，于是成为法官"}, {"id": "L3-013", "lecture": 3, "page": 13, "title": "Example 2: Yao Xiaohong’s case in Shanxi", "section": "法律工作者与职业化", "source": "13\n13\nExample 2: Yao Xiaohong’s case in Shanxi\n(三盲院长)\na. A deputy president of a county court; previously a driver of the police bureau and then fired.\nb. Barely literate (文盲), abuse of power (流氓), inadequate knowledge of law (法盲) \nc. Beating and detaining hundreds of people\nd. Surviving several investigations by the discipline departments due to his networks \ne. Was eventually arrested because of the intervention of top central leaders; sentenced to life in prison.", "knowledge": "例二：山西姚晓红案（「三盲院长」）——县法院副院长，曾是公安局司机后被开除；文盲、流氓、法盲；殴打拘押数百人；靠关系网多次逃过纪检调查；最终因中央最高层干预被抓，判无期徒刑。", "understand": "「三盲院长」是法官队伍问题的标志性案例：文盲（barely literate）、流氓（abuse of power）、法盲（inadequate knowledge of law）。注意两点：关系网可以抵御多次调查；最后要靠中央干预才能法办——再次印证地方权力网络的韧性。", "image": "study-assets/lecture-3/slide-013.jpg", "extract": "例二：山西姚晓红案（三盲院长）：a 县法院副院长，此前是公安局司机，后被开除；b 近乎文盲、滥用职权（流氓）、法律知识匮乏（法盲）；c 殴打、拘押数百人；d 靠关系网在纪检部门多次调查中安然无恙；e 最终因中央最高层领导人干预而被捕，判处无期徒刑"}, {"id": "L3-014", "lecture": 3, "page": 14, "title": "The judge-doctor debate:", "section": "法律工作者与职业化", "source": "14\n14\n\nThe judge-doctor debate: \nShould the recruitment of judges be as strict as the recruitment of doctors? \n(1): High standards for recruiting judges\n(2): Knowledge about the law is not the most important", "knowledge": "法官—医生之争：法官的录用标准是否应当像医生一样严格？观点一：应当高标准；观点二：法律知识不是最重要的。", "understand": "一场政策辩论：法官判案关乎人命财产，是否应像医生一样设高门槛？反方观点（知识不是最重要）折射出「政治可靠重于专业」的旧观念。", "image": "study-assets/lecture-3/slide-014.jpg", "extract": "法官—医生之争：录用法官是否应当像录用医生一样严格？(1) 应当高标准录用法官；(2) 法律知识不是最重要的"}, {"id": "L3-015", "lecture": 3, "page": 15, "title": "Improvement:", "section": "法律工作者与职业化", "source": "15\n15\nImprovement:\nIn 2001, a unified examination system in was introduced. \n\nThose who work as lawyers, public procurators, and judges need to pass a standard test (current judges are exempted). \n\nFrom 2002 to 2005, one million people took the exam and 66,400 passed it.", "knowledge": "改进：2001 年建立统一司法考试制度；律师、检察官、法官需通过同一考试（现任法官豁免）。2002–2005 年一百万人参考，6.64 万人通过。", "understand": "2001 年统一司法考试是职业化的关键节点：三支队伍同一门槛。通过率约 6.6%，极低，说明筛选之严，也说明此前队伍离专业标准有多远。", "image": "study-assets/lecture-3/slide-015.jpg", "extract": "改进：2001年引入统一考试制度。律师、检察官、法官需通过统一考试（现任法官豁免）。2002–2005年，100万人参加考试，6.64万人通过"}, {"id": "L3-016", "lecture": 3, "page": 16, "title": "In 2002, 310,000 people participated in the examination, onl", "section": "法律工作者与职业化", "source": "16\nIn 2002, 310,000 people participated in the examination, only 8 percent passed.", "knowledge": "2002 年 31 万人参加司法考试，仅 8% 通过。", "understand": "上一页数据的补充：8% 的通过率，记住这个量级即可。", "image": "study-assets/lecture-3/slide-016.jpg", "extract": "2002年，31万人参加考试，仅8%通过"}, {"id": "L3-017", "lecture": 3, "page": 17, "title": "E.g., judges in Fushan in Guangdong", "section": "法律工作者与职业化", "source": "17\n17\nE.g., judges in Fushan in Guangdong \n  1 9 9 8   2 0 0 2 P o s t - g r a d u a t e s   3 ;   o r   1   %     1 4 ;   o r \n   6   %   C o l l e g e   g r a d u a t e s   \n 6 5 ;   o r   2 8   %     \n 1 2 4 ;   o r   5 1   %", "knowledge": "表格：广东佛山法官学历变化（1998→2002）——研究生从 3 人（1%）增至 14 人（6%）；大学毕业生从 65 人（28%）增至 124 人（51%）。", "understand": "四年间本科学历过半，研究生翻两番——司法考试制度推行后，法官队伍素质快速改善的微观证据。", "image": "study-assets/lecture-3/slide-017.jpg", "extract": "例：广东佛山的法官：1998年→2002年，研究生：3人（1%）→14人（6%）；大学毕业生：65人（28%）→124人（51%）"}, {"id": "L3-018", "lecture": 3, "page": 18, "title": "By 2004, the number of judges who received a college educati", "section": "法律工作者与职业化", "source": "18\n18\n\n\nBy 2004, the number of judges who received a college education increased from 10,000 to 90,000, or from 6.9 % of the total number of judges in 1995 to 51.6 % in 2004.", "knowledge": "到 2004 年，受过大学教育的法官从 1 万人增至 9 万人，占比从 1995 年的 6.9% 升至 2004 年的 51.6%。", "understand": "全国层面的数据，与佛山个案互证：十年间法官学历结构根本改观。记住 6.9% → 51.6% 这个跨度。", "image": "study-assets/lecture-3/slide-018.jpg", "extract": "到2004年，受过大学教育的法官人数从1万增至9万，即从1995年占法官总数的6.9%升至2004年的51.6%"}, {"id": "L3-019", "lecture": 3, "page": 19, "title": "Education of public prosecutors:", "section": "法律工作者与职业化", "source": "19\nEducation of public prosecutors:\n\n1985: 10% with junior college degree 大专\n2005： 44% college degree \n\nSome of them might not have a law-related degree (24% law degree)", "knowledge": "检察官学历：1985 年 10% 有大专学历；2005 年 44% 有大学学历；其中部分并非法律专业（法学学位占 24%）。", "understand": "检察官的专业化进程与法官同步但同样不彻底：学历上来了，专业未必对口（仅约四分之一是法学学位）。", "image": "study-assets/lecture-3/slide-019.jpg", "extract": "检察官的学历：1985年：10%有大专学历；2005年：44%有大学学历；其中一些人可能并非法律相关专业（法学学位占24%）"}, {"id": "L3-020", "lecture": 3, "page": 20, "title": "The process of professionalization", "section": "法律工作者与职业化", "source": "20\nThe process of professionalization \nThe issue of personnel quota (编制)\nAdministrative (行政编制):\nNon-administrative public agencies (事业):\nEnterprises (企业)\n\nAdministrative quota is controlled by the central government. Staff in the legal sector belong to administrative quota.", "knowledge": "职业化进程中的编制问题：编制分行政编制、事业编制、企业编制三类；行政编制由中央控制，法律部门人员属行政编制。", "understand": "编制（personnel quota）是理解中国官僚体系的关键概念：编制决定身份、待遇和人数上限。法律部门属行政编制，意味着法官规模由中央定盘子，地方不能随意扩编——这是基层人手不足的制度根源。", "image": "study-assets/lecture-3/slide-020.jpg", "extract": "职业化进程：编制问题。行政编制；非行政性公共机构（事业）；企业。行政编制由中央政府控制。法律部门工作人员属于行政编制"}, {"id": "L3-021", "lecture": 3, "page": 21, "title": "2. Issues in the legal department", "section": "法律部门的问题：腐败、特权与关系", "source": "21\n  2. Issues in the legal department\na. Grassroots judges face a heavy workload.\nb. Risk", "knowledge": "章节页：2. 法律部门的问题——a 基层法官工作负荷沉重；b 风险。", "understand": "进入第二板块：法律部门内部的违规与困境。", "image": "study-assets/lecture-3/slide-021.jpg", "extract": "2. 法律部门的问题：a 基层法官工作负荷沉重；b 风险"}, {"id": "L3-022", "lecture": 3, "page": 22, "title": "Judges and court rulings", "section": "法律部门的问题：腐败、特权与关系", "source": "22\n22\nJudges and court rulings \nDiscretion of judges:\na. Most lawsuits concern civil and economic disputes, and the party or government intervention is limited. \nb. Laws grant judges discretion in making rulings (e.g., 3-7 years)\nc. Judges, especially in less developed areas, are not satisfied with their income", "knowledge": "法官与裁决：法官的自由裁量权——a 大多数诉讼是民商事纠纷，党政干预有限；b 法律赋予法官裁量空间（如量刑 3–7 年）；c 法官（尤其欠发达地区）对收入不满意。", "understand": "三个因素叠加解释司法腐败的土壤：有裁量空间（b）+ 缺乏外部监督（a）+ 收入不满（c）。裁量权本身是必要的，但与低收入、弱监督结合就成为寻租空间。", "image": "study-assets/lecture-3/slide-022.jpg", "extract": "法官与裁决。法官的自由裁量权：a 多数诉讼涉及民事和经济纠纷，党政干预有限；b 法律赋予法官裁量空间（如3–7年）；c 法官（尤其在欠发达地区）对收入不满意"}, {"id": "L3-023", "lecture": 3, "page": 23, "title": "Does high salary prevent corruption?", "section": "法律部门的问题：腐败、特权与关系", "source": "23\n23\nDoes high salary prevent corruption?\n(高薪养廉)\n\nYes;\nNo", "knowledge": "辩论题：高薪能养廉吗？（高薪养廉）——正方与反方。", "understand": "新加坡模式的核心主张是高薪养廉。课件接下来用民国时期的数据检验这个命题。", "image": "study-assets/lecture-3/slide-023.jpg", "extract": "高薪能防止腐败吗？（高薪养廉）正方；反方"}, {"id": "L3-024", "lecture": 3, "page": 24, "title": "Example: in the KMT period (1928)", "section": "法律部门的问题：腐败、特权与关系", "source": "24\n24\nExample: in the KMT period (1928)\n\nSalary of professors:\nProfessor: 300 – 500 yuan\nAssociate: 300-340\nAssistant: 220-260\n\nDivision head of a county government: 80-180", "knowledge": "例证：国民党时期（1928 年）的薪水——教授 300–500 元，副教授 300–340，助理教授 220–260；县政府科长 80–180 元。", "understand": "先看教授的高薪（知识分子待遇优厚），为下一页法官的低薪做对照。", "image": "study-assets/lecture-3/slide-024.jpg", "extract": "例证：国民党时期（1928年）：教授：300–500元；副教授：300–340；助理教授：220–260。县政府科长：80–180元"}, {"id": "L3-025", "lecture": 3, "page": 25, "title": "Local court judges (senior): 160-300", "section": "法律部门的问题：腐败、特权与关系", "source": "25\n25\nLocal court judges (senior): 160-300\nLowest level of court staff: 60-150\n\nPrice:\nPork: 0.2 yuan per half kilogram\nRice: a few cents per half kilogram \n\nWell-known actors/actresses: 200", "knowledge": "（接上页）地方法院高级法官月薪 160–300 元，最低级法院职员 60–150 元。当时物价：猪肉每斤 0.2 元，大米每斤几分钱；名演员月入 200 元。", "understand": "关键对比：法官收入不及名演员，与教授相当甚至更低，但相对物价也算体面。课件用民国数据暗示：单纯高薪不是廉政的充分条件。", "image": "study-assets/lecture-3/slide-025.jpg", "extract": "地方法院法官（高级）：160–300元；最低级法院职员：60–150元。物价：猪肉每斤0.2元；大米每斤几分钱。名演员：200元"}, {"id": "L3-026", "lecture": 3, "page": 26, "title": "Judges’ salary in China today:", "section": "法律部门的问题：腐败、特权与关系", "source": "26\n26\nJudges’ salary in China today:\nThey are treated as public servants /government employees in terms of their pay.\n\nSignificant variation across places\nIn Beijing (before 2004) (average annual income)\nLawyer: 260,000 yuan; but highly unequal\nAverage judges: 90,000 yuan (decreased after 2004, sunshine salary reform)  \nNational: 15,000 yuan", "knowledge": "当今中国法官的薪酬：按公务员待遇；地区差异显著。北京（2004 年前年均收入）：律师 26 万元（但差距很大）；法官平均 9 万元（2004 年阳光工资改革后下降）；全国平均 1.5 万元。", "understand": "三组数字的落差是重点：同城律师收入近法官三倍，全国平均与北京的差距更悬殊。2004 年阳光工资改革反而降低了北京法官收入——低薪与裁量权并存，回扣到上一页「高薪养廉」的辩论。", "image": "study-assets/lecture-3/slide-026.jpg", "extract": "当今中国法官的薪酬：按公务员/政府雇员待遇；各地差异显著。北京（2004年前，平均年收入）：律师26万元（但高度不均）；法官平均9万元（2004年阳光工资改革后下降）；全国：1.5万元"}, {"id": "L3-027", "lecture": 3, "page": 27, "title": "Citizens complain most about the judges and the police", "section": "法律部门的问题：腐败、特权与关系", "source": "27\n27\nCitizens complain most about the judges and the police \n\nAn online survey of 504 people about the most respected legal professionals:\nLawyers:  57.9 %\nProcurators:  22.6%\nPolice: 8.9 %\nJudges: 8.7 %", "knowledge": "民众抱怨最多的是法官和警察。504 人网络调查「最受尊敬的法律职业」：律师 57.9%，检察官 22.6%，警察 8.9%，法官 8.7%。", "understand": "法官和警察在「最受尊敬」排名中垫底，与民众抱怨对象一致。注意律师声望最高——市场职业反而比体制内法律职业更受尊敬。样本是网络调查，代表网民倾向。", "image": "study-assets/lecture-3/slide-027.jpg", "extract": "民众抱怨最多的是法官和警察。504人网络调查——最受尊敬的法律职业：律师57.9%；检察官22.6%；警察8.9%；法官8.7%"}, {"id": "L3-028", "lecture": 3, "page": 28, "title": "A survey of 279 lawyers in 2002:", "section": "法律部门的问题：腐败、特权与关系", "source": "28\n28\nA survey of 279 lawyers in 2002:\n\nCorruption in the legal departments is very serious: 40 %\nCorruption in the legal departments is rather serious: 55 %\nCorruption is not serious: 5 %", "knowledge": "2002 年对 279 名律师的调查：认为法律部门腐败「非常严重」的 40%，「比较严重」的 55%，「不严重」的仅 5%。", "understand": "律师是最了解司法内幕的群体，95% 认为腐败严重——内部人视角的腐败评估，比一般舆论更有分量。", "image": "study-assets/lecture-3/slide-028.jpg", "extract": "2002年对279名律师的调查：认为法律部门腐败非常严重的40%；比较严重的55%；不严重的5%"}, {"id": "L3-029", "lecture": 3, "page": 29, "title": "Forms of corruption:", "section": "法律部门的问题：腐败、特权与关系", "source": "29\n29\nForms of corruption:\n(1) accepting money\n(2) accepting other things (e.g., computers)\n(3) having litigants pay bills \n(4) using litigants’ property (e.g., cars)", "knowledge": "腐败的形式：(1) 收钱；(2) 收受其他物品（如电脑）；(3) 让当事人付账；(4) 使用当事人的财产（如汽车）。", "understand": "四种形式从直接到间接，后两种更隐蔽——为下一页「难以查处」铺垫。", "image": "study-assets/lecture-3/slide-029.jpg", "extract": "腐败的形式：(1) 收受金钱；(2) 收受其他物品（如电脑）；(3) 让当事人买单；(4) 使用当事人的财产（如汽车）"}, {"id": "L3-030", "lecture": 3, "page": 30, "title": "Why do you need to pay?", "section": "法律部门的问题：腐败、特权与关系", "source": "30\n30\nWhy do you need to pay?\n(1) to receive a favorable judgment \n(2) not to be discriminated against \n\nDifficulties in curbing corruption:\n(1) Many litigants are reluctant to report \n(2) Some of the forms of corruption are subtle (e.g., through family members’ business)", "knowledge": "当事人为什么要付钱？(1) 为获得有利判决；(2) 为不被歧视对待。治理腐败的困难：(1) 许多当事人不愿举报；(2) 有些腐败形式很隐蔽（如通过家属经商）。", "understand": "注意行贿动机的第二层：不是买「偏袒」而是买「公平」——当事人付费只求不被歧视，说明不公平已被预设为常态。举报意愿低 + 形式隐蔽 = 查处难。", "image": "study-assets/lecture-3/slide-030.jpg", "extract": "为什么要付钱？(1) 为获得有利判决；(2) 为不被歧视对待。治理腐败的困难：(1) 许多当事人不愿举报；(2) 有些腐败形式很隐蔽（如通过家属的生意）"}, {"id": "L3-031", "lecture": 3, "page": 31, "title": "Corruption and injustice in the legal departments", "section": "法律部门的问题：腐败、特权与关系", "source": "31\n31\nCorruption and injustice in the legal departments \n\nExample 1\nThe case of Wuhan intermediate court \nIn 2003, 13 judges were caught for corruption, including two deputy presidents. They accepted 4 million yuan in bribes. In addition, nine judges were given court discipline, and 30 judges were transferred.", "knowledge": "例一：武汉中院窝案——2003 年 13 名法官因腐败落马，包括两名副院长，受贿 400 万元；另有 9 人受纪律处分、30 人被调岗。", "understand": "集体腐败（窝案）的特征：不是个别法官行为，而是包括院领导在内的系统性沦陷。一次处理 50 多人说明问题的普遍程度。", "image": "study-assets/lecture-3/slide-031.jpg", "extract": "法律部门的腐败与不公。例一：武汉中院案。2003年，13名法官因腐败被抓，包括两名副院长，受贿400万元；另有9名法官受法院纪律处分，30名法官被调岗"}, {"id": "L3-032", "lecture": 3, "page": 32, "title": "Example 2", "section": "法律部门的问题：腐败、特权与关系", "source": "32\n32\nExample 2 \nThe housing example in Hunan \n\nTraditional Chinese character for “door”\n門 (door)  \n\nSimplified character for “door” after 1950s \n门(door)", "knowledge": "例二：湖南的「门」案例——繁体「門」与简体「门」的文字游戏。", "understand": "课件用「门」字做引子讲司法腐败中的「走后门」现象（繁体門有两扇门，隐喻关系门路）。配合图片理解即可。", "image": "study-assets/lecture-3/slide-032.jpg", "extract": "例二：湖南的房屋案例。「门」的繁体字：門；1950年代后的简体字：门"}, {"id": "L3-033", "lecture": 3, "page": 33, "title": "上海法官集体嫖娼3人被双开拘留10天", "section": "法律部门的问题：腐败、特权与关系", "source": "33\n33\n上海法官集体嫖娼3人被双开拘留10天", "knowledge": "新闻标题：上海法官集体嫖娼，3 人被双开、拘留 10 天。", "understand": "近年法官违纪的媒体曝光案例，「双开」（开除党籍、开除公职）是对公职人员最重的纪律处分。", "image": "study-assets/lecture-3/slide-033.jpg", "extract": "上海法官集体嫖娼，3人被双开，拘留10天"}, {"id": "L3-034", "lecture": 3, "page": 34, "title": "Media attention to the case", "section": "法律部门的问题：腐败、特权与关系", "source": "34\n34\nMedia attention to the case", "knowledge": "媒体对该案的关注。", "understand": "媒体曝光是司法腐败被追责的重要渠道——舆论压力弥补了内部监督的不足。", "image": "study-assets/lecture-3/slide-034.jpg", "extract": "媒体对此案的关注"}, {"id": "L3-035", "lecture": 3, "page": 35, "title": "Police officials: sense of privileged citizens", "section": "法律部门的问题：腐败、特权与关系", "source": "35\n35\nPolice officials: sense of privileged citizens \n\nA survey of 26,065 complaint telephones in 2000:\n\nFor personal gains or for the interests of friends and relatives: 24 %\n\nb. Abuse of power and being arrogant: \n29 %", "knowledge": "警察的特权公民意识。2000 年对 26,065 个投诉电话的分析：为个人私利或亲友利益的占 24%；滥用职权、态度傲慢的占 29%。", "understand": "从法官转向警察。两类投诉指向同一心态：警察自视「特权公民」（sense of privileged citizens）——把执法权当作私人资源。样本是投诉电话，只反映被投诉行为的构成。", "image": "study-assets/lecture-3/slide-035.jpg", "extract": "警察官员：特权公民意识。2000年对26,065个投诉电话的调查：为个人私利或亲友利益的24%；滥用职权、傲慢的29%"}, {"id": "L3-036", "lecture": 3, "page": 36, "title": "e.g., the police shot citizens in arguments over minor famil", "section": "法律部门的问题：腐败、特权与关系", "source": "36\n36\ne.g., the police shot citizens in arguments over minor family or personal affairs (e.g., traffic disputes) \n\nExample 1\nIn Yunnan province in November 2004, a police officer riding a motorcycle had conflict with two passengers. When he had an argument with the two people, he shot the two passengers dead.", "knowledge": "例一：2004 年 11 月云南，一名警察骑摩托车与两名乘客发生冲突，争吵中开枪将两人打死。", "understand": "琐事纠纷中警察开枪杀人——特权意识最极端的表现：配枪本是执法工具，却成为私人争强斗狠的资本。", "image": "study-assets/lecture-3/slide-036.jpg", "extract": "例如，警察因家庭或个人琐事（如交通纠纷）争吵时开枪打市民。例一：2004年11月，云南一名警察骑摩托车与两名乘客发生冲突，争吵中将两人开枪打死"}, {"id": "L3-037", "lecture": 3, "page": 37, "title": "A police officer (Li, 李忠义) in Taiyuan beat a police officer ", "section": "法律部门的问题：腐败、特权与关系", "source": "37\n37\n                                                                                                       \nA police officer (Li, 李忠义) in Taiyuan beat a police officer (Liu, 刘立民) from Beijing to death", "knowledge": "案例引入：太原警察李忠义打死北京警察刘立民案。", "understand": "警察打死警察的奇案，接下来几页用时间线展开。连同行都下得了手，特权意识之深可见一斑。", "image": "study-assets/lecture-3/slide-037.jpg", "extract": "太原警察（李忠义）打死一名北京警察（刘立民）"}, {"id": "L3-038", "lecture": 3, "page": 38, "title": "3 May 2005", "section": "法律部门的问题：腐败、特权与关系", "source": "38\n38\n                                                                                                                                                                                                                                                                                                                                                                           \n\n\n\n\n\n\n\n\n\n3 May 2005\nThe policemen from Beijing (Li) traveled to Taiyuan in Shanxi province \nLi’s care was followed by a local police’s (Liu’s) car.\nLi saw a red light and stopped his car.\nLiu was angry when he saw Li stopped his car.", "knowledge": "案情时间线（1）：2005 年 5 月 3 日，北京警察李某到山西太原；他的车被当地警察刘某的车跟行；李某见红灯停车，刘某因前车停下而恼怒。", "understand": "起因微不足
