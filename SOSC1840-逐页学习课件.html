道：一次红灯停车。逐页展开时注意每一步的升级都很偶然，却步步走向命案。", "image": "study-assets/lecture-3/slide-038.jpg", "extract": "2005年5月3日，北京警察李某到山西太原；李某的车被当地警察刘某的车跟行；李某见红灯停车；刘某见李某停车而恼火"}, {"id": "L3-039", "lecture": 3, "page": 39, "title": "Liu asked another 8 local people and went to Li’s hotel and ", "section": "法律部门的问题：腐败、特权与关系", "source": "39\n39\n                                                                                                                                                                                                                                                                                                                                                                           \n\n\n\n\n\n\n\n\nLiu asked another 8 local people and went to Li’s hotel and beat him", "knowledge": "案情时间线（2）：刘某另纠集 8 名当地人，到李某入住的酒店殴打他。", "understand": "升级的关键一步：刘某一个电话叫来 8 个人——调用的正是「关系网」和警察身份的威慑力。", "image": "study-assets/lecture-3/slide-039.jpg", "extract": "刘某叫来另外8名当地人，到李某住的酒店殴打他"}, {"id": "L3-040", "lecture": 3, "page": 40, "title": "The Beijing policeman was beaten by nine people in the hotel", "section": "法律部门的问题：腐败、特权与关系", "source": "40\n40\n                                                                                                                                                                                                                                                                                                                                                                           \n\n\n\n\n\n\n\nThe Beijing policeman was beaten by nine people in the hotel and was seriously wounded.", "knowledge": "案情时间线（3）：北京警察在酒店被 9 人殴打，伤势严重。", "understand": "9 人围殴 1 人，且在酒店公然行凶——行凶者毫无顾忌。", "image": "study-assets/lecture-3/slide-040.jpg", "extract": "北京警察在酒店被9人殴打，伤势严重"}, {"id": "L3-041", "lecture": 3, "page": 41, "title": "Died the next day in hospital", "section": "法律部门的问题：腐败、特权与关系", "source": "41\n41\n                                                                                                                                                                                                                                                                                                                                                                           \n\n\n\n\n\n\nDied the next day in hospital", "knowledge": "案情时间线（4）：李某次日在医院死亡。", "understand": "冲突以命案收场。", "image": "study-assets/lecture-3/slide-041.jpg", "extract": "（李某）次日死于医院"}, {"id": "L3-042", "lecture": 3, "page": 42, "title": "Police officers was sentenced to death penalty with a reprie", "section": "法律部门的问题：腐败、特权与关系", "source": "42\n42\n\nPolice officers was sentenced to death penalty with a reprieve.\nAnother person was sentenced to death \nAnother 7 were sentenced to 9 to 15 years in prison \nCompensation: \n     592,100 yuan", "knowledge": "判决：涉案警察被判死缓；另 1 人死刑；其余 7 人判 9 至 15 年有期徒刑；赔偿 59.21 万元。", "understand": "判决结果：主犯死缓、一名直接行凶者死刑。注意死缓（death penalty with a reprieve）通常意味着不实际执行死刑——对警察身份的主犯从轻处理的痕迹。", "image": "study-assets/lecture-3/slide-042.jpg", "extract": "涉案警察被判处死刑缓期执行；另1人被判死刑；其余7人被判9至15年有期徒刑；赔偿：59.21万元"}, {"id": "L3-043", "lecture": 3, "page": 43, "title": "Media and the image of police officers", "section": "法律部门的问题：腐败、特权与关系", "source": "43\n43\nMedia and the image of police officers\n   Some incidents were disclosed by the media and the image of the police was seriously damaged. \n \nMedia reports can be biased against police officers.  \n\n(e.g., Li Siyi 李思怡 (3-year-old girl, starved to death in 2003, Chengdu)\n Nie Shubin 聂树斌;", "knowledge": "媒体与警察形象：一些事件被媒体披露后警察形象严重受损；但媒体报道也可能对警察有偏见（如 2003 年成都 3 岁女孩李思怡饿死案、聂树斌案）。", "understand": "双向判断：媒体曝光促进问责，但负面新闻的选择性报道会放大警察的负面形象——呼应 L2 的「负面偏差」概念。李思怡案：母亲被拘留，3 岁女儿在家饿死。", "image": "study-assets/lecture-3/slide-043.jpg", "extract": "媒体与警察形象：一些事件被媒体披露后，警察形象严重受损；但媒体报道可能对警察有偏见（如李思怡——3岁女孩，2003年在成都饿死；聂树斌案）"}, {"id": "L3-044", "lecture": 3, "page": 44, "title": "Networks and injustice", "section": "法律部门的问题：腐败、特权与关系", "source": "44\n44\nNetworks and injustice \nPersonal connections or social networks are an important factor affecting the interactions among individuals or social actors in China. \n\nHow are networks or guanxi (关系) formed?\nFamily ties, kinships, friends, classmates, colleagues, being born or raised in the same place", "knowledge": "关系网与司法不公：人际关系是中国人社会互动的重要因素。关系（guanxi）如何形成？家庭、亲属、朋友、同学、同事、同乡。", "understand": "转入「关系」主题。先界定关系的来源——六种纽带都是先天或长期积累的社会资本，陌生人难以进入。", "image": "study-assets/lecture-3/slide-044.jpg", "extract": "关系网与司法不公。人际关系或社会网络是影响中国个人或社会主体之间互动的重要因素。关系如何形成？家庭纽带、亲属、朋友、同学、同事、同乡"}, {"id": "L3-045", "lecture": 3, "page": 45, "title": "A rule of law means that both state power and private power ", "section": "法律部门的问题：腐败、特权与关系", "source": "45\n45\nA rule of law means that both state power and private power need to be restrained. \n\nPrivileged citizens may manipulate the legal procedures.", "knowledge": "法治意味着国家权力和私人权力都需要受到约束；特权公民可能操纵法律程序。", "understand": "本页是关系讨论的理论落点：法治不只是约束政府，也要约束私人权力的运作（关系网）。", "image": "study-assets/lecture-3/slide-045.jpg", "extract": "法治意味着国家权力和私人权力都需受到约束。特权公民可能操纵法律程序"}, {"id": "L3-046", "lecture": 3, "page": 46, "title": "How do networks affect justice?", "section": "法律部门的问题：腐败、特权与关系", "source": "46\n46\nHow do networks affect justice?\n\na. direct connections between litigants and legal workers (e.g., judges)\n\nb. connections with people who have connections with legal workers \n\nc. building connections through the introduction of a third party (and bribing)", "knowledge": "关系如何影响司法？a 当事人与法律工作者（如法官）的直接关系；b 与「认识法律工作者的人」的关系；c 通过第三方引荐建立关系（并行贿）。", "understand": "三种路径从直接到间接，c 最普遍也最隐蔽——陌生人通过中间人牵线搭桥把「没关系」变成「有关系」。", "image": "study-assets/lecture-3/slide-046.jpg", "extract": "关系如何影响司法？a 当事人与法律工作者（如法官）的直接关系；b 与认识法律工作者的人的关系；c 通过第三方引荐建立关系（并行贿）"}, {"id": "L3-047", "lecture": 3, "page": 47, "title": "Factors Affecting the Chance of Winning a Lawsuit", "section": "法律部门的问题：腐败、特权与关系", "source": "47\n47\nFactors Affecting the Chance of Winning a Lawsuit \n  2 0 0 2   ( % ) F a c t s   1 2 . 3 P e r t i n e n t   l a w s       2 . 6 F a c t s   a n d   p e r t i n e n t   l a w s       8 . 2 P e r s o n a l   c o n n e c t i o n s       1 . 5 A l l   t h e   a b o v e                                 7 5 . 0 M i s c e l l a n e o u s         0 . 4 T o t a l                             1 0 0 . 0 N u m b e r   o f   a n s w e r s   2 6 8", "knowledge": "表格：影响胜诉的因素（2002，%）——事实 12.3；相关法律 2.6；事实与法律 8.2；人情关系 1.5；以上全部 75.0；其他 0.4（回答数 268）。", "understand": "表的重点：75% 的受访者认为胜诉是「事实+法律+关系」全部因素的组合，单一因素（包括关系单独 1.5%）都不是决定性的。关系是必要条件之一而非充分条件——这比「关系决定一切」的判断更精确。", "image": "study-assets/lecture-3/slide-047.jpg", "extract": "影响诉讼胜诉的因素（2002年，%）：事实12.3；相关法律2.6；事实与相关法律8.2；人情关系1.5；以上全部75.0；其他0.4；合计100.0；回答数268"}, {"id": "L3-048", "lecture": 3, "page": 48, "title": "Example", "section": "法律部门的问题：腐败、特权与关系", "source": "48\n48\nExample \nIn a county of Liaoning province in 1993, a migrant girl was raped. \nShe was pregnant, approached the man，and was told by his family to have an abortion. \nThe girl refused.\nShe reported it to the police, and they arrested the suspect. \nHe was soon released without punishment. \nThe young man’s family managed to obtain “proof” that the young man had a mental problem. \nThe public security bureau refuse to investigate the case", "knowledge": "案例（1/3）：1993 年辽宁某县，一名打工少女被强奸怀孕，男方家庭要求堕胎，女孩拒绝；报警后嫌疑人被捕但很快获释未受处罚；男方家庭搞到嫌疑人「有精神病」的证明，公安局拒绝立案。", "understand": "关系网运作的完整演示：释放 + 假精神病证明 + 公安不立案，每一步都靠关系。案件跨度从 1993 到 1998，注意时间的拖延。", "image": "study-assets/lecture-3/slide-048.jpg", "extract": "案例：1993年辽宁某县，一名外来女孩被强奸；怀孕后找到男方，被对方家庭要求堕胎；女孩拒绝；报警后警察逮捕了嫌疑人；嫌疑人很快获释未受惩罚；男方家庭设法取得嫌疑人「有精神问题」的证明；公安局拒绝侦查此案"}, {"id": "L3-049", "lecture": 3, "page": 49, "title": "In 1997, the girl approached the procuracy.", "section": "法律部门的问题：腐败、特权与关系", "source": "49\n49\nIn 1997, the girl approached the procuracy.\nThe procuracy investigated the case. \nThe young man’s social networks allowed him to get away with another two rapes. \nThe procuracy identified over 10 witnesses, found out that the mental-problem proof of the suspect was false. \nThe procuracy asked the provincial public security bureau to perform a DNA test of the baby and the suspect and confirmed their father-daughter relationship.", "knowledge": "案例（2/3）：1997 年女孩找到检察院；检察院调查发现精神证明系伪造，找到 10 多名证人，请省公安厅做 DNA 鉴定确认父女关系；期间嫌疑人靠关系网又犯下两起强奸。", "understand": "检察院成为打破关系网的关键：绕开本地公安、直接调查取证。「又犯两起强奸」说明关系网的保护让罪犯有恃无恐，代价由社会承担。", "image": "study-assets/lecture-3/slide-049.jpg", "extract": "1997年，女孩找到检察院；检察院调查此案；嫌疑人的社会关系网使他又犯下两起强奸；检察院找到10多名证人，查明精神问题证明系伪造；检察院请省公安厅对婴儿和嫌疑人做DNA鉴定，确认父女关系"}, {"id": "L3-050", "lecture": 3, "page": 50, "title": "In 1998, the suspect was arrested and the case was submitted", "section": "法律部门的问题：腐败、特权与关系", "source": "50\n50\nIn 1998, the suspect was arrested and the case was submitted to the procuracy for public prosecution. \nThe family began to mobilize its network to obtain a favorable judgment. \nThe procuracy then conducted the trial outside the locality where the family had influence. \nThe suspect was sentenced to 14 years in prison and, \nIn a separated civil lawsuit, ordered to pay 60,000 yuan in compensation to the girl.", "knowledge": "案例（3/3）：1998 年嫌疑人被捕并移送起诉；其家庭动用关系网争取轻判；检察院于是异地审判；最终判刑 14 年，另案民事诉讼判赔 6 万元。", "understand": "破解关系网的办法是「异地审理」——把案件移出当事人关系网的覆盖范围。这个对策与 L2 的巡回法庭、L6 的异地管辖是同一逻辑。", "image": "study-assets/lecture-3/slide-050.jpg", "extract": "1998年，嫌疑人被捕，案件移送检察院公诉；其家庭开始动用关系网争取有利判决；检察院于是在其家庭没有影响力的外地审判；嫌疑人被判14年有期徒刑；另案民事诉讼判其向女孩赔偿6万元"}, {"id": "L3-051", "lecture": 3, "page": 51, "title": "3. Prison management and the problems", "section": "监狱管理", "source": "3. Prison management and the problems \n\n\n51", "knowledge": "章节页：3. 监狱管理与问题。", "understand": "进入第三板块：监狱系统。", "image": "study-assets/lecture-3/slide-051.jpg", "extract": "3. 监狱管理与问题"}, {"id": "L3-052", "lecture": 3, "page": 52, "title": "Problems with the management of prisons in China", "section": "监狱管理", "source": "52\n52\nProblems with the management of prisons in China\nChina has about 670 prisons, and 1.5 million prisoners (U.S.: more than 2 million)\n\n\nWho can visit the prisoner?\nFamily members/relatives/guardian \n(监护人)", "knowledge": "中国监狱管理问题：全国约 670 所监狱、150 万囚犯（美国超 200 万）。探视规定：仅家属/亲属/监护人可探视。", "understand": "先看规模：中美囚犯数都在百万量级。探视权限定为亲属，为后面「保外就医」等离开监狱的通道讨论做铺垫。", "image": "study-assets/lecture-3/slide-052.jpg", "extract": "中国监狱管理问题：中国约有670所监狱、150万囚犯（美国超200万）。谁可以探视囚犯？家庭成员/亲属/监护人"}, {"id": "L3-053", "lecture": 3, "page": 53, "title": "Regulated ways of leaving the jail:", "section": "监狱管理", "source": "53\n53\n\nRegulated ways of leaving the jail:\n\nReducing a sentence or imprisonment \n     (减刑); \nb. Released on parole (假释); \n\nc. Released on bail for medical treatment (保外就医)", "knowledge": "合规离开监狱的三种途径：a 减刑；b 假释；c 保外就医。", "understand": "三个术语是本板块的核心概念，也是监狱腐败的寻租点——后面两页分别讲条件，再后面就是这三种途径被买卖的案例。", "image": "study-assets/lecture-3/slide-053.jpg", "extract": "离开监狱的合规途径：a 减刑；b 假释；c 保外就医"}, {"id": "L3-054", "lecture": 3, "page": 54, "title": "第 54 页", "section": "监狱管理", "source": "54", "knowledge": "（减刑相关内容页）", "understand": "本页文字未提取到表格外的细节，配合前页讲减刑条件。", "image": "study-assets/lecture-3/slide-054.jpg", "extract": "（减刑相关规定，本页以图片/表格为主）"}, {"id": "L3-055", "lecture": 3, "page": 55, "title": "(2). Parole:", "section": "监狱管理", "source": "(2). Parole: \na. Felons (重罪犯) (murder, explosion, robbery, rape, kidnap), who are sentenced to 10 years in jail or life in jail) cannot be paroled. \n\nb. Those with a limited sentence need to finish half of the sentence \n\nc. For lifetime imprisonment, the criminal needs to finish 10 years of imprisonment.\n\n\n55", "knowledge": "假释条件：a 重罪犯（杀人、爆炸、抢劫、强奸、绑架）被判 10 年以上或无期的不得假释；b 有期徒刑犯需服满一半刑期；c 无期徒刑犯需服刑满 10 年。", "understand": "假释的三条规则要记：重罪排除、有期过半、无期十年。规则越明确，越能看出后文「花钱买假释」的违规性质。", "image": "study-assets/lecture-3/slide-055.jpg", "extract": "(2) 假释：a 重罪犯（杀人、爆炸、抢劫、强奸、绑架）被判10年以上或无期的不得假释；b 有期徒刑犯需服满一半刑期；c 无期徒刑犯需服满10年"}, {"id": "L3-056", "lecture": 3, "page": 56, "title": "(3). For medical treatment: Those detained or sentenced to i", "section": "监狱管理", "source": "(3). For medical treatment: Those detained or sentenced to imprisonment not for lifetime have serious illness. Not applicable to those dangerous people or those who want to disable themselves. Need documents from hospitals designated by the provincial government. \n56", "knowledge": "保外就医条件：被拘押或判处非终身监禁者患严重疾病；不适用于有危险性者或想自残者；需省级政府指定医院的证明文件。", "understand": "注意保外就医的证明要求——「指定医院」正是腐败的接口：医院和监狱管理人员合谋就能开出假病历。", "image": "study-assets/lecture-3/slide-056.jpg", "extract": "(3) 保外就医：被拘押或被判处有期徒刑者患严重疾病；不适用于有危险性者或意图自残者；需省级政府指定医院的文件"}, {"id": "L3-057", "lecture": 3, "page": 57, "title": "第 57 页", "section": "监狱管理", "source": "57", "knowledge": "（图片过渡页）", "understand": "配合保外就医规定的图片页。", "image": "study-assets/lecture-3/slide-057.jpg", "extract": "（本页无提取文字，为图片页）"}, {"id": "L3-058", "lecture": 3, "page": 58, "title": "Mismanagement of prisons:", "section": "监狱管理", "source": "58\n58\nMismanagement of prisons:\nBetween 1997 and 2000, the procuracies investigated 3,798 cases involving 4,173 staff in the prison sector.", "knowledge": "监狱管理失当：1997–2000 年，检察机关查处监狱系统案件 3,798 起，涉及工作人员 4,173 人。", "understand": "四年查处四千多人，平均每年约千人——监狱系统腐败的规模性证据。", "image": "study-assets/lecture-3/slide-058.jpg", "extract": "监狱管理失当：1997至2000年间，检察机关查处监狱系统案件3,798起，涉及工作人员4,173人"}, {"id": "L3-059", "lecture": 3, "page": 59, "title": "By August 2004, it was found that 17,836 prisoners obtained ", "section": "监狱管理", "source": "59\n59\nBy August 2004, it was found that 17,836 prisoners obtained the three types of treatment illegally. \n\nThe case of a prison in Shanxi,\na. In 2003, 100 prisoners were released on parole  \n\nb. From 2002 to 2004, 229 were released on parole \n\nc. Five or the eight released on bail for medical treatment were not qualified; two did not have any disease; three escaped \n\nd. Qualified prisoners could not be released on bail;      2002: 12 died; 2003: 14 died; 2004 (by October): 17 died \n\ne. allowed prisoners to carry cash; gambling was common", "knowledge": "到 2004 年 8 月，全国发现 17,836 名囚犯通过非法途径获得减刑、假释、保外就医。山西某监狱案例：a 2003 年 100 人假释；b 2002–2004 年 229 人假释；c 8 名保外就医者中 5 人不合格（2 人无病、3 人脱逃）；d 符合条件的反而保不出去：2002 年病死 12 人、2003 年 14 人、2004 年（至 10 月）17 人；e 允许囚犯携带现金，赌博成风。", "understand": "最刺眼的对比是 c 与 d：没病的花钱出去了，真病死的保不出去——保外就医制度完全倒置。这页数字多，抓住「17,836 人非法获释」和「病死人数逐年上升」两个点。", "image": "study-assets/lecture-3/slide-059.jpg", "extract": "到2004年8月，全国发现17,836名囚犯非法获得减刑、假释、保外就医。山西某监狱案：a 2003年100人被假释；b 2002–2004年229人被假释；c 8名保外就医者中5人不合格，2人无病，3人逃脱；d 符合条件的囚犯反而办不成保外就医：2002年12人死亡，2003年14人死亡，2004年（至10月）17人死亡；e 允许囚犯携带现金，赌博普遍"}, {"id": "L3-060", "lecture": 3, "page": 60, "title": "The case of a prison Luocheng in Guangxi,", "section": "监狱管理", "source": "60\n60\nThe case of a prison Luocheng in Guangxi,\na. The case involved more than 32 cadres managing the prison in the 1990s\nb. A review of the more 5,000 prisoners suggested that 206 received a reduced sentence illegally \nc. A deputy head of the prison took 680,000 yuan in bribe\n\nd. Prices:\n3,000 yuan: one year reduction \n4,000 yuan: released on bail for medical treatment \n10,000 yuan: released on parole", "knowledge": "广西罗城监狱案：a 涉及 1990 年代 32 名以上监狱管理干部；b 复查 5,000 多名囚犯发现 206 人非法减刑；c 一名副监狱长受贿 68 万元；d 明码标价：减一年刑 3,000 元，保外就医 4,000 元，假释 10,000 元。", "understand": "腐败的「价格表」是这页的核心：三种出狱途径各有价码，监狱权力被彻底商品化。记住三档价格。", "image": "study-assets/lecture-3/slide-060.jpg", "extract": "广西罗城监狱案：a 涉及1990年代32名以上监狱管理干部；b 复查5,000多名囚犯发现206人非法减刑；c 一名副监狱长受贿68万元；d 价格：减刑一年3,000元；保外就医4,000元；假释10,000元"}, {"id": "L3-061", "lecture": 3, "page": 61, "title": "How was the case disclosed?", "section": "监狱管理", "source": "61\n61\nHow was the case disclosed?\nA video tape by a criminal’s family \nIn one case, a person was sentenced to nine years in prison. \nAfter paying the money to the deputy head, the criminal only served 4 years.\nAfter he came out, he continued to act like a criminal  \nThe family wanted him to go back to the jail.", "knowledge": "案件如何败露？一名罪犯家属的录像带。一名判 9 年的罪犯付钱后只服刑 4 年；出狱后继续作恶，家属反而希望他回监狱。", "understand": "极具讽刺的曝光方式：家属花钱买减刑，结果放出来的人继续犯罪，家属不堪其扰只好举报——腐败交易的「售后服务」问题成了破案线索。", "image": "study-assets/lecture-3/slide-061.jpg", "extract": "案件如何败露？一名罪犯家属的录像带。一名被判9年的人，付钱给副监狱长后只服刑4年；出狱后继续作恶；家属反而希望他回监狱"}, {"id": "L3-062", "lecture": 3, "page": 62, "title": "4. Organized crimes in China", "section": "有组织犯罪与保护伞", "source": "4. Organized crimes in China \n\n62", "knowledge": "章节页：4. 中国的有组织犯罪。", "understand": "进入第四板块：黑社会与保护伞。此板块与 L2 的严打内容衔接，但更聚焦「保护伞」问题。", "image": "study-assets/lecture-3/slide-062.jpg", "extract": "4. 中国的有组织犯罪"}, {"id": "L3-063", "lecture": 3, "page": 63, "title": "Organized crimes in China: protective umbrella", "section": "有组织犯罪与保护伞", "source": "63\n63\n\n\nOrganized crimes in China: protective umbrella\nIt is estimated that there are about one million people engaged in organized crimes in China.", "knowledge": "中国有组织犯罪与保护伞：估计约 100 万人从事有组织犯罪活动。", "understand": "开篇给出规模估计：100 万人。核心关键词：protective umbrella（保护伞）。", "image": "study-assets/lecture-3/slide-063.jpg", "extract": "中国的有组织犯罪：保护伞。据估计，中国约有100万人从事有组织犯罪"}, {"id": "L3-064", "lecture": 3, "page": 64, "title": "Y e a r     G r o u p s   M e m b e r s 1 9 8 5   2 7 , 0 0 ", "section": "有组织犯罪与保护伞", "source": "64\n64\nY e a r     G r o u p s   M e m b e r s 1 9 8 5   2 7 , 0 0 0   1 0 6 , 0 0 0 1 9 9 0   1 0 0 , 5 2 7   3 6 8 , 8 8 5 1 9 9 5   1 4 0 , 0 0 0   5 4 0 , 0 0 0 1 9 9 6   1 3 6 , 0 0 0   6 7 0 , 0 0 0 1 9 9 7   1 0 5 , 9 1 5   - - 1 9 9 8   1 0 2 , 3 1 4   3 6 1 , 9 2 7 1 9 9 9   9 5 , 0 0 0   - - 2 0 0 0   8 2 , 0 0 0   - - 2 0 0 1   7 3 , 0 0 0   - - 2 0 0 2   5 6 , 0 0 0   - -\nCriminal Groups and their Members", "knowledge": "表格：犯罪团伙与成员数——1985 年 2.7 万团伙/10.6 万人，1990 年 10 万/36.9 万，1995 年 14 万/54 万，1996 年 13.6 万/67 万，此后逐年下降至 2002 年 5.6 万团伙。", "understand": "比 L2 的表更完整：1985–1996 上升，1996 年后持续下降。下降期与严打（1996）和治理强化对应。注意 1997 年后成员数缺失（--），只有团伙数。", "image": "study-assets/lecture-3/slide-064.jpg", "extract": "犯罪团伙及其成员：1985年2.7万团伙/10.6万成员；1990年10.05万/36.9万；1995年14万/54万；1996年13.6万/67万；1997年10.6万/--；1998年10.2万/36.2万；1999年9.5万/--；2000年8.2万/--；2001年7.3万/--；2002年5.6万/--"}, {"id": "L3-065", "lecture": 3, "page": 65, "title": "Structure of organized crimes in China", "section": "有组织犯罪与保护伞", "source": "65\n65\nStructure of organized crimes in China\nAn analysis of 55 criminal organizations in 1993 finds that 3.6 percent of the ring leaders did not engage in criminal activities directly. \nA recent analysis of 33 organizations in 1997 finds that 36.3 percent of the leaders did not engaged in concrete criminal activities directly.", "knowledge": "有组织犯罪的结构：1993 年对 55 个犯罪组织的分析发现 3.6% 的头目不直接参与犯罪活动；1997 年对 33 个组织的分析发现 36.3% 的头目不直接参与具体犯罪。", "understand": "3.6% → 36.3% 的变化说明黑社会在「升级」：头目退居幕后、组织化程度提高，更像现代企业或地下政府——打击难度也随之上升。", "image": "study-assets/lecture-3/slide-065.jpg", "extract": "中国有组织犯罪的结构：1993年对55个犯罪组织的分析发现3.6%的头目不直接参与犯罪活动；1997年对33个组织的分析发现36.3%的头目不直接参与具体犯罪活动"}, {"id": "L3-066", "lecture": 3, "page": 66, "title": "Forms:", "section": "有组织犯罪与保护伞", "source": "66\n66\nForms: \n(1) family-based\n(2) personal connection-based: friends, school mates, fellow villagers \n(3) interest-based gangs\n(4) ex-prisoners \n(5) independent but linked organizations (e.g., smuggling)\n(6) cross-border organizations\nEach year, more than 100,000 criminal organizations are wiped out in China.", "knowledge": "有组织犯罪的六种形态：(1) 家族型；(2) 关系型（朋友、同学、同乡）；(3) 利益型团伙；(4) 刑满释放人员；(5) 独立但相互勾连的组织（如走私）；(6) 跨境组织。中国每年打掉 10 万多个犯罪组织。", "understand": "六种形态按组织纽带分类，从血缘到利益到跨境。每年打掉 10 万+ 与上一页团伙总量（5–14 万）对照，说明团伙再生速度极快。", "image": "study-assets/lecture-3/slide-066.jpg", "extract": "形态：(1) 家族型；(2) 关系型：朋友、同学、同乡；(3) 利益型团伙；(4) 刑满释放人员；(5) 独立但相互勾连的组织（如走私）；(6) 跨境组织。中国每年打掉10万多个犯罪组织"}, {"id": "L3-067", "lecture": 3, "page": 67, "title": "Causes of the organized crimes:", "section": "有组织犯罪与保护伞", "source": "67\n67\nCauses of the organized crimes:\n\na. complex social environment (e.g., unemployment; Falungong: peasants 70%; workers 20%)\nb. weak government power \nc. corruption", "knowledge": "有组织犯罪的成因：a 复杂的社会环境（如失业；法轮功：农民占 70%、工人 20%）；b 政府权力薄弱；c 腐败。", "understand": "三条成因：社会转型压力、国家能力不足、腐败。第三条（腐败）是本讲的主线——有组织犯罪与保护伞互为因果。", "image": "study-assets/lecture-3/slide-067.jpg", "extract": "有组织犯罪的成因：a 复杂的社会环境（如失业；法轮功：农民70%、工人20%）；b 政府权力薄弱；c 腐败"}, {"id": "L3-068", "lecture": 3, "page": 68, "title": "Corruption of state agents and protective umbrellas", "section": "有组织犯罪与保护伞", "source": "68\n68\nCorruption of state agents and protective umbrellas\na. Some members of organized criminal groups are members of local people’s congresses or political consultative conferences (政协)\nb. Others established connections with government officials and legal workers \n\nc. Others have evidence on public employees’ corruption (e.g., Lai Changxing, Rui’an in Zhejiang)", "knowledge": "国家工作人员腐败与保护伞：a 一些犯罪组织成员本身是地方人大或政协成员；b 一些人与政府官员和法律工作者建立关系；c 一些人掌握公职人员腐败的把柄（如赖昌星、浙江瑞安案）。", "understand": "保护伞的三种建立方式：直接混入体制、攀附官员、握把柄要挟。第三种最稳固——互相握有把柄的「共生腐败」。", "image": "study-assets/lecture-3/slide-068.jpg", "extract": "国家工作人员腐败与保护伞：a 一些有组织犯罪成员本身是地方人大或政协成员；b 另一些与政府官员和法律工作者建立关系；c 还有一些掌握公职人员腐败的证据（如赖昌星、浙江瑞安）"}, {"id": "L3-069", "lecture": 3, "page": 69, "title": "An account of 496 cases of “protective umbrellas’ involving ", "section": "有组织犯罪与保护伞", "source": "69\n69\nAn account of 496 cases of “protective umbrellas’ involving 514 public employees, 387 were legal workers  \nHow do they provide help?\n(1) Providing information on investigation (e.g., casinos, dancing halls)\n(2) Protecting them from being imposed legal punishment \n(3) Providing other help after criminals being jailed", "knowledge": "对 496 起「保护伞」案件、514 名公职人员的统计：其中 387 人是法律工作者。提供帮助的方式：(1) 提供侦查信息（如赌场、舞厅的查处行动）；(2) 使其免受法律处罚；(3) 犯罪者入狱后提供其他帮助。", "understand": "514 人中 387 人是法律工作者（占 75%）——保护伞的主力不在普通行政部门而在执法司法系统内部。三种帮助方式覆盖事前（通风报信）、事中（免罚）、事后（狱中照顾）全链条。", "image": "study-assets/lecture-3/slide-069.jpg", "extract": "对496起「保护伞」案件、514名公职人员的统计：387人是法律工作者。他们如何提供帮助？(1) 提供侦查信息（如针对赌场、舞厅）；(2) 使其免受法律处罚；(3) 罪犯入狱后提供其他帮助"}, {"id": "L3-070", "lecture": 3, "page": 70, "title": "Example 1", "section": "有组织犯罪与保护伞", "source": "70\n70\nExample 1 \nIn Hunan province, the head of a criminal organization held a birthday party for his son. 43 cadres attended, 25 of them were police officers, 2 worked in the courts, and 2 worked in the procuracies.", "knowledge": "例一：湖南某犯罪组织头目为儿子办生日宴，43 名干部出席，其中 25 名警察、2 名法院人员、2 名检察院人员。", "understand": "一场生日宴暴露的关系网构成：警察占绝对多数——与上页「75% 是法律工作者」的统计互为印证。公开赴宴说明勾结已半公开化。", "image": "study-assets/lecture-3/slide-070.jpg", "extract": "例一：湖南一名犯罪组织头目为儿子办生日宴，43名干部出席，其中25名警察、2名法院人员、2名检察院人员"}, {"id": "L3-071", "lecture": 3, "page": 71, "title": "Example 2", "section": "有组织犯罪与保护伞", "source": "71\n71\nExample 2\nIn Jilin province, an organized crime involved 42 party and government employees and 15 legal workers, including the city mayor and the head of the city police bureau. The home of the head of the criminal organization was “an important protected residence of the police department.”  \nExample (Liu Yong)", "knowledge": "例二：吉林一起有组织犯罪案涉及 42 名党政人员和 15 名法律工作者，包括市长和市公安局长；犯罪组织头目的住所竟是「公安部门重点保护住所」。另例：刘涌案。", "understand": "保护伞直达地方权力顶端（市长 + 公安局长）；「重点保护住所」这个细节说明警察的保护已经制度化、公开化。刘涌是沈阳黑社会组织头目，曾轰动全国。", "image": "study-assets/lecture-3/slide-071.jpg", "extract": "例二：吉林一起有组织犯罪案涉及42名党政人员和15名法律工作者，包括市长和市公安局长；犯罪组织头目的家是「公安部门重点保护住所」。例（刘涌）"}, {"id": "L3-072", "lecture": 3, "page": 72, "title": "Direct involvement: case 1\u000bThe case of Fuzhou, Fujian", "section": "有组织犯罪与保护伞", "source": "72\n72\nDirect involvement: case 1\u000bThe case of Fuzhou, Fujian\nChen and Xu have a dispute over a business issue\nBian became their mediator\nXu wanted to talk to Bian in private, but was declined", "knowledge": "直接参与案例（1/4）：福州案——陈某与徐某因生意发生纠纷，卞某做调解人；徐某想与卞某私聊被拒。", "understand": "从「庇护」升级到「直接作案」的案例开端。人物关系：徐（商人）—卞（调解人）—王（公安局副局长）。", "image": "study-assets/lecture-3/slide-072.jpg", "extract": "直接参与：案例一，福建福州案。陈某与徐某因生意发生纠纷；卞某成为调解人；徐某想与卞某私聊，被拒绝"}, {"id": "L3-073", "lecture": 3, "page": 73, "title": "勾结匪徒150子弹剿杀商人", "section": "有组织犯罪与保护伞", "source": "73\n73\n勾结匪徒150子弹剿杀商人\u000b\nXu approached Wang 王振忠 (deputy head of Fuzhou policy bureau) and asked him to kill Bian.\nAnother police official did the killing \nWhen Bian went to the place for a mediation, he was shot.", "knowledge": "福州案（2/4）：徐某找到福州市公安局副局长王振忠，请他杀掉卞某；另一名警官动手；卞某到调解地点时被枪杀。报纸标题：「勾结匪徒 150 子弹剿杀商人」。", "understand": "公安局副局长接受商人委托杀人——「保护伞」的极端形态是警察直接充当杀手。", "image": "study-assets/lecture-3/slide-073.jpg", "extract": "徐某找到王振忠（福州市公安局副局长），请他杀掉卞某；另一名警官动手杀人；卞某到调解地点时被枪击。报纸标题：勾结匪徒，150发子弹剿杀商人"}, {"id": "L3-074", "lecture": 3, "page": 74, "title": "The police officers then made up the scene that Bian wanted ", "section": "有组织犯罪与保护伞", "source": "74\n74\nThe police officers then made up the scene that Bian wanted to rob people with guns and was therefore shot dead by the police", "knowledge": "福州案（3/4）：警察随后伪造现场，声称卞某持枪抢劫、被警方击毙。", "understand": "杀人后伪造「持枪抢劫被击毙」的现场——执法者利用职权把谋杀包装成合法击毙，若无败露就是一起「正常执法」。", "image": "study-assets/lecture-3/slide-074.jpg", "extract": "警察随后伪造现场，称卞某欲持枪抢劫，因此被警察击毙"}, {"id": "L3-075", "lecture": 3, "page": 75, "title": "2002, 王振忠 escaped to the U.S with 10 million U.S dollars (wi", "section": "有组织犯罪与保护伞", "source": "75\n75\n2002, 王振忠 escaped to the U.S with 10 million U.S dollars (with his love)\nPolice find another 30 million yuan at his home", "knowledge": "福州案（4/4）：2002 年王振忠携 1,000 万美元与情人逃往美国；警方在其家中又搜出 3,000 万元人民币。", "understand": "赃款规模（合计约 1.5 亿人民币）说明公安局长的腐败收益；外逃美国与赖昌星外逃加拿大是同一模式。", "image": "study-assets/lecture-3/slide-075.jpg", "extract": "2002年，王振忠携1,000万美元（与情人）逃往美国；警方在其家中另发现3,000万元人民币"}, {"id": "L3-076", "lecture": 3, "page": 76, "title": "His love then lived with another men and left Wang. Wang got", "section": "有组织犯罪与保护伞", "source": "76\n76\nHis love then lived with another men and left Wang. Wang got cancer in 2005 and died in 2007", "knowledge": "王振忠案尾声：情人后来与他人生活并离开了他；王 2005 年患癌，2007 年去世。", "understand": "外逃者的结局：人财两空、客死异乡。课件以此暗示外逃并非「成功出路」。", "image": "study-assets/lecture-3/slide-076.jpg", "extract": "他的情人后来与另一男人生活并离开了王；王2005年患癌，2007年去世"}, {"id": "L3-077", "lecture": 3, "page": 77, "title": "The case of Liu Han in Sichuan", "section": "有组织犯罪与保护伞", "source": "The case of Liu Han in Sichuan\n77", "knowledge": "案例引入：四川刘汉案。", "understand": "转入近年最大的涉黑案之一：刘汉、刘维兄弟案（2014 年宣判）。", "image": "study-assets/lecture-3/slide-077.jpg", "extract": "四川刘汉案"}, {"id": "L3-078", "lecture": 3, "page": 78, "title": "Sichuan Province", "section": "有组织犯罪与保护伞", "source": "78\nSichuan Province", "knowledge": "图片页：四川省。", "understand": "交代案件发生地的地图页。", "image": "study-assets/lecture-3/slide-078.jpg", "extract": "四川省"}, {"id": "L3-079", "lecture": 3, "page": 79, "title": "36 people of the group were charged with 15 crimes:", "section": "有组织犯罪与保护伞", "source": "79\n   36 people of the group were charged with 15 crimes:\n\nthe crimes of organizing, leading and participating in organized crimes. \n        咸宁市中级人民法院于2014年3月31日至4月19日对刘汉、刘维等36名被告人组织、领导、参加黑社会性质组织，故意杀人，故意伤害，包庇、纵容黑社会性质组织等案，以及被告单位四川汉龙（集团）有限公司骗取贷款、票据承兑、金融票证案依法公开开庭审理。庭审结束后，经各合议庭评议，审判委员会讨论决定作出判决。", "knowledge": "刘汉案：36 名被告人被控 15 项罪名，包括组织、领导、参加黑社会性质组织罪，故意杀人、故意伤害、包庇纵容黑社会性质组织等；其公司四川汉龙集团还涉骗取贷款、票据承兑、金融票证案。2014 年 3 月 31 日至 4 月 19 日咸宁中院公开审理。", "understand": "注意三点：人数多（36 人）、罪名多（15 项）、有企业外壳（汉龙集团）——现代黑社会「公司化」的典型。异地审理（在湖北咸宁而非四川）再次用到回避关系网的策略。", "image": "study-assets/lecture-3/slide-079.jpg", "extract": "该团伙36人被控15项罪名：组织、领导、参加黑社会性质组织罪，故意杀人、故意伤害、包庇纵容黑社会性质组织等；被告单位四川汉龙（集团）有限公司骗取贷款、票据承兑、金融票证案。咸宁市中级人民法院于2014年3月31日至4月19日依法公开开庭审理，经合议庭评议、审判委员会讨论决定作出判决"}, {"id": "L3-080", "lecture": 3, "page": 80, "title": "Five people, including Liu Han and his brother were sentence", "section": "有组织犯罪与保护伞", "source": "80\n   Five people, including Liu Han and his brother were sentenced to death. \n\n   劉漢和他的兄弟劉維以及唐先兵、張東華、田先偉共5人執行了死刑。", "knowledge": "刘汉及其弟刘维与唐先兵、张东华、田先伟共 5 人被判并执行死刑。", "understand": "5 人执行死刑——近年来对涉黑案件最严厉的判决之一。", "image": "study-assets/lecture-3/slide-080.jpg", "extract": "包括刘汉及其兄弟在内的5人被判死刑。刘汉和他的兄弟刘维以及唐先兵、张东华、田先伟共5人被执行死刑"}, {"id": "L3-081", "lecture": 3, "page": 81, "title": "Charges:", "section": "有组织犯罪与保护伞", "source": "81\nCharges:\n15 crimes \n\nOrganizing, leading, and participating in organized crimes", "knowledge": "指控：15 项罪名，包括组织、领导、参加黑社会性质组织罪。", "understand": "重述指控要点，强调「组织、领导、参加黑社会性质组织罪」这一专门罪名。", "image": "study-assets/lecture-3/slide-081.jpg", "extract": "指控：15项罪名；组织、领导、参加黑社会性质组织"}, {"id": "L3-082", "lecture": 3, "page": 82, "title": "Protective umbrella:", "section": "有组织犯罪与保护伞", "source": "82\nProtective umbrella:\nTwo police officials \n     Proving information, weapons, bullets, etc \n2. One public prosecutor\n      providing weapons, bullets, etc \n\nLiu was also a member of the Political Consultative Conference of Sichuan province 82(政协委员，常委)", "knowledge": "刘汉案的保护伞：两名警官（提供信息、武器、子弹等）；一名检察官（提供武器、子弹等）；刘汉本人还是四川省政协委员、常委。", "understand": "保护伞配置与前面的统计完全吻合（警察+检察官）。刘汉的政协委员身份正是 L3-068 说的「混入体制」路径。", "image": "study-assets/lecture-3/slide-082.jpg", "extract": "保护伞：两名警官——提供信息、武器、子弹等；一名检察官——提供武器、子弹等；刘汉还是四川省政协委员、常委"}, {"id": "L3-083", "lecture": 3, "page": 83, "title": "第 83 页", "section": "有组织犯罪与保护伞", "source": "83", "knowledge": "（图片过渡页）", "understand": "刘汉案相关图片页。", "image": "study-assets/lecture-3/slide-083.jpg", "extract": "（本页无提取文字，为图片页）"}, {"id": "L3-084", "lecture": 3, "page": 84, "title": "Survived the 2008 earthquake", "section": "有组织犯罪与保护伞", "source": "84\nSurvived the 2008 earthquake", "knowledge": "细节：刘汉曾在 2008 年汶川地震中「幸存」。", "understand": "背景细节：刘汉集团一度因地震中的表现获得正面形象（捐建学校未倒塌等），反差更显其双面性。", "image": "study-assets/lecture-3/slide-084.jpg", "extract": "在2008年地震中幸存"}, {"id": "L3-085", "lecture": 3, "page": 85, "title": "Government measures:", "section": "有组织犯罪与保护伞", "source": "85\n85\nGovernment measures:\nDestroying the protective umbrella.\n\nA recent news headline (February 23, 2006): \nThe central party committee announced a fight against organized crimes; protective umbrella will be destroyed \n\n中央部署打黑除恶斗争\n将深挖保护伞严查关系网", "knowledge": "政府对策：摧毁保护伞。2006 年 2 月 23 日新闻标题：中央部署打黑除恶斗争，将深挖保护伞、严查关系网。", "understand": "从案例回到政策：打黑的关键从「打黑社会」转向「打保护伞」——治理重点的转移。", "image": "study-assets/lecture-3/slide-085.jpg", "extract": "政府措施：摧毁保护伞。2006年2月23日的新闻标题：中央部署打黑除恶斗争，将深挖保护伞严查关系网"}, {"id": "L3-086", "lecture": 3, "page": 86, "title": "第 86 页", "section": "有组织犯罪与保护伞", "source": "86\n86", "knowledge": "（图片过渡页）", "understand": "打黑除恶主题的图片页。", "image": "study-assets/lecture-3/slide-086.jpg", "extract": "（本页无提取文字，为图片页）"}, {"id": "L3-087", "lecture": 3, "page": 87, "title": "How serious is the corruption in legal departments?", "section": "腐败的测量与反腐", "source": "87\n87\nHow serious is the corruption in legal departments?\n\nThere seems to be a bias\n\ne.g., people have a long memory about  negative news. \n(Yao’ example)", "knowledge": "法律部门的腐败到底有多严重？似乎存在偏差——人们对负面新闻记忆更长久（如姚晓红的例子）。", "understand": "方法论提醒再次出现：极端案例（姚晓红）记忆深刻，会高估整体腐败程度。与 L2-100 的 negative bias 是同一概念。", "image": "study-assets/lecture-3/slide-087.jpg", "extract": "法律部门的腐败到底有多严重？似乎存在一种偏差——例如人们对负面新闻记忆更长久（姚的例子）"}, {"id": "L3-088", "lecture": 3, "page": 88, "title": "Which is the most corrupt country in the Asia?", "section": "腐败的测量与反腐", "source": "88\n88\nWhich is the most corrupt country in the Asia?", "knowledge": "提问：亚洲最腐败的国家是哪个？", "understand": "用提问引入下一页的廉洁指数（CPI）国际比较。", "image": "study-assets/lecture-3/slide-088.jpg", "extract": "亚洲最腐败的国家是哪个？"}, {"id": "L3-089", "lecture": 3, "page": 89, "title": "C o u n t r y   r a n k     C o u n t r y     2 0 0 5       ", "section": "腐败的测量与反腐", "source": "89\n89\nC o u n t r y   r a n k     C o u n t r y     2 0 0 5       C P I   S c o r e 1 .   I c e l a n d     9 . 7 5 .   S i n g a p o r e     9 . 4 1 5 .   H o n g   K o n g     8 . 3 1 7 .   U n i t e d   S t a t e s   7 . 6 3 9 .   M a l a y s i a     5 . 1     K o r e a ,   S o u t h   5 . 0     T h a i l a n d     3 . 8 7 8 .   C h i n a     3 . 2     I n d i a     2 . 9     V i e t n a m     2 . 6   1 1 7   P h i l i p p i n e s     2 . 5     R u s s i a     2 . 4     I n d o n e s i a     2 . 2     P a k i s t a n     2 . 1 1 5 8 .   B a n g l a d e s h     1 . 7", "knowledge": "表格：2005 年清廉指数（CPI）排名——冰岛 9.7（第 1）、新加坡 9.4（第 5）、香港 8.3（15）、美国 7.6（17）、马来西亚 5.1（39）、韩国 5.0、泰国 3.8、中国 3.2（78）、印度 2.9、越南 2.6、菲律宾 2.5（117）、俄罗斯 2.4、印尼 2.2、巴基斯坦 2.1、孟加拉国 1.7（158）。", "understand": "CPI 满分 10 分、分数越高越清廉。中国 3.2 排 78，处于中下游；亚洲最腐败的答案是孟加拉国。注意香港（8.3）与内地（3.2）的巨大差距——为下一页 ICAC 案例做铺垫。", "image": "study-assets/lecture-3/slide-089.jpg", "extract": "国家排名（2005年CPI得分）：第1名冰岛9.7；第5新加坡9.4；第15香港8.3；第17美国7.6；第39马来西亚5.1；韩国5.0；泰国3.8；第78中国3.2；印度2.9；越南2.6；第117菲律宾2.5；俄罗斯2.4；印尼2.2；巴基斯坦2.1；第158孟加拉国1.7"}, {"id": "L3-090", "lecture": 3, "page": 90, "title": "C h i n a", "section": "腐败的测量与反腐", "source": "90\n90\n  C h i n a   \n H K   I n d i a   R u s s i a   V i e t n a m 1 9 8 0 - 1 9 8 5   5 . 1   7 . 4   3 . 7   5 . 1   - - 1 9 8 8 - 1 9 9 2   4 . 7   6 . 9   2 . 9   3 . 3   - - 1 9 9 6   2 . 4   7 . 0   2 . 6   2 . 6   - - 1 9 9 7   2 . 9   7 . 3   2 . 8   2 . 3   2 . 8 1 9 9 8   3 . 5   7 . 8   2 . 9   2 . 4   2 . 5 1 9 9 9   3 . 4   7 . 7   2 . 9   2 . 4   2 . 6 2 0 0 0   3 . 1   7 . 7   2 . 8   2 . 1   2 . 5 2 0 0 1   3 . 5   7 . 9   2 . 7   2 . 3   2 . 6 2 0 0 2   3 . 5   8 . 2   2 . 7   2 . 7   2 . 4 2 0 0 3   3 . 4   8 . 0   2 . 8   2 . 7   2 . 4 2 0 0 4   3 . 4   8 . 0   2 . 8   2 . 8   2 . 6 2 0 0 5   3 . 2   8 . 3   2 . 9   2 . 4   2 . 6\nCorruption Perceptions Index", "knowledge": "表格：清廉指数时间序列（1980–2005）——中国从 5.1（1980–85）跌至 1996 年的 2.4 后回升到 3.2–3.5 区间；香港从 7.4 升至 8.3；印度稳定在 2.6–2.9；俄罗斯从 5.1 跌至 2.4；越南 1997 年后约 2.4–2.8。", "understand": "中国的曲线先降后稳：改革初期腐败感知急剧恶化（5.1→2.4），1998 年后小幅回升并稳定在 3.2–3.5。香港持续上升，与内地走势形成鲜明对照——制度（ICAC）的作用。", "image": "study-assets/lecture-3/slide-090.jpg", "extract": "清廉指数：中国 1980–85年5.1 → 1996年2.4 → 1998年3.5 → 2005年3.2；香港 7.4 → 8.3 持续上升；印度 3.7 → 2.9 左右；俄罗斯 5.1 → 2.4；越南 1997年起约2.4–2.8"}, {"id": "L3-091", "lecture": 3, "page": 91, "title": "N a m e   P o s i t i o n   F u n d s   e m b e z z l e d 2 ", "section": "腐败的测量与反腐", "source": "91\n91\nN a m e   P o s i t i o n   F u n d s   e m b e z z l e d 2   1 .   M o h a m e d   S u h a r t o   P r e s i d e n t   o f   I n d o n e s i a   ( 1 9 6 7 – 1 9 9 8 )   $ 1 5 – 3 5   b i l l i o n   2 .   F e r d i n a n d   M a r c o s   P r e s i d e n t   o f   t h e   P h i l i p p i n e s   ( 1 9 7 2 – 1 9 8 6 )   5 – 1 0   b i l l i o n   3 .   M o b u t u   S e s e   S e k o   P r e s i d e n t   o f   Z a i r e   ( 1 9 6 5 – 1 9 9 7 )   5   b i l l i o n   4 .   S a n i   A b a c h a   P r e s i d e n t   o f   N i g e r i a   ( 1 9 9 3 – 1 9 9 8 )   2 – 5   b i l l i o n   5 .   S l o b o d a n   M i l o s e v i c   P r e s i d e n t   o f   S e r b i a / Y u g o s l a v i a   \n ( 1 9 8 9 – 2 0 0 0 )   1   b i l l i o n   6 .   J e a n - C l a u d e   D u v a l i e r   P r e s i d e n t   o f   H a i t i   ( 1 9 7 1 – 1 9 8 6 )   3 0 0 – 8 0 0   m i l l i o n   7 .   A l b e r t o   F u j i m o r i   P r e s i d e n t   o f   P e r u   ( 1 9 9 0 – 2 0 0 0 )   6 0 0   m i l l i o n   8 .   P a v l o   L a z a r e n k o   P r i m e   M i n i s t e r   o f   U k r a i n e   ( 1 9 9 6 – 1 9 9 7 )   1 1 4 – 2 0 0   m i l l i o n   9 .   A r n o l d o   A l e m á n   P r e s i d e n t   o f   N i c a r a g u a   ( 1 9 9 7 – 2 0 0 2 )   1 0 0   m i l l i o n 1 0 .   J o s e p h   E s t r a d a   P r e s i d e n t   o f   t h e   P h i l i p p i n e s   \n ( 1 9 9 8 – 2 0 0 1 )   7 8 – 8 0   m i l l i o n", "knowledge": "表格：全球贪腐领导人排行——印尼苏哈托（1967–98 在任）150–350 亿美元居首；菲律宾马科斯 50–100 亿；扎伊尔蒙博托 50 亿；尼日利亚阿巴查 20–50 亿；塞尔维亚米洛舍维奇 10 亿。", "understand": "透明国际的「最腐败领导人」榜单：榜首苏哈托贪腐规模以百亿计。注意都是国家元首级——权力顶端不受约束时的腐败规模。", "image": "study-assets/lecture-3/slide-091.jpg", "extract": "姓名/职务/贪腐金额：1 印尼总统苏哈托（1967–1998）150–350亿美元；2 菲律宾总统马科斯（1972–1986）50–100亿；3 扎伊尔总统蒙博托（1965–1997）50亿；4 尼日利亚总统阿巴查（1993–1998）20–50亿；5 塞尔维亚/南斯拉夫总统米洛舍维奇（1989–2000）10亿……"}, {"id": "L3-092", "lecture": 3, "page": 92, "title": "Mohamed Suharto has received a dubious honor from Transparen", "section": "腐败的测量与反腐", "source": "92\n92\nMohamed Suharto has received a dubious honor from Transparency International, which named the former Indonesian president the most corrupt world leader of the past 20 years.", "knowledge": "透明国际把「过去 20 年最腐败的世界领导人」这一不光彩的称号授予印尼前总统苏哈托。", "understand": "对上页榜首的定性强调。", "image": "study-assets/lecture-3/slide-092.jpg", "extract": "透明国际将「过去20年最腐败的世界领导人」的称号授予印尼前总统苏哈托"}, {"id": "L3-093", "lecture": 3, "page": 93, "title": "What can the government do?", "section": "腐败的测量与反腐", "source": "93\n93\nWhat can the government do?\nWhat has the government done?\n\nState power", "knowledge": "政府能做什么？政府做了什么？——国家权力。", "understand": "过渡页：从腐败程度的测量转向反腐措施。", "image": "study-assets/lecture-3/slide-093.jpg", "extract": "政府能做什么？政府已经做了什么？国家权力"}, {"id": "L3-094", "lecture": 3, "page": 94, "title": "Hong Kong ICAC 香港廉政公署", "section": "腐败的测量与反腐", "source": "94\n94\nHong Kong ICAC 香港廉政公署\nIn the 1960s, corruption in the police department:\nFirms’ annual profit: 4-5 million per year\nFees collected by the police: 10 million per month \n\n(amnesty in 1977: crimes before Jan. 1 1977 exempted)", "knowledge": "香港廉政公署（ICAC）案例：1960 年代警队腐败——企业年利润 400–500 万，警察每月收费 1,000 万；1977 年大赦（1977 年 1 月 1 日前的罪行豁免）。", "understand": "ICAC 是反腐制度的标杆案例。注意两个设计：警察腐败规模曾超过企业利润（收费 1,000 万/月 vs 利润 400–500 万/年）；1977 年大赦是「既往不咎、往后从严」的政治妥协，用以化解警队抵制。香港的 CPI 上升曲线（L3-090）证明其成效。", "image": "study-assets/lecture-3/slide-094.jpg", "extract": "香港廉政公署：1960年代警队腐败——企业年利润400–500万；警察每月收费1,000万。（1977年大赦：1977年1月1日前的罪行豁免）"}, {"id": "L3-095", "lecture": 3, "page": 95, "title": "In China:", "section": "腐败的测量与反腐", "source": "95\n95\nIn China: \nBetween August and November 2003, the Ministry of Public Security transferred or dismissed more than disqualified 33,700 staff from law enforcement posts in the public security system.", "knowledge": "中国：2003 年 8–11 月，公安部把 33,700 名不合格人员调离或清除出公安执法岗位。", "understand": "四个月清理 3.37 万人——运动式清理的规模惊人，但也说明队伍中不合格者的存量之大。", "image": "study-assets/lecture-3/slide-095.jpg", "extract": "中国：2003年8月至11月，公安部将33,700多名不合格人员调离或清除出公安系统执法岗位"}, {"id": "L3-096", "lecture": 3, "page": 96, "title": "The central government’s pressure to curb corruption in Chin", "section": "腐败的测量与反腐", "source": "96\nThe central government’s pressure to curb corruption in China.\n\nThe logic of “the leakage of authority” (权威流失)", "knowledge": "中央政府遏制腐败的压力与「权威流失」（the leakage of authority）的逻辑。", "understand": "核心概念：权威流失——中央政策在逐级下达过程中被层层打折扣。下一页用数字演示。", "image": "study-assets/lecture-3/slide-096.jpg", "extract": "中央政府遏制腐败的压力。「权威流失」的逻辑"}, {"id": "L3-097", "lecture": 3, "page": 97, "title": "Center", "section": "腐败的测量与反腐", "source": "97\n97\n             Center \n                  \n            Provincial \n                  \n                City\n                  \n        County/district\n                  \n           Township\n                  \n              Village", "knowledge": "层级图：中央 → 省 → 市 → 县/区 → 乡镇 → 村。", "understand": "与 L2 的行政层级图相同，这里用来演示权威流失：链条每多一级，中央意志就衰减一层。", "image": "study-assets/lecture-3/slide-097.jpg", "extract": "中央 → 省 → 市 → 县/区 → 乡镇 → 村"}, {"id": "L3-098", "lecture": 3, "page": 98, "title": "L e v e l   o f   g o v e r n m e n t     P e r c e i v e d ", "section": "腐败的测量与反腐", "source": "98\nL e v e l   o f   g o v e r n m e n t     P e r c e i v e d   s e r i o u s n e s s   C e n t r a l   g o v e r n m e n t     A   p o l i c y   P r o v i n c i a l   g o v e r n m e n t     8 0 %   s e r i o u s   C i t y   g o v e r n m e n t     8 0 %   s e r i o u s   ( 8 0 %   x   8 0 % ) C o u n t y   g o v e r n m e n t     8 0 %   s e r i o u s   ( 8 0 %   x   8 0 %   x 8 0 % ) T o w n s h i p   g o v e r n m e n t     F u r t h e r   d i s c o u n t e d", "knowledge": "表格：权威流失的折扣模型——中央出台一项政策；省级 80% 认真执行；市级 80%（即 0.8×0.8=64%）；县级 80%（0.8³≈51%）；乡镇进一步打折。", "understand": "用乘法模型量化权威流失：即使每级都「80% 认真」，到县级只剩约一半，到乡镇更低。这解释了为什么中央反腐决心与基层腐败观感之间存在巨大落差。", "image": "study-assets/lecture-3/slide-098.jpg", "extract": "政府层级/被感知的认真程度：中央政府——出台一项政策；省级——80%认真；市级——80%认真（80%×80%）；县级——80%认真（80%×80%×80%）；乡镇——进一步打折"}, {"id": "L3-099", "lecture": 3, "page": 99, "title": "Government measures", "section": "腐败的测量与反腐", "source": "99\n99\nGovernment measures  \n(1) Strengthening the information collection system \n(2) Strengthening internal checks \n(3) More resources\n(4) More transparency \n(5) The punishment of malfeasant legal agents is more credible", "knowledge": "政府措施：(1) 加强信息收集系统；(2) 加强内部制衡；(3) 增加资源；(4) 提高透明度；(5) 对渎职法律工作者的惩罚更可信。", "understand": "五条措施针对前面的病因：信息不对称（1）、缺乏制衡（2）、激励不足（3、4）、惩罚不可信（5）。注意 (5) 的措辞 credible——惩罚要「可信」而非「严厉」，是威慑理论的应用。", "image": "study-assets/lecture-3/slide-099.jpg", "extract": "政府措施：(1) 加强信息收集系统；(2) 加强内部制衡；(3) 更多资源；(4) 更高透明度；(5) 对渎职法律工作者的惩罚更可信"}, {"id": "L3-100", "lecture": 3, "page": 100, "title": "2021", "section": "腐败的测量与反腐", "source": "2021\n100", "knowledge": "图片页：2021（政法队伍教育整顿）。", "understand": "2021 年全国政法队伍教育整顿的图片，说明内部整风的延续。", "image": "study-assets/lecture-3/slide-100.jpg", "extract": "2021（图片页）"}, {"id": "L3-101", "lecture": 3, "page": 101, "title": "Discipline of staff in the court system in China:", "section": "腐败的测量与反腐", "source": "101\n101\nDiscipline of staff in the court system in China:\n\n Y e a r   N u m b e r   o f   p e o p l e   d i s c i p l i n e d   1 9 9 8   2 , 5 1 2 1 9 9 9   1 , 4 5 0 2 0 0 0   1 , 3 3 8 2 0 0 1   1 , 0 8 0 2 0 0 3         7 9 4", "knowledge": "表格：法院系统受处分人数——1998 年 2,512 人 → 1999 年 1,450 → 2000 年 1,338 → 2001 年 1,080 → 2003 年 794。", "understand": "受处分人数持续下降，可作两种解读：腐败减少，或查处放松。课件取前者（配合后文进步判断），但注意下降也可能是「越查越难」。", "image": "study-assets/lecture-3/slide-101.jpg", "extract": "中国法院系统人员受处分情况：1998年2,512人；1999年1,450人；2000年1,338人；2001年1,080人；2003年794人"}, {"id": "L3-102", "lecture": 3, "page": 102, "title": "Effectiveness:", "section": "腐败的测量与反腐", "source": "102\n102\nEffectiveness:\n   There have been progress towards a better legal system, though the progress is slow (e.g., a survey).\n\nSome of those who once filed lawsuits reported that they believed that the legal channel is getting better.\nMore transparency generates pressure on legal agents (video taping the process of interrogation).", "knowledge": "有效性：法律制度在向好的方向进步，虽然缓慢（如某调查）；一些打过官司的人认为法律渠道在改善；更高透明度对法律工作者形成压力（如审讯过程录像）。", "understand": "对反腐成效的谨慎乐观结论：进步存在但缓慢。审讯录像是透明化措施的具体例子——技术监督替代人的监督。", "image": "study-assets/lecture-3/slide-102.jpg", "extract": "有效性：法律制度在进步，虽然缓慢（如某调查）；一些曾打过官司的人认为法律渠道在改善；更高透明度对法律工作者形成压力（对审讯过程录像）"}, {"id": "L3-103", "lecture": 3, "page": 103, "title": "Overall, China has achieved progress in anticorruption:", "section": "腐败的测量与反腐", "source": "Overall, China has achieved progress in anticorruption:\n\nIn 2011: 35.5% were satisfied with anticorruption.\nIn 2016: 71.5%\nOfficials are clean: 2011--35.4%; 2016—65.3%。\n103", "knowledge": "总体看中国反腐取得进展：对反腐的满意率 2011 年 35.5% → 2016 年 71.5%；认为官员廉洁的比例 2011 年 35.4% → 2016 年 65.3%。", "understand": "两组翻倍数据对应 2012 年后的大规模反腐运动。满意率与支持率同步翻番，是本讲的收束数据。", "image": "study-assets/lecture-3/slide-103.jpg", "extract": "总体看，中国在反腐上取得进展：2011年35.5%的人对反腐满意，2016年为71.5%；认为官员廉洁的：2011年35.4%，2016年65.3%"}, {"id": "L3-104", "lecture": 3, "page": 104, "title": "Corruption perceptions index", "section": "腐败的测量与反腐", "source": "Corruption perceptions index\n104", "knowledge": "图片页：清廉指数。", "understand": "配合 CPI 数据的图表展示页。", "image": "study-assets/lecture-3/slide-104.jpg", "extract": "清廉指数"}, {"id": "L3-105", "lecture": 3, "page": 105, "title": "India", "section": "腐败的测量与反腐", "source": "India \n105", "knowledge": "图片页：印度。", "understand": "以印度作国际对照的结束页——民主制度并不自动等于廉洁（印度 CPI 长期低于 3）。", "image": "study-assets/lecture-3/slide-105.jpg", "extract": "印度"}, {"id": "L4-001", "lecture": 4, "page": 1, "title": "Lecture 4", "section": "民事纠纷与三种解决机制", "source": "1\nLecture 4            \nThe use of Lawsuits in China", "knowledge": "Lecture 4 主题：中国的诉讼使用（The use of Lawsuits in China）。", "understand": "前两讲讲了法律制度和法律人，本讲转向「需求侧」：普通中国人什么时候、为什么、怎样使用（或不使用）诉讼。", "image": "study-assets/lecture-4/slide-001.jpg", "extract": "第四讲：中国的诉讼使用"}, {"id": "L4-002", "lecture": 4, "page": 2, "title": "China has seen the rise of social conflicts in recent years.", "section": "民事纠纷与三种解决机制", "source": "2\nChina has seen the rise of social conflicts in recent years. \n\na. Conflict between state agencies and social actors \nb. Conflict between social actors: civil disputes", "knowledge": "近年来中国社会冲突上升：a 国家机构与社会主体之间的冲突；b 社会主体之间的冲突（民事纠纷）。", "understand": "两类冲突对应两种诉讼：b 对应民事诉讼，a 对应行政诉讼（L6 的主题）。本讲先讲民事纠纷。", "image": "study-assets/lecture-4/slide-002.jpg", "extract": "近年来中国的社会冲突上升：a 国家机构与社会主体之间的冲突；b 社会主体之间的冲突：民事纠纷"}, {"id": "L4-003", "lecture": 4, "page": 3, "title": "P e o p l e   C i v i l", "section": "民事纠纷与三种解决机制", "source": "3\n  P e o p l e   C i v i l   \n ( % )   S t a t e \n c i t i z e n \n ( % ) U r b a n \n     r e s i d e n t s     6 , 0 9 8   8 . 0   2 . 3 R u r a l \n     r e s i d e n t s     4 , 2 7 4                 1 0 . 7   2 . 8 T o t a l               1 0 , 3 7 2   9 . 1   2 . 5\nCGSS: Social Conflicts in China (2005)", "knowledge": "表格：CGSS 中国社会冲突调查（2005）——城市居民（6,098 人）经历民事冲突的 8.0%、国家—公民间冲突的 2.3%；农村居民（4,274 人）分别为 10.7%、2.8%；总体（10,372 人）为 9.1%、2.5%。", "understand": "全国代表性调查的两个发现：农村冲突率高于城市（与直觉相反）；民事纠纷远多于官民冲突（约 4 倍）——为「行政诉讼占比极小」埋下伏笔。", "image": "study-assets/lecture-4/slide-003.jpg", "extract": "CGSS：中国的社会冲突（2005）：城市居民6,098人——民事冲突8.0%、国家—公民冲突2.3%；农村居民4,274人——10.7%、2.8%；总计10,372人——9.1%、2.5%"}, {"id": "L4-004", "lecture": 4, "page": 4, "title": "Courts trial + closed cases:", "section": "民事纠纷与三种解决机制", "source": "Courts trial + closed cases:\n2005: 7.94 million \n2025: 36.2 million \n4", "knowledge": "法院受理+结案数：2005 年 794 万件 → 2025 年 3,620 万件。", "understand": "二十年增长约 4.5 倍，直观展示「诉讼爆炸」。这是本讲的核心背景数据。", "image": "study-assets/lecture-4/slide-004.jpg", "extract": "法院审理+结案数：2005年794万件；2025年3,620万件"}, {"id": "L4-005", "lecture": 4, "page": 5, "title": "Mechanisms for addressing civil disputes in China:", "section": "民事纠纷与三种解决机制", "source": "5\nMechanisms for addressing civil disputes in China:\n\n(1) Arbitration (仲裁)\n(2) Mediation (调解)\n(3) Lawsuits (起诉）", "knowledge": "中国民事纠纷的解决机制：(1) 仲裁；(2) 调解；(3) 诉讼。", "understand": "三种机制是本讲的分类框架，接下来逐一展开。注意三者在成本、约束力、正式性上的差异。", "image": "study-assets/lecture-4/slide-005.jpg", "extract": "中国民事纠纷的解决机制：(1) 仲裁；(2) 调解；(3) 诉讼"}, {"id": "L4-006", "lecture": 4, "page": 6, "title": "T o t a l   ( % )                           U r b a n   ( % ", "section": "民事纠纷与三种解决机制", "source": "6\n                                                                                                                                      T o t a l   ( % )                           U r b a n   ( % )                 R u r a l   ( % )                                                                                                                                         T o t a l   ( % )                           U r b a n   ( % )                 R u r a l   ( % )                                                                                                                                         T o t a l   ( % )                           U r b a n   ( % )                 R u r a l   ( % )                                                                                                                                         T o t a l   ( % )                           U r b a n   ( % )                 R u r a l   ( % ) M o d e s   o f   a c t i o n               M e d i a t i o n   b y   a c q u a i n t a n c e s     3 0 . 7   3 2 . 9   2 8 . 4       N o   a c t i o n     2 6 . 5     2 3 . 9   2 9 . 3       A p p r o a c h i n g   s t a t e   a u t h o r i t i e s         2 0 . 5     1 3 . 7   2 7 . 8       L a w     1 6 . 1     2 0 . 9   1 1 . 1       A p p r o a c h i n g   l e a d e r s   o f   t h e   \n               o t h e r   p a r t y ’ s   a g e n c y       8 . 0     1 3 . 3       2 . 4       A p p r o a c h i n g   t h e   m e d i a       1 . 2       2 . 2           0       M i s c e l l a n e o u s       7 . 7       9 . 4       5 . 5       T o t a l   n u m b e r   o f   c a s e s     9 4 7     4 8 9     4 5 8\nResolving civil disputes (2005)", "knowledge": "表格：民事纠纷的解决方式（2005）——按总体/城市/农村分列的多项选择调查。", "understand": "表格结构是按城乡分组的比例数据（多选，合计可超 100%）。重点看城乡差异：农村更多用调解和找村干部，城市更多用法律渠道。具体数据见原图。", "image": "study-assets/lecture-4/slide-006.jpg", "extract": "民事纠纷的解决（2005年）：按总体、城市、农村分列的调查数据表"}, {"id": "L4-007", "lecture": 4, "page": 7, "title": "Arbitration (仲裁 mainly for economic and civil disputes)", "section": "民事纠纷与三种解决机制", "source": "7\nArbitration (仲裁 mainly for economic and civil disputes)\n\nThe two or more parties involved in a dispute are willing to submit their disputes to a third party for arbitration (e.g., as regulated as in the contract they have signed).", "knowledge": "仲裁（主要用于经济和民事纠纷）：纠纷双方自愿将争议提交第三方仲裁（如合同中的仲裁条款约定）。", "understand": "仲裁的定义要点：自愿 + 事先约定（合同条款）。没有仲裁协议不能强制仲裁。", "image": "study-assets/lecture-4/slide-007.jpg", "extract": "仲裁（主要用于经济和民事纠纷）：纠纷双方自愿将争议提交第三方仲裁（如所签合同中的约定）"}, {"id": "L4-008", "lecture": 4, "page": 8, "title": "Arbitration is an important mode of conflict resolution betw", "section": "民事纠纷与三种解决机制", "source": "8\nArbitration is an important mode of conflict resolution between firms in China. \n.Mediation is not legally binding, and lawsuits can be costly and lengthy. \n\n.Arbitration costs less than a lawsuit, and what is more, arbitration determined in China is accepted by the international community and can be implemented by them.", "knowledge": "仲裁是中国企业间纠纷解决的重要方式：调解没有法律约束力，诉讼成本高、耗时长；仲裁成本低于诉讼，且中国作出的仲裁裁决获国际社会承认并可在外国执行。", "understand": "仲裁的两个比较优势：比调解有约束力，比诉讼便宜快捷；涉外商事中的可执行性（《纽约公约》体系）是企业选择它的关键。", "image": "study-assets/lecture-4/slide-008.jpg", "extract": "仲裁是中国企业间冲突解决的重要方式：调解不具法律约束力，诉讼昂贵且漫长；仲裁成本低于诉讼，而且中国的仲裁裁决获国际社会承认并可在外国执行"}, {"id": "L4-009", "lecture": 4, "page": 9, "title": "An important arbitration organization responsible for the ar", "section": "民事纠纷与三种解决机制", "source": "9\nAn important arbitration organization responsible for the arbitration between firms, including foreign firms\n\nThe China International Economic and Trade Arbitration Commission (中国国际经济贸易仲裁委员会).", "knowledge": "重要的仲裁机构：中国国际经济贸易仲裁委员会（CIETAC），负责企业间（含涉外企业）仲裁。", "understand": "记住这个机构名称和缩写——中国涉外仲裁的代表机构。", "image": "study-assets/lecture-4/slide-009.jpg", "extract": "负责企业间（含外资企业）仲裁的重要仲裁机构：中国国际经济贸易仲裁委员会"}, {"id": "L4-010", "lecture": 4, "page": 10, "title": "In Shanghai in 2002, foreign-related cases made up 50 percen", "section": "民事纠纷与三种解决机制", "source": "10\nIn Shanghai in 2002, foreign-related cases made up 50 percent of the 174 received by the Shanghai Commission of the China International Economic and Trade Arbitration Commission (中国国际经济贸易仲裁委员会). \n\nThe remaining half were economic disputes involving China-based joint ventures and domestic enterprises.", "knowledge": "2002 年上海贸仲受理的 174 件案件中，涉外案件占 50%；另一半是中外合资企业和国内企业的经济纠纷。", "understand": "涉外占一半说明仲裁在跨境商业中的独特地位：外国企业不信任中国法院时，仲裁是折中选择。", "image": "study-assets/lecture-4/slide-010.jpg", "extract": "2002年，中国国际经济贸易仲裁委员会上海分会受理的174件案件中，涉外案件占50%；另一半是中外合资企业和国内企业的经济纠纷"}, {"id": "L4-011", "lecture": 4, "page": 11, "title": "Example:", "section": "民事纠纷与三种解决机制", "source": "11\nExample:\nIn Shenzhen, a Hong Kong company contracted to manage a hotel. There was a written agreement between the HK company and the hotel. Later, the HK company failed to pay the contact fee to the hotel. The hotel submitted the case for arbitration, requesting to stop the contract relationship. It also required that the HK company pay 800,000 yuan in contract fee. So the arbitration committee supported the hotel’s demands.", "knowledge": "例：深圳一家香港公司签约管理酒店，后未付合同费；酒店申请仲裁要求解除合约并支付 80 万元合同费，仲裁委员会支持了酒店的请求。", "understand": "仲裁案例的标准流程：合同条款 → 一方违约 → 申请仲裁 → 裁决支持。80 万元标的的商事纠纷走仲裁而非法院。", "image": "study-assets/lecture-4/slide-011.jpg", "extract": "例：深圳，一家香港公司签约管理一家酒店，双方有书面协议；后香港公司未向酒店支付合同费；酒店申请仲裁，要求解除合约关系，并要求香港公司支付80万元合同费；仲裁委员会支持了酒店的请求"}, {"id": "L4-012", "lecture": 4, "page": 12, "title": "Mediation", "section": "民事纠纷与三种解决机制", "source": "12\nMediation \nMediation (调解）by a third party which is not the court (e.g., work unit leaders, village cadres, senior people in the village)\nMediation by the court (instead of making formal rulings)\nCourts are encouraged to use more mediation and fewer court rulings. Mediation is also common in other countries. \nIn the U.S more than 90 percent of civil and commercial cases are not solved through the courts but through mediation.", "knowledge": "调解（两种）：a 法院外第三方调解（单位领导、村干部、村中长者）；b 法院调解（代替正式判决）。法院被鼓励多用调解、少用判决。美国 90% 以上的民商事案件也不是通过法院而是调解解决。", "understand": "调解两分法：法院外 vs 法院内。「鼓励多调解少判决」是中国司法政策的特点（案结事了的治理逻辑）。美国的 90% 数据说明调解不是中国特色，而是普遍现象。", "image": "study-assets/lecture-4/slide-012.jpg", "extract": "调解：由法院之外的第三方调解（如单位领导、村干部、村中长者）；法院调解（代替正式判决）。法院被鼓励多用调解、少用判决。调解在其他国家也常见：美国90%以上的民商事案件不经法院而通过调解解决"}, {"id": "L4-013", "lecture": 4, "page": 13, "title": "Mediation in Family Affairs:", "section": "民事纠纷与三种解决机制", "source": "13\nMediation in Family Affairs: \na. Without going to the court:\nExample 1\nAfter J was released from jail and returned home, he suspected that his wife had extramarital affairs during his imprisonment. He beat his wife several times. His wife went to her father’s home and filed a lawsuit, requesting a divorce. J decided to kill his wife and explode her father’s house. One day, J and several other people went to his wife’s father’s home. The mediator arrived and grasped the explosives and shouted that J’s activities violated the law. J stopped and left. The mediator went to J’s home several times and told him that his wife was not that kind of person he had thought and she had suffered a great deal during his imprisonment. J made apology to his wife and his father-in-law, and his wife withdrew the lawsuit.", "knowledge": "家庭事务调解例一（不上法院）：J 出狱后怀疑妻子有外遇并多次殴打；妻子回娘家起诉离婚；J 欲杀妻并炸岳父家，带人上门时调解员赶到，夺下爆炸物并警告其违法；J 罢手离开；调解员多次上门劝解……", "understand": "极端案例展示调解员的正面功能：在暴力一触即发时介入，既阻止犯罪又化解纠纷。调解在乡村社会扮演「准警察+准法官」角色。", "image": "study-assets/lecture-4/slide-013.jpg", "extract": "家庭事务调解：a 不上法院。例一：J 刑满释放回家，怀疑妻子在其服刑期间有外遇，多次殴打妻子；妻子回娘家起诉离婚；J 决意杀妻并炸其父亲的房子。一天 J 带数人到岳父家，调解员赶到，夺下爆炸物，喝止其行为违法，J 停手离开。调解员多次到 J 家……"}, {"id": "L4-014", "lecture": 4, "page": 14, "title": "b. Court intervention: in the shadow of law/按法律的精神", "section": "民事纠纷与三种解决机制", "source": "14\nb. Court intervention: in the shadow of law/按法律的精神 \nExample 2 \nIn one family, the mother introduced a boyfriend to her daughter, but the daughter refused. The mother-daughter relationship was intense. In 1997, the daughter married another person and stopped contact with her mother. Because of a construction project, the mother’s village had to move elsewhere. According to the regulation, each person was paid 10,000 yuan in compensation. The daughter’s compensation was taken by the mother who refused to pay it to her daughter. The two parties resorted to physical fights.\n\nThe daughter then sued her mother. After the mediation of the court, the daughter was willing to withdraw the case, and the mother paid the money to her daughter.", "knowledge": "例二（法院介入/「在法律阴影下」）：母亲为女儿介绍男友被拒，母女关系紧张；1997 年女儿另嫁他人并与母亲断绝来往；因工程搬迁每人获赔 1 万元，女儿那份被母亲领走拒付，双方动手；女儿起诉……", "understand": "呼应 L1 的「in the shadow of law/按法律的精神」：法院介入后的调解以法律为底线，双方按法律预期讨价还价。案例本身展示家庭财产纠纷如何进入法律渠道。", "image": "study-assets/lecture-4/slide-014.jpg", "extract": "b 法院介入：在法律阴影下/按法律的精神。例二：某家庭母亲为女儿介绍男友，女儿拒绝，母女关系紧张；1997年女儿另嫁他人并与母亲断绝联系；因一项建设工程母亲所在村须搬迁，按规定每人获1万元补偿；女儿的补偿被母亲领走拒付，双方发生肢体冲突；女儿起诉……"}, {"id": "L4-015", "lecture": 4, "page": 15, "title": "Example 3", "section": "民事纠纷与三种解决机制", "source": "15\nExample 3\nP (the wife) married Z through some people’s introduction. Later, P found that Z had a mental problem which could not be cured. P filed a lawsuit and requested a divorce. The defendant’s father claimed that he lent 200,000 yuan to P who used the money to do business. But P claimed that the money was used for Z’s medication. After the court mediation, the two parties agreed to have a divorce.\na. P paid lump-sum compensation (80,000 yuan) to Z. \nb. P needed to pay the 200,000 yuan in debt. \nc. Their son lived with P.", "knowledge": "例三：P（妻）经人介绍与 Z 结婚，后发现 Z 有无法治愈的精神疾病，起诉离婚；被告父亲称借给 P 20 万元做生意，P 称钱用于给 Z 治病。经法院调解双方同意离婚：a P 一次性补偿 Z 8 万元；b P 需偿还 20 万元债务；c 儿子随 P 生活。", "understand": "法院调解的实际形态：离婚、债务、抚养权打包处理，结果（赔钱离婚）是双方妥协而非严格依法判决。", "image": "study-assets/lecture-4/slide-015.jpg", "extract": "例三：P（妻）经人介绍与 Z 结婚，后发现 Z 有无法治愈的精神疾病，起诉离婚；被告父亲称曾借20万元给P做生意，P称钱用于给Z治病。经法院调解双方同意离婚：a P一次性补偿Z 8万元；b P需偿还20万元债务；c 儿子随P生活"}, {"id": "L4-016", "lecture": 4, "page": 16, "title": "U r b a n                                           R u r a ", "section": "民事纠纷与三种解决机制", "source": "16\n                                                                                            U r b a n                                           R u r a l                                                                                                 U r b a n                                           R u r a l                                                                                                 U r b a n                                           R u r a l                                                                                                 U r b a n                                           R u r a l                                                                                                 U r b a n                                           R u r a l   M o d e s   I n t e n t i o n \n ( % )   A c t i o n \n ( % )   I n t e n t i o n \n ( % )   A c t i o n \n ( % )         L a w   4 1 . 3   2 0 . 9   1 6 . 4   1 1 . 1 A p p r o a c h i n g   l e a d e r s   o f   \n           t h e   o t h e r   p a r t y ’ s   a g e n c y   1 4 . 2   1 3 . 3       5 . 5       2 . 4 M e d i a t i o n   b y   a c q u a i n t a n c e s   1 8 . 8   3 2 . 9   2 4 . 7   2 8 . 4 A p p r o a c h i n g   s t a t e   a u t h o r i t i e s     1 2 . 8   1 3 . 7   3 7 . 2   2 7 . 8 A p p r o a c h i n g   t h e   m e d i a       2 . 3       2 . 2       1 . 0   0 I n a c t i o n         9 . 0   2 3 . 9   1 3 . 2   2 9 . 3 M i s c e l l a n e o u s         1 . 6       9 . 4       2 . 2       5 . 5 T o t a l   c a s e s     5 , 6 0 9   4 8 9   3 8 1 6   4 5 8\nBehavioral intention and actual action in civil disputes", "knowledge": "表格：民事纠纷中的行为意向与实际行动——按城乡分列的对比调查。", "understand": "这张表的核心结构是「意向 vs 行动」两列：想告的人远多于实际告的人（意向—行动落差）。结合 L4-006 一起看，城乡对比也要注意。具体数字见原图。", "image": "study-assets/lecture-4/slide-016.jpg", "extract": "民事纠纷中的行为意向与实际行动：按城乡分列的对比调查表"}, {"id": "L4-017", "lecture": 4, "page": 17, "title": "The use of lawsuits:", "section": "诉讼使用的增长", "source": "17\nThe use of lawsuits: \nCivil cases, including economic disputes", "knowledge": "章节页：诉讼的使用——民事案件（含经济纠纷）。", "understand": "从三种机制聚焦到诉讼本身：先看民事案件的总量变化。", "image": "study-assets/lecture-4/slide-017.jpg", "extract": "诉讼的使用：民事案件，包括经济纠纷"}, {"id": "L4-018", "lecture": 4, "page": 18, "title": "Cases accepted by courts", "section": "诉讼使用的增长", "source": "18\nCases accepted by courts", "knowledge": "图表页：法院受理案件数的变化。", "understand": "图表展示受理案件数的长期上升趋势（与 L4-004 的 794 万→3,620 万呼应）。看趋势斜率：哪段上升最快，对应市场化最快的时期。", "image": "study-assets/lecture-4/slide-018.jpg", "extract": "法院受理的案件（数量趋势图）"}, {"id": "L4-019", "lecture": 4, "page": 19, "title": "Proportion /比例", "section": "诉讼使用的增长", "source": "19\nProportion /比例", "knowledge": "图表页：案件构成的比例。", "understand": "比例图配合下一页的三类诉讼占比：民事约 85%、刑事 12–13%、行政不到 2%。", "image": "study-assets/lecture-4/slide-019.jpg", "extract": "比例（案件构成图）"}, {"id": "L4-020", "lecture": 4, "page": 20, "title": "Cases", "section": "诉讼使用的增长", "source": "20\nCases", "knowledge": "图表页：案件数（趋势）。", "understand": "案件数量的趋势展示页，与 L4-018 一组。", "image": "study-assets/lecture-4/slide-020.jpg", "extract": "案件（数量图）"}, {"id": "L4-021", "lecture": 4, "page": 21, "title": "1 9 9 4   1 2 . 2   8 6 . 9   0 . 8 9 1 9 9 5   1 0 . 9   8 ", "section": "诉讼使用的增长", "source": "21\n1 9 9 4   1 2 . 2   8 6 . 9   0 . 8 9 1 9 9 5   1 0 . 9   8 7 . 9   1 . 1 6 1 9 9 6   1 1 . 7   8 6 . 8   1 . 5 1 1 9 9 7   8 . 3   9 0 . 0   1 . 7 1 1 9 9 8   8 . 9   8 9 . 3   1 . 8 2 1 9 9 9   9 . 5   8 8 . 8   1 . 7 2 2 0 0 0   1 0 . 5   8 7 . 9   1 . 6 0 2 0 0 1   1 1 . 8   8 6 . 3   1 . 8 9 2 0 0 2   1 2 . 3   8 6 . 1   1 . 5 7 2 0 0 3   1 2 . 3   8 6 . 0   1 . 7 1 2 0 0 4   1 2 . 8   8 5 . 4   1 . 8 3 2 0 0 5   1 3 . 3   8 4 . 9   1 . 8 6 2 0 0 6   1 3 . 6   8 4 . 6   1 . 8 4 2 0 0 7   1 3 . 0   8 5 . 1   1 . 8 3 2 0 0 8   1 2 . 2   8 6 . 1   1 . 7 2 2 0 0 9   1 1 . 5   8 6 . 7   1 . 8 0 2 0 1 0   1 1 . 1   8 7 . 0   1 . 8 4 2 0 1 1   1 1 . 1   8 7 . 1   1 . 8 0", "knowledge": "表格：历年民事、刑事、行政案件的占比与行政案件数（万件）——行政案件占比从 1994 年的 0.89 万、约 12% 民事占比波动到 2005 年后民事约 85%、行政案件约 1.7–1.9 万件。", "understand": "长序列数据的重点：民事案件占比稳定在 85% 上下，行政诉讼（第三列，单位万件）绝对数和占比都极小。这直接量化「民告官」的边缘地位。", "image": "study-assets/lecture-4/slide-021.jpg", "extract": "历年案件构成（1994–2011）：民事占比约85–90%，刑事约11–14%，行政案件约0.89万–1.9万件（占比不足2%）"}, {"id": "L4-022", "lecture": 4, "page": 22, "title": "Lawsuits in China in recent years:", "section": "诉讼使用的增长", "source": "22\nLawsuits in China in recent years:\n\nCivil lawsuits (civil, commercial/economic): 85-86 percent \n\nCriminal: 12-13 percent\n\nAdministrative litigation/\nstate compensation         less than 2 percent", "knowledge": "近年中国诉讼的构成：民事（民商事/经济）85–86%；刑事 12–13%；行政诉讼/国家赔偿不到 2%。", "understand": "三类诉讼的比例是本讲最重要的数字之一，务必记住：85 / 12 / 2。行政诉讼不足 2% 是 L6 的出发点。", "image": "study-assets/lecture-4/slide-022.jpg", "extract": "近年的诉讼构成：民事诉讼（民事、商事/经济）85–86%；刑事12–13%；行政诉讼/国家赔偿不到2%"}, {"id": "L4-023", "lecture": 4, "page": 23, "title": "Reasons for the increase:", "section": "诉讼使用的增长", "source": "23\nReasons for the increase:\na. The weakening of the previous social, political, and economic arrangements \n   (work unit/单位制度)\nb. The increased interactions among citizens, social organizations, or state agencies (i.e., the development of the market economy市场经济)\nc. The rise of citizens’ awareness of rights or the change of their mentalities （法律意识）", "knowledge": "诉讼增加的原因：a 旧的社会、政治、经济安排弱化（单位制度）；b 公民、社会组织、国家机构之间的交往增加（市场经济发展）；c 公民权利意识上升（法律意识）。", "understand": "三条原因正好对应 L1 的三大变化：单位/公社解体、市场经济、普法教育。这是「社会经济变迁→纠纷→诉讼」链条的总结页，建议背熟。", "image": "study-assets/lecture-4/slide-023.jpg", "extract": "诉讼增加的原因：a 旧的社会、政治、经济安排弱化（单位制度）；b 公民、社会组织、国家机构之间的交往增加（市场经济发展）；c 公民权利意识上升或心态变化（法律意识）"}, {"id": "L4-024", "lecture": 4, "page": 24, "title": "The calf dispute in Yunnan", "section": "消费者维权", "source": "24\nThe calf dispute in Yunnan\nIn a village in Yunnan province in 1998. \n\nZhao (赵文兴) lost his calf \n\n1999, Zhao was told that his calf could be in the cattle of a villager in another village  \n\nZhao went to check the calf and brought it back", "knowledge": "云南小牛纠纷案（1/3）：1998 年赵文兴丢了一头小牛；1999 年听说牛在邻村一村民家，前去确认后把牛牵回。", "understand": "一个经典的「权利意识觉醒」案例开场：一头牛引发的诉讼。注意乡村背景下物证认定的困难。", "image": "study-assets/lecture-4/slide-024.jpg", "extract": "云南小牛纠纷：1998年，赵文兴丢了一头小牛；1999年听说牛可能在邻村一户村民的牛群里；赵前去确认并把牛牵了回来"}, {"id": "L4-025", "lecture": 4, "page": 25, "title": "The other village sued Zhao, won the case, and got the calf ", "section": "消费者维权", "source": "25\nThe other village sued Zhao, won the case, and got the calf back\n\nIf you were Zhao, what would you do?", "knowledge": "小牛案（2/3）：邻村村民起诉赵某并胜诉，牛被判回。提问：如果你是赵，你会怎么办？", "understand": "一审靠村庄关系和传统证据规则判决，赵败诉。设问引出下一页的现代解决方案。", "image": "study-assets/lecture-4/slide-025.jpg", "extract": "邻村村民起诉赵并胜诉，牛被判回。如果你是赵，你会怎么办？"}, {"id": "L4-026", "lecture": 4, "page": 26, "title": "For the DNA test", "section": "消费者维权", "source": "26\nFor the DNA test \nZhao decided to resorted to the DNA test by spending more than 7,000 yuan \n\nZhao won the case in 2000, got his calf back.", "knowledge": "小牛案（3/3）：赵某花 7,000 多元做 DNA 鉴定；2000 年胜诉，要回小牛。", "understand": "用 DNA 鉴定给牛做亲子鉴定——科学技术战胜地方关系网，是「权利意识+技术手段」结合的标志性案例。7,000 元鉴定费对农民是巨资，说明维权成本。", "image": "study-assets/lecture-4/slide-026.jpg", "extract": "为做DNA鉴定，赵花了7,000多元；2000年赵胜诉，要回了小牛"}, {"id": "L4-027", "lecture": 4, "page": 27, "title": "Murahachibu (八分村)：a traditional communal sanction in rural J", "section": "消费者维权", "source": "Murahachibu (八分村)：a traditional communal sanction in rural Japan\n成人礼：coming-of-age ceremonies\n婚礼：weddings\n产妇生产：childbirth assistance\n建房：house construction\n探病：visiting the sick\n水灾救援：flood relief\n远行：support for long-distance travel\n法事祭祀：Buddhist rites and ancestral sacrifices\n火灾救助：firefighting /fire rescue\n葬礼：funerals\n\n27", "knowledge": "日本农村的「八分村」（murahachibu）传统村社制裁：在成人礼、婚礼、接生、建房、探病、水灾救援、远行、法事、火灾救助、葬礼十项互助中，被制裁者只配参加「两分」（通常指火灾和葬礼）。", "understand": "日本版「非正式规则」：村民违规后被集体排斥（村八分）。与 L1 中国村庄的非正式秩序对照——熟人社会制裁的跨国共性。", "image": "study-assets/lecture-4/slide-027.jpg", "extract": "八分村：日本农村传统的村社制裁。十项互助场合：成人礼、婚礼、产妇生产、建房、探病、水灾救援、远行、法事祭祀、火灾救助、葬礼——被制裁者只获「两分」帮助"}, {"id": "L4-028", "lecture": 4, "page": 28, "title": "Citizens’ awareness of rights: The case of consumers’ compla", "section": "消费者维权", "source": "28\nCitizens’ awareness of rights: The case of consumers’ complaints \n\nChina enacted the Consumers’ Rights Protection Law in 1993, which took effect in 1994. \n\nThe law allows the establishment of the consumer’s association. \n\nChina has about 156,000 such associations.    \n\n   The association has the right to investigate consumers’ complaints.", "knowledge": "公民权利意识案例：消费者投诉。中国 1993 年颁布《消费者权益保护法》，1994 年生效；法律允许设立消费者协会，全国约有 15.6 万个消协；消协有权调查消费者投诉。", "understand": "消费者保护制度的建立：法律（1993/1994）+ 组织（15.6 万个消协）。这是「权利意识上升」的制度基础设施。", "image": "study-assets/lecture-4/slide-028.jpg", "extract": "公民权利意识：消费者投诉案。中国1993年颁布《消费者权益保护法》，1994年生效；法律允许设立消费者协会；中国约有15.6万个消协；消协有权调查消费者投诉"}, {"id": "L4-029", "lecture": 4, "page": 29, "title": "How to address an issue between a consumer and the business ", "section": "消费者维权", "source": "29\nHow to address an issue between a consumer and the business actor: \n\nAccording to the law:\na. Negotiation with the business actor\nb. Mediation by the consumer’s association \nc. Appeals to pertinent government agencies\nd. Apply for an arbitration organization for arbitration (based on ex ante agreement)\ne. Lawsuits", "knowledge": "消费者与商家纠纷的法定解决途径：a 与商家协商；b 消协调解；c 向有关政府部门申诉；d 申请仲裁（需事先协议）；e 诉讼。", "understand": "五种途径从非正式到正式排列，是一个完整的「纠纷解决阶梯」。e 是最后手段——对应「诉讼是最后的选择」。", "image": "study-assets/lecture-4/slide-029.jpg", "extract": "如何处理消费者与商家的纠纷：依法：a 与商家协商；b 消协调解；c 向有关政府部门申诉；d 申请仲裁（基于事先协议）；e 诉讼"}, {"id": "L4-030", "lecture": 4, "page": 30, "title": "Complaints submitted to the consumers’ associations:", "section": "消费者维权", "source": "30\nComplaints submitted to the consumers’ associations:\n\n1994: 410,000\n1998: 670,000\n\nThe case of Wang Hai:\nIn 1995, a 23-year-old youth of Shandong province consciously bought fake stuff in Beijing large department stores and then demanded compensation.", "knowledge": "消协收到的投诉量：1994 年 41 万件 → 1998 年 67 万件。王海案：1995 年山东 23 岁青年王海在北京大商场故意买假货然后索赔。", "understand": "投诉量四年增六成，权利意识上升的直接证据。王海「知假买假」是消费者权益保护的标志性事件——利用法律的惩罚性赔偿条款职业化打假，引发「消费者」界定的争论。", "image": "study-assets/lecture-4/slide-030.jpg", "extract": "提交消协的投诉：1994年41万件；1998年67万件。王海案：1995年，山东23岁青年在北京大商场故意买假货，然后索赔"}, {"id": "L4-031", "lecture": 4, "page": 31, "title": "Violations of consumers’ rights in China:", "section": "消费者维权", "source": "31\nViolations of consumers’ rights in China:\nConsumers’ complaints (according to a survey in Beijing, Shanghai, and Guangzhou) \nProduct quality: 29%\nFalse advertisement or fake stuff: 20%\nPoor service quality: 14 %\nFailing to honor service promise: 10%", "knowledge": "北上广消费者调查中权益受侵的类型：产品质量 29%；虚假广告/假货 20%；服务质量差 14%；不履行服务承诺 10%。", "understand": "侵权类型的构成数据：产品质量问题居首。各项合计不足 100%，可能有其他类别未列出。", "image": "study-assets/lecture-4/slide-031.jpg", "extract": "中国消费者权益受侵情况（北上广调查）：产品质量29%；虚假广告或假货20%；服务质量差14%；不履行服务承诺10%"}, {"id": "L4-032", "lecture": 4, "page": 32, "title": "Example: Hospital charges", "section": "消费者维权", "source": "32\nExample: Hospital charges\nFrom 18 May to 6 August, 2005,\nin a hospital in Harbin, a patient paid 1.39 million yuan in hospitalization expenses , and more than 4 million yuan in medicine, a total of 5.5 million yuan. \nBlood transfusion: 94 times one day. \n\nIn Shenzhen, in 2005, a patient was charged 1.2 million. A patient was charged an extra 100,000 yuan.", "knowledge": "例：医院乱收费——2005 年哈尔滨一患者住院费 139 万、药费 400 多万，合计 550 万元，一天输血 94 次；深圳 2005 年一患者被收 120 万，另一患者多收 10 万。", "understand": "极端案例展示消费者权益受侵可以严重到什么程度。「一天输血 94 次」是明显的造假痕迹，成为舆论焦点。", "image": "study-assets/lecture-4/slide-032.jpg", "extract": "例：医院收费。2005年5月18日至8月6日，哈尔滨某医院一患者付住院费139万元、药费400多万元，合计550万元；一天输血94次。深圳2005年，一患者被收费120万元；另一患者被多收10万元"}, {"id": "L4-033", "lecture": 4, "page": 33, "title": "A survey of consumers in Beijing, Shanghai, and Guangzhou:", "section": "消费者维权", "source": "33\nA survey of consumers in Beijing, Shanghai, and Guangzhou:\nWhat to do:\nTake action: 44.5 %\nAccept it:      31 %\nIndifferent:    25%\n\nWhat kind of action:\nTo the consumers’ association: 62%\nComplaints to the manufacturers: 56%\nReport to the media: 11.8 %\nLawsuits: 3.6%", "knowledge": "北上广消费者调查：被侵权后怎么办——采取行动 44.5%；忍了 31%；无所谓 25%。采取什么行动——找消协 62%；向厂家投诉 56%；报料媒体 11.8%；诉讼 3.6%。", "understand": "两组比例说明：多数人选择行动，但行动方式高度非诉——诉讼仅 3.6%，排在消协、投诉厂家、媒体之后。「依法维权」实践中主要靠行政和社会渠道而非法院。", "image": "study-assets/lecture-4/slide-033.jpg", "extract": "北上广消费者调查：怎么办——采取行动44.5%；接受31%；无所谓25%。采取什么行动——找消协62%；向厂家投诉56%；报媒体11.8%；诉讼3.6%"}, {"id": "L4-034", "lecture": 4, "page": 34, "title": "Variations in the use of lawsuits:", "section": "诉讼使用的城乡差异", "source": "34\nVariations in the use of lawsuits:\n1. Proportionally (among 10,000 citizens), more lawsuits were filed in those developed areas in terms of the GDP per capita.\nEconomic Development Level and the Use of Lawsuits in early 2000s", "knowledge": "诉讼使用的地区差异 1：按人均 GDP 衡量的发达地区，人均诉讼量更高（每万人）。", "understand": "经济发展水平与诉讼率正相关——市场化程度越高，陌生人交往越多，越需要正式规则。图表是散点/柱状对比，看趋势方向即可。", "image": "study-assets/lecture-4/slide-034.jpg", "extract": "诉讼使用的差异：1. 按每万人比例，人均GDP越高的发达地区诉讼越多（2000年代初经济发展水平与诉讼使用）"}, {"id": "L4-035", "lecture": 4, "page": 35, "title": "2. Proportionally, more lawsuits were filed in those areas t", "section": "诉讼使用的城乡差异", "source": "35\n2. Proportionally, more lawsuits were filed in those areas that had proportionally more urban population. \nUrban Population and the Use of Lawsuits in early 2000s", "knowledge": "诉讼使用的地区差异 2：城市人口比例越高的地区，人均诉讼越多。", "understand": "城市化与诉讼率正相关——城市是陌生人社会，非正式调解机制弱，只能走法律。与上一页是同一逻辑的两个指标。", "image": "study-assets/lecture-4/slide-035.jpg", "extract": "2. 城市人口比例越高的地区，诉讼越多（2000年代初城市人口与诉讼使用）"}, {"id": "L4-036", "lecture": 4, "page": 36, "title": "3. Citizens in big cities are more likely to use lawsuits", "section": "诉讼使用的城乡差异", "source": "36\n3. Citizens in big cities are more likely to use lawsuits \n\n“What will do if you were beaten and wounded by other people” (authorities approached by respondents to solve their disputes)", "knowledge": "诉讼使用的地区差异 3：大城市居民更倾向于诉讼。设问「如果你被别人打伤，你会找谁解决？」", "understand": "设问的调查结果在下一页表格中。", "image": "study-assets/lecture-4/slide-036.jpg", "extract": "3. 大城市居民更可能使用诉讼。「如果你被别人打伤，你会怎么办？」（受访者求助的机构）"}, {"id": "L4-037", "lecture": 4, "page": 37, "title": "R e a c t i o n s   B i g   c i t i e s     S m a l l   c i ", "section": "诉讼使用的城乡差异", "source": "37\nR e a c t i o n s   B i g   c i t i e s     S m a l l   c i t i e s     S u b u r b   \n v i l l a g e s     V i l l a g e s     T o t a l   W o r k   u n i t s   o r   v i l l a g e   a u t h o r i t i e s   ( % )       1 5 . 5   3 5 . 8           5 6 . 9         5 0 . 6   4 5 . 6 L e g a l   d e p a r t m e n t s   ( % )       4 9 . 7     3 4 . 7       1 5 . 3         1 6 . 8     2 3 . 3 N           7 2 3       7 6 9       1 , 4 7 4       2 , 5 2 4   5 , 4 9 0", "knowledge": "表格：被打伤后的求助选择——大城市找单位/村权威 15.5%、找法律部门 49.7%（N=723）；小城市 35.8%/34.7%（N=769）；郊区村 56.9%/15.3%（N=1,474）；农村 50.6%/16.8%（N=2,524）；总体 45.6%/23.3%（N=5,490）。", "understand": "最有力的梯度数据：从大城市到农村，找法律部门的比例从约 50% 跌到 16%，找单位/村权威的从 16% 升到 57%。城市化与法律使用的关系一目了然。", "image": "study-assets/lecture-4/slide-037.jpg", "extract": "反应（被打伤后求助谁）：大城市——单位或村权威15.5%、法律部门49.7%；小城市——35.8%、34.7%；郊区村——56.9%、15.3%；农村——50.6%、16.8%；总计——45.6%、23.3%（N分别为723、769、1,474、2,524、5,490）"}, {"id": "L4-038", "lecture": 4, "page": 38, "title": "T o t a l   ( % )         U r b a n   ( % )             R u ", "section": "诉讼使用的城乡差异", "source": "38\n                                                                                                                                      T o t a l   ( % )         U r b a n   ( % )             R u r a l   ( % )                                                                                                                                         T o t a l   ( % )         U r b a n   ( % )             R u r a l   ( % )                                                                                                                                         T o t a l   ( % )         U r b a n   ( % )             R u r a l   ( % )                                                                                                                                         T o t a l   ( % )         U r b a n   ( % )             R u r a l   ( % ) M o d e s   o f   a c t i o n               M e d i a t i o n   b y   a c q u a i n t a n c e s     3 0 . 7   3 2 . 9   2 8 . 4       N o   a c t i o n     2 6 . 5     2 3 . 9   2 9 . 3       A p p r o a c h i n g   s t a t e   a u t h o r i t i e s         2 0 . 5     1 3 . 7   2 7 . 8       L a w     1 6 . 1     2 0 . 9   1 1 . 1       A p p r o a c h i n g   l e a d e r s   o f   t h e   \n               o t h e r   p a r t y ’ s   a g e n c y       8 . 0     1 3 . 3       2 . 4       A p p r o a c h i n g   t h e   m e d i a       1 . 2       2 . 2           0       M i s c e l l a n e o u s       7 . 7       9 . 4       5 . 5       T o t a l   n u m b e r   o f   c a s e s     9 4 7     4 8 9     4 5 8\nResolving civil disputes (2005)", "knowledge": "表格：民事纠纷的解决（2005）——城乡对比。", "understand": "与 L4-006 同表的重复或细化展示，继续看城乡差异：农村重调解、城市重法律。", "image": "study-assets/lecture-4/slide-038.jpg", "extract": "民事纠纷的解决（2005年）：城乡对比调查表"}, {"id": "L4-039", "lecture": 4, "page": 39, "title": "U r b a n                                                   ", "section": "诉讼使用的城乡差异", "source": "39\n                                                                                                                                                U r b a n                                                       R u r a l                                                                                                                                                     U r b a n                                                       R u r a l                                                                                                                                                     U r b a n                                                       R u r a l                                                                                                                                                     U r b a n                                                       R u r a l                                                                                                                                                     U r b a n                                                       R u r a l   M o d e s     I n t e n t i o n \n ( % )   A c t i o n \n ( % )   I n t e n t i o n \n ( % )     A c t i o n   \n ( % )         L a w     5 0 . 5   3 2 . 9   2 8 . 3   2 1 . 5 A p p r o a c h i n g   l e a d e r s   o f   t h i s   \n         A g e n c y   1 5 . 2   2 2 . 1   1 3 . 2   1 6 . 5 A p p r o a c h i n g   u p p e r - l e v e l   l e a d e r s   1 7 . 5   2 9 . 3   4 0 . 0   2 4 . 0 C o l l e c t i v e   P e t i t i o n         2 . 0   1 6 . 4       2 . 7       9 . 9 A p p r o a c h i n g   t h e   m e d i a       5 . 8       5 . 7       1 . 8       3 . 3 N o   a c t i o n         8 . 3   1 4 . 3   1 6 . 8   3 9 . 5 M i s c e l l a n e o u s         0 . 8       4 . 3       1 . 3       3 . 3 T o t a l   c a s e s     5 , 9 5 8   1 4 0   4 1 5 3   1 2 1\nState-citizen disputes", "knowledge": "表格：国家—公民纠纷的解决方式——城乡对比。", "understand": "官民纠纷的解决渠道数据，为 L6 行政诉讼板块预热：看农民遇到政府侵权时用什么渠道（找领导、上访、忍耐远多于诉讼）。", "image": "study-assets/lecture-4/slide-039.jpg", "extract": "国家—公民纠纷（解决方式调查表，城乡对比）"}, {"id": "L4-040", "lecture": 4, "page": 40, "title": "Socioeconomic changes and the use of lawsuits in China:", "section": "离婚", "source": "40\n  Socioeconomic changes and the use of lawsuits in China: \n\n  The case of divorce", "knowledge": "章节页：社会经济变化与诉讼使用——离婚案例。", "understand": "进入离婚专题：用离婚率的变化看社会变迁与法律使用。", "image": "study-assets/lecture-4/slide-040.jpg", "extract": "中国的社会经济变化与诉讼使用：离婚案例"}, {"id": "L4-041", "lecture": 4, "page": 41, "title": "Divorce, Chinese Style", "section": "离婚", "source": "41\n                                                                             \n                                                                             \n                                                                             \nDivorce, Chinese Style \nPopular drama in 2004", "knowledge": "图片页：《中国式离婚》——2004 年热播电视剧。", "understand": "以流行文化为引子：离婚题材电视剧热播本身说明离婚已从禁忌话题变为公共话题。", "image": "study-assets/lecture-4/slide-041.jpg", "extract": "《中国式离婚》：2004年热播电视剧"}, {"id": "L4-042", "lecture": 4, "page": 42, "title": "Causes: distrust, misunderstanding,", "section": "离婚", "source": "42\nCauses: distrust, misunderstanding,", "knowledge": "离婚原因（剧中）：不信任、误解。", "understand": "电视剧情节的过渡页。", "image": "study-assets/lecture-4/slide-042.jpg", "extract": "原因：不信任、误解"}, {"id": "L4-043", "lecture": 4, "page": 43, "title": "The increase in divorces in China", "section": "离婚", "source": "43\nThe increase in divorces in China\n\n China’s divorce rate (comparing the number of divorces with the number of marriages in the same year), was about 19 percent in 2004, nearly five times the 1979 rate. \n\nIn 2001, the courts accepted 3.46 million civil disputes, or 64.7 percent of total lawsuits in China. \n\nOf the 3.46 million civil cases, more than 33 percent were divorces, constituting 21.4 percent of the total lawsuits in China.", "knowledge": "中国离婚率上升：2004 年离婚率（当年离婚数/结婚数）约 19%，是 1979 年的近 5 倍。2001 年法院受理 346 万件民事案件，占全国诉讼的 64.7%；其中超过 33% 是离婚案，占全部诉讼的 21.4%。", "understand": "两组关键数据：离婚率 30 年翻近 5 倍；离婚案占全部诉讼五分之一强——离婚是民事案件中最大单一类型之一。", "image": "study-assets/lecture-4/slide-043.jpg", "extract": "中国离婚率上升：2004年离婚率（当年离婚数与结婚数之比）约19%，接近1979年的5倍；2001年法院受理346万件民事案件，占全国诉讼的64.7%；其中超过33%是离婚案，占全国诉讼的21.4%"}, {"id": "L4-044", "lecture": 4, "page": 44, "title": "Divorce rate:", "section": "离婚", "source": "44\n\n\nDivorce rate:\nMarried couples/divorced couples in a year\n\nDivorced couples/1,000 couples", "knowledge": "离婚率的两种口径：当年结婚对数/离婚对数；每 1,000 对夫妇中的离婚对数。", "understand": "方法论页：同一现象两种算法结果差异很大，看数据时先问口径（结婚对数比还是千分率）。", "image": "study-assets/lecture-4/slide-044.jpg", "extract": "离婚率：一年内结婚夫妇数/离婚夫妇数；或离婚夫妇数/1,000对夫妇"}, {"id": "L4-045", "lecture": 4, "page": 45, "title": "U.S:", "section": "离婚", "source": "45\nU.S:\nOne of every two couples. \n\nTaiwan:\nOne of every 2.2 couples \n\nHong Kong:\nOne out of three \n\nChinese Mainland:\n1.3 of every 10 couples", "knowledge": "离婚率比较：美国——每两对夫妇有一对离婚；台湾——每 2.2 对有一对；香港——三对有一对；中国大陆——每 10 对有 1.3 对。", "understand": "国际比较：中国大陆离婚率仍远低于美国、台湾、香港。上升快但起点低。", "image": "study-assets/lecture-4/slide-045.jpg", "extract": "美国：每两对夫妇中有一对；台湾：每2.2对中有一对；香港：三对中有一对；中国大陆：每10对中有1.3对"}, {"id": "L4-046", "lecture": 4, "page": 46, "title": "Divorce rate in China", "section": "离婚", "source": "Divorce rate in China \n46", "knowledge": "图表页：中国离婚率。", "understand": "离婚率趋势图，配合前后数据看长期上升。", "image": "study-assets/lecture-4/slide-046.jpg", "extract": "中国离婚率（趋势图）"}, {"id": "L4-047", "lecture": 4, "page": 47, "title": "From 1987 to 2017, divorced couple increased from 0.58 milli", "section": "离婚", "source": "47\n   From 1987 to 2017, divorced couple increased from 0.58 million to 4.37 million, or by 6.53 times.\n\n   Divorce rate increased from 0.55 per thousand to 3.2 per thousand; from 2013, it kept increasing steadily. \n\n   Each year, 1.71 couples chose divorce; or 5,000 couples per day.", "knowledge": "1987–2017 年，离婚对数从 58 万对增至 437 万对，增长 6.53 倍；离婚率从 0.55‰ 升至 3.2‰，2013 年后持续上升；每年 171 万对（原文如此）离婚，即每天约 5,000 对。", "understand": "长时段数据：30 年涨 6.5 倍。「每天 5,000 对」是便于记忆的换算。注意 2013 年后还在加速。", "image": "study-assets/lecture-4/slide-047.jpg", "extract": "1987至2017年，离婚夫妇从58万对增至437万对，增长6.53倍；离婚率从0.55‰升至3.2‰，2013年后持续稳步上升；每年171万对离婚，即每天约5,000对"}, {"id": "L4-048", "lecture": 4, "page": 48, "title": "Modes of divorce in
